/* ===== c09-mult-div-10.js ===== */
/* Chapitre 6e : multiplier et diviser par 10, 100, 1 000 et par 0,1 ; 0,01 ; 0,001 */
/* Glissement des chiffres dans le tableau de numération : md10_glisse('3,57', 2, '× 100') ; k > 0 : vers la gauche (multiplier), k < 0 : vers la droite (diviser) ; o.hide : résultat caché */
function md10_glisse(n, k, op, o){
  o = o || {};
  const [ip, dp] = String(n).split(','), d = dp || '';
  const top = {}; // rang → chiffre (unités = 0, dixièmes = -1…)
  ip.split('').forEach((c, i) => { top[ip.length - 1 - i] = c; });
  d.split('').forEach((c, i) => { top[-1 - i] = c; });
  const rks = Object.keys(top).map(Number), lead = p => ip === '0' && p === 0; // zéro des unités de 0,…
  const nz = rks.filter(p => top[p] !== '0').map(p => p + k);
  const rhi = Math.max(...nz, 0), rlo = Math.min(...nz, 0);
  const res = {}; for (let p = rhi; p >= rlo; p--){ const q = p - k; res[p] = top[q] != null && !lead(q) ? top[q] : '0'; }
  const C = Math.max(...rks, rhi, 0), F = Math.min(...rks, rlo, -1);
  const names = { 4: 'diz. de mille', 3: 'milliers', 2: 'centaines', 1: 'dizaines', 0: 'unités', '-1': 'dixièmes', '-2': 'centièmes', '-3': 'millièmes', '-4': 'dix-millièmes', '-5': 'cent-mill.' };
  const cw = 64, lw = 74, ncol = C - F + 1, W = lw + ncol * cw + 14, H = 172;
  const X = p => lw + (C - p) * cw + cw / 2;
  const y1 = 64, y2 = 146;
  let s = SVG0(W, H);
  for (let p = C; p >= F; p--){
    const x = lw + (C - p) * cw;
    s += `<rect x="${x}" y="8" width="${cw}" height="30" fill="${p < 0 ? '#fff3dc' : '#eef2fb'}" stroke="#8a94a8"/>` + svgTxt(x + cw / 2, 28, names[p] || '', { size: 10.5, w: 'bold', c: '#1d2433' });
    s += `<rect x="${x}" y="38" width="${cw}" height="40" fill="#fff" stroke="#8a94a8"/><rect x="${x}" y="120" width="${cw}" height="40" fill="#fff" stroke="#8a94a8"/>`;
  }
  const xc = lw + (C + 1) * cw; // trait de la virgule (entre unités et dixièmes)
  s += `<line x1="${xc}" y1="38" x2="${xc}" y2="78" stroke="${COL.r}" stroke-width="3"/><line x1="${xc}" y1="120" x2="${xc}" y2="160" stroke="${COL.r}" stroke-width="3"/>`;
  rks.forEach(p => { s += svgTxt(X(p), y1 + 2, top[p], { size: 20, w: 'bold', c: COL.b }); });
  Object.keys(res).map(Number).forEach(p => { const moved = top[p - k] != null && !lead(p - k); s += svgTxt(X(p), y2 + 2, o.hide ? '?' : res[p], { size: o.hide ? 18 : 20, w: 'bold', c: o.hide ? '#8a94a8' : moved ? COL.b : COL.g }); });
  rks.filter(p => !lead(p)).forEach(p => { const xa = X(p), xb = X(p + k); s += `<line x1="${xa}" y1="${y1 + 10}" x2="${xb}" y2="${y2 - 22}" stroke="${COL.o}" stroke-width="1.8"/>` + arrowHead(xa, y1 + 10, xb, y2 - 22, COL.o, 8); });
  s += svgTxt(lw / 2, y1 + 2, String(n), { size: 14, w: 'bold' }) + svgTxt(lw / 2, (y1 + y2) / 2 + 4, op || '', { size: 15, w: 'bold', c: COL.o });
  s += svgTxt(lw / 2, y2 + 2, '=', { size: 16, w: 'bold' });
  return s + '</svg>';
}
/* Tableau de conversion (HTML) : md10_conv(['km','hm','dam','m','dm','cm','mm'], ['', '', '', '3', '5', '0', ''], 3) ; virgule après la colonne d'indice v */
function md10_conv(u, cells, v, o){
  o = o || {};
  let h = '<div class="scroll"><table class="t" style="margin:8px auto;text-align:center"><tr>' + u.map((x, i) => `<th${o.hl === i ? ' style="background:#ffe3a3"' : ''}>${x}</th>`).join('') + '</tr><tr>';
  h += cells.map((c, i) => `<td style="font-size:18px;min-width:34px${i === v ? ';border-right:3px solid #d23c3c' : ''}${o.green && o.green.includes(i) ? ';color:#1f9d55' : ''}"><b>${c}</b></td>`).join('') + '</tr></table></div>';
  return h;
}

/* Chapitre 6e : multiplier des décimaux, diviser un décimal par un entier */
/* Division décimale posée d'un décimal par un entier : mdec_div('9,6', 4, {max: 3 (chiffres après la virgule au plus)}) */
function mdec_div(a, b, o){
  o = o || {};
  const [ip, dp] = String(a).split(','), nInt = ip.length, max = o.max != null ? o.max : 3;
  const D = (ip + (dp || '')).split('').map(Number), real = D.length;
  const col = i => i + 1; // colonne 0 : signe ; la virgule est collée au chiffre des unités
  const rows = [];
  let cur = 0, start = -1, q = '', i = 0;
  const put = (str, end, sign, under) => { const cells = {}; for (let k = 0; k < str.length; k++) cells[col(end - str.length + 1 + k)] = str[k]; if (sign) cells[col(end - str.length + 1) - 1] = sign; rows.push({ cells, under }); };
  while (true){
    if (i >= D.length){ if (cur !== 0 && D.length - nInt < max){ D.push(0); } else break; }
    cur = cur * 10 + D[i];
    if (start < 0 && cur < b && i < nInt - 1){ i++; continue; }
    if (start < 0) start = i;
    const qd = Math.floor(cur / b), sub = qd * b, rest = cur - sub;
    q += qd; if (i === nInt - 1 && (D.length > nInt || rest !== 0 || dp)) q += ',';
    if (qd > 0 || rows.length) put(String(sub), i, '−', true);
    cur = rest;
    if (i + 1 < D.length || (rest !== 0 && D.length - nInt < max)){ if (i + 1 >= D.length) D.push(0); put((rest ? String(rest) : '') + D[i + 1], i + 1); }
    else put(String(rest), i);
    i++;
  }
  if (q.endsWith(',')) q = q.slice(0, -1);
  const ncol = col(D.length - 1) + 1;
  const first = [];
  for (let c = 0; c < ncol; c++) first.push('');
  D.forEach((d, k) => { first[col(k)] = { t: String(d), g: k >= real }; });
  if (D.length > nInt) first[col(nInt - 1)].t += `<span style="position:absolute;color:${dp ? 'inherit' : '#1f9d55'}">,</span>`;
  const td = (c, st) => `<td style="${st || ''}">${c}</td>`;
  let h = '<table class="pose" style="margin:0"><tr>' + first.map(c => c ? td(c.t, c.g ? 'color:#1f9d55' : '') : td('')).join('') + '</tr>';
  rows.forEach(r => { h += '<tr>' + Array.from({ length: ncol }, (_, c) => r.cells[c] != null ? td(r.cells[c], (r.cells[c] === '−' ? 'color:#2f5bd3;font-weight:700' : '') + (r.under && r.cells[c] !== '−' ? ';border-bottom:2px solid #1d2433' : '')) : td('')).join('') + '</tr>'; });
  h += '</table>';
  const stop = cur === 0;
  return `<div class="fig"><div class="div"><div class="l" style="padding-right:8px">${h}</div><div class="r"><div class="d">${b}</div><div><b>${q}${stop ? '' : '…'}</b></div></div></div></div>`;
}
/* Carré unité partagé en 100 : produit de deux dixièmes, mdec_carre(4, 3) → 0,4 × 0,3 */
function mdec_carre(a, b){
  const u = 22, L = 10 * u, x0 = 50, y0 = 14, W = x0 + L + 30, H = y0 + L + 44;
  let s = SVG0(W, H);
  for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++){ const on = i < a && j < b; s += `<rect x="${x0 + i * u}" y="${y0 + L - (j + 1) * u}" width="${u}" height="${u}" fill="${on ? COL.o + 'aa' : '#fff'}" stroke="#b8c0d0"/>`; }
  s += `<rect x="${x0}" y="${y0}" width="${L}" height="${L}" fill="none" stroke="#1d2433" stroke-width="2.4"/>`;
  s += `<line x1="${x0}" y1="${y0 + L + 10}" x2="${x0 + a * u}" y2="${y0 + L + 10}" stroke="${COL.r}" stroke-width="3"/>` + svgTxt(x0 + a * u / 2, y0 + L + 28, '0,' + a, { c: COL.r, w: 'bold', size: 14 });
  s += `<line x1="${x0 - 10}" y1="${y0 + L}" x2="${x0 - 10}" y2="${y0 + L - b * u}" stroke="${COL.b}" stroke-width="3"/>` + svgTxt(x0 - 16, y0 + L - b * u / 2 + 5, '0,' + b, { c: COL.b, w: 'bold', size: 14, a: 'end' });
  s += svgTxt(x0 + L / 2, y0 + L + 40, `côté du grand carré : 1`, { size: 12, c: '#555' });
  return s + '</svg>';
}

CH({ id: 'mult-decimaux', th: 'Nombres et calculs', per: 'Période 2', t: 'Multiplier des décimaux, diviser par un entier',
intro: r`Comprendre et calculer le produit de deux nombres décimaux (en le posant et avec un ordre de grandeur), diviser un nombre décimal par un nombre entier, et résoudre des problèmes de prix, d'aires et de partages.`,
cours: [
{ t: 'Le sens de la multiplication de décimaux', h: r`<p>Multiplier par un nombre entier, c'est répéter une addition : $3 \times 0,4 = 0,4 + 0,4 + 0,4 = 1,2$ (12 dixièmes).</p>` + FIG(barModel([{ l: '3 × 0,4', parts: [{ v: 4, t: '0,4' }, { v: 4, t: '0,4' }, { v: 4, t: '0,4' }] }], { u: 30, lw: 70, total: { t: '1,2' } })) + r`<p>Pour multiplier deux décimaux, on peut penser à l'<b>aire d'un rectangle</b>. Dans un carré de côté 1 partagé en 100 petits carreaux, le rectangle de côtés $0,4$ et $0,3$ contient $4 \times 3 = 12$ carreaux sur 100 :</p>` + FIG(mdec_carre(4, 3)) + EXM(r`$0,4 \times 0,3 = \frac{12}{100} = 0,12$. Un dixième multiplié par un dixième donne un centième.`) + ATT(r`$0,4 \times 0,3$ ne fait pas $1,2$ ! Le produit est même plus petit que $0,4$ et que $0,3$ : on prend « 3 dixièmes de $0,4$ ».`) },
{ t: 'Calculer le produit de deux décimaux', h: METH(r`<ol><li>On multiplie les deux nombres <b>sans tenir compte des virgules</b>, comme des entiers.</li>
<li>On compte le nombre total de chiffres après la virgule dans les deux facteurs.</li>
<li>Le produit a <b>autant de chiffres après la virgule</b> : on place la virgule en comptant à partir de la droite.</li></ol>`, 'Méthode : poser une multiplication') + EXM(r`$3,7 \times 2,9$ : on calcule $37 \times 29 = 1\,073$. Il y a 1 chiffre après la virgule dans $3,7$ et 1 dans $2,9$ : 2 en tout. Donc $3,7 \times 2,9 = 10,73$.`) + pose('×', ['3,7', '2,9']) + EXM(r`$1,25 \times 0,4$ : $125 \times 4 = 500$ ; 2 + 1 = 3 chiffres après la virgule : $0,500 = 0,5$.`) + PROP(r`Pourquoi ça marche ? $3,7 = 37 \div 10$ et $2,9 = 29 \div 10$. Donc $3,7 \times 2,9 = 37 \times 29 \div 100 = 1\,073 \div 100 = 10,73$.`, 'Pourquoi ?') + ATT(r`On n'aligne pas les virgules dans une multiplication ! On aligne les chiffres à droite, comme pour des entiers, et on place la virgule à la fin.`) },
{ t: 'Ordre de grandeur et vérification', h: METH(r`Pour trouver un <b>ordre de grandeur</b> d'un produit, on remplace chaque facteur par un nombre proche, simple à calculer.<br>
$3,7 \times 2,9 \approx 4 \times 3 = 12$. Le résultat $10,73$ est proche de 12 : il est plausible. Si on avait trouvé $107,3$ ou $1,073$, on saurait qu'on s'est trompé de place pour la virgule.`, 'Méthode : vérifier avec un ordre de grandeur') + FIG(geo({ s: 50, pts: { A: [0, 0], B: [3.7, 0], C: [3.7, 2.9], D: [0, 2.9] }, hide: ['A', 'B', 'C', 'D'], polys: [{ p: ['A', 'B', 'C', 'D'], fill: COL.g + '33', c: COL.g }], lab: [['A', 'B', '3,7 m'], ['B', 'C', '2,9 m']], txt: [[1.85, 1.45, 'aire = 3,7 × 2,9 = 10,73 m²', { c: COL.k, size: 14 }]] })) + PROP(r`<ul><li>Multiplier par un nombre <b>plus grand que 1</b> rend le nombre plus grand : $25 \times 1,2 = 30$.</li>
<li>Multiplier par un nombre <b>plus petit que 1</b> rend le nombre plus petit : $25 \times 0,8 = 20$.</li></ul>`) + METH(r`Calculs utiles : $0,5 \times 8 = 4$ (la moitié de 8) ; $0,25 \times 12 = 3$ (le quart de 12) ; $2,5 \times 4 = 10$ ; $1,5 \times 6 = 6 + 3 = 9$.`, 'Calcul mental') },
{ t: 'Diviser un décimal par un entier', h: METH(r`On pose la division comme avec des entiers. <b>Dès qu'on abaisse le chiffre des dixièmes</b>, on écrit la virgule au quotient.`, 'Méthode : division décimale') + EXM(r`$9,6 \div 4$ : en 9 combien de fois 4 ? 2 fois, il reste 1. On abaisse le 6 (les dixièmes) : on écrit la virgule au quotient. En 16 combien de fois 4 ? 4 fois, il reste 0. Donc $9,6 \div 4 = 2,4$.`) + mdec_div('9,6', 4) + r`<p>Si le reste n'est pas nul, on peut continuer en ajoutant des zéros après la virgule (en vert) : $7 = 7,00$.</p>` + EXM(r`$7 \div 4 = 1,75$. Vérification : $4 \times 1,75 = 7$.`) + mdec_div('7', 4) + ATT(r`N'oublie pas la virgule au quotient au moment où tu abaisses le premier chiffre après la virgule. Vérifie avec une multiplication : $4 \times 2,4 = 9,6$.`) },
{ t: 'Quotient décimal ou valeur approchée', h: r`<p>Parfois la division « s'arrête » (le reste devient 0) : le quotient est un nombre décimal. Par exemple $9\,855 \div 6 = 1\,642,5$.</p><p>Parfois elle ne s'arrête jamais : $10 \div 3 = 3,333\ldots$ Le quotient n'est pas un nombre décimal. On donne alors une <b>valeur approchée</b>, par exemple l'arrondi au centième : $10 \div 3 \approx 3,33$.</p>` + mdec_div('10', 3, { max: 3 }) + METH(r`Pour donner l'arrondi au centième d'un quotient, on calcule jusqu'aux millièmes, puis on arrondit.<br>
$73 \div 6 = 12,166\ldots$ : arrondi au dixième $12,2$ ; arrondi au centième $12,17$.`, 'Méthode') + EXM(r`Léo paie $15,60$ € pour 3 m de tissu. Prix d'un mètre : $15,60 \div 3 = 5,20$ €.<br>
On partage $1,5$ L de jus dans 6 verres : $1,5 \div 6 = 0,25$ L, soit 25 cL par verre.`) + RET(r`<ul><li>Produit : on multiplie sans les virgules, puis on place la virgule (somme des chiffres après la virgule).</li><li>Division par un entier : la virgule du quotient s'écrit quand on abaisse les dixièmes.</li><li>Toujours vérifier avec un <b>ordre de grandeur</b>.</li></ul>`, 'À retenir') }
],

/* Chapitre 6e : fractions et quotients */
CH({ id: 'quotients', th: 'Nombres et calculs', per: 'Période 3', t: 'Fractions et quotients',
intro: r`Comprendre qu'une fraction $\frac{a}{b}$ est le résultat exact de la division de $a$ par $b$ : c'est le nombre qui, multiplié par $b$, donne $a$. Placer une fraction sur une demi-droite graduée, multiplier une fraction par un nombre entier et calculer une fraction d'une quantité.`,
cours: [
{ t: 'Le quotient de a par b', h: DEF(r`Soit $a$ et $b$ deux nombres entiers, avec $b$ différent de 0. Le <b>quotient</b> de $a$ par $b$ est le nombre qui, <b>multiplié par $b$, donne $a$</b>. On le note $a \div b$ ou $\frac{a}{b}$.<br>
Autrement dit : $b \times \frac{a}{b} = a$.`) + EXM(r`<ul><li>$3 \times \ldots = 12$ : le nombre manquant est $\frac{12}{3} = 12 \div 3 = 4$.</li>
<li>$4 \times \ldots = 3$ : le nombre manquant est $\frac{3}{4} = 3 \div 4 = 0,75$.</li>
<li>$3 \times \ldots = 7$ : le nombre manquant est $\frac{7}{3}$. Ici, la division ne s'arrête pas : $7 \div 3 = 2,333\ldots$ On garde l'écriture <b>exacte</b> $\frac{7}{3}$.</li></ul>`) + r`<p>Partager 7 m de ruban en 3 morceaux égaux : chaque morceau mesure $\frac{7}{3}$ m, car $3 \times \frac{7}{3} = 7$.</p>` + FIG(barModel([{ l: '7 m', parts: [{ v: 7 / 3, t: '7/3' }, { v: 7 / 3, t: '7/3' }, { v: 7 / 3, t: '7/3' }] }], { u: 60, lw: 50, total: { t: '3 × 7/3 = 7' } })) + ATT(r`$\frac{7}{3}$ n'est pas égal à $2,33$ : $3 \times 2,33 = 6,99$, ce n'est pas 7. $2,33$ est seulement une <b>valeur approchée</b> de $\frac{7}{3}$ (au centième). On écrit $\frac{7}{3} \approx 2,33$.`) },
{ t: 'Une fraction, c’est une division', h: PROP(r`Le trait de fraction veut dire « divisé par » : $\frac{a}{b} = a \div b$. Une fraction peut donc être :
<ul><li>un <b>nombre entier</b> : $\frac{12}{4} = 3$ ;</li>
<li>un <b>nombre décimal</b> : $\frac{3}{4} = 0,75$ ; $\frac{7}{2} = 3,5$ ;</li>
<li>un nombre <b>qui n'est pas décimal</b> : $\frac{2}{6} = 0,333\ldots$ (la division ne s'arrête jamais).</li></ul>`) + FIG(fracBar(3, 4, { W: 400, lab: '3/4 = 3 ÷ 4 = 0,75' })) + r`<p>Partager 3 unités en 4 parts égales donne la même chose que prendre 3 quarts d'une unité : $\frac{3}{4} = 3 \div 4$.</p>` + METH(r`Pour trouver l'écriture décimale d'une fraction, on divise le numérateur par le dénominateur (en posant la division ou de tête).<br>
$\frac{9}{8} = 9 \div 8 = 1,125$ ; $\frac{1}{3} = 1 \div 3 \approx 0,33$.`, 'Méthode') },
{ t: 'Égalités à trous', h: METH(r`Pour compléter $b \times \ldots = a$, on cherche le nombre qui, multiplié par $b$, donne $a$ : c'est $\frac{a}{b}$.
${''}` + TAB([['Égalité', 'Nombre manquant', 'Vérification'], [r`$6 \times \ldots = 42$`, r`$\frac{42}{6} = 7$`, r`$6 \times 7 = 42$`], [r`$5 \times \ldots = 2$`, r`$\frac{2}{5} = 0,4$`, r`$5 \times 0,4 = 2$`], [r`$3 \times \ldots = 2$`, r`$\frac{2}{3}$`, r`$3 \times \frac{2}{3} = 2$`], [r`$\ldots \times 8 = 3$`, r`$\frac{3}{8} = 0,375$`, r`$0,375 \times 8 = 3$`]]), 'Méthode : compléter une égalité à trou') + FIG(barModel([{ l: '2', parts: [{ v: 2, t: '2/3' }, { v: 2, t: '2/3' }, { v: 2, t: '2/3' }] }], { u: 40, lw: 40, total: { t: '3 × 2/3 = 2' } })) + ATT(r`Dans $3 \times \ldots = 2$, la réponse n'est pas un nombre entier, ni même un nombre décimal. Mais elle existe : c'est $\frac{2}{3}$ ! Les fractions permettent de résoudre <b>toutes</b> ces égalités.`) },
{ t: 'Repérer une fraction sur une demi-droite graduée', h: METH(r`Pour placer $\frac{a}{b}$ sur une demi-droite graduée :
<ol><li>on partage chaque unité en $b$ parts égales ;</li>
<li>on compte $a$ parts à partir de 0.</li></ol>`, 'Méthode') + FIG(gline({ a: 0, b: 3, sub: 3, W: 540, labs: 'all', fracLab: true, pts: [{ x: 7 / 3, l: '7/3', c: COL.r }, { x: 2 / 3, l: '2/3', c: COL.b }] })) + EXM(r`Chaque unité est partagée en 3 : chaque petit trait vaut $\frac{1}{3}$. Pour $\frac{7}{3}$, on compte 7 tiers. On voit que $\frac{7}{3} = \frac{6}{3} + \frac{1}{3} = 2 + \frac{1}{3}$ : il est entre 2 et 3.`) + r`<p>Si la graduation ne correspond pas au dénominateur, on cherche une fraction égale : $\frac{2}{3} = \frac{4}{6}$, donc sur une graduation en sixièmes, on compte 4 parts.</p>` + FIG(gline({ a: 0, b: 2, sub: 6, W: 540, pts: [{ x: 4 / 6, l: '2/3 = 4/6', c: COL.b }, { x: 9 / 6, l: '3/2 = 9/6', c: COL.g }] })) + RET(r`$\frac{a}{b}$ est plus petit que 1 si $a < b$, égal à 1 si $a = b$, et plus grand que 1 si $a > b$.`, 'À retenir') },
{ t: 'Multiplier une fraction par un nombre entier', h: PROP(r`Pour multiplier une fraction par un nombre entier, on multiplie le <b>numérateur</b> par ce nombre et on garde le dénominateur : $3 \times \frac{2}{7} = \frac{3 \times 2}{7} = \frac{6}{7}$.`) + r`<p>En effet, $3 \times \frac{2}{7} = \frac{2}{7} + \frac{2}{7} + \frac{2}{7}$ : on a 3 fois 2 septièmes, soit 6 septièmes.</p>` + FIG(fracBar(6, 7, { W: 420, lab: '2/7 + 2/7 + 2/7 = 6/7' })) + EXM(r`$4 \times \frac{3}{4} = \frac{12}{4} = 3$ ; $5 \times \frac{2}{3} = \frac{10}{3}$ ; $\frac{7}{10} \times 2 = \frac{14}{10} = 1,4$.`) + ATT(r`On ne multiplie pas le dénominateur ! $3 \times \frac{2}{7}$ n'est pas $\frac{6}{21}$ (qui vaut $\frac{2}{7}$).`) },
{ t: 'Fraction d’une quantité', h: PROP(r`Prendre une fraction d'une quantité, c'est <b>multiplier</b> : « $\frac{2}{5}$ de 60 » se calcule $\frac{2}{5} \times 60$.`) + METH(r`Deux façons de calculer $\frac{2}{5}$ de 60 :
<ul><li>on partage en 5, puis on prend 2 parts : $60 \div 5 = 12$, puis $2 \times 12 = 24$ ;</li>
<li>on multiplie, puis on divise : $2 \times 60 = 120$, puis $120 \div 5 = 24$.</li></ul>`, 'Méthode') + FIG(barModel([{ l: '60', parts: [{ v: 3, t: '12', c: COL.o }, { v: 3, t: '12', c: COL.o }, { v: 3, t: '12' }, { v: 3, t: '12' }, { v: 3, t: '12' }] }], { u: 34, lw: 40, total: { t: '2/5 de 60 = 12 + 12 = 24', v: 6 } })) + EXM(r`$\frac{3}{4}$ d'une heure $= \frac{3}{4} \times 60$ min $= 3 \times 15 = 45$ min.<br>
$\frac{5}{4}$ de 3 $= \frac{5 \times 3}{4} = \frac{15}{4} = 3,75$.`) + RET(r`<ul><li>$\frac{a}{b}$ est le nombre qui multiplié par $b$ donne $a$ : $b \times \frac{a}{b} = a$.</li><li>$\frac{a}{b} = a \div b$.</li><li>$\frac{a}{b}$ de $n$ $= (n \div b) \times a$.</li></ul>`, 'À retenir') }
],

/* Tableau à deux lignes avec flèches : prop_tab(['Nombre de cahiers', 'Prix (€)'], ['4', '1', '7'], ['6', '?', '?'], {top: [[0, 1, '÷ 4']], bot: [[0, 1, '÷ 4']], side: '× 1,5'}) */
function prop_tab(lab, r1, r2, o){
  o = o || {};
  const cw = o.cw || 74, lw = o.lw || 170, rh = 40, n = r1.length, top = (o.top && o.top.length) ? 44 : 10, W = lw + n * cw + (o.side ? 90 : 14), H = top + 2 * rh + ((o.bot && o.bot.length) ? 44 : 10);
  const X = i => lw + i * cw + cw / 2;
  let s = SVG0(W, H);
  [r1, r2].forEach((row, j) => {
    const y = top + j * rh;
    s += `<rect x="4" y="${y}" width="${lw - 4}" height="${rh}" fill="#eef2fb" stroke="#8a94a8"/>` + svgTxt(lw / 2 + 2, y + 25, lab[j], { size: 13, w: 'bold' });
    row.forEach((v, i) => { const q = v === '?'; s += `<rect x="${lw + i * cw}" y="${y}" width="${cw}" height="${rh}" fill="${q ? '#fff3dc' : '#fff'}" stroke="#8a94a8"/>` + svgTxt(X(i), y + 26, v, { size: 16, w: 'bold', c: q ? COL.r : COL.k }); });
  });
  const arc = (i, j, t, up, k) => { const x1 = X(i), x2 = X(j), y = up ? top : top + 2 * rh, d = up ? -1 : 1, c = PAL[k % PAL.length];
    return `<path d="M${x1} ${y}C${x1} ${y + d * 32},${x2} ${y + d * 32},${x2} ${y + d * 3}" fill="none" stroke="${c}" stroke-width="1.8"/>` + arrowHead(x2, y + d * 14, x2, y + d * 2, c, 7) + svgTxt((x1 + x2) / 2, y + d * 30 + (up ? -2 : 12), t, { c, w: 'bold', size: 13 }); };
  (o.top || []).forEach((a, k) => { s += arc(a[0], a[1], a[2], true, k); });
  (o.bot || []).forEach((a, k) => { s += arc(a[0], a[1], a[2], false, k + 2); });
  if (o.side){ const x = lw + n * cw + 12; s += `<path d="M${x} ${top + rh / 2}C${x + 26} ${top + rh / 2},${x + 26} ${top + 1.5 * rh},${x + 2} ${top + 1.5 * rh}" fill="none" stroke="${COL.g}" stroke-width="2"/>` + arrowHead(x + 14, top + 1.5 * rh, x + 1, top + 1.5 * rh, COL.g, 8) + svgTxt(x + 30, top + rh + 5, o.side, { c: COL.g, w: 'bold', size: 14, a: 'start' }); }
  return s + '</svg>';
}
/* Carte avec échelle graphique : prop_carte({bar: 2 (cm), barLab: '500 m', ab: 6 (cm), A: 'École', B: 'Piscine'}) ; 1 cm = 30 px (pas en vraie grandeur) */
function prop_carte(o){
  const u = 30, W = Math.max(o.ab * u + 120, 360), H = 190;
  let s = SVG0(W, H) + `<rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="10" fill="#eef7ee" stroke="#9cc59c"/>`;
  s += `<path d="M20 120 Q ${W / 2} 40 ${W - 20} 110" fill="none" stroke="#7ab0e0" stroke-width="7" opacity=".6"/>`;
  const ax = 50, ay = 70, bx = ax + o.ab * u, by = 70;
  s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${COL.r}" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="${ax}" cy="${ay}" r="6" fill="${COL.r}"/><circle cx="${bx}" cy="${by}" r="6" fill="${COL.r}"/>`;
  s += svgTxt(ax, ay - 14, o.A || 'A', { w: 'bold', size: 14 }) + svgTxt(bx, by - 14, o.B || 'B', { w: 'bold', size: 14 });
  const y = 158, x0 = 30;
  for (let k = 0; k < o.bar; k++) s += `<rect x="${x0 + k * u}" y="${y - 8}" width="${Math.min(1, o.bar - k) * u}" height="8" fill="${k % 2 ? '#fff' : '#1d2433'}" stroke="#1d2433"/>`;
  s += svgTxt(x0, y + 16, '0', { size: 12 }) + svgTxt(x0 + o.bar * u, y + 16, o.barLab, { size: 12, w: 'bold' });
  return s + '</svg>';
}

{ t: 'Le passage à l’unité', h: METH(r`On calcule d'abord la valeur pour <b>une seule unité</b> (1 objet, 1 kg, 1 L…), puis on multiplie.`, 'Méthode : passer par l’unité') + EXM(r`4 cahiers coûtent 6 €. Combien coûtent 7 cahiers ?<br>

/* Graphique cartésien simple : don_graph({x:[x0, x1, pas], y:[y0, y1, pas], pts:[[x, y], ...], line:true, xl:'heure', yl:'°C', read:[[x, y]], lab:[[x, y, 'A']]}) */
function don_graph(o){
  const [x0, x1, xs] = o.x, [y0, y1, ys] = o.y, W = o.W || 500, H = o.H || 290, pl = 52, pb = 42, pt = 28, pr = 24;
  const X = x => pl + (x - x0) * (W - pl - pr) / (x1 - x0), Y = y => H - pb - (y - y0) * (H - pb - pt) / (y1 - y0);
  let s = SVG0(W, H);
  for (let x = x0; x <= x1 + 1e-9; x += xs) s += `<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" stroke="#e3e8f2"/>` + svgTxt(X(x), Y(y0) + 17, fr(+x.toFixed(4)), { size: 11.5, c: '#444' });
  for (let y = y0; y <= y1 + 1e-9; y += ys) s += `<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" stroke="#e3e8f2"/>` + svgTxt(X(x0) - 7, Y(y) + 4, fr(+y.toFixed(4)), { size: 11.5, c: '#444', a: 'end' });
  s += `<line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x1) + 12}" y2="${Y(y0)}" stroke="#333" stroke-width="1.5"/>` + arrowHead(X(x0), Y(y0), X(x1) + 16, Y(y0), '#333', 8);
  s += `<line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x0)}" y2="${Y(y1) - 12}" stroke="#333" stroke-width="1.5"/>` + arrowHead(X(x0), Y(y0), X(x0), Y(y1) - 16, '#333', 8);
  if (o.xl) s += svgTxt(W - 4, Y(y0) + 34, o.xl, { size: 12, c: '#555', a: 'end', w: 'bold' });
  if (o.yl) s += svgTxt(X(x0) + 8, 14, o.yl, { size: 12, c: '#555', a: 'start', w: 'bold' });
  (o.read || []).forEach(([x, y]) => { s += `<path d="M${X(x)} ${Y(y0)}V${Y(y)}H${X(x0)}" fill="none" stroke="${COL.r}" stroke-width="1.6" stroke-dasharray="5 4"/>`; });
  const c = o.c || COL.b;
  if (o.line && o.pts) s += `<path d="${o.pts.map((p, k) => (k ? 'L' : 'M') + X(p[0]) + ' ' + Y(p[1])).join('')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>`;
  (o.pts || []).forEach(p => { s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${c}"/>`; });
  (o.lab || []).forEach(([x, y, t, cc]) => { s += `<path d="M${X(x) - 5} ${Y(y) - 5}l10 10m0 -10l-10 10" stroke="${cc || COL.r}" stroke-width="2.4"/>` + svgTxt(X(x) + 8, Y(y) - 8, t, { w: 'bold', c: cc || COL.r, a: 'start' }); });
  return s + '</svg>';
}

cours: [
{ t: 'Recueillir et ranger des données', h: r`<p>On a demandé à 24 élèves leur couleur préférée. On note les réponses : B (bleu), R (rouge), V (vert), J (jaune).</p><p style="text-align:center;letter-spacing:2px"><b>B R V B B J R B V R B J B R V B R B J B R B V B</b></p>` + METH(r`Pour ranger ces données, on fait un <b>tableau d'effectifs</b> : pour chaque réponse, on compte combien de fois elle apparaît (on peut faire un bâton par réponse, puis barrer chaque réponse comptée pour ne pas l'oublier).`, 'Méthode : compter') + TAB([['Couleur', 'Bleu', 'Rouge', 'Vert', 'Jaune', 'Total'], ['Comptage', '||||| ||||| |', '||||| |', '||||', '|||', ''], ['Effectif', '11', '6', '4', '3', '<b>24</b>']]) + DEF(r`L'<b>effectif</b> d'une réponse est le nombre de fois où elle apparaît. L'<b>effectif total</b> est le nombre total de réponses.`) + ATT(r`Vérifie toujours que la somme des effectifs est égale au nombre total de réponses : $11 + 6 + 4 + 3 = 24$.`) },
{ t: 'Lire un tableau à double entrée', h: r`<p>Un <b>tableau à double entrée</b> range des données selon deux critères (ici : le moyen de transport et filles/garçons) pour les 26 élèves d'une classe de 6e.</p>` + don_transport + METH(r`Pour lire une case, on croise une <b>ligne</b> et une <b>colonne</b>. Par exemple, la case « En bus » / « Filles » indique que <b>6 filles</b> viennent en bus.<br>
La dernière ligne et la dernière colonne donnent les <b>totaux</b> : 9 élèves viennent à pied ($4 + 5$).`, 'Méthode : lire un tableau') + DEF(r`<b>Filtrer</b> des données, c'est garder seulement celles qui respectent un <b>critère</b>. Par exemple, pour un trajet en covoiturage, on peut choisir selon le prix, l'heure d'arrivée ou le nombre d'arrêts.`, 'Filtrer selon un critère') + don_covoit + EXM(r`Critère « le moins cher » : Paul (25 €). Critère « arriver avant 12 h » : Sarah (11 h 50). Critères « sans arrêt <b>et</b> moins de 30 € » : Chloé.`) },
{ t: 'Les diagrammes en barres', h: r`<p>Un <b>diagramme en barres</b> représente chaque effectif par une barre. La <b>hauteur</b> de la barre est proportionnelle à l'effectif. Voici le diagramme des couleurs préférées :</p>` + FIG(barsC({ lab: ['Bleu', 'Rouge', 'Vert', 'Jaune'], val: [11, 6, 4, 3], ymax: 12, ystep: 2, unit: 'élèves', show: true, xl: 'couleur' })) + METH(r`Pour construire un diagramme en barres :
<ol><li>on trace deux axes ; sur l'axe horizontal, on écrit les réponses ;</li>
<li>on choisit une graduation <b>régulière</b> sur l'axe vertical (par exemple 1 carreau pour 2 élèves), qui va jusqu'au plus grand effectif ;</li>
<li>on trace des barres de même largeur, dont la hauteur correspond à l'effectif ;</li>
<li>on donne un titre au diagramme et on écrit les unités.</li></ol>`, 'Méthode : construire') + ATT(r`La graduation doit être régulière : les nombres 0, 2, 4, 6… doivent être espacés de la même façon. Avec 1 carreau pour 2 élèves, un effectif de 7 correspond à $3,5$ carreaux.`) },
{ t: 'Les diagrammes circulaires', h: r`<p>Dans un <b>diagramme circulaire</b>, le disque entier représente l'effectif total. Chaque secteur est proportionnel à l'effectif qu'il représente. On l'utilise pour voir la <b>part</b> de chaque réponse.</p>` + FIG(pie([{ l: 'Football', v: 20 }, { l: 'Basket', v: 10 }, { l: 'Handball', v: 5 }, { l: 'Natation', v: 5 }], { pct: true, R: 80 })) + EXM(r`Sport préféré de 40 élèves. Le football occupe la <b>moitié</b> du disque : $\frac{1}{2}$ de 40 $= 20$ élèves (50 %). Le basket occupe un <b>quart</b> : $\frac{1}{4}$ de 40 $= 10$ élèves (25 %). Handball et natation occupent chacun un huitième : 5 élèves.`) + RET(r`Repères : la moitié du disque = 50 % ; un quart = 25 % ; trois quarts = 75 % ; le disque entier = 100 %.`, 'À retenir') },
{ t: 'Les graphiques', h: r`<p>On a relevé la température toutes les deux heures pendant une journée. On place chaque mesure par un <b>point</b> : l'heure sur l'axe horizontal, la température sur l'axe vertical. On peut relier les points.</p>` + TAB([['Heure (h)', '8', '10', '12', '14', '16', '18'], ['Température (°C)', '6', '9', '14', '17', '15', '11']]) + FIG(don_graph({ x: [8, 18, 2], y: [0, 20, 2], pts: [[8, 6], [10, 9], [12, 14], [14, 17], [16, 15], [18, 11]], line: true, xl: 'heure (h)', yl: 'température (°C)', read: [[12, 14]] })) + METH(r`Pour lire un graphique : on part de l'heure sur l'axe horizontal, on monte jusqu'à la courbe, puis on va horizontalement jusqu'à l'axe vertical (pointillés rouges). À 12 h, il fait 14 °C.`, 'Méthode : lire un graphique') + METH(r`Pour placer un point (par exemple 10 h et 9 °C) : on repère 10 sur l'axe horizontal, 9 sur l'axe vertical, et on place le point au croisement. On choisit des graduations régulières adaptées aux données.`, 'Méthode : placer un point') + ATT(r`Ne confonds pas les deux axes : ici, l'axe horizontal porte les <b>heures</b> et l'axe vertical les <b>températures</b>. Lis toujours les titres des axes.`) }

/* Faces de dé : prob_des([1, 2, 3, 4, 5, 6], {hl: [2, 4, 6]}) */
function prob_des(faces, o){
  o = o || {};
  const u = 54, g = 14, W = faces.length * (u + g) + g, H = u + 2 * g;
  const P = { 1: [[0.5, 0.5]], 2: [[0.25, 0.25], [0.75, 0.75]], 3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]], 4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]], 5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]], 6: [[0.25, 0.22], [0.75, 0.22], [0.25, 0.5], [0.75, 0.5], [0.25, 0.78], [0.75, 0.78]] };
  let s = SVG0(W, H);
  faces.forEach((f, k) => { const x = g + k * (u + g), y = g, on = (o.hl || []).includes(f);
    s += `<rect x="${x}" y="${y}" width="${u}" height="${u}" rx="10" fill="${on ? '#ffe3a3' : '#fff'}" stroke="${on ? COL.o : '#1d2433'}" stroke-width="${on ? 3 : 2}"/>`;
    (P[f] || []).forEach(([a, b]) => { s += `<circle cx="${x + a * u}" cy="${y + b * u}" r="5" fill="#1d2433"/>`; }); });
  return s + '</svg>';
}

  let s = SVG0(W, H);
  const x0 = 30, wU = 2 * per * r + 20, y0 = 22;
  s += `<path d="M${x0} ${y0}L${x0} ${H - 24}Q${x0} ${H - 10} ${x0 + 14} ${H - 10}L${x0 + wU - 14} ${H - 10}Q${x0 + wU} ${H - 10} ${x0 + wU} ${H - 24}L${x0 + wU} ${y0}" fill="#f3f6fc" stroke="#1d2433" stroke-width="2.4"/>`;
  all.forEach((c, k) => { const i = k % per, j = Math.floor(k / per); s += `<circle cx="${x0 + 10 + r + i * 2 * r}" cy="${H - 10 - 8 - r - j * 2 * r}" r="${r - 1.5}" fill="${c}" stroke="#1d2433" stroke-width="1.2"/>`; });

  return s + '</svg>';

{ t: 'Le hasard', h: DEF(r`Une expérience est <b>aléatoire</b> (elle dépend du hasard) quand :

cours: [
{ t: 'Le point et la droite', h: DEF(r`Un <b>point</b> marque un endroit précis. On le dessine avec une petite <b>croix</b> et on le nomme avec une <b>lettre majuscule</b> : le point $A$.<br>
Une <b>droite</b> est une ligne bien droite, <b>sans début ni fin</b> : on ne peut en dessiner qu'un morceau. La droite qui passe par les points $A$ et $B$ se note $(AB)$ (avec des <b>parenthèses</b>). On peut aussi la nommer avec une lettre minuscule entre parenthèses : la droite $(d)$.`) +
FIG(geo({ s: 45, pts: { A: [0, 0], B: [3, 1], C: [6, 2], D: [3.5, -0.8] }, lp: { D: 's' }, box: [-1, -1.5, 7, 2.6], lines: [['A', 'B', { c: COL.b, n: '(d)', dx: 30, dy: -24 }]] })) +
PROP(r`Par deux points distincts, il passe <b>une seule</b> droite. Par un seul point, il passe une infinité de droites.`) +
DEF(r`Si un point est sur une droite, on dit qu'il <b>appartient</b> à la droite. On écrit le symbole $\in$ (« appartient à »).<br>Sinon, on écrit $\notin$ (« n'appartient pas à »).`, 'Appartenance') +
EXM(r`Sur la figure : $C \in (AB)$ (on lit « $C$ appartient à la droite $(AB)$ ») et $D \notin (AB)$.<br>La droite $(d)$ peut aussi s'appeler $(AB)$, $(BA)$, $(AC)$, $(CA)$, $(BC)$ ou $(CB)$ : il suffit de deux de ses points.`) +
ATT(r`On ne peut pas mesurer une droite : elle est infinie. Les parenthèses $( \;)$ sont réservées aux droites.`) },
{ t: 'Demi-droite et segment', h: DEF(r`Une <b>demi-droite</b> est une partie de droite qui a un <b>début</b> (son <b>origine</b>) mais pas de fin. La demi-droite d'origine $A$ qui passe par $B$ se note $[AB)$ : le crochet est du côté de l'origine.<br>
Un <b>segment</b> est une partie de droite limitée par deux points, ses <b>extrémités</b>. Le segment d'extrémités $A$ et $B$ se note $[AB]$ (deux crochets).`) +

CH({ id: 'paralleles-perp', th: 'Géométrie', per: 'Période 1', t: 'Droites parallèles et perpendiculaires',
intro: r`Reconnaître des droites sécantes, perpendiculaires ou parallèles, utiliser les notations $\perp$ et //, les tracer avec la règle et l'équerre, et utiliser trois propriétés pour <b>démontrer</b> que des droites sont parallèles ou perpendiculaires.`,
cours: [
{ t: 'Droites sécantes et droites parallèles', h: DEF(r`Deux droites sont <b>sécantes</b> si elles se coupent en <b>un seul point</b>, appelé leur <b>point d'intersection</b>.<br>Deux droites sont <b>parallèles</b> si elles ne se coupent jamais (ou si elles sont confondues).`) +
FIG(pp_sec + ' ' + pp_par) +
EXM(r`À gauche : $(d)$ et $(d')$ sont sécantes en $I$. À droite : $(d)$ et $(d')$ sont parallèles ; on écrit $(d) // (d')$.`) +
ATT(r`Une droite est infinie : deux droites qui ne se croisent pas <b>sur le dessin</b> peuvent se couper plus loin ! Pour savoir si elles sont parallèles, il faut vérifier (avec l'équerre, comme on le verra) ou utiliser un codage ou une propriété.`) +
FIG(geo({ s: 34, pts: { _a: [0, 0], _b: [3, 0.6], _c: [0, 1.6], _d: [3, 1.6], _e: [8, 1.6], _f: [8, 1.6] }, box: [0, -0.4, 8.5, 2.3], segs: [['_a', '_b', { c: COL.b }], ['_c', '_d', { c: COL.r }], ['_b', '_e', { c: COL.b, dash: true }], ['_d', '_e', { c: COL.r, dash: true }]], txt: [[8, 2.1, 'ici, elles se coupent !', { c: COL.o, size: 12, a: 'end' }]] })) },
{ t: 'Droites perpendiculaires', h: DEF(r`Deux droites sont <b>perpendiculaires</b> si elles se coupent en formant un <b>angle droit</b>. On écrit $(d) \perp (d')$ (on lit « $(d)$ est perpendiculaire à $(d')$ »).`) +
FIG(pp_perp) +
DEF(r`Sur une figure, le petit <b>carré</b> au point d'intersection signifie « angle droit ». Sans ce codage (ou une phrase de l'énoncé), on ne peut pas affirmer que deux droites sont perpendiculaires : il faut vérifier avec l'<b>équerre</b>.`, 'Le codage') +
METH(r`<b>Pour vérifier :</b> je place un côté de l'angle droit de l'équerre le long de $(d)$, le sommet de l'angle droit sur le point d'intersection, et je regarde si l'autre côté de l'équerre suit exactement $(d')$.`, 'Méthode : vérifier avec l\'équerre') +
ATT(r`Deux droites perpendiculaires sont toujours sécantes. Mais deux droites sécantes ne sont pas toujours perpendiculaires !`) },
{ t: 'Tracer avec la règle et l\'équerre', h: METH(r`<b>Tracer la droite perpendiculaire à $(d)$ passant par un point $A$ :</b><br>1. Je place un côté de l'angle droit de l'équerre le long de $(d)$.<br>2. Je fais glisser l'équerre le long de $(d)$ jusqu'à ce que l'autre côté de l'angle droit touche le point $A$.<br>3. Je trace la droite le long de ce côté, puis je la prolonge à la règle et je code l'angle droit.`, 'Méthode 1 : la perpendiculaire') +
FIG(geo({ s: 40, pts: { _a: [0, 0], _b: [6, 1.5], A: [2, 3.5], H: [2.706, 0.676] }, lp: { H: 'se', A: 'ne' }, box: [0, -0.5, 9, 4], lines: [['_a', '_b', { c: COL.b }], ['H', 'A', { c: COL.r }]], right: [['_b', 'H', 'A']], txt: [[5.5, 0.9, '(d)', { c: COL.b, it: true }], [3.0, 2.5, 'la perpendiculaire à (d) passant par A', { c: COL.r, size: 12, a: 'start' }]] })) +
METH(r`<b>Tracer la droite parallèle à $(d)$ passant par un point $B$ :</b><br>1. Je trace d'abord une droite $(\Delta)$ perpendiculaire à $(d)$ (n'importe laquelle).<br>2. Je trace ensuite la perpendiculaire à $(\Delta)$ passant par $B$ (méthode 1).<br>La droite obtenue est perpendiculaire à $(\Delta)$, comme $(d)$ : elle est donc parallèle à $(d)$ (c'est la propriété 1 du bloc suivant).`, 'Méthode 2 : la parallèle') +
FIG(geo({ s: 40, pts: { _a: [0, 0], _b: [6, 1.5], B: [1.5, 3], _h: [3, 0.75], _k: [2.38, 3.22], _g: [1.8, 3.15], _p: [6, 4.12] }, lp: { B: 'n' }, box: [0, -0.5, 6, 4.8], lines: [['_a', '_b', { c: COL.b }], ['_h', '_k', { c: COL.gr, dash: true }], ['B', '_p', { c: COL.g }]], right: [['_b', '_h', '_k'], ['_p', '_k', '_h']], txt: [[5.5, 0.85, '(d)', { c: COL.b, it: true }], [5.4, 4.5, "(d')", { c: COL.g, it: true }], [2.75, 4.3, '(Δ)', { c: COL.gr, size: 13 }]] })) +
ATT(r`On n'utilise pas le quadrillage du cahier pour « deviner » : on se sert vraiment de l'équerre, et on prolonge bien les droites avec la règle.`) },
{ t: 'Trois propriétés pour démontrer', h: PROP(r`<b>Propriété 1.</b> Si deux droites sont <b>perpendiculaires à une même droite</b>, alors elles sont <b>parallèles</b> entre elles.`) +
FIG(geo({ s: 36, pts: { _a: [0, 0], _b: [6, 0], _c: [1.5, 0], _d: [1.5, 3], _e: [4.5, 0], _f: [4.5, 3] }, box: [0, -1.2, 6, 3.4], lines: [['_a', '_b', { c: COL.b }], ['_c', '_d', { c: COL.r }], ['_e', '_f', { c: COL.g }]], right: [['_b', '_c', '_d'], ['_b', '_e', '_f']], txt: [[5.6, 0.3, '(d)', { c: COL.b, it: true }], [1.95, 2.8, '(d1)', { c: COL.r, it: true }], [4.95, 2.8, '(d2)', { c: COL.g, it: true }]] })) +
PROP(r`<b>Propriété 2.</b> Si deux droites sont <b>parallèles</b> et si une troisième droite est <b>perpendiculaire à l'une</b>, alors elle est <b>perpendiculaire à l'autre</b>.`) +
FIG(geo({ s: 36, pts: { _a: [0, 0.6], _b: [6, 0.6], _c: [0, 2.4], _d: [6, 2.4], _e: [3, 0.6], _f: [3, 2.4] }, box: [0, -0.4, 6, 3.2], lines: [['_a', '_b', { c: COL.b }], ['_c', '_d', { c: COL.g }], ['_e', '_f', { c: COL.r }]], right: [['_b', '_e', '_f']], txt: [[5.5, 0.85, '(d1)', { c: COL.b, it: true }], [5.5, 2.65, '(d2)', { c: COL.g, it: true }], [3.4, 3.0, '(d3)', { c: COL.r, it: true }]] })) +
PROP(r`<b>Propriété 3.</b> Si deux droites sont <b>parallèles à une même droite</b>, alors elles sont <b>parallèles</b> entre elles.`) +
METH(r`On rédige en trois étapes :<br><b>Je sais que</b> $(d_{1}) \perp (d)$ et $(d_{2}) \perp (d)$. (les données)<br><b>Or</b> si deux droites sont perpendiculaires à une même droite, alors elles sont parallèles. (la propriété)<br><b>Donc</b> $(d_{1}) // (d_{2})$. (la conclusion)`, 'Méthode : rédiger une démonstration') +
ATT(r`Il faut lire les données de l'énoncé ou du codage, pas « ce qui a l'air vrai » sur le dessin.`) },
{ t: 'Le plus court chemin d\'un point à une droite', h: PROP(r`Soit $A$ un point qui n'est pas sur la droite $(d)$, et $H$ le point où la perpendiculaire à $(d)$ passant par $A$ coupe $(d)$. Alors, de tous les points de $(d)$, c'est $H$ le <b>plus proche</b> de $A$ : le plus court chemin de $A$ jusqu'à la droite est le segment $[AH]$.`) +
FIG(geo({ s: 45, pts: { A: [3, 3], H: [3, 0], M: [0.5, 0], N: [5.5, 0], _a: [-0.5, 0], _b: [7, 0] }, lp: { H: 's', M: 's', N: 's' }, lines: [['_a', '_b', { c: COL.b }]], segs: [['A', 'H', { c: COL.r, w: 3 }], ['A', 'M', { c: COL.gr, dash: true }], ['A', 'N', { c: COL.gr, dash: true }]], right: [['_b', 'H', 'A']], txt: [[6.6, 0.3, '(d)', { c: COL.b, it: true }], [3.6, 1.5, 'AH = 3', { c: COL.r, a: 'start' }], [0.9, 1.9, 'AM ≈ 3,9', { c: COL.gr, size: 12 }], [5.3, 1.9, 'AN ≈ 3,9', { c: COL.gr, size: 12 }]] })) +
EXM(r`Un nageur au point $A$ veut rejoindre la plage (la droite $(d)$) le plus vite possible : il doit nager <b>perpendiculairement</b> à la plage, vers $H$.`) +
RET(r`Sécantes : un point commun. Parallèles : $(d) // (d')$, jamais de point commun. Perpendiculaires : $(d) \perp (d')$, angle droit.<br>Deux perpendiculaires à une même droite sont parallèles. Une perpendiculaire à l'une de deux parallèles est perpendiculaire à l'autre.<br>Le plus court chemin d'un point à une droite suit la perpendiculaire.`) }
],

const an_pol = (deg, rr, o) => { o = o || [0, 0]; rr = rr == null ? 3 : rr; return [+(o[0] + rr * Math.cos(deg * Math.PI / 180)).toFixed(3), +(o[1] + rr * Math.sin(deg * Math.PI / 180)).toFixed(3)]; };
// un angle de sommet O dont les côtés font a1 et a2 degrés avec l'horizontale
const an_ang = (a1, a2, o) => { o = o || {}; const L = o.L || 3; return geo(Object.assign({ s: o.s || 36, pts: Object.assign({ O: [0, 0], _x: an_pol(a1, L), _y: an_pol(a2, L) }, o.pts || {}), lp: Object.assign({ O: a2 - a1 > 150 ? 's' : 'sw' }, o.lp || {}), box: o.box || [-0.6, -0.6, 3.3, 3.3], rays: [['O', '_x', { c: COL.b }], ['O', '_y', { c: COL.b }]], angles: [['_x', 'O', '_y', { l: o.l, c: COL.o, r: o.r || 0.8 }]], txt: o.txt }, o.extra || {})); };
const an_type = (deg, name) => geo({ s: 30, pad: 18, pts: { O: [0, 0], _x: [2.6, 0], _y: an_pol(deg, 2.6) }, hide: ['O'], box: [-2.7, -0.8, 2.7, 2.7], rays: [['O', '_x', { c: COL.b }], ['O', '_y', { c: COL.b }]], angles: deg === 90 ? [] : [['_x', 'O', '_y', { c: COL.o, r: 0.7 }]], right: deg === 90 ? [['_x', 'O', '_y']] : [], txt: [[0, -0.65, name, { c: COL.k, size: 13 }]] });

/* Chapitre 6e : Les triangles */
// triangle ABC avec A(0;0), B(c;0) à partir des trois longueurs a = BC, b = CA, c = AB
const tr_sss = (a, b, c) => { const x = (b * b + c * c - a * a) / (2 * c); return { A: [0, 0], B: [c, 0], C: [+x.toFixed(4), +Math.sqrt(b * b - x * x).toFixed(4)] }; };
// triangle ABC avec AB = c et les angles en A et en B (degrés)
const tr_asa = (c, aA, aB) => { const aC = 180 - aA - aB, R = Math.PI / 180, b = c * Math.sin(aB * R) / Math.sin(aC * R); return { A: [0, 0], B: [c, 0], C: [+(b * Math.cos(aA * R)).toFixed(4), +(b * Math.sin(aA * R)).toFixed(4)] }; };
// centre du cercle circonscrit
const tr_cc = (P, Q, S) => { const [ax, ay] = P, [bx, by] = Q, [cx, cy] = S, d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d, uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d; return [+ux.toFixed(4), +uy.toFixed(4)]; };
const tr_mid = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
const tr_t1 = tr_asa(6, 50, 60); // angles 50°, 60°, 70°
const tr_iso = { A: [2, 3.4], B: [0, 0], C: [4, 0] }, tr_equi = tr_sss(4, 4, 4), tr_rect = { A: [0, 0], B: [4, 0], C: [0, 3] };
// cercle circonscrit
const tr_cP = { A: [0, 0], B: [6, 0], C: [1.6, 3.6] }, tr_O = tr_cc(tr_cP.A, tr_cP.B, tr_cP.C);
const tr_perpPts = (P, Q, k) => { const M = tr_mid(P, Q), dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy); return [[M[0] - dy / L * k, M[1] + dx / L * k], [M[0] + dy / L * k, M[1] - dx / L * k]]; };
const tr_circ = (() => { const P = tr_cP, [m1, n1] = tr_perpPts(P.A, P.B, 1), [m2, n2] = tr_perpPts(P.B, P.C, 1), [m3, n3] = tr_perpPts(P.C, P.A, 1);
  return geo({ s: 40, pts: Object.assign({ O: tr_O, _m1: m1, _n1: n1, _m2: m2, _n2: n2, _m3: m3, _n3: n3 }, P), lp: { O: 'e', C: 'n' }, polys: [{ p: ['A', 'B', 'C'], c: COL.k, fill: '#2f5bd312' }], circles: [{ o: 'O', through: 'A', c: COL.g }], lines: [['_m1', '_n1', { c: COL.r, dash: true }], ['_m2', '_n2', { c: COL.r, dash: true }], ['_m3', '_n3', { c: COL.r, dash: true }]], segs: [['O', 'A', { c: COL.g }], ['O', 'B', { c: COL.g }], ['O', 'C', { c: COL.g }]] }); })();
// construction au compas : BC = 5, CA = 4, AB = 6
const tr_k = tr_sss(5, 4, 6), tr_kA = Math.atan2(tr_k.C[1], tr_k.C[0]) * 180 / Math.PI, tr_kB = 180 - Math.atan2(tr_k.C[1], 6 - tr_k.C[0]) * 180 / Math.PI;

/* Chapitre 6e : La symétrie axiale */
// symétrique d'un point M par rapport à la droite passant par P et Q
const sy_ref = (M, P, Q) => { const ux = Q[0] - P[0], uy = Q[1] - P[1], L2 = ux * ux + uy * uy, t = ((M[0] - P[0]) * ux + (M[1] - P[1]) * uy) / L2, H = [P[0] + t * ux, P[1] + t * uy]; return [+(2 * H[0] - M[0]).toFixed(4), +(2 * H[1] - M[1]).toFixed(4)]; };
const sy_foot = (M, P, Q) => { const ux = Q[0] - P[0], uy = Q[1] - P[1], t = ((M[0] - P[0]) * ux + (M[1] - P[1]) * uy) / (ux * ux + uy * uy); return [+(P[0] + t * ux).toFixed(4), +(P[1] + t * uy).toFixed(4)]; };
// figure + son symétrique sur quadrillage (axe vertical x = k) ; pts = liste de [x,y]
const sy_grid = (pts, k, o) => { o = o || {}; const P = {}, Q = {}; pts.forEach((p, i) => { P['_p' + i] = p; P['_q' + i] = [2 * k - p[0], p[1]]; });
  const ys = pts.map(p => p[1]), y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1; P._a = [k, y0]; P._b = [k, y1];
  const xs = pts.map(p => p[0]).concat(pts.map(p => 2 * k - p[0]));
  return geo({ s: o.s || 26, grid: true, pts: P, box: [Math.min(...xs) - 1, y0, Math.max(...xs) + 1, y1], polys: [{ p: pts.map((_, i) => '_p' + i), c: COL.b, fill: '#2f5bd333' }].concat(o.half ? [] : [{ p: pts.map((_, i) => '_q' + i), c: COL.o, fill: '#e07b0033', dash: o.dash }]), lines: [['_a', '_b', { c: COL.r, w: 2.5 }]], txt: [[k + 0.3, y1 - 0.4, '(d)', { c: COL.r, it: true, a: 'start' }]] }); };
// point M et son symétrique M' (axe oblique)
const sy_P = [0, 0], sy_Q = [4, 3], sy_M = [0.6, 2.8], sy_M2 = sy_ref(sy_M, sy_P, sy_Q), sy_H = sy_foot(sy_M, sy_P, sy_Q);
const sy_pt = geo({ s: 48, pts: { M: sy_M, "M'": sy_M2, H: sy_H, _p: [-0.5, -0.375], _q: [4.5, 3.375] }, lp: { H: 'nw', M: 'n', "M'": 's' }, box: [-0.5, -0.4, 4.5, 3.4], lines: [['_p', '_q', { c: COL.r }]], segs: [['M', "M'", { c: COL.gr, dash: true }]], right: [['_q', 'H', 'M']], ticks: [['M', 'H', 2], ['H', "M'", 2]], txt: [[4.3, 2.8, '(d)', { c: COL.r, it: true }]] });

CH({ id: 'durees', th: 'Grandeurs et mesures', per: 'Période 1', t: 'Horaires et durées',
intro: r`Lire l’heure, distinguer un horaire et une durée, convertir des durées (jours, heures, minutes, secondes) et calculer une durée, un horaire de fin ou un horaire de début.`,
cours: [
{ t: 'Lire l’heure', h: DEF(r`Sur une horloge à aiguilles :<br>
• la <b>petite aiguille</b> (rouge ici) indique les <b>heures</b> ;<br>
• la <b>grande aiguille</b> (bleue) indique les <b>minutes</b> : chaque grand trait vaut 5 minutes.<br>
Une journée dure 24 heures : la petite aiguille fait <b>deux tours</b>. 3 h de l’après-midi s’écrit <b>15 h</b> ($3 + 12$).`, 'L’horloge') + FIG(clock(3, 15, { R: 70 }) + clock(8, 30, { R: 70 }) + clock(10, 45, { R: 70 })) + EXM(r`De gauche à droite : 3 h 15 (« trois heures et quart ») ; 8 h 30 (« huit heures et demie ») ; 10 h 45 (« onze heures moins le quart »).`) + TAB([['En une heure, la grande aiguille fait…', 'un quart de tour', 'un demi-tour', 'trois quarts de tour', 'un tour'], ['Durée', r`$\frac{1}{4}$ h = 15 min`, r`$\frac{1}{2}$ h = 30 min`, r`$\frac{3}{4}$ h = 45 min`, '1 h = 60 min']]) + ATT(r`À 10 h 45, la petite aiguille est presque sur le 11 : elle avance doucement pendant l’heure. Ne lis pas « 11 h 45 » !`) },
{ t: 'Horaire ou durée ? Les unités', h: DEF(r`• Un <b>horaire</b> (ou instant) répond à la question « <b>à quelle heure ?</b> » : le film commence <b>à</b> 17 h 40.<br>
• Une <b>durée</b> répond à la question « <b>combien de temps ?</b> » : le film dure 1 h 50 min.`, 'Horaire et durée') + FIG(timeline([['17 h 40', 0], ['19 h 30', 110]], { arcs: [[0, 1, 'durée : 1 h 50 min']] })) + TAB([['Unité', 'Équivalence'], ['1 minute (min)', '60 secondes (s)'], ['1 heure (h)', '60 min = 3 600 s'], ['1 jour (j)', '24 h'], ['1 semaine', '7 jours'], ['1 année', '12 mois, 365 jours (366 les années bissextiles)']]) + ATT(r`Les durées ne se comptent pas de 10 en 10 ou de 100 en 100 : <b>1 h = 60 min</b>, et non 100 min !`) },
{ t: 'Convertir des durées', h: METH(r`• Pour convertir des heures en minutes, je <b>multiplie par 60</b> : $2$ h $15$ min $= 2 \times 60 + 15 = 135$ min.<br>
• Pour convertir des minutes en heures et minutes, je fais la <b>division euclidienne par 60</b> : $200 = 60 \times 3 + 20$, donc $200$ min $= 3$ h $20$ min.`, 'Méthode') + FIG(barModel([{ l: '200 min', parts: [{ v: 6, t: '60', c: '#2f5bd3' }, { v: 6, t: '60', c: '#2f5bd3' }, { v: 6, t: '60', c: '#2f5bd3' }, { v: 2, t: '20', c: '#e07b00' }] }], { u: 20, total: { t: '3 h 20 min' } })) + EXM(r`$34\,990$ s en heures, minutes, secondes :<br>
$34\,990 = 60 \times 583 + 10$ : 583 min et 10 s ; puis $583 = 60 \times 9 + 43$ : 9 h 43 min.<br>
Donc $34\,990$ s $= 9$ h $43$ min $10$ s.`) + EXM(r`609 h en semaines, jours, heures : $609 = 24 \times 25 + 9$ (25 jours et 9 h), puis $25 = 7 \times 3 + 4$. Donc 609 h = 3 semaines 4 jours 9 h.`) + ATT(r`$1,5$ h n’est pas 1 h 50 min ! $1,5$ h $= 1$ h $+ \frac{1}{2}$ h $= 1$ h 30 min. De même $0,25$ h $= 15$ min, $0,75$ h $= 45$ min et $0,1$ h $= 6$ min (un dixième de 60 min).`) },
{ t: 'Calculer une durée', h: METH(r`Pour calculer la durée entre 8 h 45 et 11 h 20, je fais des <b>bonds</b> sur une frise, en passant par les heures « rondes » :`, 'Méthode 1 : la frise') + FIG(timeline([['8 h 45', 0], ['9 h', 15], ['11 h', 135], ['11 h 20', 155]], { arcs: [[0, 1, '15 min'], [1, 2, '2 h'], [2, 3, '20 min']] })) + EXM(r`$15$ min $+ 2$ h $+ 20$ min $= 2$ h $35$ min.`) + METH(r`On soustrait : 11 h 20 − 8 h 45. On ne peut pas faire 20 − 45 : je transforme 1 h en 60 min.<br>
11 h 20 min = 10 h 80 min. Puis 10 h 80 min − 8 h 45 min = <b>2 h 35 min</b>.`, 'Méthode 2 : la soustraction') + ATT(r`On ne pose pas $11,20 - 8,45 = 2,75$ comme avec des nombres décimaux : les heures ont 60 minutes, pas 100.`) },
{ t: 'Calculer un horaire de fin ou de début', h: EXM(r`<b>Horaire de fin.</b> Un film commence à 17 h 40 et dure 110 min. À quelle heure se termine-t-il ?<br>
$110$ min $= 1$ h $50$ min. $17$ h $40$ + $1$ h $50$ = $18$ h $90$ min = <b>19 h 30</b> (car 90 min = 1 h 30 min).`) + FIG(timeline([['17 h 40', 0], ['18 h', 20], ['19 h', 80], ['19 h 30', 110]], { arcs: [[0, 1, '20 min'], [1, 2, '1 h'], [2, 3, '30 min']] })) + EXM(r`<b>Horaire de début.</b> Un train arrive à 14 h 10 après un trajet de 2 h 35. À quelle heure est-il parti ?<br>
14 h 10 − 2 h 35 : 14 h 10 = 13 h 70. $13$ h $70 - 2$ h $35 = 11$ h $35$. Il est parti à <b>11 h 35</b>.`) + FIG(timeline([['11 h 35', 0], ['12 h', 30], ['14 h', 120], ['14 h 10', 155]], { arcs: [[0, 1, '25 min'], [1, 2, '2 h'], [2, 3, '10 min']] })) + METH(r`Vérifie en refaisant le calcul dans l’autre sens : $11$ h $35 + 2$ h $35 = 13$ h $70 = 14$ h $10$. ✔`, 'Vérifier') + RET(r`<ul><li>1 h = 60 min ; 1 min = 60 s ; 1 j = 24 h.</li>
<li>Horaire : « à quelle heure ? » ; durée : « combien de temps ? ».</li>
<li>Pour calculer : frise avec les heures rondes, ou calcul en échangeant 1 h contre 60 min.</li>
<li>Quand on a 60 min ou plus, on les transforme en heures.</li></ul>`) }
],

/* Chapitre 6e : Périmètres */
const pe_poly = (pts, o) => { o = o || {}; const P = {}; pts.forEach((p, i) => { P['_p' + i] = p; }); return geo(Object.assign({ s: o.s || 26, grid: o.grid !== false, pts: P, box: o.box, polys: [{ p: pts.map((_, i) => '_p' + i), c: o.c || COL.b, fill: o.fill || '#2f5bd322', w: 3 }], txt: o.txt }, o.extra || {})); };
// stade : rectangle L × d avec deux demi-cercles de diamètre d
const pe_stade = (L, d, o) => { o = o || {}; const rr = d / 2; return geo({ s: o.s || 30, pts: { _a: [0, 0], _b: [L, 0], _c: [L, d], _e: [0, d], _o1: [0, rr], _o2: [L, rr] }, box: [-rr, -0.9, L + rr, d], segs: [['_a', '_b', { c: COL.b, w: 3 }], ['_e', '_c', { c: COL.b, w: 3 }], ['_a', '_e', { c: COL.gr, dash: true, w: 1.4 }], ['_b', '_c', { c: COL.gr, dash: true, w: 1.4 }]], arcs: [{ o: '_o1', r: rr, a1: 90, a2: 270, c: COL.o, w: 3 }, { o: '_o2', r: rr, a1: -90, a2: 90, c: COL.o, w: 3 }], txt: o.txt }); };

intro: r`Comprendre ce qu'est le périmètre d'une figure, convertir des longueurs, calculer le périmètre d'un polygone, d'un carré, d'un rectangle, la longueur d'un cercle avec $\pi$, et le périmètre de figures composées.`,
cours: [
{ t: 'La notion de périmètre', h: DEF(r`Le <b>périmètre</b> d'une figure est la <b>longueur de son contour</b> : c'est la distance parcourue quand on fait le tour de la figure en suivant son bord.`) +
FIG(pe_poly([[1, 1], [5, 1], [5, 3], [3, 3], [3, 4], [1, 4]], { txt: [[3, 0.35, 'P = 4 + 2 + 2 + 1 + 2 + 3 = 14', { c: COL.b, size: 12 }]], box: [-1, 0, 7, 5] })) +

ATT(r`Deux figures peuvent avoir le même périmètre et des formes très différentes. Le périmètre ne dit rien de la place occupée à l'intérieur (c'est l'<b>aire</b>, au chapitre suivant).`) +
FIG(pe_poly([[0, 0], [4, 0], [4, 2], [0, 2]], { box: [-0.5, -0.5, 4.5, 3.5], txt: [[2, 2.6, 'P = 12', { c: COL.b }]] }) + ' ' + pe_poly([[0, 0], [5, 0], [5, 1], [0, 1]], { c: COL.o, fill: '#e07b0022', box: [-0.5, -0.5, 5.5, 3.5], txt: [[2.5, 1.6, 'P = 12', { c: COL.o }]] }) + ' ' + pe_poly([[0, 0], [3, 0], [3, 3], [0, 3]], { c: COL.g, fill: '#1f9d5522', box: [-0.5, -0.5, 3.5, 4], txt: [[1.5, 3.4, 'P = 12', { c: COL.g }]] })) },
{ t: 'Les unités de longueur', h: DEF(r`L'unité principale de longueur est le <b>mètre</b> (m). Les autres unités se déduisent du mètre en multipliant ou divisant par 10, 100, 1 000 :`) +
TAB([['kilomètre', 'hectomètre', 'décamètre', 'mètre', 'décimètre', 'centimètre', 'millimètre'], ['km', 'hm', 'dam', '<b>m</b>', 'dm', 'cm', 'mm'], ['1 000 m', '100 m', '10 m', '1 m', '0,1 m', '0,01 m', '0,001 m']]) +
RET(r`kilo = mille ; hecto = cent ; déca = dix ; déci = un dixième ; centi = un centième ; milli = un millième.<br>$1$ km $= 1\,000$ m ; $1$ m $= 100$ cm $= 1\,000$ mm ; $1$ cm $= 10$ mm.`) +
METH(r`Pour passer à une unité <b>plus petite</b>, le nombre devient <b>plus grand</b> : on multiplie. Pour passer à une unité <b>plus grande</b>, on divise.<br>$3,5$ km $= 3,5 \times 1\,000$ m $= 3\,500$ m.<br>$245$ cm $= 245 \div 100$ m $= 2,45$ m.<br>$7$ mm $= 7 \div 10$ cm $= 0,7$ cm.`, 'Méthode : convertir') +
ATT(r`Avant d'additionner des longueurs ou de calculer un périmètre, je mets <b>toutes les longueurs dans la même unité</b>.`) },
{ t: 'Périmètre d\'un polygone, d\'un carré, d\'un rectangle', h: PROP(r`Le périmètre d'un <b>polygone</b> est la <b>somme des longueurs de ses côtés</b>.`) +

{ t: 'La longueur d\'un cercle', h: PROP(r`La longueur d'un cercle (son <b>périmètre</b>) est <b>proportionnelle à son diamètre</b> : si le diamètre double, la longueur double. Le coefficient est un nombre noté $\pi$ (« pi ») :<br><b>longueur du cercle $= \pi \times$ diamètre</b> $= \pi \times d$, ou encore $2 \times \pi \times r$ (avec $r$ le rayon).`) +
FIG(geo({ s: 38, pts: { O: [0, 0], A: [-2, 0], B: [2, 0] }, lp: { O: 'n', A: 'w', B: 'e' }, circles: [{ o: 'O', r: 2, c: COL.o, w: 3 }], segs: [['A', 'B', { c: COL.b }]], box: [-2, -2.8, 2, 2], txt: [[0, -0.5, 'd', { c: COL.b, it: true }], [0, -2.6, 'longueur ≈ 3,14 × d', { c: COL.o }]] })) +
DEF(r`$\pi$ ne s'écrit pas exactement avec des chiffres : $\pi \approx 3,14$ (en réalité $\pi = 3,14159…$). La touche $\pi$ de la calculatrice donne une valeur plus précise.`, 'Le nombre π') +
EXM(r`Cercle de diamètre 10 cm : longueur $= \pi \times 10 \approx 3,14 \times 10 = 31,4$ cm.<br>Cercle de rayon 3 cm : $d = 6$ cm, longueur $= \pi \times 6 \approx 18,84$ cm.`) +
ATT(r`Ne confonds pas rayon et diamètre ! Si on te donne le rayon, pense à le <b>doubler</b> avant de multiplier par $\pi$. Et un demi-cercle a une longueur égale à la <b>moitié</b> de celle du cercle.`) },
{ t: 'Figures composées', h: METH(r`1. Je repère les morceaux qui forment le <b>contour</b> (segments, demi-cercles…).<br>2. Je calcule la longueur de chaque morceau, dans la même unité.<br>3. J'additionne. <b>Les traits intérieurs ne comptent pas</b> : ils ne sont pas sur le bord.`, 'Méthode') +
FIG(pe_stade(6, 4, { txt: [[3, -0.6, '2 segments de 6 m + 2 demi-cercles de diamètre 4 m', { c: COL.k, size: 12 }]] })) +
EXM(r`Ce « stade » est formé de 2 segments de 6 m (en bleu) et de 2 demi-cercles de diamètre 4 m (en orange). Les deux demi-cercles forment un cercle entier de diamètre 4 m.<br>$P = 6 + 6 + \pi \times 4 \approx 12 + 12,56 = 24,56$ m. Les pointillés gris sont intérieurs : on ne les compte pas.`) +
RET(r`Périmètre = longueur du contour. Même unité avant de calculer.<br>Carré : $4 \times c$. Rectangle : $2 \times (L + \ell)$. Cercle : $\pi \times d$, avec $\pi \approx 3,14$.`) }

/* Chapitre 6e : Aires */
const ai_poly = (pts, o) => { o = o || {}; const P = {}; pts.forEach((p, i) => { P['_p' + i] = p; }); return geo(Object.assign({ s: o.s || 26, grid: o.grid !== false, pts: P, box: o.box, polys: [{ p: pts.map((_, i) => '_p' + i), c: o.c || COL.b, fill: o.fill || '#2f5bd333', w: 2.5 }].concat(o.polys || []), txt: o.txt, segs: o.segs, lab: o.lab, right: o.right }, o.extra || {})); };
// rectangle L × l dessiné en carreaux de 1 cm
const ai_rq = (L, l, o) => { o = o || {}; return geo({ s: o.s || 28, grid: true, pts: { _a: [0, 0], _b: [L, 0], _c: [L, l], _d: [0, l] }, box: [-0.5, -1, L + 2, l + 0.5], polys: [{ p: ['_a', '_b', '_c', '_d'], c: o.c || COL.b, fill: (o.c || COL.b) + '33', w: 2.5 }], lab: [['_a', '_b', (o.lL || L + ' cm'), { side: 1 }]], txt: [[L + 0.2, l / 2 - 0.15, (o.ll || l + ' cm'), { c: COL.b, a: 'start' }]].concat(o.txt || []) }); };

intro: r`Comprendre ce qu'est l'aire d'une surface, comparer des aires sans les mesurer, mesurer une aire avec un quadrillage, utiliser les unités d'aire (cm², dm², m²…), calculer l'aire d'un carré, d'un rectangle, d'un triangle rectangle et de figures composées, sans confondre aire et périmètre.`,
cours: [
{ t: 'La notion d\'aire', h: DEF(r`L'<b>aire</b> d'une figure est la mesure de sa <b>surface</b> : la place qu'elle occupe à plat, « ce qu'on peut colorier ».`) +
METH(r`On peut comparer deux aires <b>sans mesurer</b> : par <b>superposition</b> (une figure tient-elle entièrement dans l'autre ?) ou par <b>découpage et recollement</b> (on découpe une figure et on recolle les morceaux autrement : l'aire ne change pas).`, 'Comparer sans mesurer') +
FIG(ai_poly([[0, 0], [4, 0], [4, 3], [0, 3]], { box: [-0.5, -1, 4.5, 3.5], segs: [['_p0', '_p2', { c: COL.r, dash: true }]], txt: [[2, -0.7, 'je coupe le rectangle…', { c: COL.k, size: 12 }]] }) + ' ' +
geo({ s: 26, grid: true, pts: { _a: [0, 0], _b: [4, 0], _c: [4, 3], _e: [8, 0] }, box: [-0.5, -1, 8.5, 3.5], polys: [{ p: ['_a', '_b', '_c'], c: COL.b, fill: '#2f5bd333', w: 2.5 }, { p: ['_b', '_e', '_c'], c: COL.o, fill: '#e07b0033', w: 2.5 }], txt: [[4, -0.7, '… et je recolle : même aire, 12 carreaux', { c: COL.k, size: 12 }]] })) +
EXM(r`Le rectangle et le grand triangle n'ont pas la même forme, mais ils ont la <b>même aire</b> : ils sont faits des mêmes morceaux (12 carreaux chacun).`) },
{ t: 'Mesurer une aire avec un quadrillage', h: METH(r`On choisit une <b>unité d'aire</b>, par exemple un carreau, et on compte combien de carreaux recouvrent la figure. Deux demi-carreaux font un carreau entier.`, 'Méthode') +
FIG(geo({ s: 30, grid: true, pts: { _a: [0, 0], _b: [5, 0], _c: [5, 2], _d: [3, 4], _e: [0, 4] }, box: [-2.2, -1, 7.2, 4.5], polys: [{ p: ['_a', '_b', '_c', '_d', '_e'], c: COL.b, fill: '#2f5bd333', w: 2.5 }], txt: [[2.5, -0.7, '17 carreaux entiers + 2 demi-carreaux = 18 carreaux', { size: 12, c: COL.k }]] })) +
EXM(r`En bas, un rectangle de $5 \times 2 = 10$ carreaux. En haut à gauche, $3 \times 2 = 6$ carreaux. Puis, à droite en haut, 1 carreau entier et 2 demi-carreaux (le bord en biais coupe 2 carreaux en deux) : $1 + 1 = 2$. Total : $10 + 6 + 2 = 18$ carreaux.`) +
ATT(r`Le résultat dépend de l'unité choisie : si on prend des carreaux deux fois plus grands, on trouve un nombre plus petit. C'est pourquoi on utilise des unités communes : les cm², m²…`) },
{ t: 'Les unités d\'aire', h: DEF(r`<b>1 cm²</b> (centimètre carré) est l'aire d'un carré de 1 cm de côté.<br><b>1 dm²</b> est l'aire d'un carré de 1 dm (10 cm) de côté ; <b>1 m²</b> celle d'un carré de 1 m de côté.<br>On utilise aussi le <b>mm²</b> (très petites surfaces) et le <b>km²</b> (très grandes surfaces, comme une ville).`) +
FIG(geo({ s: 16, grid: true, pts: { _a: [0, 0], _b: [10, 0], _c: [10, 10], _d: [0, 10], _e: [1, 0], _f: [1, 1], _g: [0, 1] }, box: [-0.5, -1.5, 18, 10.5], polys: [{ p: ['_a', '_b', '_c', '_d'], c: COL.b, fill: '#2f5bd318', w: 2.5 }, { p: ['_a', '_e', '_f', '_g'], c: COL.r, fill: '#d23c3c99', w: 2 }], txt: [[5, -1, '1 dm = 10 cm', { c: COL.b, size: 12 }], [10.6, 6, '1 dm² = 10 × 10', { c: COL.b, size: 13, a: 'start' }], [10.6, 4.6, '= 100 cm²', { c: COL.b, size: 13, a: 'start' }], [10.6, 1.8, 'en rouge : 1 cm²', { c: COL.r, size: 12, a: 'start' }]] })) +
RET(r`$1$ dm² $= 100$ cm² ; $1$ m² $= 100$ dm² ; $1$ cm² $= 100$ mm².<br>Pour les aires, on passe d'une unité à la suivante en multipliant ou en divisant par <b>100</b> (et non par 10 !).`) +
METH(r`$3$ dm² $= 3 \times 100$ cm² $= 300$ cm².<br>$450$ cm² $= 450 \div 100$ dm² $= 4,5$ dm².<br>$2$ m² $= 200$ dm² $= 20\,000$ cm².`, 'Exemples de conversions') +
ATT(r`Un carré de 1 dm de côté contient 10 rangées de 10 petits carrés de 1 cm² : c'est pour cela qu'on multiplie par 100 et pas par 10.`) },
{ t: 'Aire du carré et du rectangle', h: PROP(r`• <b>Rectangle</b> de longueur $L$ et de largeur $\ell$ : $\text{Aire} = L \times \ell$.<br>• <b>Carré</b> de côté $c$ : $\text{Aire} = c \times c$.<br>Les longueurs doivent être dans la <b>même unité</b> ; l'aire s'exprime alors dans l'unité « carrée » correspondante.`) +
FIG(ai_rq(5, 3)) +
EXM(r`Le rectangle de 5 cm sur 3 cm contient 3 rangées de 5 carreaux de 1 cm² : $\text{Aire} = 5 \times 3 = 15$ cm².<br>Carré de côté 7 m : $\text{Aire} = 7 \times 7 = 49$ m².<br>Rectangle de 2 m sur 50 cm : $2$ m $= 200$ cm, donc $\text{Aire} = 200 \times 50 = 10\,000$ cm² $= 1$ m².`) +

// Assemblage de cubes unités en perspective cavalière : list = [[x, y, z], ...] (y = profondeur)
function so_cubes(list, o){
  o = o || {}; const u = o.u || 30, k = 0.5, c = Math.cos(Math.PI / 4) * k, col = o.c || '#2f5bd3';
  const P = (x, y, z) => [x * u + y * u * c, -(z * u + y * u * c)];
  const all = []; list.forEach(([x, y, z]) => { all.push(P(x, y, z), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1), P(x + 1, y, z)); });
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]), x0 = Math.min(...xs) - 8, y0 = Math.min(...ys) - 8, W = Math.max(...xs) - x0 + 8, H = Math.max(...ys) - y0 + 8;
  const T = p => (p[0] - x0).toFixed(1) + ' ' + (p[1] - y0).toFixed(1);
  const face = (pts, fill) => `<path d="M${pts.map(T).join('L')}Z" fill="${fill}" stroke="#1d2433" stroke-width="1.3" stroke-linejoin="round"/>`;
  const mix = t => { const h = col.replace('#', ''), v = [0, 2, 4].map(i => Math.round(parseInt(h.substr(i, 2), 16) * t + 255 * (1 - t))); return `rgb(${v.join(',')})`; };
  let s = SVG0(W, H);
  list.slice().sort((a, b) => b[1] - a[1] || a[2] - b[2] || a[0] - b[0]).forEach(([x, y, z]) => {
    s += face([P(x, y, z), P(x + 1, y, z), P(x + 1, y, z + 1), P(x, y, z + 1)], mix(0.45));
    s += face([P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], mix(0.22));
    s += face([P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], mix(0.7));
  });
  return s + '</svg>';
}
// prisme droit à base triangulaire (remplace solid('prisme'))
function so_prisme(o){
  o = o || {}; const c = o.c || COL.g, A = [30, 165], B = [120, 165], C = [70, 85], d = [55, -38], A2 = [A[0] + d[0], A[1] + d[1]], B2 = [B[0] + d[0], B[1] + d[1]], C2 = [C[0] + d[0], C[1] + d[1]];
  const L = (p, q, dash) => `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${c}" stroke-width="2.2" ${dash ? 'stroke-dasharray="6 4" stroke-opacity=".7"' : ''}/>`;
  return SVG0(200, 190) + `<path d="M${B}L${B2}L${C2}L${C}Z" fill="${c}10"/><path d="M${A}L${B}L${C}Z" fill="${c}26"/>` + L(A, B) + L(B, C) + L(C, A) + L(B, B2) + L(C, C2) + L(B2, C2) + L(A, A2, 1) + L(A2, B2, 1) + L(A2, C2, 1) + '</svg>';
}
// pavé rempli de cubes : L × l × h
const so_box = (L, l, h, o) => { const a = []; for (let z = 0; z < h; z++) for (let y = 0; y < l; y++) for (let x = 0; x < L; x++) a.push([x, y, z]); return so_cubes(a, o); };
// patron fait de carrés : cells = [[col, row, 'étiquette'], ...]
function so_net(cells, o){
  o = o || {}; const u = o.u || 34, cs = cells.map(c => c[0]), rs = cells.map(c => c[1]), W = (Math.max(...cs) + 1) * u + 16, H = (Math.max(...rs) + 1) * u + 16;
  let s = SVG0(W, H);
  cells.forEach(([cc, rr, t], i) => { s += `<rect x="${8 + cc * u}" y="${8 + rr * u}" width="${u}" height="${u}" fill="${(o.fill || PAL[i % 3]) + '33'}" stroke="#1d2433" stroke-width="1.8"/>`; if (t != null) s += svgTxt(8 + cc * u + u / 2, 8 + rr * u + u / 2 + 6, String(t), { w: 'bold', size: 16 }); });
  return s + '</svg>';
}
const so_lab = t => `<div style="text-align:center;font-weight:bold;font-size:14px;margin-top:-4px">${t}</div>`;
const so_card = (svg, t) => `<div style="display:inline-block;margin:4px 8px;vertical-align:top">${svg}${so_lab(t)}</div>`;

/* Tracé d'un chemin : scr_chemin([[0,0],[4,0],[4,-4]], {grid:true, close:false, lab:['100 pas'], start:true}) ; affiche les flèches de déplacement */
function scr_chemin(p, o){
  o = o || {};
  const pts = {}; p.forEach((q, k) => { pts['_' + k] = q; });
  const segs = [], arrows = [];
  for (let k = 0; k + 1 < p.length; k++) arrows.push(['_' + k, '_' + (k + 1), { c: o.c || COL.b }]);
  const g = { s: o.s || 34, grid: o.grid, pts, arrows, txt: [], lab: [] };
  if (o.start){ g.pts.D = p[0]; g.lp = { D: o.lp || 'sw' }; g.pc = { D: COL.g }; }
  (o.lab || []).forEach((t, k) => { if (t) g.lab.push(['_' + k, '_' + (k + 1), t, { c: COL.r }]); });
  (o.marks || []).forEach(m => { g.pts[m[0]] = m[1]; });
  if (o.lps) g.lp = Object.assign(g.lp || {}, o.lps);
  return geo(g);
}
