name: Build APK MJN COURS

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Compiler l’APK de test
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Publier l’APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MJN-COURS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
