name: Build APK MJN COURS

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurer le SDK Android déjà présent sur le runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Installer les composants Android nécessaires
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager introuvable dans le SDK préinstallé."
            find /usr/local/lib/android/sdk -maxdepth 4 -name sdkmanager -type f
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Contrôles de sécurité statiques
        shell: bash
        run: |
          set -euo pipefail
          manifest="android/app/src/main/AndroidManifest.xml"
          activity="android/app/src/main/java/fr/mjncours/app/MainActivity.java"
          gradle_file="android/app/build.gradle"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          if grep -E 'uses-permission' "$manifest" | grep -v 'android.permission.INTERNET'; then
            echo "Permission Android supplémentaire détectée : revue manuelle requise."
            exit 1
          fi
          grep -q 'setAllowFileAccess(false)' "$activity"
          grep -q 'setAllowContentAccess(false)' "$activity"
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' "$activity"
          grep -q 'setSafeBrowsingEnabled(true)' "$activity"
          grep -q 'targetSdk 36' "$gradle_file"
          echo "Contrôles statiques réussis. Ils ne remplacent pas un audit de sécurité ni une analyse antivirus."

      - name: Compiler l’APK de test
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Publier l’APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MJN-COURS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
