name: Build and release MJN COURS Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurer le SDK Android déjà présent sur le runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Installer les composants Android nécessaires
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager introuvable dans le SDK préinstallé."
            find /usr/local/lib/android/sdk -maxdepth 4 -name sdkmanager -type f
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Contrôles de sécurité statiques
        shell: bash
        run: |
          set -euo pipefail
          manifest="android/app/src/main/AndroidManifest.xml"
          activity="android/app/src/main/java/fr/mjncours/app/MainActivity.java"
          gradle_file="android/app/build.gradle"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          if grep -E 'uses-permission' "$manifest" | grep -v 'android.permission.INTERNET'; then
            echo "Permission Android supplémentaire détectée : revue manuelle requise."
            exit 1
          fi
          grep -q 'setAllowFileAccess(false)' "$activity"
          grep -q 'setAllowContentAccess(false)' "$activity"
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' "$activity"
          grep -q 'setSafeBrowsingEnabled(true)' "$activity"
          grep -q 'targetSdk 36' "$gradle_file"
          echo "Contrôles statiques réussis. Ils ne remplacent pas un audit de sécurité ni une analyse antivirus."

      - name: Compiler APK debug pour tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Publier l’APK de test
        uses: actions/upload-artifact@v4
        with:
          name: MJN-COURS-APK-TEST
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Vérifier si les secrets de signature sont configurés
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signature de production ignorée : les quatre secrets requis ne sont pas tous configurés."
          fi

      - name: Préparer la clé de signature temporaire
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mjn-release.jks"
          test -s "$RUNNER_TEMP/mjn-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mjn-release.jks" >> "$GITHUB_ENV"

      - name: Compiler APK et bundle de production signés
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Vérifier la signature de l’APK de production
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose "$APK"

      - name: Publier les fichiers signés pour vérification
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MJN-COURS-RELEASE-SIGNEE
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
