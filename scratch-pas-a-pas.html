<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scratch pas à pas | COURS MJN</title>
<meta name="description" content="Apprends Scratch pas à pas avec une activité interactive de mathématiques : découvre les blocs, programme et teste tes idées.">
<link rel="canonical" href="https://mathsavecel.github.io/COURS-MJN/scratch-pas-a-pas.html">
<meta name="robots" content="index, follow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Mise en page : feuille de cahier (même famille que la course aux nombres), scène Scratch 480×360 au centre des exercices,
   blocs aux couleurs officielles de Scratch 3 (identiques dans les deux thèmes pour que les élèves les reconnaissent). */
:root{
  --paper:#f4f6fb; --grid:#e2e8f4; --card:#ffffff; --text:#1c2135; --ink:#24318a; --muted:#596282;
  --line:#d4dbeb; --red:#c22e2e; --red-soft:#fcebea; --green:#16764a; --green-soft:#e2f3e9;
  --amber:#985600; --amber-soft:#fbefdc; --mark:#ffef9e; --accent:#3d5bd9; --accent-soft:#e8edff;
  --violet:#6b3fc9; --violet-soft:#f0eaff; --stage:#ffffff; --stage-grid:#e6eaf3; --stage-axis:#9aa3bd; --pen:#2a46c4;
  --c-ev:#FFBF00; --c-mo:#4C97FF; --c-lo:#9966FF; --c-pe:#0FBD8C; --c-ct:#FFAB19; --c-se:#5CB1D6; --c-op:#59C059; --c-va:#FF8C1A; --c-my:#FF6680; --c-li:#FF661A;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --f-block:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050; --stage:#0d1124; --stage-grid:#1f2645; --stage-axis:#4c5680; --pen:#93a8ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050; --stage:#0d1124; --stage-grid:#1f2645; --stage-axis:#4c5680; --pen:#93a8ff; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background-color:var(--paper);color:var(--text);font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse}

/* En-tête */
.top{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{width:42px;height:42px;flex:none;border-radius:10px;background:var(--c-ct);display:grid;place-items:center}
.logo svg{width:28px;height:28px}
.brand h1{font-size:1.2rem;font-weight:800;color:var(--ink)}
.brand p{font-size:.78rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.brand p b{color:var(--red);letter-spacing:.08em}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.93rem}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a.on{color:var(--ink);background:var(--accent-soft)}

main{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
footer{padding-block:4px 32px;color:var(--muted);font-size:.85rem;text-align:center}

/* Feuille */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 24px 62px;min-width:0}
.sheet::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
@media (max-width:600px){ .sheet{padding:18px 14px 20px 30px} .sheet::before{left:18px} }
.sheet > * + *{margin-top:14px}
.sheet h2{font-size:1.45rem;color:var(--ink)}
.sheet h3{font-size:1.15rem;color:var(--ink)}
.lead{max-width:66ch}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:10px;font-weight:700;font-size:.98rem;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:2rem;font-weight:800}
.hero .kicker{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
.hero .demo{min-width:0}
.demo .sb-scripts{display:none}
.demo .sb-wrap{grid-template-columns:minmax(0,1fr)}
.demo .run-ctl label{display:none}
.namebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.namebox input{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:1rem;width:min(220px,100%)}
.parcours{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.parcours{grid-template-columns:1fr}}
.pc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 16px}
.pc:hover{border-color:var(--accent)}
.pc.on{border-color:var(--ink);background:var(--accent-soft)}
.pc .pt{font:800 1.08rem var(--f-display);color:var(--ink)}
.pc .pd{font-size:.92rem;color:var(--muted)}
.pc .ps{font-size:.82rem;font-weight:700;color:var(--text)}
.pc .on-flag{font-size:.78rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}

.year{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:600px){.year{grid-template-columns:1fr}}
.year-lab{font:800 1.6rem var(--f-display);color:var(--card);background:var(--ink);border-radius:10px;text-align:center;padding:10px 0 8px;line-height:1}
.year-lab small{display:block;font:700 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;opacity:.85}
.y5 .year-lab{background:#2f7d4f}.y4 .year-lab{background:#b86200}.y3 .year-lab{background:#a52a4a}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;text-decoration:none;color:var(--text);min-height:118px;transition:transform .15s,border-color .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard.off{opacity:.55}
.scard.reco{border:2px solid var(--green)}
.scard .num{font:800 .9rem var(--f-display);color:var(--red)}
.scard .th{font-weight:700;line-height:1.3}
.scard .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);width:100%}
.minibar{flex:1;min-width:50px;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.minibar span{display:block;height:100%;background:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.r{background:var(--red-soft);color:var(--red);border-color:transparent}

/* Diagnostic */
.diag-q{border-top:1px dashed var(--line);padding-top:12px}
.diag-q .dq{font-weight:700;margin-bottom:8px}
.diag-res{border-radius:8px;padding:12px 16px;background:var(--green-soft);color:var(--text)}

/* Page d'étape */
.band{border-radius:10px;padding:18px 20px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.band.y5{background:#2f7d4f}.band.y4{background:#b86200}.band.y3{background:#a52a4a}
.band .bn{grid-row:span 3;font:800 3rem/1 var(--f-display);text-align:center;min-width:70px}
.band .bn small{display:block;font:700 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.band h2{font-size:1.65rem;font-weight:800;color:#fff}
.band p{opacity:.92}
.band .bt{display:flex;gap:6px;flex-wrap:wrap}
.band .bt span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px}
.objectifs{display:grid;gap:4px;padding-left:1.2em;margin:0}

.box{border-radius:8px;padding:14px 16px;border-left:5px solid var(--bc);background:var(--bs);min-width:0}
.box > * + *{margin-top:10px}
.box h4{font:700 .8rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--bc)}
.box h4 b{color:var(--text);text-transform:none;letter-spacing:0;font-size:.95rem}
.box ul,.box ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.box.def{--bc:var(--accent);--bs:var(--accent-soft)}
.box.sav{--bc:var(--violet);--bs:var(--violet-soft)}
.box.met{--bc:var(--amber);--bs:var(--amber-soft)}
.box.exe{--bc:var(--green);--bs:var(--green-soft)}
.box.pie{--bc:var(--red);--bs:var(--red-soft)}
.box.ast{--bc:var(--muted);--bs:var(--paper)}
.box.ret{--bc:var(--ink);--bs:var(--card);border:2px solid var(--ink);border-left-width:6px}
.formula{font:800 1.25rem var(--f-display);color:var(--ink);text-align:center;padding:4px 0}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 20px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{min-width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:700;font-size:.85rem}
.tbl td.c,.tbl th.c{text-align:center}
.faux{color:var(--red);font-weight:700}.vrai{color:var(--green);font-weight:700}
mark{color:inherit;background:var(--mark);padding:0 3px;border-radius:3px;font-weight:700}
.hand{font:700 1.45rem var(--f-hand);color:var(--red)}

/* Exercices */
.lvl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:22px!important}
.lvl-h .stars{color:var(--amber);font-size:1.15rem;letter-spacing:2px}
.lvl-h h3{font-size:1.15rem}
.lvl-h span.muted{font-size:.9rem}
.lvl-h .reco-tag{font-size:.75rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.ex{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);min-width:0}
.ex > * + *{margin-top:10px}
.ex.done{border-color:var(--green)}
.ex-h{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.ex-h .en{font:800 1rem var(--f-display);color:var(--red)}
.ex-h h4{font-size:1.05rem;color:var(--ink)}
.ex-h .src{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:1px 7px}
.ex-h .ok-flag{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--green)}
.qs{display:grid;gap:10px;margin:0;padding-left:1.5em}
.qs > li::marker{font-weight:800;color:var(--ink)}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.qa input{width:min(170px,100%);border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.qa input.ok{border-color:var(--green);background:var(--green-soft)}
.qa input.ko{border-color:var(--red);background:var(--red-soft)}
.qa .choice{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-weight:700;min-height:38px}
.qa .choice:hover{border-color:var(--accent)}
.qa .choice.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.qa .choice.ko{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fb{font-weight:700;font-size:.92rem}
.fb.ok{color:var(--green)}.fb.ko{color:var(--red)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{background:var(--amber-soft);border-radius:8px;padding:10px 14px;border-left:4px solid var(--amber)}
.hint b.hl{color:var(--amber)}
.corr{border:2px dashed var(--red);border-radius:8px;padding:10px 16px 14px}
.corr > * + *{margin-top:8px}
.corr .ct{font:700 1.6rem/1 var(--f-hand);color:var(--red)}
.corr ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.res{display:inline-block;padding:2px 10px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Mémo */
.memo td:first-child{white-space:nowrap}

/* Blocs Scratch */
.k{display:inline-block;font:700 .84em/1.3 var(--f-block);color:#fff;background:var(--kc);border-radius:5px;padding:1px 7px;white-space:nowrap;vertical-align:baseline}
.k.ev{--kc:#D9A300}.k.mo{--kc:#3d7fe0}.k.lo{--kc:#7f55e0}.k.pe{--kc:#0b9a72}.k.ct{--kc:#e08f00}.k.se{--kc:#3b97be}.k.op{--kc:#3e9e3e}.k.va{--kc:#e67300}.k.my{--kc:#e64d6a}
.sb-wrap{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:16px;align-items:start}
.sb-wrap.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:760px){.sb-wrap{grid-template-columns:minmax(0,1fr)}}
.sb-scripts{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;overflow-x:auto;max-width:100%;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:14px 14px}
.sb{display:inline-flex;flex-direction:column;align-items:flex-start;font:700 13px/1 var(--f-block);color:#fff;vertical-align:top}
.blk{--c:var(--c-mo);background:var(--c);border:1px solid rgba(0,0,0,.18);border-radius:5px;padding:5px 9px;min-height:32px;display:flex;align-items:center;gap:5px;white-space:nowrap;position:relative;margin-top:-1px;transition:box-shadow .15s}
.blk::after{content:"";position:absolute;left:14px;bottom:-5px;width:16px;height:5px;background:var(--c);border-radius:0 0 4px 4px;border:1px solid rgba(0,0,0,.18);border-top:0;z-index:1}
.blk.hat{border-radius:18px 18px 5px 5px;padding-top:12px;min-width:110px}
.blk.def{border-radius:18px 18px 5px 5px;padding-top:12px;padding-bottom:8px}
.blk.cap::after{display:none}
.cb{display:flex;flex-direction:column;align-items:flex-start;--c:var(--c-ct)}
.cb > .blk{border-bottom-left-radius:0}
.cb .mouth{border-left:14px solid var(--c);min-height:22px;padding:1px 0 4px;display:flex;flex-direction:column;align-items:flex-start;margin-top:-1px}
.cb .arm{background:var(--c);height:18px;width:max(90px,40%);border-radius:0 5px 5px 5px;border:1px solid rgba(0,0,0,.18);border-top:0;margin-top:-1px;position:relative}
.cb .arm.mid{height:auto;width:auto;min-height:26px;border-radius:0 5px 5px 0;padding:5px 9px;display:flex;align-items:center}
.cb .arm:not(.mid)::after{content:"";position:absolute;left:14px;bottom:-5px;width:16px;height:5px;background:var(--c);border-radius:0 0 4px 4px}
.c-ev{--c:var(--c-ev)}.c-mo{--c:var(--c-mo)}.c-lo{--c:var(--c-lo)}.c-pe{--c:var(--c-pe)}.c-ct{--c:var(--c-ct)}.c-se{--c:var(--c-se)}.c-op{--c:var(--c-op)}.c-va{--c:var(--c-va)}.c-my{--c:var(--c-my)}
.in{background:#fff;color:#4a5068;border-radius:999px;padding:3px 9px;min-width:26px;text-align:center;font-weight:600;border:1px solid rgba(0,0,0,.12)}
.in.dd{background:rgba(0,0,0,.16);color:#fff;border-color:rgba(0,0,0,.2)}
.in.blank{background:#fff7d6;border:2px dashed #e07800;color:#b85a00;min-width:38px}
.in.slot{background:none;border:0;padding:0;min-width:0}
.rep{background:var(--c);border-radius:999px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(0,0,0,.2)}
.bool{background:var(--c);padding:4px 14px;display:inline-flex;align-items:center;gap:4px;clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
.flag{color:#4cbf56;font-size:15px}
.blk.now{box-shadow:0 0 0 3px #ffe14d,0 0 14px 4px rgba(255,214,0,.75);z-index:3}
.blk.badblock{outline:3px solid var(--red)}

/* Scène */
.runner{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage-box{position:relative;width:100%;max-width:480px;aspect-ratio:4/3;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--stage)}
.stage-box canvas{width:100%;height:100%;display:block}
.run-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.run-ctl .go{background:#3fa34d;border-color:#3fa34d;color:#fff}
.run-ctl label{font-size:.88rem;font-weight:700;display:flex;gap:6px;align-items:center}
.run-ctl input[type=text]{width:110px;border:2px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--paper);font-weight:700}
.run-status{font-size:.88rem;color:var(--muted);min-height:1.3em}
.run-status b{color:var(--text)}
.run-status .warn{color:var(--red);font-weight:700}
.trace{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.trace table{width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
.trace th,.trace td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
.trace th{position:sticky;top:0;background:var(--paper);font-size:.78rem}
.trace tr.cur td{background:var(--mark)}
.say{font-weight:700;color:var(--violet)}

.prof .hidden-prof{display:none}
.teacher-flag{font-size:.8rem;font-weight:700;color:var(--red)}

@media print{
  .top,.run-ctl,.ex-actions,.qa,.runner,nav,.pnav,.no-print{display:none!important}
  body{background:#fff}
  .sheet{border:0;padding-left:0}.sheet::before{display:none}
}
/* Charte MJN et mode sombre */

<script>
/* ============================================================
   MOTEUR : lecture des scripts, dessin des blocs, exécution
   Syntaxe d'un script (une ligne = un bloc, 2 espaces = imbrication) :
     ev quand ⚑ est cliqué
     ct répéter [4] fois
       mo avancer de [50] pas
     ct sinon            (à la hauteur du « si »)
   [x] case blanche · [x▾] menu · [?] ou […] case à compléter
   {va:score} reporter (catégorie:contenu) · ⟨op:[a] > [b]⟩ condition
   Une ligne vide sépare deux scripts.
   ============================================================ */
const CATS = ['ev','mo','lo','pe','ct','se','op','va','my'];
let BID = 0;

function parseInline(s, i, close){
  const parts = []; let txt = '';
  const flush = () => { if (txt) { parts.push({t:'text', v:txt}); txt=''; } };
  while (i < s.length){
    const c = s[i];
    if (close && c === close){ flush(); return {parts, i:i+1}; }
    if (c === '['){
      flush();
      const r = parseInline(s, i+1, ']');
      const nodes = r.parts.filter(p => !(p.t==='text' && !p.v.trim()));
      if (nodes.length === 1 && nodes[0].t !== 'text') parts.push({t:'in', node:nodes[0]});
      else parts.push({t:'in', v: r.parts.map(p=>p.v||'').join('')});
      i = r.i; continue;
    }
    if (c === '{' || c === '⟨'){
      flush();
      const j = s.indexOf(':', i);
      const cat = s.slice(i+1, j);
      const r = parseInline(s, j+1, c === '{' ? '}' : '⟩');
      parts.push({t: c === '{' ? 'rep' : 'bool', cat, parts:r.parts});
      i = r.i; continue;
    }
    txt += c; i++;
  }
  flush(); return {parts, i};
}
const sigOf = parts => parts.map(p => p.t==='text' ? p.v : ' _ ').join('').replace(/\s+/g,' ').trim();
const plain = parts => parts.map(p => p.t==='text' ? p.v : p.t==='in' ? (p.node ? '('+plain(p.node.parts)+')' : (p.v||'').replace('▾','')) : '('+plain(p.parts)+')').join('').replace(/\s+/g,' ').trim();

function parseScripts(src){
  return src.replace(/\r/g,'').split(/\n\s*\n/).map(chunk => {
    const root = []; const stack = [{indent:-1, list:root}];
    chunk.split('\n').forEach(line => {
      if (!line.trim()) return;
      const indent = line.match(/^ */)[0].length;
      const m = line.trim().match(/^(\w\w)\s+(.*)$/);
      if (!m) return;
      const cat = m[1], text = m[2];
      if (cat === 'ct' && text === 'sinon'){
        while (stack.length > 1 && stack[stack.length-1].indent > indent) stack.pop();
        const top = stack[stack.length-1];
        if (top.block){ top.block.els = []; top.list = top.block.els; }
        return;
      }
      while (stack.length > 1 && stack[stack.length-1].indent >= indent) stack.pop();
      const b = {id: ++BID, cat, parts: parseInline(text, 0, null).parts, kids: []};
      b.sig = sigOf(b.parts);
      b.c = cat === 'ct' && /^(répéter|si )/.test(b.sig);
      stack[stack.length-1].list.push(b);
      stack.push({indent, list:b.kids, block:b});
    });
    return root;
  }).filter(s => s.length);
}

/* ---------- Dessin des blocs ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inlineHTML(parts, cat){
  return parts.map(p => {
    if (p.t === 'text') return esc(p.v.trim()).replace('⚑','<span class="flag">⚑</span>');
    if (p.t === 'in'){
      if (p.node) return '<span class="in slot">'+inlineHTML([p.node], cat)+'</span>';
      const v = p.v.trim();
      if (v === '?' || v === '…' || v === '...') return '<span class="in blank">…</span>';
      if (v.endsWith('▾')) return '<span class="in dd">'+esc(v)+'</span>';
      return '<span class="in">'+esc(v||' ')+'</span>';
    }
    const cls = p.t === 'rep' ? 'rep' : 'bool';
    return '<span class="'+cls+' c-'+p.cat+'">'+inlineHTML(p.parts, p.cat)+'</span>';
  }).join(' ');
}
function blockHTML(b, isLast){
  const head = inlineHTML(b.parts, b.cat);
  const hat = /^(quand|définir)/.test(b.sig);
  if (!b.c){
    const cls = 'blk c-'+b.cat + (hat ? (b.sig.startsWith('définir') ? ' def' : ' hat') : '') + (/^(stop tout|répéter indéfiniment)/.test(b.sig) ? ' cap':'');
    return '<div class="'+cls+'" data-b="'+b.id+'">'+head+'</div>';
  }
  const list = l => l.map(blockHTML).join('');
  let h = '<div class="cb c-'+b.cat+'"><div class="blk c-'+b.cat+'" data-b="'+b.id+'">'+head+'</div><div class="mouth">'+list(b.kids)+'</div>';
  if (b.els) h += '<div class="arm mid">sinon</div><div class="mouth">'+list(b.els)+'</div>';
  return h + '<div class="arm"></div></div>';
}
const scriptHTML = s => '<div class="sb">'+s.map(blockHTML).join('')+'</div>';

/* ---------- Exécution ---------- */
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[−–]/g,'-').replace(',','.').replace(/\s/g,'')); return isNaN(n) ? 0 : n; };
const isNum = v => typeof v === 'number' || /^\s*[-−–]?\d+([.,]\d+)?\s*$/.test(String(v));
const fmt = v => { if (typeof v !== 'number') return String(v); const r = Math.round(v*1e6)/1e6; return String(r).replace('.',',').replace('-','−'); };

function Machine(scripts, answers){
  this.procs = {}; this.main = null;
  scripts.forEach(s => {
    const h = s[0];
    if (h.sig.startsWith('définir')){
      const params = []; const p2 = h.parts.slice();
      p2[0] = {t:'text', v:p2[0].v.replace(/^\s*définir\s*/,'')};
      p2.forEach(p => { if (p.t === 'in') params.push((p.v||'').trim()); else if (p.t !== 'text') params.push(sigOf(p.parts)); });
      this.procs[sigOf(p2)] = {params, body: s.slice(1)};
    } else if (h.sig.startsWith('quand ⚑') && !this.main) this.main = s.slice(1);
  });
  this.x = 0; this.y = 0; this.dir = 90; this.pen = false; this.lines = [];
  this.vars = {}; this.varOrder = []; this.say = ''; this.t = 0; this.answer = '';
  this.answers = answers.slice(); this.frames = []; this.usesMotion = false; this.steps = 0;
}
Machine.prototype.setVar = function(n, v){ if (!(n in this.vars)) this.varOrder.push(n); this.vars[n] = v; };
Machine.prototype.ev = function(p){
  if (!p) return '';
  if (p.t === 'in') return p.node ? this.ev(p.node) : (isNum(p.v) ? num(p.v) : (p.v.includes('▾') ? p.v.replace('▾','').trim() : p.v));
  if (p.t === 'text') return p.v.trim();
  const ins = p.parts.filter(q => q.t !== 'text' || false);
  const a = () => this.ev(ins[0]), b = () => this.ev(ins[1]);
  const sig = sigOf(p.parts);
  switch (sig){
    case '_ + _': return num(a()) + num(b());
    case '_ - _': return num(a()) - num(b());
    case '_ * _': return num(a()) * num(b());
    case '_ / _': return num(a()) / num(b());
    case '_ modulo _': { const m = num(b()); return ((num(a()) % m) + m) % m; }
    case 'nombre aléatoire entre _ et _': { const lo = Math.ceil(num(a())), hi = Math.floor(num(b())); return lo + Math.floor(Math.random()*(hi-lo+1)); }
    case 'regrouper _ et _': return fmt(a()) + fmt(b());
    case 'arrondi de _': return Math.round(num(a()));
    case 'racine de _': return Math.sqrt(num(a()));
    case '_ < _': return num(a()) < num(b());
    case '_ > _': return num(a()) > num(b());
    case '_ = _': { const x = a(), y = b(); return (isNum(x) && isNum(y)) ? num(x) === num(y) : String(x).toLowerCase() === String(y).toLowerCase(); }
    case '_ et _': return !!a() && !!b();
    case '_ ou _': return !!a() || !!b();
    case 'non _': return !a();
    case 'réponse': return this.answer;
    case 'abscisse x': this.usesMotion = true; return this.x;
    case 'ordonnée y': this.usesMotion = true; return this.y;
    case 'direction': return this.dir;
  }
  if (p.cat === 'my'){ for (let i = this.frames.length-1; i >= 0; i--) if (sig in this.frames[i]) return this.frames[i][sig]; return 0; }
  if (p.cat === 'va') return (sig in this.vars) ? this.vars[sig] : 0;
  return 0;
};
Machine.prototype.moveTo = function(nx, ny){
  if (this.pen) this.lines.push([this.x, this.y, nx, ny]);
  this.x = nx; this.y = ny; this.usesMotion = true;
};
Machine.prototype.run = function*(list){
  for (const b of list){
    if (++this.steps > this.limit) throw new Error('limit');
    const ins = b.parts.filter(p => p.t !== 'text');
    const A = i => this.ev(ins[i]);
    const s = b.sig; let note = '';
    if (s === 'répéter _ fois'){
      const n = Math.round(num(A(0)));
      for (let k = 1; k <= n; k++){ if (++this.steps > this.limit) throw new Error('limit'); yield {b, note:'tour '+k+' / '+n}; yield* this.run(b.kids); }
      continue;
    }
    if (s === 'répéter jusqu\'à ce que _'){
      let k = 0;
      while (true){
        if (++this.steps > this.limit) throw new Error('limit');
        const c = A(0);
        yield {b, note: c ? 'condition vraie → on sort' : 'condition fausse → tour '+(++k)};
        if (c) break;
        yield* this.run(b.kids);
      }
      continue;
    }
    if (s === 'répéter indéfiniment'){ let k=0; while (true){ if (++this.steps > this.limit) throw new Error('limit'); yield {b, note:'tour '+(++k)}; yield* this.run(b.kids); } }
    if (s === 'si _ alors'){
      const c = A(0);
      yield {b, note: c ? 'condition vraie' : 'condition fausse'};
      if (c) yield* this.run(b.kids); else if (b.els) yield* this.run(b.els);
      continue;
    }
    // appel d'un bloc personnalisé
    if (b.cat === 'my' && this.procs[s]){
      const pr = this.procs[s], fr = {};
      pr.params.forEach((nm, i) => fr[nm] = A(i));
      yield {b, note: pr.params.map(nm => nm+' = '+fmt(fr[nm])).join(', ')};
      this.frames.push(fr); yield* this.run(pr.body); this.frames.pop();
      continue;
    }
    const d = this.dir*Math.PI/180;
    switch (s){
      case 'avancer de _ pas': { const n = num(A(0)); this.moveTo(this.x + n*Math.sin(d), this.y + n*Math.cos(d)); break; }
      case 'reculer de _ pas': { const n = -num(A(0)); this.moveTo(this.x + n*Math.sin(d), this.y + n*Math.cos(d)); break; }
      case 'tourner ↻ de _ degrés': this.dir = norm(this.dir + num(A(0))); this.usesMotion = true; break;
      case 'tourner ↺ de _ degrés': this.dir = norm(this.dir - num(A(0))); this.usesMotion = true; break;
      case 's\'orienter à _': this.dir = norm(num(A(0))); this.usesMotion = true; break;
      case 'aller à x: _ y: _': this.moveTo(num(A(0)), num(A(1))); break;
      case 'ajouter _ à x': this.moveTo(this.x + num(A(0)), this.y); break;
      case 'ajouter _ à y': this.moveTo(this.x, this.y + num(A(0))); break;
      case 'mettre x à _': this.moveTo(num(A(0)), this.y); break;
      case 'mettre y à _': this.moveTo(this.x, num(A(0))); break;
      case 'effacer tout': this.lines = []; break;
      case 'stylo en position d\'écriture': this.pen = true; break;
      case 'relever le stylo': this.pen = false; break;
      case 'dire _': this.say = fmt(A(0)); break;
      case 'penser à _': this.say = fmt(A(0)); break;
      case 'dire _ pendant _ secondes': this.say = fmt(A(0)); this.t += num(A(1)); break;
      case 'attendre _ secondes': this.t += num(A(0)); break;
      case 'demander _ et attendre': {
        const v = this.answers.length ? this.answers.shift() : '';
        this.answer = isNum(v) ? num(v) : v; this.say = '';
        note = 'question : « '+fmt(A(0))+' » · réponse tapée : '+fmt(this.answer); break;
      }
      case 'mettre _ à _': this.setVar(String(A(0)), A(1)); break;
      case 'ajouter _ à _': { const n = String(A(1)); this.setVar(n, num(this.vars[n]||0) + num(A(0))); break; }
      case 'stop tout': yield {b, note:'arrêt'}; throw new Error('stop');
    }    yield {b, note};
  }
};
const norm = d => { d = ((d % 360) + 360) % 360; return d > 180 ? d - 360 : d; };
const dirName = d => ({'90':'droite','0':'haut','180':'bas','-90':'gauche','-180':'bas'})[String(Math.round(d))] || '';

/* ---------- La scène ---------- */
function drawStage(cv, m, opts){
  const ctx = cv.getContext('2d'); const W = 480, H = 360, R = cv.width / W;
  const cs = getComputedStyle(document.documentElement);
  const col = n => cs.getPropertyValue(n).trim();
  ctx.setTransform(R,0,0,R,0,0);
  ctx.fillStyle = col('--stage'); ctx.fillRect(0,0,W,H);
  const X = x => W/2 + x, Y = y => H/2 - y;
  if (opts.grid){
    ctx.strokeStyle = col('--stage-grid'); ctx.lineWidth = 1;
    for (let x = -240; x <= 240; x += 20){ ctx.beginPath(); ctx.moveTo(X(x)+.5,0); ctx.lineTo(X(x)+.5,H); ctx.stroke(); }
    for (let y = -180; y <= 180; y += 20){ ctx.beginPath(); ctx.moveTo(0,Y(y)+.5); ctx.lineTo(W,Y(y)+.5); ctx.stroke(); }
    ctx.fillStyle = col('--stage-axis'); ctx.font = '10px sans-serif';
    [-200,-100,100,200].forEach(v => { ctx.fillText(v, X(v)+2, Y(0)+11); });
    [-100,100].forEach(v => { ctx.fillText(v, X(0)+3, Y(v)-2); });
  }
  ctx.strokeStyle = col('--stage-axis'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,Y(0)+.5); ctx.lineTo(W,Y(0)+.5); ctx.moveTo(X(0)+.5,0); ctx.lineTo(X(0)+.5,H); ctx.stroke();
  ctx.strokeStyle = col('--pen'); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); m.lines.forEach(l => { ctx.moveTo(X(l[0]),Y(l[1])); ctx.lineTo(X(l[2]),Y(l[3])); }); ctx.stroke();
  // le lutin : une flèche orange qui montre sa direction
  ctx.save(); ctx.translate(X(m.x), Y(m.y)); ctx.rotate((m.dir-90)*Math.PI/180);
  ctx.fillStyle = '#ff9a1f'; ctx.strokeStyle = '#8a4b00'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-9,-10); ctx.lineTo(-4,0); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  if (m.say !== ''){
    ctx.font = 'bold 14px sans-serif';
    const t = String(m.say).slice(0,40), w = ctx.measureText(t).width + 18;
    let bx = Math.min(Math.max(X(m.x)+10, 4), W - w - 4), by = Math.max(Y(m.y) - 52, 4);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#9aa3bd'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx,by,w,30,12) : ctx.rect(bx,by,w,30); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1c2135'; ctx.fillText(t, bx+9, by+20);
  }
}

/* ---------- Un script prêt à l'emploi (blocs + scène + tableau de suivi) ---------- */
function mountScript(el){
  const src = el.textContent;
  const scripts = parseScripts(src);
  const runnable = el.dataset.run !== undefined;
  const wrap = document.createElement('div');
  wrap.className = 'sb-wrap' + (runnable ? '' : ' solo');
  wrap.innerHTML = '<div class="sb-scripts">'+scripts.map(scriptHTML).join('')+'</div>';
  el.replaceWith(wrap);
  if (!runnable) { wrap.style.display = 'block'; wrap.firstChild.style.display = 'inline-flex'; return; }
  const ask = /demander/.test(src);
  const grid = el.dataset.grid !== undefined;
  const r = document.createElement('div'); r.className = 'runner';
  const uid = 'r' + (++BID);
  r.innerHTML =
    '<div class="stage-box"><canvas width="960" height="720" aria-label="Scène Scratch"></canvas></div>' +
    '<div class="run-ctl">' +
      (ask ? '<label for="'+uid+'">Je tape :<input type="text" id="'+uid+'" value="'+esc(el.dataset.ask||'')+'"></label>' : '') +
      '<button class="btn small go" type="button" data-a="run">⚑ Exécuter</button>' +
      '<button class="btn small ghost" type="button" data-a="step">Pas à pas ▸</button>' +
      '<button class="btn small ghost" type="button" data-a="reset">Effacer</button>' +
      '<label><input type="checkbox" data-a="tr"> Tableau de suivi</label>' +
    '</div><div class="run-status" aria-live="polite"></div><div class="trace" hidden></div>';
  wrap.appendChild(r);
  const cv = r.querySelector('canvas'), st = r.querySelector('.run-status'), tr = r.querySelector('.trace');
  const opts = {grid};
  let M, G, rows, timer = null, done = false;
  const blocks = () => wrap.querySelectorAll('.blk[data-b]');
  function reset(){
    clearTimeout(timer); timer = null; done = false;
    const answers = ask ? r.querySelector('input[type=text]').value.split(';').map(s => s.trim()) : [];
    M = new Machine(scripts, answers); M.limit = 4000;
    G = M.main ? M.run(M.main) : null; rows = [];
    blocks().forEach(b => b.classList.remove('now'));
    drawStage(cv, M, opts); st.innerHTML = 'Clique sur <b>⚑ Exécuter</b> ou avance <b>pas à pas</b>.'; renderTrace();
  }
  function snapshot(info){
    rows.push({txt: plain(info.b.parts), note: info.note, x:M.x, y:M.y, dir:M.dir, vars: Object.assign({}, M.vars), say: M.say});
  }
  function step(){
    if (done || !G) return false;
    let r1;
    try { r1 = G.next(); }
    catch(e){
      done = true;
      if (e.message === 'limit') st.innerHTML = '<span class="warn">⚠ Le programme tourne encore après '+M.limit+' blocs : c\'est sûrement une boucle infinie. Le lutin est arrêté.</span>';
      else finish();
      return false;
    }
    if (r1.done){ done = true; finish(); return false; }
    blocks().forEach(b => b.classList.toggle('now', +b.dataset.b === r1.value.b.id));
    snapshot(r1.value);
    return true;
  }
  function status(){
    const parts = [];
    if (M.usesMotion) parts.push('Position <b>('+fmt(M.x)+' ; '+fmt(M.y)+')</b> · direction <b>'+fmt(M.dir)+'</b>'+(dirName(M.dir)?' ('+dirName(M.dir)+')':''));
    M.varOrder.forEach(v => parts.push(esc(v)+' = <b>'+esc(fmt(M.vars[v]))+'</b>'));
    if (M.say !== '') parts.push('le lutin dit <b class="say">'+esc(M.say)+'</b>');
    if (M.t) parts.push('durée <b>'+fmt(M.t)+' s</b>');
    return parts.join(' · ');
  }
  function finish(){
    blocks().forEach(b => b.classList.remove('now'));
    drawStage(cv, M, opts);
    st.innerHTML = '✔ Fin du programme ('+rows.length+' étapes). ' + status();
    renderTrace();
  }
  function renderTrace(){
    if (tr.hidden) return;
    const vs = M.varOrder;
    let h = '<table><thead><tr><th>n°</th><th>Bloc exécuté</th>' + (M.usesMotion ? '<th>x</th><th>y</th><th>direction</th>' : '') +
      vs.map(v => '<th>'+esc(v)+'</th>').join('') + '<th>Le lutin dit</th></tr></thead><tbody>';
    const show = rows.slice(0, 400);
    show.forEach((r2, i) => {
      h += '<tr'+(i === rows.length-1 && !done ? ' class="cur"' : '')+'><td>'+(i+1)+'</td><td>'+esc(r2.txt)+(r2.note?' <span class="muted">('+esc(r2.note)+')</span>':'')+'</td>' +
        (M.usesMotion ? '<td>'+fmt(r2.x)+'</td><td>'+fmt(r2.y)+'</td><td>'+fmt(r2.dir)+'</td>' : '') +
        vs.map(v => '<td>'+(v in r2.vars ? esc(fmt(r2.vars[v])) : '')+'</td>').join('') + '<td class="say">'+esc(r2.say)+'</td></tr>';
    });
    if (rows.length > 400) h += '<tr><td colspan="9" class="muted">… '+(rows.length-400)+' lignes de plus</td></tr>';
    tr.innerHTML = h + '</tbody></table>';
    if (!done) tr.scrollTop = tr.scrollHeight;
  }
  r.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a || a === 'tr') return;
    if (a === 'reset'){ reset(); return; }
    if (a === 'step'){
      if (timer){ clearTimeout(timer); timer = null; }
      if (done) reset();
      if (step()){ drawStage(cv, M, opts); st.innerHTML = 'Bloc '+rows.length+' : <b>'+esc(rows[rows.length-1].txt)+'</b>'+(rows[rows.length-1].note?' ('+esc(rows[rows.length-1].note)+')':'')+'<br>'+status(); renderTrace(); }
      return;
    }
    if (a === 'run'){
      if (timer) return;
      if (done || rows.length) reset();
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const tick = () => {
        const n = reduce ? 100000 : 1 + Math.floor(rows.length / 25);
        let alive = true;
        for (let i = 0; i < n && alive; i++) alive = step();
        if (alive){ drawStage(cv, M, opts); st.innerHTML = status(); renderTrace(); timer = setTimeout(tick, 140); }
        else timer = null;
      };
      tick();
    }
  });
  r.querySelector('[data-a=tr]').addEventListener('change', e => { tr.hidden = !e.target.checked; renderTrace(); });
  reset();
}

function S(src, opt){
  const lines = src.replace(/^\n+|\s+$/g,'').split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  const body = lines.map(l => l.slice(ind)).join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<pre class="sbsrc" '+(opt||'')+'>'+body+'</pre>';
}

function normA(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/(\d),(\d)/g,'$1.$2').replace(/[;,.°€](?!\d)/g,'').replace(/pas$|secondes?$|s$/,'');
}
function same(given, ans){
  const list = Array.isArray(ans) ? ans : [ans];
  const g = normA(given);
  return list.some(a => { const b = normA(a); if (g === b) return true; const x = parseFloat(g), y = parseFloat(b); return !isNaN(x) && /^-?\d+(\.\d+)?$/.test(g) && x === y; });
}
const stepDone = st => st.ex.filter(e => ST.done[e.n]).length;

/* ---------- Page d'étape ---------- */
function viewStep(n){
  const s = STEPS.find(x => x.n === n); if (!s) return viewHome();
  const p = curP(), inP = p.steps.includes(n);
  let h = '<section class="band y'+s.y+'"><div class="bn"><small>Étape</small>'+s.n+'</div><div class="bt"><span>Niveau '+YEAR[s.y]+'</span>'+(inP ? '<span>Dans ton parcours</span>' : '<span>Hors de ton parcours</span>')+'</div><h2>'+s.t+'</h2><p>'+s.sub+'</p></section>';

    '<h3>Mes objectifs · à la fin de cette étape, je sais…</h3><ul class="objectifs">'+s.obj.map(o => '<li>'+o+'</li>').join('')+'</ul></section>';
  h += '<section class="sheet"><h2>La leçon</h2>'+s.lesson+'</section>';
  h += '<section class="sheet" id="exos"><h2>✎ Je m\'entraîne</h2><p class="lead muted">Commence par les ★. Si tu bloques, ouvre un indice ; la correction est là quand tu as vraiment cherché. Coche « Tableau de suivi » sous une scène pour vérifier ton tableau.</p>';
  [1,2,3].forEach(lv => {
    const list = s.ex.filter(e => e.lvl === lv); if (!list.length) return;
    h += '<div class="lvl-h"><span class="stars">'+LV[lv][0]+'</span><h3>'+LV[lv][1]+'</h3><span class="muted">'+LV[lv][2]+'</span>'+(p.lv.includes(lv) && inP ? '<span class="reco-tag">conseillé pour ton parcours</span>' : '')+'</div>';
    list.forEach(e => { h += exHTML(e); });
  });
  h += '<div id="stepEnd"></div></section>';

function exHTML(e){
  const id = 'x'+e.n.replace('.','_');
  return '<article class="ex'+(ST.done[e.n] ? ' done' : '')+'" id="'+id+'"><div class="ex-h"><span class="en">Exercice '+e.n+'</span><h4>'+e.t+'</h4>'+(e.src ? '<span class="src">'+e.src+'</span>' : '')+'<span class="ok-flag">'+(ST.done[e.n] ? '✔ réussi' : '')+'</span></div>' +
    e.body +
    '<ol class="qs">'+e.qs.map((q, i) => '<li><div>'+q.q+'</div><div class="qa" data-q="'+i+'">' +
      (q.choices ? q.choices.map(c => '<button type="button" class="choice" data-c="'+esc(c)+'">'+c+'</button>').join('')
        : '<input type="text" inputmode="text" id="'+id+'_'+i+'" aria-label="Ta réponse" autocomplete="off">'+(q.unit ? '<span class="muted">'+q.unit+'</span>' : '')+'<button type="button" class="btn small ghost" data-chk>Vérifier</button>') +
      '<span class="fb" aria-live="polite"></span></div></li>').join('')+'</ol>' +
    '<div class="ex-actions"><button type="button" class="btn small ghost" data-hint>💡 Un indice</button><button type="button" class="btn small ghost" data-sol>J\'ai cherché : voir la correction</button></div>' +
    e.hints.map((t, i) => '<div class="hint" data-h="'+i+'"'+(PROF ? '' : ' hidden')+'><b class="hl">Indice '+(i+1)+'.</b> '+t+'</div>').join('') +
    '<div class="corr"'+(PROF ? '' : ' hidden')+'><p class="ct">Correction</p>'+e.sol+'</div></article>';
}

function wireEx(e, s){
  const el = document.getElementById('x'+e.n.replace('.','_'));
  const ok = new Set();
  const finish = () => {
    if (ok.size === e.qs.length && !ST.done[e.n]){
      ST.done[e.n] = true; save();
      el.classList.add('done'); el.querySelector('.ok-flag').textContent = '✔ réussi';
      stepEnd(s, true);
    }
  };
  e.qs.forEach((q, i) => {
    const box = el.querySelector('[data-q="'+i+'"]'), fb = box.querySelector('.fb');
    const verdict = good => {
      fb.className = 'fb ' + (good ? 'ok' : 'ko');
      fb.textContent = good ? pick(BRAVO) : pick(ENCORE);
      if (good) ok.add(i); finish();
    };
    if (q.choices){
      box.addEventListener('click', ev => {
        const b = ev.target.closest('.choice'); if (!b || ok.has(i)) return;
        const good = b.dataset.c === q.a || b.dataset.c === esc(q.a);
        b.classList.add(good ? 'ok' : 'ko'); verdict(good);
      });
    } else {
      const inp = box.querySelector('input');
      const chk = () => { if (!inp.value.trim()) return; const good = same(inp.value, q.a); inp.classList.toggle('ok', good); inp.classList.toggle('ko', !good); if (good) inp.readOnly = true; verdict(good); };
      box.querySelector('[data-chk]').addEventListener('click', chk);
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') chk(); });
    }
  });
  const hb = el.querySelector('[data-hint]');
  hb.addEventListener('click', () => {
    const hid = [...el.querySelectorAll('.hint')].find(x => x.hidden);
    if (hid) hid.hidden = false;
    if (![...el.querySelectorAll('.hint')].some(x => x.hidden)){ hb.disabled = true; hb.textContent = '💡 Tous les indices sont affichés'; }
  });
  el.querySelector('[data-sol]').addEventListener('click', ev => {
    const c = el.querySelector('.corr'); c.hidden = !c.hidden;
    ev.target.textContent = c.hidden ? 'J\'ai cherché : voir la correction' : 'Cacher la correction';
  });
}

function stepEnd(s, fresh){
  const d = stepDone(s), tot = s.ex.length, box = document.getElementById('stepEnd'); if (!box) return;
  const next = STEPS.find(x => x.n === s.n+1);
  if (d === tot){
    box.innerHTML = '<div class="box exe" style="margin-top:18px"><h4>Étape validée · <b>'+tot+' / '+tot+' exercices</b></h4><p class="hand">'+(ST.name ? 'Bravo '+esc(ST.name)+' !' : 'Bravo !')+' Tu as réussi toute l\'étape '+s.n+'.</p><p>Chaque étape réussie te rapproche du brevet. Quel beau travail : continue comme ça !</p><p class="muted">— M. AHA MAJANI</p>'+(next ? '<p><a class="btn small" href="#e'+next.n+'">Passer à l\'étape '+next.n+' →</a></p>' : '')+'</div>';
  } else {
    box.innerHTML = '<div class="box ast" style="margin-top:18px"><h4>Ma progression · <b>'+d+' / '+tot+' exercices réussis</b></h4><p>'+(d === 0 ? 'Lance-toi sur le premier exercice ★ : il est guidé pas à pas.' : d >= tot/2 ? 'Plus de la moitié ! Encore un petit effort, tu y es presque.' : 'Bien parti ! Chaque bonne réponse compte.')+'</p></div>';
  }
  if (fresh && d === tot) box.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- Mémo ---------- */
function viewMemo(){
  const rows = [
    ['ev','quand ⚑ est cliqué','Démarre le script'],['mo','aller à x: … y: …','Place le lutin au point (x ; y)'],['mo','ajouter … à x / à y','Décale le lutin horizontalement / verticalement'],
    ['mo','s\'orienter à …','Choisit la direction (90 = droite, 0 = haut, 180 = bas, −90 = gauche)'],['mo','avancer de … pas','Se déplace tout droit dans sa direction'],['mo','tourner ↻ / ↺ de … degrés','Pivote sur place (droite / gauche)'],
    ['pe','stylo en position d\'écriture / relever le stylo','Trace / ne trace plus'],['ct','répéter … fois','Boucle bornée'],['ct','répéter jusqu\'à ce que …','Boucle non bornée (s\'arrête quand la condition devient vraie)'],
    ['ct','si … alors … sinon','Instruction conditionnelle'],['se','demander … et attendre · réponse','Entrée'],['lo','dire …','Sortie'],
    ['va','mettre … à … / ajouter … à …','Initialiser (remplacer) / modifier (ajouter) une variable'],['op','+ − * / · &lt; = &gt; · modulo','Calculer · comparer · reste d\'une division'],
    ['op','nombre aléatoire entre … et …','Nombre entier au hasard'],['my','définir …','Créer son propre bloc (avec ou sans paramètre)']];
  const src = [];
  STEPS.forEach(s => s.ex.forEach(e => { if (e.src) src.push('<li><a href="#e'+s.n+'">Exercice '+e.n+' · '+e.t+'</a> <span class="muted">('+e.src+')</span></li>'); }));
  app.innerHTML = '<section class="sheet"><h2>Mémo des blocs essentiels</h2><div class="tbl memo"><table><thead><tr><th>Bloc</th><th>À quoi il sert</th></tr></thead><tbody>'+rows.map(r => '<tr><td><span class="k '+r[0]+'">'+r[1]+'</span></td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table></div></section>' +
    '<section class="sheet">'+B('met','Lire un script au brevet','<ol><li>Je repère le départ : position, direction, valeurs des variables.</li><li>Je lis les blocs de haut en bas, sans en sauter.</li><li>Je tiens un tableau de suivi.</li><li>Dans une boucle, je compte les tours ; dans un test, je dis si la condition est vraie ou fausse.</li><li>Je réponds et je vérifie (tour complet = 360°, test avec une valeur…).</li></ol>') +
    B('sav','Les formules à connaître','<ul><li>Polygone régulier à n côtés : <b>répéter n fois (avancer ; tourner de 360 ÷ n)</b>.</li><li>Boucle « jusqu\'à » : <b>tours = (seuil − départ) ÷ gain</b>, puis vérifier le dernier tour.</li><li>Programme de calcul : poser x, traduire bloc par bloc, simplifier en <b>ax + b</b>.</li><li>Pair : <b>n modulo 2 = 0</b> ; multiple de 5 : <b>n modulo 5 = 0</b>.</li></ul>') + '</section>' +
    '<section class="sheet"><h2>Exercices inspirés des annales du brevet</h2><ul style="display:grid;gap:6px;padding-left:1.2em;margin:0">'+src.join('')+'</ul><p class="muted">Les nombres ont été adaptés ; les situations reprennent celles des sujets officiels.</p></section>';
  window.scrollTo(0,0);
}

/* ---------- Routeur ---------- */
function route(){
  const h = (location.hash || '#accueil').slice(1);
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.nav === h || (h === 'parcours' && a.dataset.nav === 'accueil')));
  const m = h.match(/^e(\d+)$/);
  if (m) viewStep(+m[1]);
  else if (h === 'memo') viewMemo();
  else if (h === 'etapes' || h === 'diag' || h === 'parcours') viewHome(h);
  else viewHome();
}
window.addEventListener('hashchange', route);
document.getElementById('brandHome').addEventListener('click', () => { location.hash = '#accueil'; });
document.getElementById('profBtn').addEventListener('click', ev => {
  PROF = !PROF; document.body.classList.toggle('prof', PROF);
  ev.target.textContent = PROF ? 'Mode professeur activé : cliquer pour masquer les corrections' : 'Mode professeur : afficher toutes les corrections';
  route();
});
route();
</script>
