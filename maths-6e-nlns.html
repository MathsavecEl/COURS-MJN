<!-- mjn-angle-notation-fix : chapeau couvrant les trois lettres de l’angle -->
<style id="mjn-angle-notation-fix">
.mjn-angle3{display:inline-block;position:relative;white-space:nowrap;padding-top:.32em;line-height:1.15;vertical-align:baseline}
.mjn-angle3::before{content:"";position:absolute;left:4%;right:4%;top:.02em;height:.26em;border-top:1.6px solid currentColor;border-radius:100% 100% 0 0;box-sizing:border-box}
@media print{.mjn-angle3{padding-top:.32em}.mjn-angle3::before{border-top-width:1.3px}}
</style>
<script id="mjn-angle-notation-fix-script">
(function(){
 if(window.__mjnAngleNotationFix)return;window.__mjnAngleNotationFix=true;
 const rx=/(\bangle\s+)([A-Z]{3}\b|[xy]O[xy])|(\bcos\s*\()([A-Z]{3})(\))/g;
 function fix(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
   const p=n.parentElement;if(!p||p.closest('script,style,textarea,input,pre,code,.mjn-angle3'))return NodeFilter.FILTER_REJECT;
   rx.lastIndex=0;return rx.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
   rx.lastIndex=0;const value=n.nodeValue;let m,last=0,changed=false;const frag=document.createDocumentFragment();
   while((m=rx.exec(value))){
    changed=true;frag.appendChild(document.createTextNode(value.slice(last,m.index)));
    if(m[1]){frag.appendChild(document.createTextNode(m[1]));const s=document.createElement('span');s.className='mjn-angle3';s.textContent=m[2];frag.appendChild(s);}
    else{frag.appendChild(document.createTextNode(m[3]));const s=document.createElement('span');s.className='mjn-angle3';s.textContent=m[4];frag.appendChild(s);frag.appendChild(document.createTextNode(m[5]));}
    last=rx.lastIndex;
   }
   if(changed){frag.appendChild(document.createTextNode(value.slice(last)));n.parentNode.replaceChild(frag,n);}
  });
 }
 function run(){fix(document.body);}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fix(n);else if(n.nodeType===3&&n.parentNode)fix(n.parentNode);}))).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
