<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>COURS MJN | Cours de mathématiques et exercices interactifs</title>
<meta name="description" content="COURS MJN : cours de mathématiques, exercices interactifs et automatismes pour les élèves de 6e, 5e, 4e, 3e, Seconde et Première. Révise, entraîne-toi et relève des défis.">
<link rel="canonical" href="https://mathsavecel.github.io/COURS-MJN/">
<meta name="robots" content="index, follow">
<meta name="google-site-verification" content="crv6C6owfUFLbtgbPX1ydA1oqrNsOuRanjTGkeikuWA" />
<meta property="og:type" content="website">
<meta property="og:title" content="COURS MJN | Cours de mathématiques">
<meta property="og:description" content="Cours de maths, exercices interactifs et automatismes pour réviser, progresser et se défier.">
<meta property="og:url" content="https://mathsavecel.github.io/COURS-MJN/">
<meta property="og:locale" content="fr_FR">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233d4bd8'/><path d='M18 20h18a10 10 0 0 1 10 10v16H28a10 10 0 0 1-10-10z' fill='white'/></svg>">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<header class="hero">
  <div class="conteneur">
    <p class="surtitre" id="surtitre"></p>
    <h1 id="titre">Mes cours</h1>
    <p class="intro" id="presentation"></p>
  </div>
</header>

<main class="conteneur">
  <div class="classes" id="classes" role="group" aria-label="Choisir une classe"></div>
  <div class="outils">
    <label class="recherche">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="recherche" type="search" placeholder="Rechercher un cours, un chapitre…" aria-label="Rechercher un cours">
    </label>
  </div>
  <div id="resultats-recherche" class="resultats-recherche" hidden aria-live="polite"></div>
  <div id="liste"></div>
</main>

<section class="conteneur">
  <div class="a-propos">
    <div>
      <h2>À propos</h2>
      <div id="apropos"></div>
    </div>
    <aside class="contact" id="contact"></aside>
  </div>
</section>

<footer><div class="conteneur" id="pied"></div></footer>

<script src="cours.js?v=19"></script>
<script src="recherche-index.js?v=2"></script>
<script>
  const $ = id => document.getElementById(id);
  const echap = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const teinte = nom => (CLASSES.find(c => c.nom === nom) || {}).couleur ?? 230;

  document.title = SITE.titre + (SITE.enseignant ? ' · ' + SITE.enseignant : '');
  $('titre').textContent = SITE.titre;
  $('presentation').textContent = SITE.presentation;
  $('surtitre').innerHTML = [SITE.enseignant, SITE.matiere, SITE.etablissement].filter(Boolean).map(t => `<span>${echap(t)}</span>`).join('');
  $('pied').textContent = [SITE.enseignant ? '© ' + new Date().getFullYear() + ' ' + SITE.enseignant : '', SITE.etablissement, SITE.droits, 'Site hébergé avec GitHub Pages'].filter(Boolean).join(' · ');

  $('apropos').innerHTML = (SITE.aPropos || []).map(t => `<p>${echap(t)}</p>`).join('');
  if (SITE.signature) $('apropos').innerHTML += `<p class="signature">${echap(SITE.signature)}</p>`;
  if (SITE.blague) $('pied').innerHTML += `<p class="blague-bas"><span aria-hidden="true">😄</span>${echap(SITE.blague)}</p>`;
  if (SITE.email) {
    $('contact').innerHTML = `<strong>Une coquille, une erreur ?</strong>
      <p>Merci de me la signaler, je la corrigerai rapidement.</p>
      <a class="bouton" href="mailto:${echap(SITE.email)}?subject=${encodeURIComponent('Coquille sur le site ' + SITE.titre)}">Écrire un mail</a>
      <small>${echap(SITE.email)}</small>`;
  } else $('contact').remove();

  let choisie = new URLSearchParams(location.search).get('classe');
  if (!CLASSES.some(c => c.nom === choisie)) choisie = null;

  function afficherClasses() {
    $('classes').innerHTML = CLASSES.map(c => {
      const n = COURS.filter(x => x.classe === c.nom).length;
      return `<button class="classe" style="--h:${c.couleur}" aria-pressed="${c.nom === choisie}" data-nom="${echap(c.nom)}">
        <span class="pastille">${echap(c.court || c.nom.slice(0, 2))}</span>
        <span><strong>${echap(c.label || c.nom)}</strong><small>${n ? n + ' ressource' + (n > 1 ? 's' : '') : 'Bientôt'}</small></span>
      </button>`;
    }).join('');
    $('classes').querySelectorAll('.classe').forEach(b => b.onclick = () => {
      choisie = b.dataset.nom;
      history.pushState({ classe: choisie }, '', '?classe=' + encodeURIComponent(choisie));
      afficherClasses();
      afficherCours();
      const cible = $('liste');
      if (cible) setTimeout(() => cible.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    });
  }

  function carte(c) {
    const h = teinte(c.classe);
    return `<a class="carte" style="--h:${h}" href="${echap(c.lien)}">
      <div class="meta">
        ${c.type ? `<span class="etiquette type">${echap(c.type)}</span>` : ''}
        ${c.chapitre ? `<span class="etiquette">${echap(c.chapitre)}</span>` : ''}
        ${c.nouveau ? '<span class="etiquette nouveau">Nouveau</span>' : ''}
      </div>
      <h3>${echap(c.titre)}</h3>
      ${c.description ? `<p>${echap(c.description)}</p>` : ''}
      <span class="ouvrir">Ouvrir →</span>
    </a>`;
  }

  const normaliser = texte => String(texte || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

  function afficherRecherche(terme) {
    const zone = $('resultats-recherche');
    const listeCours = $('liste');
    if (!normaliser(terme)) {
      zone.hidden = true;
      zone.innerHTML = '';
      listeCours.hidden = false;
      return false;
    }
    const index = Array.isArray(INDEX_RECHERCHE) ? INDEX_RECHERCHE : [];
    const requete = normaliser(terme);
    // Correspondance exacte du titre, en ignorant seulement un article initial.
    // Les chapitres associés ou les titres plus longs ne sont pas affichés.
    const titreNormalise = item => normaliser(item.titre).replace(/^(le|la|les|l)\s+/, '');
    const resultats = index.filter(item => titreNormalise(item) === requete)
      .sort((a, b) => a.titre.localeCompare(b.titre, 'fr'));
    zone.hidden = false;
    listeCours.hidden = true;
    if (!resultats.length) {
      zone.innerHTML = '<p class="vide">Aucun résultat pour « ' + echap(terme) + ' ». Essaie un autre mot ou une formulation plus courte.</p>';
      return true;
    }
    zone.innerHTML = '<h2 class="titre-resultats">' + resultats.length + ' résultat' + (resultats.length > 1 ? 's' : '') + ' pour « ' + echap(terme) + ' »</h2>' +
      '<div class="grille-resultats">' + resultats.map(item =>
        '<a class="resultat-recherche" href="' + echap(item.lien) + '">' +
          '<span class="resultat-classe">' + echap(item.classe) + '</span>' +
          '<strong>' + echap(item.titre) + '</strong>' +
          '<span class="resultat-description">' + echap(item.description || 'Cours interactif') + '</span>' +
          '<span class="ouvrir">Ouvrir le chapitre →</span>' +
        '</a>'
      ).join('') + '</div>';
    return true;
  }

  function afficherCours() {
    const terme = $('recherche').value.trim();
    if (afficherRecherche(terme)) return;
    const classes = choisie ? CLASSES.filter(c => c.nom === choisie) : CLASSES;
    let html = '';
    classes.forEach(cl => {
      const liste = COURS.filter(c => c.classe === cl.nom);
      html += `<section class="groupe" id="${encodeURIComponent(cl.nom)}">
        <h2 style="--h:${cl.couleur}">${echap(cl.nom)} <span class="compte">${liste.length || ''}</span></h2>
        ${liste.length ? `<div class="grille">${liste.map(carte).join('')}</div>` : '<p class="vide">Les ressources de cette classe arrivent bientôt.</p>'}
      </section>`;
    });
    $('liste').innerHTML = html || '<p class="vide">Aucun cours disponible.</p>';
  }

  $('recherche').addEventListener('input', afficherCours);
  window.addEventListener('popstate', () => {
    const niveau = new URLSearchParams(location.search).get('classe');
    choisie = CLASSES.some(c => c.nom === niveau) ? niveau : null;
    afficherClasses(); afficherCours();
    if (choisie) setTimeout(() => $('liste').scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  afficherClasses(); afficherCours();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
<script src="progression.js?v=2"></script>
</body>
</html>
