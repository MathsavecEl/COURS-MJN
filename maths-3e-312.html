<style>
/* Mise en page : feuille de cahier, même charte que les cours Scratch et Tableur */
:root{
  --paper:#f4f6fb; --grid:#e2e8f4; --card:#ffffff; --text:#1c2135; --ink:#24318a; --muted:#596282;
  --line:#d4dbeb; --red:#c22e2e; --red-soft:#fcebea; --green:#16764a; --green-soft:#e2f3e9;
  --amber:#985600; --amber-soft:#fbefdc; --mark:#ffef9e; --accent:#3d5bd9; --accent-soft:#e8edff;
  --violet:#6b3fc9; --violet-soft:#f0eaff; --brand:#a52a4a;
  --p1:#2f6fb0; --p2:#2f7d4f; --p3:#7046c0; --p4:#b8541a; --p5:#a52a4a;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background-color:var(--paper);color:var(--text);font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse}

/* En-tête */
.top{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo svg{width:28px;height:28px}
.brand h1{font-size:1.2rem;font-weight:800;color:var(--ink)}
.brand p{font-size:.78rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.brand p b{color:var(--red);letter-spacing:.08em}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.93rem}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a.on{color:var(--ink);background:var(--accent-soft)}

main{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
footer{padding-block:4px 32px;color:var(--muted);font-size:.85rem;text-align:center}

/* Feuille */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 24px 62px;min-width:0}
.sheet::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
@media (max-width:600px){ .sheet{padding:18px 14px 20px 30px} .sheet::before{left:18px} }
.sheet > * + *{margin-top:14px}
.sheet h2{font-size:1.45rem;color:var(--ink)}
.sheet h3{font-size:1.15rem;color:var(--ink)}
.lead{max-width:66ch}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:10px;font-weight:700;font-size:.98rem;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Page d'étape */
.band{border-radius:10px;padding:18px 20px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.band.y5{background:#2f7d4f}.band.y4{background:#b86200}.band.y3{background:#a52a4a}
.band .bn{grid-row:span 3;font:800 3rem/1 var(--f-display);text-align:center;min-width:70px}
.band .bn small{display:block;font:700 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.band h2{font-size:1.65rem;font-weight:800;color:#fff}
.band p{opacity:.92}
.band .bt{display:flex;gap:6px;flex-wrap:wrap}
.band .bt span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px}
.objectifs{display:grid;gap:4px;padding-left:1.2em;margin:0}

.box{border-radius:8px;padding:14px 16px;border-left:5px solid var(--bc);background:var(--bs);min-width:0}
.box > * + *{margin-top:10px}
.box h4{font:700 .8rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--bc)}
.box h4 b{color:var(--text);text-transform:none;letter-spacing:0;font-size:.95rem}
.box ul,.box ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.box.def{--bc:var(--accent);--bs:var(--accent-soft)}
.box.sav{--bc:var(--violet);--bs:var(--violet-soft)}
.box.met{--bc:var(--amber);--bs:var(--amber-soft)}
.box.exe{--bc:var(--green);--bs:var(--green-soft)}
.box.pie{--bc:var(--red);--bs:var(--red-soft)}
.box.ast{--bc:var(--muted);--bs:var(--paper)}
.box.ret{--bc:var(--ink);--bs:var(--card);border:2px solid var(--ink);border-left-width:6px}
.formula{font:800 1.25rem var(--f-display);color:var(--ink);text-align:center;padding:4px 0}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 20px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{min-width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:700;font-size:.85rem}
.tbl td.c,.tbl th.c{text-align:center}
.faux{color:var(--red);font-weight:700}.vrai{color:var(--green);font-weight:700}
mark{color:inherit;background:var(--mark);padding:0 3px;border-radius:3px;font-weight:700}
.hand{font:700 1.45rem var(--f-hand);color:var(--red)}

/* Exercices */
.lvl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:22px!important}
.lvl-h .stars{color:var(--amber);font-size:1.15rem;letter-spacing:2px}
.lvl-h h3{font-size:1.15rem}
.lvl-h span.muted{font-size:.9rem}
.lvl-h .reco-tag{font-size:.75rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.ex{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);min-width:0}
.ex > * + *{margin-top:10px}
.ex.done{border-color:var(--green)}
.ex-h{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.ex-h .en{font:800 1rem var(--f-display);color:var(--red)}
.ex-h h4{font-size:1.05rem;color:var(--ink)}
.ex-h .src{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:1px 7px}
.ex-h .ok-flag{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--green)}
.qs{display:grid;gap:10px;margin:0;padding-left:1.5em}
.qs > li::marker{font-weight:800;color:var(--ink)}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.qa input{width:min(170px,100%);border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.qa input.ok{border-color:var(--green);background:var(--green-soft)}
.qa input.ko{border-color:var(--red);background:var(--red-soft)}
.qa .choice{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-weight:700;min-height:38px}
.qa .choice:hover{border-color:var(--accent)}
.qa .choice.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.qa .choice.ko{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fb{font-weight:700;font-size:.92rem}
.fb.ok{color:var(--green)}.fb.ko{color:var(--red)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{background:var(--amber-soft);border-radius:8px;padding:10px 14px;border-left:4px solid var(--amber)}
.hint b.hl{color:var(--amber)}
.corr{border:2px dashed var(--red);border-radius:8px;padding:10px 16px 14px}
.corr > * + *{margin-top:8px}
.corr .ct{font:700 1.6rem/1 var(--f-hand);color:var(--red)}
.corr ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.res{display:inline-block;padding:2px 10px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}


/* ---- Ajouts du site 3e ---- */
.logo{background:var(--brand)}
.kicker{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .kicker{color:#ff8fa8} }
:root[data-theme="dark"] .kicker{color:#ff8fa8}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:2rem;font-weight:800;color:var(--ink)}
.hero > div > * + *{margin-top:12px}
.namebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.namebox input{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:1rem;width:min(220px,100%)}
.prog{gap:10px}.prog .minibar{max-width:320px;height:10px}
.go-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.go{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
.go:hover{border-color:var(--accent);transform:translateY(-2px)}
.go b{font:800 1.05rem var(--f-display);color:var(--ink)}
.go span:not(.gi):not(.pill){font-size:.9rem;color:var(--muted)}
.go .gi{font-size:1.6rem;line-height:1}
.go.wide{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;border-color:var(--brand)}
.howto{margin:0;padding-left:1.4em;display:grid;gap:6px}
.box.mail{--bc:var(--brand);--bs:var(--card);border:2px dashed var(--brand);border-left-width:6px}
.box.mail a{color:var(--accent);font-weight:700;word-break:break-all}
.per h3{display:flex;align-items:center;gap:10px}
.pdot{width:14px;height:14px;border-radius:50%;background:var(--pc);flex:none}
.p1{--pc:var(--p1)}.p2{--pc:var(--p2)}.p3{--pc:var(--p3)}.p4{--pc:var(--p4)}.p5{--pc:var(--p5)}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:8px;padding:11px 13px;text-decoration:none;color:var(--text);min-height:132px;transition:transform .15s,border-color .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard.full{border-color:var(--green);border-top-color:var(--green)}
.scard .num{font:800 .85rem var(--f-display);color:var(--pc)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .scard .num{color:var(--ink)} }
:root[data-theme="dark"] .scard .num{color:var(--ink)}
.scard .th{font-weight:700;line-height:1.3}
.scard .dm{font-size:.8rem;color:var(--muted)}
.scard .meta{margin-top:auto;display:flex;gap:6px;align-items:center;width:100%}
.minibar{flex:1;min-width:50px;height:7px;border-radius:9px;background:var(--line);overflow:hidden;display:inline-block}
.minibar span{display:block;height:100%;background:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green);border-color:transparent}
.band{background:var(--pc)}
.band .bn{grid-row:span 4}
.band .ded{font:700 1.35rem var(--f-hand);opacity:1}
.subnav{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.subnav a{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:.9rem}
.subnav a:hover{border-color:var(--accent)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:700px){.split2{grid-template-columns:1fr}}
.split2 > div > * + *{margin-top:8px}
.objectifs{padding-left:1.2em}
.sheet > .box + .box{margin-top:14px}
.exemple{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.exl{display:inline-block;font:700 .72rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:1px 8px;border-radius:6px;margin-bottom:4px}
.formula{font:700 1.15rem var(--f-display);color:var(--ink);text-align:center;padding:6px 0;overflow-x:auto}
.ex{margin-top:14px}
.ex-e > * + *{margin-top:8px}
.figbox{display:flex;justify-content:center;overflow-x:auto}
.fig{width:100%;height:auto;display:inline-block;vertical-align:middle;margin:4px auto}
.box .fig{max-height:300px}
.qs{display:grid;gap:14px;margin:0;padding-left:1.5em}
.q{min-width:0}
.q .qt{font-weight:600}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.qa input{width:min(220px,100%);border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-weight:700;font-size:1rem}
.qa input.ok{border-color:var(--green);background:var(--green-soft)}
.qa input.ko{border-color:var(--red);background:var(--red-soft)}
.unit{font-weight:700;color:var(--muted)}
.fb{font-weight:700;font-size:.93rem;min-height:0}
.fb .ok{color:var(--green)}.fb .ko{color:var(--red)}
.qbtns{display:flex;gap:14px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:700;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;display:none}
.lnk.show,.prof .lnk{display:inline-block}
.hint,.corr{margin-top:6px}
.corr p{margin:0}
.ans-prof{display:none}
.prof .corr{display:block!important}.prof .ans-prof{display:block;color:var(--green)}
.q.qdone .qt::after{content:" ✓";color:var(--green);font-weight:800}
.res{display:inline-block;padding:0 8px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:0 6px}
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.acard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-2px)}
.aic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink);font:800 1.1rem var(--f-display)}
.acard b{line-height:1.3}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;background:var(--green);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #toast{color:#06210f} }
:root[data-theme="dark"] #toast{color:#06210f}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{font-size:.93rem;font-variant-numeric:tabular-nums;margin:4px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:center;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:700}
.tbl table.memo{width:100%}.tbl table.memo td{text-align:left}.tbl table.memo td:first-child{font-weight:700;white-space:nowrap}
.tbl table.dice td,.tbl table.dice th{padding:3px 8px}
.sheet h3{margin-top:18px}
/* écriture des maths */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 2px;line-height:1.2}
.fr > span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr > span:last-child{padding:0 3px}
.rad{white-space:nowrap}.rad > span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
sup{font-size:.72em;line-height:0}
/* figures */
.fl{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.fl.hl{stroke:var(--red);stroke-width:2.2}
.fl.dash{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4 4}
.fl.thin{stroke-width:1.2}
.fl2{stroke:var(--muted);stroke-width:1}
.fz{fill:var(--accent-soft)}
.fd{fill:var(--ink)}
.fa{stroke:var(--amber);stroke-width:1.6;fill:none}
.ft{font:600 13px var(--f-body);fill:var(--text);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.ftp{font-style:italic;font-weight:700;font-size:14px}
.fts{fill:var(--ink);font-size:12px}
.gg{stroke:var(--line);stroke-width:1}
.ga{stroke:var(--text);stroke-width:1.3}
.gah{fill:var(--text)}
.gt{font:12px var(--f-body);fill:var(--muted);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.gty{text-anchor:end}
.gtt{font-weight:700;fill:var(--text)}
.gc{fill:none;stroke-width:2.4;stroke:var(--accent)}
.gc1{stroke:var(--red)}.gc2{stroke:var(--green)}

const T3 = (ab, ac, bc) => { const x = (ab * ab + ac * ac - bc * bc) / (2 * ab); return { A: [0, 0], B: [ab, 0], C: [x, Math.sqrt(ac * ac - x * x)] }; };

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const nz = (a, b) => { let v; do v = ri(a, b); while (v === 0); return v; };
const pick = L => L[Math.floor(Math.random() * L.length)];
const p_ = v => v < 0 ? '(' + nf(v) + ')' : nf(v);            // nombre entre parenthèses s'il est négatif
const lcm = (a, b) => a / gcd(a, b) * b;
const frs = (n, d) => { const g = gcd(n, d); n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : n + '/' + d; };
const frh = (n, d) => { const g = gcd(n, d); n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? nf(n) : (n < 0 ? '−' : '') + F(Math.abs(n), d); };
const sgn = (v, first) => v < 0 ? (first ? '−' : ' − ') + nf(-v) : (first ? '' : ' + ') + nf(v);   // « + 3 » / « − 3 »
const tx = (a, first) => a === 0 ? '' : (a === 1 ? (first ? '' : ' + ') : a === -1 ? (first ? '−' : ' − ') : sgn(a, first)) + V('x');

const SVGW = (w, h, s, alt, mw) => `<svg class="fig" viewBox="0 0 ${w} ${h}" style="max-width:${mw || Math.round(w * 1.15)}px" role="img" aria-label="${alt}">${s}</svg>`;
const TX = (x, y, s, c = 'ft fts') => `<text x="${x}" y="${y}" class="${c}">${s}</text>`;
/* triangle donné par sa base et ses deux angles à la base (en degrés) */
const TAng = (base, a, b) => { const ra = a * Math.PI / 180, rb = b * Math.PI / 180, x = base * Math.tan(rb) / (Math.tan(ra) + Math.tan(rb)); return { A: [0, 0], B: [base, 0], C: [x, x * Math.tan(ra)] }; };
const chOf = id => CH.find(c => c.id === id);
const addCoursFig = (cid, h, fig) => { const k = chOf(cid).cours.find(k => k.h === h); k.ex = (k.ex ? k.ex + '<br>' : '') + fig; };
const addExFig = (cid, ti, fig) => { const c = chOf(cid); const e = c.dir.concat(c.app).find(e => e.ti === ti); e.fig = (e.fig || '') + fig; };

}

EVALS.push({ id: 'pythagore', chap: 'c18', titre: 'Théorème de Pythagore', sous: SOUS, parties: [
  { nom: 'Connaître le théorème', ctx: svgFig({ pts: { A: [0, 3], B: [0, 0], C: [5, 0] }, segs: [['A', 'B'], ['B', 'C'], ['A', 'C', 'fl hl']], right: [['A', 'B', 'C']], w: 200, alt: 'Triangle rectangle en B' }) + '<br>Le triangle ABC est rectangle en B.', qs: [
    Q('L\'hypoténuse du triangle ABC est :', ['[AC]', '[AB]', '[BC]'], 'L\'hypoténuse est le côté opposé à l\'angle droit B : c\'est [AC], le plus grand côté.'),
    Q('Quelle égalité est vraie ?', ['AC^2 = AB^2 + BC^2', 'AB^2 = AC^2 + BC^2', 'BC^2 = AB^2 + AC^2', 'AC = AB + BC'], 'Le carré de l\'hypoténuse est égal à la somme des carrés des deux autres côtés : AC^2 = AB^2 + BC^2.'),
    Q('La réciproque du théorème de Pythagore sert à :', ['prouver qu\'un triangle est rectangle', 'calculer une longueur', 'prouver que deux droites sont parallèles', 'calculer un angle'], 'Avec les trois longueurs, on compare le carré du plus grand côté à la somme des deux autres carrés : la réciproque prouve qu\'un triangle est rectangle.')
  ] },
  { nom: 'Calculer une longueur', qs: [
    Q('RST est rectangle en S avec RS = 9 cm et ST = 12 cm. RT = ?', ['15 cm', '21 cm', '225 cm', '7,9 cm'], 'RT^2 = 9^2 + 12^2 = 81 + 144 = 225, donc RT = √225 = 15 cm.'),
    Q('RST est rectangle en S avec RT = 13 cm et RS = 5 cm. ST = ?', ['12 cm', '8 cm', '13,9 cm', '144 cm'], 'RT est l\'hypoténuse : ST^2 = 13^2 − 5^2 = 169 − 25 = 144, donc ST = 12 cm. On soustrait !'),
    Q('Un triangle rectangle a des côtés de l\'angle droit de 4 cm et 7 cm. Son hypoténuse mesure environ :', ['8,1 cm', '11 cm', '5,7 cm', '65 cm'], 'h^2 = 16 + 49 = 65, donc h = √65 ≈ 8,1 cm.'),
    Q('La diagonale d\'un carré de côté 5 cm mesure environ :', ['7,1 cm', '10 cm', '5 cm', '50 cm'], 'La diagonale coupe le carré en deux triangles rectangles : d^2 = 25 + 25 = 50, donc d = √50 ≈ 7,1 cm.')
  ] },
  { nom: 'Rectangle ou pas ?', qs: [
    Q('Un triangle a pour côtés 7 cm, 24 cm et 25 cm. Est-il rectangle ?', ['Oui', 'Non'], '25^2 = 625 et 7^2 + 24^2 = 49 + 576 = 625. Égalité : il est rectangle (réciproque de Pythagore).'),
    Q('Un triangle a pour côtés 6 cm, 9 cm et 11 cm. Est-il rectangle ?', ['Non', 'Oui'], '11^2 = 121 et 6^2 + 9^2 = 36 + 81 = 117. 121 ≠ 117 : il n\'est pas rectangle.'),
    Q('Un triangle a pour côtés 1,5 cm, 2 cm et 2,5 cm. Est-il rectangle ?', ['Oui', 'Non'], '2,5^2 = 6,25 et 1,5^2 + 2^2 = 2,25 + 4 = 6,25. Égalité : il est rectangle.'),
    Q('EFG a pour côtés EF = 8 cm, FG = 17 cm et EG = 15 cm. Il est :', ['rectangle en E', 'rectangle en F', 'rectangle en G', 'pas rectangle'], '17^2 = 289 et 8^2 + 15^2 = 64 + 225 = 289. Il est rectangle, et l\'angle droit est en face du plus grand côté [FG] : en E.')
  ] },
  { nom: 'Type brevet : l\'échelle', ctx: 'Une échelle de 5 m est posée contre un mur vertical. Son pied est à 1,40 m du mur. Le sol est horizontal.', qs: [
    Q('À quelle hauteur l\'échelle touche-t-elle le mur ?', ['4,8 m', '3,6 m', '5,2 m', '23,04 m'], 'L\'échelle est l\'hypoténuse : h^2 = 5^2 − 1,4^2 = 25 − 1,96 = 23,04, donc h = √23,04 = 4,8 m.'),
    Q('On rapproche le pied à 1 m du mur. La hauteur atteinte devient environ :', ['4,9 m', '4 m', '5,1 m', '24 m'], 'h^2 = 25 − 1 = 24, donc h = √24 ≈ 4,9 m.'),
    Q('Un terrain rectangulaire mesure 60 m sur 80 m. Sa diagonale mesure :', ['100 m', '140 m', '70 m', '10 000 m'], 'd^2 = 60^2 + 80^2 = 3 600 + 6 400 = 10 000, donc d = 100 m.')
  ] }
] });

EVALS.push({ id: 'divisibilite', chap: 'c1', titre: 'Divisibilité et nombres premiers', sous: SOUS, parties: [
  { nom: 'Division euclidienne et critères', qs: [

  { nom: 'Nombres premiers et décomposition', qs: [

  { nom: 'Fractions irréductibles', qs: [
    Q(`La forme irréductible de ${F(42, 56)} est :`, [F(3, 4), F(6, 8), F(21, 28), F(7, 8)], `42 = 2 × 3 × 7 et 56 = 2^3 × 7. On simplifie par 14 : ${F(42, 56)} = ${F(3, 4)}.`),

  ] },
  { nom: 'Type brevet : boîtes et bus', ctx: 'Un pâtissier a 252 macarons et 180 chocolats. Il veut faire le plus grand nombre possible de boîtes identiques en utilisant tout.', qs: [

    Q('Combien de macarons par boîte ?', ['7', '5', '14', '9'], '252 ÷ 36 = 7 macarons (et 180 ÷ 36 = 5 chocolats).'),
    Q('Deux bus partent ensemble à 7 h. L\'un repasse toutes les 12 min, l\'autre toutes les 18 min. Quand repartent-ils ensemble la première fois ?', ['7 h 36', '7 h 30', '7 h 06', '10 h 36'], 'Il faut le plus petit multiple commun de 12 et 18 : 12, 24, 36… et 18, 36. C\'est 36 min, donc 7 h 36.')

EVALS.push({ id: 'equations', chap: 'c7', titre: 'Équations', sous: SOUS, parties: [
  { nom: 'Équations du premier degré', qs: [

  { nom: `Équations ${x}² = a`, qs: [

    Q(`Solutions de ${x}^2 = 7 :`, ['√7 et −√7', '3,5 et −3,5', '49 et −49', '√7 seulement'], 'Si a &gt; 0, x^2 = a a deux solutions : √a et −√a.'),
    Q(`Solutions de ${x}^2 − 25 = 0 :`, ['5 et −5', '25', '5 seulement', '12,5'], `${x}^2 = 25 donc ${x} = 5 ou ${x} = −5.`)

    Q('Un père a trois fois l\'âge de son fils. Dans 12 ans, il aura le double de l\'âge de son fils. Quel âge a le fils ?', ['12 ans', '6 ans', '24 ans', '36 ans'], `3${x} + 12 = 2(${x} + 12) donc 3${x} + 12 = 2${x} + 24 et ${x} = 12. Le père a 36 ans ; dans 12 ans : 48 = 2 × 24.`)
  ] }

var EV = null;
function evChap(e) { return CH.find(c => c.id === e.chap); }
function evSort() { EVALS.sort((a, b) => (evChap(a) || { n: 99 }).n - (evChap(b) || { n: 99 }).n); }
function evAll(e) { return e.parties.flatMap((p, pi) => p.qs.map((q, qi) => Object.assign(q, { pi, num: qi + 1 }))); }
function evTxt(e, s) { return e.prof ? (s || '') : fmt(s || ''); }
function evBest(id) { ST.ev = ST.ev || {}; return ST.ev[id] || {}; }
function evSave(id, k, s, n) { const b = evBest(id); if (!b[k] || s / n > b[k][0] / b[k][1]) { b[k] = [s, n]; ST.ev[id] = b; save(); } }
function evShuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pageEvalList() {
  nav('eval'); CUR = null; EV = null; evSort();
  let h = `<section class="sheet"><h2>Entraînement à l'évaluation</h2><p class="lead">Avant chaque évaluation, entraîne-toi avec le QCM du chapitre. Fais le calcul au brouillon avant de cliquer, puis lis bien la correction. À la fin, tu peux refaire uniquement tes erreurs. Tes records sont gardés sur cet appareil.</p></section>`;
  for (let p = 1; p <= 5; p++) {
    const L = EVALS.filter(e => (evChap(e) || {}).per === p); if (!L.length) continue;
    h += `<section class="sheet per p${p}"><h3><span class="pdot"></span>${PER[p]}</h3><div class="steps-grid">` + L.map(e => {
      const c = evChap(e), n = evAll(e).length, b = evBest(e.id).all;
      return `<a class="scard${b && b[0] === b[1] ? ' full' : ''}" href="#/eval/${e.id}"><span class="num">Chapitre ${c.n}</span><span class="th">${e.titre}</span><span class="dm">${e.prof ? 'QCM de cours' : 'QCM d\'entraînement'} · ${n} questions</span><span class="meta">${b ? `<span class="pill${b[0] === b[1] ? ' g' : ''}">record ${b[0]}/${b[1]}</span>` : '<span class="pill">pas encore fait</span>'}</span></a>`;
    }).join('') + `</div></section>`;
  }
  app().innerHTML = h + `<section class="sheet">${mailBox()}</section>`;
}

function pageEval(id) {
  nav('eval'); CUR = null;
  const e = EVALS.find(v => v.id === id); if (!e) return pageEvalList();
  EV = { e, run: null }; evMenu();
}
function evHead(e) {
  const c = evChap(e);
  return `<p class="kicker">Entraînement à l'évaluation · Chapitre ${c.n} · </p><h2>${e.titre}</h2>`;
}
function evMenu() {
  const e = EV.e, b = evBest(e.id), c = evChap(e); EV.run = null;
  const rec = k => b[k] ? `<span class="pill${b[k][0] === b[k][1] ? ' g' : ''}">record ${b[k][0]}/${b[k][1]}</span>` : '';
  app().innerHTML = `<section class="sheet ev${e.prof ? ' ev-prof' : ''}">${evHead(e)}<p class="lead">${e.sous}</p>
    <div class="row"><button class="btn" type="button" data-ev="all">▶ Tout le QCM (${evAll(e).length} questions)</button>${rec('all')}</div>
    <h3>Ou une partie seulement</h3><div class="ev-parts">${e.parties.map((p, i) => `<button class="ev-part" type="button" data-ev="p${i}"><span><b>Partie ${i + 1}</b> · ${evTxt(e, p.nom)}</span><small>${rec('p' + i)} ${p.qs.length} questions</small></button>`).join('')}</div>
    <p class="muted">Au clavier : touches 1 à 4 pour répondre, Entrée pour passer à la suite.</p>

}
function evStart(list, key, label) { EV.run = { list, key, label, i: 0, score: 0, wrong: [] }; evShow(); }
function evShow() {
  const e = EV.e, r = EV.run, q = r.list[r.i], p = e.parties[q.pi], n = r.list.length;
  r.order = evShuffle(q.c.map((t, k) => ({ t, ok: k === 0 }))); r.done = false;
  app().innerHTML = `<section class="sheet ev${e.prof ? ' ev-prof' : ''}">${evHead(e)}
    <div class="ev-meta"><span>Question ${r.i + 1} / ${n}</span><span id="evSc">Score : ${r.score}</span></div>
    <div class="ev-bar"><span style="width:${100 * r.i / n}%"></span></div>
    <span class="tag">Partie ${q.pi + 1} · ${evTxt(e, p.nom)}</span>
    ${p.ctx ? `<div class="ev-ctx">${evTxt(e, p.ctx)}</div>` : ''}
    <div class="ev-q">${evTxt(e, q.q)}</div>${q.fig ? `<div class="ev-fig">${evTxt(e, q.fig)}</div>` : ''}
    <div class="ev-ch">${r.order.map((o, k) => `<button class="ev-c" type="button" data-evc="${k}"><span class="L">${'ABCD'[k]}</span><span>${evTxt(e, o.t)}</span></button>`).join('')}</div>
    <div class="ev-fb" id="evFb" hidden></div>
    <div class="row ev-nav"><button class="btn ghost" type="button" data-ev="menu">Menu du QCM</button><button class="btn" type="button" id="evNext" data-ev="next" disabled>${r.i + 1 < n ? 'Question suivante →' : 'Voir mon résultat'}</button></div></section>`;
  window.scrollTo(0, 0);
}
function evAnswer(k) {
  const e = EV.e, r = EV.run; if (!r || r.done || !r.order[k]) return; r.done = true;
  const q = r.list[r.i], good = r.order[k].ok;
  const deferred = window.__evCorrectionMode === 'end';
  document.querySelectorAll('.ev-c').forEach((b, j) => {
    b.disabled = true;
    if (deferred) b.classList.remove('ok','ko','dim');
    else b.classList.add(r.order[j].ok ? 'ok' : j === k ? 'ko' : 'dim');
  });
  if (good) r.score++; else r.wrong.push(q);
  const fb = document.getElementById('evFb');
  if (deferred) {
    if (fb) { fb.hidden = true; fb.innerHTML = ''; }
    const sc = document.getElementById('evSc'); if (sc) sc.textContent = '';
  } else {
    if (fb) { fb.hidden = false; fb.className = 'ev-fb ' + (good ? 'ok' : 'ko'); }
    const nm = ST.name ? ' ' + esc(ST.name) : '';
    if (fb) fb.innerHTML = `<b>${good ? '✔ ' + (nm ? pick2(BRAVO_N(nm.trim())) : pick2(BRAVO)) : '✘ Pas tout à fait. La bonne réponse est : ' + evTxt(e, q.c[0])}</b><div>${evTxt(e, q.e)}</div>`;
    const sc = document.getElementById('evSc'); if (sc) sc.textContent = 'Score : ' + r.score;
  }
  const nx = document.getElementById('evNext'); nx.disabled = false; nx.focus();
}
function evNext() { const r = EV.run; r.i++; if (r.i < r.list.length) evShow(); else evEnd(); }
function evEnd() {
  const e = EV.e, r = EV.run, n = r.list.length, s = r.score; r.end = true;
  if (r.key !== 'err') evSave(e.id, r.key, s, n);
  const x = s / n, nm = ST.name ? ' ' + esc(ST.name) : '';
  const msg = x === 1 ? `Parfait${nm} ! Tu es prêt(e) pour l'évaluation.` : x >= 0.8 ? `Très bien${nm} ! Revois les quelques erreurs ci-dessous.` : x >= 0.5 ? `C'est en bonne voie${nm}. Relis les corrections puis refais tes erreurs.` : `Courage${nm} ! Relis ton cours, puis refais le QCM partie par partie. Tu vas progresser.`;
  const per = e.parties.map((p, i) => { const t = r.list.filter(q => q.pi === i).length; if (!t) return ''; const w = r.wrong.filter(q => q.pi === i).length; return `<tr><td>Partie ${i + 1} · ${evTxt(e, p.nom)}</td><td>${t - w} / ${t}</td></tr>`; }).join('');
  app().innerHTML = `<section class="sheet ev${e.prof ? ' ev-prof' : ''}">${evHead(e)}<h3>${r.label} : terminé</h3>
    <div class="ev-score">${s} / ${n}</div><p class="hand">${msg}</p><div class="tbl"><table class="ev-res">${per}</table></div>
    <div class="row">${r.wrong.length ? `<button class="btn" type="button" data-ev="redo">Refaire mes erreurs (${r.wrong.length})</button>` : ''}<button class="btn ghost" type="button" data-ev="again">Recommencer</button><button class="btn ghost" type="button" data-ev="menu">Menu du QCM</button></div>
    ${r.wrong.length ? '<h3>Mes erreurs à revoir</h3>' + r.wrong.map(q => { const p = e.parties[q.pi]; return `<div class="ev-miss"><span class="tag">Partie ${q.pi + 1} · ${evTxt(e, p.nom)}</span>${p.ctx ? `<div class="ev-ctx">${evTxt(e, p.ctx)}</div>` : ''}<div class="ev-q">${evTxt(e, q.q)}</div>${q.fig ? `<div class="ev-fig">${evTxt(e, q.fig)}</div>` : ''}<p class="ev-good">Bonne réponse : ${evTxt(e, q.c[0])}</p><div>${evTxt(e, q.e)}</div></div>`; }).join('') : ''}</section><section class="sheet">${mailBox()}</section>`;
  window.scrollTo(0, 0);
}
document.addEventListener('click', ev => {
  if (!EV || !ev.target.closest('.ev')) return;
  const c = ev.target.closest('[data-evc]'); if (c) return evAnswer(+c.dataset.evc);
  const t = ev.target.closest('[data-ev]'); if (!t) return;
  const a = t.dataset.ev, e = EV.e, r = EV.run;
  if (a === 'all') evStart(evAll(e), 'all', 'Tout le QCM');
  else if (/^p\d+$/.test(a)) { const i = +a.slice(1); evAll(e); evStart(e.parties[i].qs, a, 'Partie ' + (i + 1)); }
  else if (a === 'next') evNext();
  else if (a === 'menu') evMenu();
  else if (a === 'redo') evStart(r.wrong, 'err', 'Mes erreurs');
  else if (a === 'again') evStart(r.list, r.key, r.label);
});
document.addEventListener('keydown', ev => {
  if (!EV || !EV.run || EV.run.end || !document.querySelector('.ev-c') || ev.target.matches('input, textarea')) return;
  if (ev.key >= '1' && ev.key <= '4') evAnswer(+ev.key - 1);
  else if (ev.key === 'Enter' && EV.run.done) { ev.preventDefault(); evNext(); }
});

const tries = {};
function answer(id, raw, btn) {
  const q = QMAP[id]; if (!q) return;
  const li = document.getElementById('q-' + id); const fb = li.querySelector('.fb');
  const r = check(q, raw);
  if (r.ok) {
    if (q.t === 'qcm') { li.querySelectorAll('.choice').forEach(b => b.classList.remove('ko')); btn.classList.add('ok'); }
    else li.querySelector('input').className = 'ok';
    const msg = ST.name && Math.random() < 0.4 ? pick2(BRAVO_N(esc(ST.name))) : pick2(BRAVO);
    fb.innerHTML = `<span class="ok">✓ ${msg}</span>`;
    li.classList.add('qdone'); li.querySelector('.corrb').classList.add('show');
    if (!id.startsWith('auto')) { ST.done[id] = 1; save(); afterSolve(li); }
    else autoProgress(id, true);
  } else {
    tries[id] = (tries[id] || 0) + 1;
    if (q.t === 'qcm') btn.classList.add('ko'); else li.querySelector('input').className = 'ko';
    fb.innerHTML = `<span class="ko">✗ ${r.msg ? esc(r.msg) : pick2(ENCORE)}</span>`;
    li.querySelector('.hintb').classList.add('show');
    if (tries[id] >= 2) li.querySelector('.corrb').classList.add('show');
    if (id.startsWith('auto')) autoProgress(id, false);
  }
}

function pageChapters() {
  nav('chapitres');
  let h = `<section class="sheet"><h2>Les chapitres de l'année</h2><p class="lead">Les chapitres suivent notre progression de 3<sup>e</sup>, période par période. Dans chaque chapitre : <b>Je retiens</b>, <b>Je m'entraîne</b>, <b>Je vais plus loin</b>.</p></section>`;
  for (let p = 1; p <= 5; p++) {
    h += `<section class="sheet per p${p}"><h3><span class="pdot"></span>${PER[p]}</h3><div class="steps-grid">` + CH.filter(c => c.per === p).map(c => { const L = chapQs(c), d = doneCount(L); return `<a class="scard${d === L.length ? ' full' : ''}" href="#/ch/${c.n}"><span class="num">Chapitre ${c.n}</span><span class="th">${c.t}</span><span class="dm">${c.dom}</span><span class="meta">${bar(d, L.length)}</span></a>`; }).join('') + `</div></section>`;
  }

function chapEnd(c) {
  const L = chapQs(c), d = doneCount(L);
  if (d === L.length) return `<div class="box exe"><h4>Chapitre terminé · <b>${d} / ${L.length}</b></h4><p class="hand">${ST.name ? 'Félicitations ' + esc(ST.name) + ' !' : 'Félicitations !'}</p><p>Tu as réussi tout le chapitre ${c.n}. C'est un vrai pas de plus vers le brevet. Pense à revenir faire quelques automatismes pour ne pas oublier.</p></div>`;
  return `<div class="box ast"><h4>Ton avancée dans ce chapitre · <b>${d} / ${L.length}</b></h4><p>${d === 0 ? 'Lance-toi, la première question est toujours la plus difficile !' : d < L.length / 2 ? 'Bon début ! Continue, chaque question réussie compte.' : 'Plus de la moitié, bravo ! Tu y es presque.'}</p></div>`;
}

/* ---------- automatismes ---------- */
let SERIE = null;
function pageAutoList() {
  nav('automatismes');
  app().innerHTML = `<section class="sheet"><h2>Automatismes</h2><p class="lead">Les automatismes, ce sont les calculs que l'on doit savoir faire vite et sans hésiter. Au brevet, une partie de l'épreuve leur est consacrée. Choisis un thème : à chaque fois, une nouvelle série de 10 questions est tirée au hasard. Refais-les souvent, quelques minutes par jour suffisent !</p>
    <a class="go wide" href="#/auto/mix"><span class="gi">🎯</span><b>Mélange spécial brevet</b><span>12 questions de tous les thèmes, comme le jour J</span>${ST.auto.mix !== undefined ? `<span class="pill g">Meilleur score : ${ST.auto.mix}/12</span>` : ''}</a>
    <div class="auto-grid">${AUTO.map(a => `<a class="acard" href="#/auto/${a.id}"><span class="aic">${a.ic}</span><b>${a.t}</b>${ST.auto[a.id] !== undefined ? `<span class="pill${ST.auto[a.id] === 10 ? ' g' : ''}">Record : ${ST.auto[a.id]}/10</span>` : '<span class="pill">Pas encore fait</span>'}</a>`).join('')}</div>${mailBox()}</section>`;
}
function newSerie(id) {
  const mix = id === 'mix', N = mix ? 12 : 10, qs = [];
  const th = AUTO.find(a => a.id === id);
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    let g, k = 0, src;
    do { src = mix ? AUTO[Math.floor(Math.random() * AUTO.length)] : th; g = src.gen[mix ? Math.floor(Math.random() * src.gen.length) : i % src.gen.length](); k++; } while (seen.has(g.q) && k < 20);
    seen.add(g.q); g.id = `auto-${i}-${Date.now() % 100000}`; g.h = mix ? src.t : (g.h || 'Relis le rappel en haut de la page.'); g.th = src.t; QMAP[g.id] = g; qs.push(g);
  }
  SERIE = { id, qs, res: {}, N };
}
function autoProgress(qid, ok) {
  if (!SERIE || !(qid in QMAP)) return;
  if (SERIE.res[qid] === undefined) SERIE.res[qid] = ok;    // seul le 1er essai compte pour le score
  const ans = Object.keys(SERIE.res).length, sc = Object.values(SERIE.res).filter(x => x).length;
  const el = document.getElementById('aScore'); if (el) el.innerHTML = `Score : <b>${sc}</b> / ${SERIE.N} · ${ans} question${ans > 1 ? 's' : ''} sur ${SERIE.N} tentée${ans > 1 ? 's' : ''}`;
  if (ans === SERIE.N) {
    const best = ST.auto[SERIE.id]; if (best === undefined || sc > best) { ST.auto[SERIE.id] = sc; save(); }
    const r = sc / SERIE.N, nm = ST.name ? ' ' + esc(ST.name) : '';
    const msg = r === 1 ? `Sans faute${nm} ! Tu es prêt(e) pour le brevet sur ce thème.` : r >= 0.7 ? `Très bon score${nm} ! Encore une série pour viser le sans-faute ?` : r >= 0.4 ? `C'est en bonne voie${nm}. Relis le rappel et les corrections, puis refais une série.` : `Ne te décourage pas${nm} : relis le rappel, regarde les corrections, et recommence. Chaque série te fait progresser.`;
    document.getElementById('aEnd').innerHTML = `<div class="box exe"><h4>Série terminée · <b>${sc} / ${SERIE.N}</b></h4><p class="hand">${msg}</p><button class="btn" type="button" id="again">Nouvelle série</button></div>`;
    document.getElementById('again').onclick = () => { newSerie(SERIE.id); renderSerie(); window.scrollTo(0, 0); };
  }
}
function pageAuto(id) {
  nav('automatismes');
  if (id !== 'mix' && !AUTO.find(a => a.id === id)) return pageAutoList();
  newSerie(id); renderSerie();
}
function renderSerie() {
  const id = SERIE.id, th = AUTO.find(a => a.id === id);
  const head = id === 'mix' ? `<h2>Mélange spécial brevet</h2><p class="lead">12 questions tirées dans tous les thèmes. Seul ton premier essai compte pour le score, mais tu peux réessayer pour comprendre.</p>`
    : `<h2>${th.t}</h2><div class="box sav"><h4>Rappel</h4><div>${fmt(th.rap)}</div><div class="exemple"><span class="exl">Exemples</span><div>${fmt(th.ex)}</div></div></div>`;
  app().innerHTML = `<section class="sheet"><p class="kicker">Automatismes · </p>${head}
    <div class="row"><span id="aScore" class="pill">Score : 0 / ${SERIE.N}</span><button class="btn small ghost" type="button" id="reroll">Nouvelle série</button><a class="btn small ghost" href="#/automatismes">Tous les thèmes</a></div>
    <article class="ex"><ol class="qs">${SERIE.qs.map(q => qHTML(q).replace('<div class="qt">', `<div class="qt">${id === 'mix' ? `<span class="tag">${q.th}</span> ` : ''}`)).join('')}</ol></article><div id="aEnd"></div>${mailBox()}</section>`;
  document.getElementById('reroll').onclick = () => { newSerie(id); renderSerie(); };
}

/* ---------- brevet & mémo ---------- */
function pageBrevet() {
  nav('brevet'); CUR = null;
  app().innerHTML = `<section class="sheet"><h2>Problèmes type brevet</h2><p class="lead">Ces problèmes mélangent plusieurs chapitres, comme au brevet. Lis tout l'énoncé avant de commencer, et n'oublie pas : on peut réussir les dernières questions même si on a bloqué sur une des premières.</p></section>
    <section class="sheet">${BREVET.app.map((e, i) => exHTML(e, i + 1, 'p')).join('')}${mailBox()}</section>`;
}
function pageMemo() {
  nav('memo');
  const T = rows => TB(rows.map(r => r.map(fmt)), 'memo');
  app().innerHTML = `<section class="sheet"><h2>Mémo : les formules à connaître</h2><p class="lead">Garde cette page sous la main pendant que tu fais tes exercices. Avec le temps, tu n'en auras plus besoin !</p>
    <h3>Nombres et calculs</h3>${T([['#Notion', '#À retenir'], ['Priorités', 'Parenthèses, puis × et ÷, puis + et −'], ['Fractions', `${F('a', 'b')} + ${F('c', 'b')} = ${F('a + c', 'b')} ; ${F('a', 'b')} × ${F('c', 'd')} = ${F('ac', 'bd')} ; diviser = multiplier par l'inverse`], ['Puissances', 'a^m × a^n = a^{m+n} ; a^m ÷ a^n = a^{m−n} ; (a^m)^n = a^{m×n} ; a^{−n} = 1/a^n ; notation scientifique a × 10^n avec 1 ≤ a &lt; 10'], ['Nombre premier', 'Exactement deux diviseurs : 1 et lui-même'], ['Pourcentages', 'Augmenter de t % : × (1 + t/100) ; diminuer : × (1 − t/100)'], ['Ratio', 'a et b dans le ratio 2 : 3 : a/2 = b/3 ; partager : total ÷ nombre de parts, puis × parts']])}
    <h3>Calcul littéral et équations</h3>${T([['#Notion', '#À retenir'], ['Distributivité', 'k(a + b) = ka + kb ; (a + b)(c + d) = ac + ad + bc + bd'], ['Identités remarquables', '(a + b)^2 = a^2 + 2ab + b^2 ; (a − b)^2 = a^2 − 2ab + b^2 ; (a + b)(a − b) = a^2 − b^2'], ['Produit nul', 'A × B = 0 ⟺ A = 0 ou B = 0'], ['x^2 = a', 'a &gt; 0 : √a et −√a ; a = 0 : 0 ; a &lt; 0 : aucune solution']])}
    <h3>Fonctions</h3>${T([['#Notion', '#À retenir'], ['Vocabulaire', 'f(a) = b : b est l\'image de a, a est un antécédent de b'], ['Linéaire', 'f(x) = ax : droite passant par l\'origine ; proportionnalité'], ['Affine', 'f(x) = ax + b : droite ; a coefficient directeur, b ordonnée à l\'origine'], ['Coefficient', `a = ${F('f(x<sub>2</sub>) − f(x<sub>1</sub>)', 'x<sub>2</sub> − x<sub>1</sub>')}`]])}
    <h3>Géométrie</h3>${T([['#Notion', '#À retenir'], ['Pythagore', 'Triangle rectangle : hypoténuse^2 = somme des carrés des deux autres côtés'], ['Triangles semblables', 'Mêmes angles deux à deux (deux suffisent) ⇔ longueurs proportionnelles ; coefficient k = grand ÷ petit'], ['Thalès', `(MN) // (BC) : ${F('AM', 'AB')} = ${F('AN', 'AC')} = ${F('MN', 'BC')}`], ['Réciproque de Thalès', 'Rapports égaux et points dans le même ordre ⟹ droites parallèles'], ['Trigonométrie', `cos = ${F('adj', 'hyp')} ; sin = ${F('opp', 'hyp')} ; tan = ${F('opp', 'adj')} (SOH CAH TOA)`], ['Homothétie de rapport k', 'Longueurs × |k| ; aires × k^2 ; volumes × |k|^3'], ['Sphère terrestre', 'Latitude 0° à 90° N/S ; longitude 0° à 180° E/O']])}
    <h3>Grandeurs et mesures</h3>${T([['#Solide', '#Volume'], ['Pavé droit', 'L × l × h'], ['Prisme, cylindre', 'Aire de la base × h ; cylindre : π r^2 h'], ['Pyramide, cône', `${F('Aire de la base × h', 3)} ; cône : ${F('π r^2 h', 3)}`], ['Boule', `${F(4, 3)} π r^3 ; aire de la sphère : 4 π r^2`], ['Vitesse', 'v = d ÷ t ; 1 m/s = 3,6 km/h'], ['Volumes', '1 dm³ = 1 L ; 1 m³ = 1 000 L']])}
    <h3>Statistiques et probabilités</h3>${T([['#Notion', '#À retenir'], ['Moyenne', 'Somme des valeurs ÷ effectif total (pondérée : chaque valeur × son effectif)'], ['Médiane', 'Valeurs rangées : elle partage la série en deux groupes de même effectif'], ['Étendue', 'Plus grande valeur − plus petite valeur'], ['Fréquence', 'Effectif ÷ effectif total'], ['Probabilité', 'Issues favorables ÷ issues possibles ; P(non A) = 1 − P(A)']])}
    ${mailBox()}</section>`;
}

/* ---------- routeur & événements ---------- */
function route() {
  const h = location.hash || '#/';
  let m;
  if ((m = h.match(/^#\/ch\/(\d+)/))) pageChapter(+m[1]);
  else if ((m = h.match(/^#\/auto\/(\w+)/))) pageAuto(m[1]);
  else if ((m = h.match(/^#\/eval\/([\w-]+)/))) pageEval(m[1]);
  else if (h.startsWith('#/eval')) pageEvalList();
  else if (h.startsWith('#/chapitres')) pageChapters();
  else if (h.startsWith('#/automatismes')) pageAutoList();
  else if (h.startsWith('#/brevet')) pageBrevet();
  else if (h.startsWith('#/memo')) pageMemo();
  else if (h === '#/' || h === '' || h === '#' || h.startsWith('#/accueil')) pageHome();
  else return;   // ancres internes (#retiens…) : ne rien recharger
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.jump) { e.preventDefault(); const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const id = t.dataset.q; if (!id) return;
  const li = document.getElementById('q-' + id);
  if (t.classList.contains('chk')) answer(id, li.querySelector('input').value, t);
  else if (t.classList.contains('choice')) answer(id, t.dataset.v, t);
  else if (t.classList.contains('hintb')) { const hn = li.querySelector('.hint'); hn.hidden = !hn.hidden; }
  else if (t.classList.contains('corrb')) { const c = li.querySelector('.corr'); c.hidden = !c.hidden; t.textContent = c.hidden ? 'Voir la correction' : 'Masquer la correction'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.qa input')) answer(e.target.dataset.q, e.target.value, null); });
document.getElementById('profBtn').onclick = () => { const on = document.body.classList.toggle('prof'); document.getElementById('profBtn').textContent = on ? 'Mode professeur activé : cliquer pour masquer les corrections' : 'Mode professeur : afficher toutes les corrections'; };
document.getElementById('brandHome').onclick = () => { location.hash = '#/'; };
window.addEventListener('hashchange', route);
register(); route();

</script>

(function(){

d #ddd}ol{padding-left:28px}li{margin:4px 0}@media(max-width:600px){.scr{grid-template-columns:1fr}}@media print{body{margin:0}.contexte,.scr>div,.prog{break-inside:avoid}}@page{size:A4;margin:15mm}</style></head><body><h1>'+esc(e.titre)+'</h1><p>Nom : ____________________ Date : __________ Durée : 45 min</p>'+html+'<script>onload=()=>print()<\\/script></body></html>');w.document.close()
 }
 evMenu=function(){menu0();addOptions()};
 evStart=function(list,key,label){

   document.body.classList.add('ev-deferred-correction');
   document.querySelectorAll('.ev-c').forEach(b=>b.classList.remove('ok','ko','dim'));

 };
 evAnswer=function(k){

   const fb=document.getElementById('evFb');if(fb)fb.hidden=true;

  const review=document.createElement('section');review.className='sheet';

  app().append(review);document.getElementById('evPrintReview').onclick=()=>window.print();window.scrollTo(0,0)

<!-- mjn-angle-notation-fix : chapeau couvrant les trois lettres de l’angle -->
<style id="mjn-angle-notation-fix">
.mjn-angle3{display:inline-block;position:relative;white-space:nowrap;padding-top:.24em;line-height:1}
.mjn-angle3::before{content:"";position:absolute;left:2%;right:2%;top:.06em;height:.22em;border-top:1.5px solid currentColor;border-radius:55% 55% 0 0}
@media print{.mjn-angle3{padding-top:.24em}.mjn-angle3::before{border-top-width:1.3px}}
</style>
<script id="mjn-angle-notation-fix-script">
(function(){
 if(window.__mjnAngleNotationFix)return;window.__mjnAngleNotationFix=true;
 const rx=/(\bangle\s+)([A-Z]{3}\b)|(\bcos\s*\()([A-Z]{3})(\))/g;
 function fix(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
   const p=n.parentElement;if(!p||p.closest('script,style,textarea,input,pre,code,.mjn-angle3'))return NodeFilter.FILTER_REJECT;
   rx.lastIndex=0;return rx.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
   rx.lastIndex=0;const value=n.nodeValue;let m,last=0,changed=false;const frag=document.createDocumentFragment();
   while((m=rx.exec(value))){
    changed=true;frag.appendChild(document.createTextNode(value.slice(last,m.index)));
    if(m[1]){frag.appendChild(document.createTextNode(m[1]));const s=document.createElement('span');s.className='mjn-angle3';s.textContent=m[2];frag.appendChild(s);}
    else{frag.appendChild(document.createTextNode(m[3]));const s=document.createElement('span');s.className='mjn-angle3';s.textContent=m[4];frag.appendChild(s);frag.appendChild(document.createTextNode(m[5]));}
    last=rx.lastIndex;
   }
   if(changed){frag.appendChild(document.createTextNode(value.slice(last)));n.parentNode.replaceChild(frag,n);}
  });
 }
 function run(){fix(document.body);}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fix(n);else if(n.nodeType===3&&n.parentNode)fix(n.parentNode);}))).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
