<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b55">
<meta name="description" content="MJN COURS, les cours et exercices interactifs de mathématiques sur mobile, tablette et ordinateur.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">\n<meta name="apple-mobile-web-app-title" content="MJN COURS">\n<meta name="mobile-web-app-capable" content="yes">
<title>MJN COURS — Application</title>
<style>
:root{color-scheme:light;--vert:#176b55;--fond:#f4f7f6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--fond);color:#172b26}.app{height:100%;height:100dvh;display:flex;flex-direction:column}.barre{display:flex;align-items:center;gap:.7rem;padding:.65rem 1rem;background:white;border-bottom:1px solid #d9e5e0;box-shadow:0 2px 8px #102b2010;z-index:2}.logo{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:.7rem;background:var(--vert);color:white;font-weight:800;font-size:1.5rem}.marque{flex:1;min-width:0}.marque strong{display:block;font-size:1rem}.marque small{color:#52645e}.actions{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}.actions a,.actions button{font:inherit;font-size:.85rem;font-weight:650;text-decoration:none;border:1px solid #cbd9d3;background:white;color:#174b3d;border-radius:.6rem;padding:.5rem .65rem;cursor:pointer}.actions .primaire{background:var(--vert);color:white;border-color:var(--vert)}iframe{border:0;width:100%;flex:1;min-height:0;background:white}.message{font-size:.75rem;color:#52645e;text-align:center;padding:.25rem}.hors-ligne{display:none}@media(max-width:520px){.barre{padding:.5rem;gap:.45rem}.marque small{display:none}.actions a,.actions button{padding:.45rem;font-size:.78rem}.logo{width:2.1rem;height:2.1rem}}@media(orientation:landscape) and (max-height:450px){.barre{padding:.25rem .6rem}.logo{width:1.7rem;height:1.7rem}.marque small{display:none}.message{display:none}}
</style>
</head>
<body><div class="app">
<header class="barre"><div class="logo" aria-hidden="true">π</div><div class="marque"><strong>MJN COURS</strong><small>Les maths, un pas à la fois !</small></div><nav class="actions" aria-label="Actions"><a href="../" target="cours" rel="noopener">Accueil</a><button id="installer" class="primaire" hidden>Installer</button><button id="plein-ecran" type="button" aria-label="Passer en plein écran">⛶</button></nav></header>
<iframe name="cours" title="Site MJN COURS — cours et exercices" src="../" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
<div class="message" id="etat">Application web MJN COURS · Connexion Internet requise pour charger les ressources.</div>
</div>
<script>
let inviteInstallation;const bouton=document.getElementById('installer');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();inviteInstallation=e;bouton.hidden=false});
bouton.addEventListener('click',async()=>{if(!inviteInstallation){alert('Sur iPhone/iPad : ouvrez le menu Partager puis « Sur l’écran d’accueil ». Sur Android : utilisez « Installer l’application » dans le menu du navigateur.');return}inviteInstallation.prompt();await inviteInstallation.userChoice;inviteInstallation=null;bouton.hidden=true});
document.getElementById('plein-ecran').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){document.getElementById('etat').textContent='Le plein écran n’est pas pris en charge par ce navigateur.'}});
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
