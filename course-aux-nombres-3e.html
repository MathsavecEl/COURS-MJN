    <p>Chaque semaine, une série de <b>30 questions</b> pour s'entraîner à la course aux nombres. Un exemple corrigé t'aide avant chaque question, et une correction détaillée s'affiche après ta réponse. À la fin, tu obtiens ta note sur 20.</p>
    <form class="form" id="nameForm" autocomplete="off"><label for="prenom">Prénom<input id="prenom" name="prenom" required maxlength="40" placeholder="ex. Inès"></label>
    <label for="nom">Nom<input id="nom" name="nom" required maxlength="40" placeholder="ex. MARTIN"></label><button class="btn" type="submit">C'est parti</button></form>
    <p class="err" id="err">${msg||''}</p>
    ${known.length?`<div class="known">Déjà inscrit sur cet appareil : ${known.map(k=>`<button class="btn ghost small" data-id="${esc(k.id)}">${esc(fullName(k))}</button>`).join('')}</div>`:''}</section>`;}
  else{const run=DB.runs[s.id];
    h+=`<section class="sheet welcome"><span class="margin-note">✎</span><h2>Bonjour ${esc(s.prenom)} !</h2><p>Choisis la série de la semaine ou un sujet type course aux nombres. Prends ton temps : lis l'exemple, réponds, puis regarde bien la correction.</p>
    ${run?`<div class="resume"><span>Tu n'as pas fini : <b>${title(run.s)}</b> (question ${Math.min(run.ans.length+1,30)} sur 30).</span><span class="row"><button class="btn small" id="resume">Reprendre</button><button class="btn ghost small" id="drop">Abandonner</button></span></div>`:''}</section>`;}
  const mins=DB.examMin||9;
  h+=`<section id="sujets"><div class="sec-h"><h2>Sujets type course aux nombres</h2><p>30 questions mélangées, dans l'ordre du jour de l'épreuve</p></div>
  <div class="sujet-intro"><p><b>Entraînement</b> : exemple et correction animée après chaque question. <b>Chrono</b> : conditions réelles, le compte à rebours tourne et la correction arrive à la fin.</p>
  <div class="durs" role="radiogroup" aria-label="Durée du chrono"><span>Durée du chrono :</span>${[[9,'9 min (officiel)'],[12,'12 min'],[15,'15 min (temps aménagé)']].map(([m,l])=>`<label><input type="radio" name="dur" id="dur${m}" value="${m}"${m===mins?' checked':''}> ${l}</label>`).join('')}</div></div>
  <div class="grid">${Array.from({length:NSUJ},(_,k)=>{const n=k+1,bt=s?best(s,100+n):null,bc=s?best(s,200+n):null;
    return `<div class="scard sj"><span class="num">Sujet ${n}</span><span class="th">${['','Niveau 1 · pour démarrer','Niveau 2 · intermédiaire','Niveau 3 · comme au brevet'][n<=4?1:n<=8?2:3]}</span>
    <span class="meta"><span class="pill ${pillClass(bt)}">Entr. ${bt==null?'–':N(bt)+'/20'}</span><span class="pill ${pillClass(bc)}">Chrono ${bc==null?'–':N(bc)+'/20'}</span></span>
    <span class="row"><button class="btn ghost small" data-go="${100+n}">Entraînement</button><button class="btn red small" data-go="${200+n}">Chrono</button></span></div>`;}).join('')}</div></section>`;
  h+=`<section><div class="sec-h"><h2>Les 36 séries de l'année</h2><p>Une série par semaine · ${s?'ta meilleure note est affichée':'entre ton nom pour commencer'}</p></div>`;
  for(const [a,b,label] of PERIODS){h+=`<div class="period"><h3>${label}</h3><div class="grid">`;
    for(let i=a;i<=b;i++){const bn=s?best(s,i):null,nb=s?s.attempts.filter(x=>x.s===i).length:0;
      h+=`<button class="scard" data-s="${i}"><span class="num">Série ${i}</span><span class="th">${THEMES[i-1][0]}</span><span class="meta"><span class="pill ${pillClass(bn)}">${bn==null?'À faire':N(bn)+' / 20'}</span>${nb?`<span>${nb} essai${nb>1?'s':''}</span>`:''}</span></button>`;}
    h+='</div></div>';}
  h+='</section>';app.innerHTML=h;
  const f=document.getElementById('nameForm');
  if(f){f.onsubmit=e=>{e.preventDefault();const p=f.prenom.value.trim(),n=f.nom.value.trim();if(!p||!n){document.getElementById('err').textContent='Écris ton prénom et ton nom pour commencer.';return;}
      const P2=p.charAt(0).toUpperCase()+p.slice(1),N2=n.toUpperCase(),id=N2+'|'+P2.toLowerCase();if(!DB.students[id])DB.students[id]={id,prenom:P2,nom:N2,attempts:[]};DB.last=id;save();renderHome();};
    app.querySelectorAll('.known button').forEach(b=>b.onclick=()=>{DB.last=b.dataset.id;save();renderHome();});}
  app.querySelectorAll('[name=dur]').forEach(r=>r.onchange=()=>{DB.examMin=+r.value;save();});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(!cur()){document.getElementById('err').textContent='Écris d\'abord ton prénom et ton nom, puis choisis ton sujet.';document.getElementById('prenom').focus();return;}startSeries(+b.dataset.go,0);});
  app.querySelectorAll('button.scard').forEach(b=>b.onclick=()=>{if(!cur()){document.getElementById('err').textContent='Écris d\'abord ton prénom et ton nom, puis choisis ta série.';document.getElementById('prenom').focus();return;}startSeries(+b.dataset.s,0);});
  const rs=document.getElementById('resume');if(rs){rs.onclick=()=>{const r=DB.runs[s.id];startSeries(r.s,r.v,r);};document.getElementById('drop').onclick=()=>{delete DB.runs[s.id];save();renderHome();};}
  window.scrollTo(0,0);}

/* =============== Série =============== */
function startSeries(s,v,resume){if(s>=200){startExam(s,v);return;}const qs=buildSeries(s,v);ST={s,v,qs,ans:resume?resume.ans.slice():[],i:resume?resume.ans.length:0,elapsed:resume?resume.elapsed||0:0,t0:Date.now(),phase:'answer'};
  if(ST.i>=30){finish();return;}saveRun();renderQ();startTimer();}
function saveRun(){const s=cur();if(!s||!ST||ST.mode==='exam')return;DB.runs[s.id]={s:ST.s,v:ST.v,ans:ST.ans,elapsed:elapsed()};save();}
const elapsed=()=>ST?ST.elapsed+(Date.now()-ST.t0):0;
function startTimer(){stopTimer();TIMER=setInterval(()=>{if(!ST)return;const t=document.getElementById('timer');
  if(ST.mode==='exam'){const rem=ST.limit-elapsed();if(rem<=0){endExam(true);return;}if(t){const s=Math.ceil(rem/1000);t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',rem<60000);}}
  else if(t){const s=Math.floor(elapsed()/1000);t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}},500);}
function stopTimer(){if(TIMER)clearInterval(TIMER);TIMER=null;}
function stepsHTML(st,anim){return `<ol class="steps${anim?' anim':''}">${st.map((x,i)=>`<li class="step" style="--d:${(i*1.1).toFixed(2)}s">${x}</li>`).join('')}</ol>`;}

function renderQ(){renderWho();const q=ST.qs[ST.i],score=ST.ans.filter(a=>a.ok).length,ex=exampleFor(q);
  const dots=ST.qs.map((_,i)=>`<i class="${i<ST.ans.length?(ST.ans[i].ok?'ok':'ko'):''}${i===ST.i?' cur':''}"></i>`).join('');
  let inp;if(q.type==='qcm')inp=`<div class="choices" id="choices">${q.choices.map((c,i)=>`<button class="choice" type="button" data-i="${i}">${c}</button>`).join('')}</div>`;
  else inp=`<form class="answer" id="ansForm" autocomplete="off"><input id="ans" inputmode="text" aria-label="Ta réponse" placeholder="Ta réponse"><span class="unit">${q.u||''}</span>
    <span class="keys"><button type="button" data-k="−" aria-label="signe moins">−</button><button type="button" data-k="," aria-label="virgule">,</button>${q.type==='frac'?'<button type="button" data-k="/" aria-label="barre de fraction">/</button>':''}</span>
    <button class="btn" type="submit">Valider</button><button class="btn ghost" type="button" id="skip">Je ne sais pas</button></form>`;
  app.innerHTML=`<section><div class="qbar"><h2>${title(ST.s)}</h2><div class="stats"><span>Score : ${score}</span><span>⏱ <span id="timer">0:00</span></span></div></div>
    <div class="progress" aria-hidden="true"><span style="width:${ST.i/30*100}%"></span></div><div class="dots" aria-label="Progression">${dots}</div></section>
  <section class="sheet"><span class="margin-note">Q${ST.i+1}</span>
    <div class="tags"><span class="tag cat">${q.cat}</span><span class="tag">${q.block}</span><span class="tag">Question ${ST.i+1} sur 30</span></div>
    <details class="example" id="exbox"${DB.ex?' open':''}><summary>Exemple corrigé : regarde avant de répondre</summary><div class="exq">${ex.q}</div>${ex.fig?`<div class="figbox">${ex.fig}</div>`:''}
      ${ex.type==='qcm'?`<div>Choix : ${ex.choices.join(' · ')}</div>`:''}${stepsHTML(ex.steps,false)}</details>
    <div class="qtext">${q.q}</div>${q.fig?`<div class="figbox">${q.fig}</div>`:''}${q.hint||q.type==='frac'?`<p class="hint">${q.hint||'Écris ta réponse sous la forme a/b.'}</p>`:''}
    ${inp}<div id="after"></div></section>
  <div class="row"><button class="link" id="quit">Quitter la série</button></div><div id="confirm"></div>`;
  const tm=document.getElementById('timer');{const s=Math.floor(elapsed()/1000);tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
  document.getElementById('exbox').addEventListener('toggle',e=>{DB.ex=e.target.open;save();});
  if(q.type==='qcm')app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  else{const f=document.getElementById('ansForm'),i=document.getElementById('ans');f.onsubmit=e=>{e.preventDefault();if(!i.value.trim()){i.focus();i.placeholder='Écris une réponse';return;}answer(i.value);};
    document.getElementById('skip').onclick=()=>answer('');f.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{i.value+=b.dataset.k==='−'?'-':b.dataset.k;i.focus();});
    try{i.focus({preventScroll:true});}catch(e){}}
  document.getElementById('quit').onclick=()=>{document.getElementById('confirm').innerHTML=`<div class="confirm row"><span>Quitter maintenant ? Tu pourras reprendre cette série plus tard depuis l'accueil.</span><button class="btn red small" id="qy">Oui, quitter</button><button class="btn ghost small" id="qn">Continuer</button></div>`;
    document.getElementById('qy').onclick=()=>{saveRun();ST=null;renderHome();};document.getElementById('qn').onclick=()=>{document.getElementById('confirm').innerHTML='';};};
  window.scrollTo(0,0);}

function answer(g){if(ST.phase!=='answer')return;const q=ST.qs[ST.i],ok=g!==''&&check(q,g);ST.ans.push({g,ok});ST.phase='corrected';saveRun();
  if(q.type==='qcm')app.querySelectorAll('.choice').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===g)b.classList.add('picked');});
  else{const f=document.getElementById('ansForm');f.querySelectorAll('input,button').forEach(x=>x.disabled=true);}
  const last=ST.i===29,enc=['Bravo !','Excellent !','Super !','Bien joué !','Parfait !'][ST.i%5];
  document.getElementById('after').innerHTML=`<div class="feedback ${ok?'ok':'ko'}" role="status"><span class="big">${ok?enc:g===''?'Pas grave, regarde la correction.':'Pas tout à fait…'}</span>
    ${ok?'Ta réponse est juste.':`${g===''?'':`Ta réponse : ${givenHTML(q,g)}. `}La bonne réponse est <b>${ansHTML(q)}</b>.`}</div>
    <div class="correction"><h3>Correction</h3><div id="stepsBox">${stepsHTML(q.steps,true)}</div><div class="row corr-actions"><button class="btn ghost small" id="replay">↻ Revoir l'animation</button></div></div>
    <div class="next-row"><button class="btn" id="next">${last?'Voir mon résultat':'Question suivante →'}</button></div>`;
  document.getElementById('replay').onclick=()=>{const b=document.getElementById('stepsBox');b.innerHTML='';void b.offsetWidth;b.innerHTML=stepsHTML(q.steps,true);};
  const nx=document.getElementById('next');nx.onclick=next;
  const dots=app.querySelectorAll('.dots i');if(dots[ST.i])dots[ST.i].className=ok?'ok cur':'ko cur';
  const sc=app.querySelector('.stats span');if(sc)sc.textContent='Score : '+ST.ans.filter(a=>a.ok).length;
  setTimeout(()=>{const af=document.getElementById('after');if(!af||!document.body.contains(nx))return;try{nx.focus({preventScroll:true});}catch(e){}af.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});},60);}
function next(){ST.i++;ST.phase='answer';if(ST.i>=30)finish();else renderQ();}

/* =============== Résultat =============== */
function message(n,p){if(n>=18)return `Excellent travail, ${p} ! Tu maîtrises très bien cette série. Continue comme ça, tu es prêt(e) pour la course aux nombres !`;
  if(n>=15)return `Très bien, ${p} ! Tu as de solides réflexes. Relis les corrections de tes quelques erreurs et vise le 20/20.`;
  if(n>=12)return `Bien joué, ${p} ! Tu progresses. Regarde les questions ratées ci-dessous : chaque correction t'aide à faire mieux la prochaine fois.`;
  if(n>=10)return `C'est encourageant, ${p} ! Tu as la moyenne. Refais la série dans quelques jours : tu verras ta note monter.`;
  if(n>=7)return `Courage, ${p} ! Tu as déjà réussi plusieurs questions. Relis bien les exemples et les corrections, puis retente la série : tu vas progresser.`;
  return `Ne lâche rien, ${p} ! Ces séries sont faites pour s'entraîner, pas pour être parfaites du premier coup. Relis les corrections une par une et recommence : chaque essai compte.`;}
function finish(){stopTimer();const s=cur(),score=ST.ans.filter(a=>a.ok).length,note=grade(score),prev=s.attempts.filter(x=>x.s===ST.s),dur=elapsed();
  const att={s:ST.s,v:ST.v,score,note,date:new Date().toISOString(),dur:ST.mode==='exam'?Math.min(dur,ST.limit):dur,timeout:!!ST.timeout};s.attempts.push(att);delete DB.runs[s.id];save();renderResult(att,prev,ST.qs,ST.ans);ST=null;}
function renderResult(att,prev,qs,ans){renderWho();const s=cur(),bestPrev=prev.length?Math.max(...prev.map(x=>x.note)):null,lastPrev=prev.length?prev[prev.length-1].note:null;
  const cats={};qs.forEach((q,i)=>{cats[q.cat]=cats[q.cat]||[0,0];cats[q.cat][1]++;if(ans[i].ok)cats[q.cat][0]++;});
  let delta='';if(lastPrev!=null){const d=att.note-lastPrev;delta=d>0?`Tu as gagné <b>${N(d)} point${d>1?'s':''}</b> depuis ton dernier essai sur cette série. Bravo pour ce progrès !`:d===0?`C'est la même note que ton dernier essai (${N(lastPrev)}/20).`:`Ton dernier essai était à ${N(lastPrev)}/20. Ce n'est pas grave : relis les corrections et réessaie.`;}
  const summary=`${fullName(s)} · ${title(att.s)} : ${att.score}/30, note ${N(att.note)}/20 · ${new Date(att.date).toLocaleDateString('fr-FR')}`;
  app.innerHTML=`<section class="sheet result"><span class="margin-note">✔</span><p class="tag" style="display:inline-block">${title(att.s)}</p>${att.timeout?'<p class="timeout">⏱ Temps écoulé ! Les questions sans réponse comptent comme fausses.</p>':''}
  <h2>${esc(fullName(s))}</h2>
  <div class="score"><div class="scorebox"><small>Bonnes réponses</small><b>${att.score} / 30</b></div><div class="scorebox stamp"><small>Note</small><b>${N(att.note)} / 20</b></div><div class="scorebox"><small>Temps</small><b style="font-size:1.4rem">${fmtTime(att.dur)}</b></div></div>
  <p class="msg">${esc(message(att.note,s.prenom))}</p>${delta?`<p>${delta}</p>`:''}${bestPrev!=null&&att.note>bestPrev?`<p><b>Nouveau record sur cette série !</b></p>`:''}
  <div class="row" style="margin-top:14px"><button class="btn" id="again">Refaire avec d'autres nombres</button><button class="btn ghost" id="same">Refaire la même série</button><button class="btn ghost" id="home">Choisir une autre série</button><button class="btn ghost" id="copy">Copier mon bilan</button></div>
  <p class="hint" id="copyMsg" style="margin-top:8px"></p></section>
  <section><div class="sec-h"><h2>Mes réussites par thème</h2></div><div class="cats">${Object.entries(cats).map(([c,[a,b]])=>`<div><span>${c}</span><span class="pill ${pillClass(a/b*20)}">${a} / ${b}</span></div>`).join('')}</div></section>
  <section><div class="sec-h"><h2>Revoir les 30 questions</h2><p>Clique sur une question pour revoir sa correction.</p></div><div class="review">${qs.map((q,i)=>`<details class="${ans[i].ok?'ok':'ko'}"><summary><span class="mk">${ans[i].ok?'✓':'✗'}</span><span class="rq"><b>Q${i+1}.</b> ${q.q}</span></summary>
    <div class="body">${q.fig?`<div class="figbox">${q.fig}</div>`:''}<p>Ta réponse : ${givenHTML(q,ans[i].g)} · Bonne réponse : <b>${ansHTML(q)}</b></p>${stepsHTML(q.steps,false)}</div></details>`).join('')}</div></section>`;
  document.getElementById('again').onclick=()=>startSeries(att.s,(att.v||0)+1+Math.floor(Math.random()*1000));
  document.getElementById('same').onclick=()=>startSeries(att.s,att.v||0);document.getElementById('home').onclick=()=>renderHome();
  document.getElementById('copy').onclick=()=>{const m=document.getElementById('copyMsg');const fb=()=>{m.innerHTML=`Copie ce texte : <b>${esc(summary)}</b>`;};
    try{navigator.clipboard.writeText(summary).then(()=>{m.textContent='Bilan copié : tu peux le coller dans un message à ton professeur.';},fb);}catch(e){fb();}};
  app.querySelectorAll('.review details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){const ol=d.querySelector('ol.steps');ol.classList.remove('anim');void ol.offsetWidth;ol.classList.add('anim');}}));
  window.scrollTo(0,0);}

/* =============== Sujet en conditions réelles =============== */
function startExam(s,v){ST={s,v,qs:buildSeries(s,v),mode:'exam',ans:[],i:0,elapsed:0,t0:Date.now(),phase:'exam',given:Array(30).fill(''),limit:(DB.examMin||9)*60000};renderExam();startTimer();}
function storeCur(){if(!ST||ST.mode!=='exam')return;const q=ST.qs[ST.i],i=document.getElementById('ans');if(q.type!=='qcm'&&i)ST.given[ST.i]=i.value.trim();}
function endExam(timeout){if(!ST||ST.mode!=='exam')return;storeCur();stopTimer();ST.ans=ST.qs.map((q,i)=>{const g=ST.given[i];return {g,ok:g!==''&&check(q,g)};});ST.timeout=timeout;finish();}
function renderExam(){renderWho();const q=ST.qs[ST.i],rem=Math.max(0,Math.ceil((ST.limit-elapsed())/1000));
  const dots=ST.qs.map((_,i)=>`<button type="button" class="qd${ST.given[i]!==''?' done':''}${i===ST.i?' cur':''}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('');
  let inp;if(q.type==='qcm')inp=`<div class="choices">${q.choices.map((c,i)=>`<button class="choice${ST.given[ST.i]===i?' sel':''}" type="button" data-i="${i}">${c}</button>`).join('')}</div>`;
  else inp=`<form class="answer" id="ansForm" autocomplete="off"><input id="ans" inputmode="text" aria-label="Ta réponse" placeholder="Ta réponse" value="${esc(ST.given[ST.i])}"><span class="unit">${q.u||''}</span>
    <span class="keys"><button type="button" data-k="−" aria-label="signe moins">−</button><button type="button" data-k="," aria-label="virgule">,</button>${q.type==='frac'?'<button type="button" data-k="/" aria-label="barre de fraction">/</button>':''}</span>
    <button class="btn" type="submit">${ST.i===29?'Enregistrer':'Suivante →'}</button></form>`;
  const left=ST.given.filter(g=>g==='').length;
  app.innerHTML=`<section><div class="qbar"><h2>${title(ST.s)}</h2><div class="clock" id="timer">${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}</div></div>
    <p class="hint" style="margin:6px 0 8px">Comme le jour J : pas de calculatrice, pas de brouillon, la correction arrive à la fin. Clique sur un numéro pour sauter une question ou y revenir.</p><div class="qdots">${dots}</div></section>
  <section class="sheet"><span class="margin-note">${ST.i+1})</span><div class="tags"><span class="tag cat">${q.cat}</span><span class="tag">Question ${ST.i+1} sur 30</span></div>
    <div class="qtext">${q.q}</div>${q.fig?`<div class="figbox">${q.fig}</div>`:''}${q.hint||q.type==='frac'?`<p class="hint">${q.hint||'Écris ta réponse sous la forme a/b.'}</p>`:''}${inp}
    <div class="next-row"><button class="btn ghost" id="prev"${ST.i===0?' disabled':''}>← Précédente</button>${ST.i<29?'<button class="btn ghost" id="skipq">Passer</button>':''}<button class="btn red" id="end">Terminer l'épreuve</button></div></section><div id="confirm"></div>`;
  const go=i=>{storeCur();ST.i=i;renderExam();};
  app.querySelectorAll('.qd').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.getElementById('prev').onclick=()=>go(ST.i-1);const sk=document.getElementById('skipq');if(sk)sk.onclick=()=>go(ST.i+1);
  if(q.type==='qcm')app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ST.given[ST.i]=+b.dataset.i;if(ST.i<29)go(ST.i+1);else renderExam();});
  else{const f=document.getElementById('ansForm'),i=document.getElementById('ans');f.onsubmit=e=>{e.preventDefault();if(ST.i<29)go(ST.i+1);else{storeCur();renderExam();}};
    f.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{i.value+=b.dataset.k==='−'?'-':b.dataset.k;i.focus();});try{i.focus({preventScroll:true});}catch(e){}}
  document.getElementById('end').onclick=()=>{storeCur();const l=ST.given.filter(g=>g==='').length;document.getElementById('confirm').innerHTML=`<div class="confirm row"><span>${l?`Il reste ${l} question${l>1?'s':''} sans réponse. `:''}Terminer et voir la correction ?</span><button class="btn red small" id="ey">Oui, terminer</button><button class="btn ghost small" id="en">Continuer</button></div>`;
    document.getElementById('ey').onclick=()=>endExam(false);document.getElementById('en').onclick=()=>{document.getElementById('confirm').innerHTML='';};};}

/* =============== Progrès =============== */
function renderProgress(){renderWho();const s=cur();if(!s){renderHome();return;}const W=740,H=230,l=34,b=200,bw=(W-l-10)/36;let bars='';
  for(let y=0;y<=20;y+=5)bars+=`<line class="gl" x1="${l}" x2="${W-6}" y1="${b-y*8.5}" y2="${b-y*8.5}"/><text class="t" x="${l-6}" y="${b-y*8.5+4}" text-anchor="end">${y}</text>`;
  for(let i=1;i<=36;i++){const n=best(s,i),x=l+(i-1)*bw+2;if(n!=null)bars+=`<rect class="bar-${n>=14?'good':n>=10?'mid':'low'}" x="${x}" y="${b-n*8.5}" width="${bw-4}" height="${Math.max(2,n*8.5)}" rx="2"><title>Série ${i} : ${N(n)}/20</title></rect>`;
    bars+=`<text class="t" x="${x+(bw-4)/2}" y="${b+16}" text-anchor="middle">${i}</text>`;}
  const at=s.attempts.slice().reverse(),done=new Set(s.attempts.map(a=>a.s)).size,avg=s.attempts.length?s.attempts.reduce((x,a)=>x+a.note,0)/s.attempts.length:null;
  app.innerHTML=`<section class="sheet"><span class="margin-note">★</span><h2 style="font-size:1.6rem;color:var(--ink)">Les progrès de ${esc(fullName(s))}</h2>
  <div class="score"><div class="scorebox"><small>Séries faites</small><b>${done} / 36</b></div><div class="scorebox"><small>Essais</small><b>${s.attempts.length}</b></div><div class="scorebox"><small>Moyenne des notes</small><b>${avg==null?'–':N(Math.round(avg*10)/10)}</b></div></div>
  <h3 style="margin:8px 0">Meilleure note par série (sur 20)</h3><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Meilleure note par série">${bars}<text class="t" x="${W/2}" y="${H-2}" text-anchor="middle">Numéro de la série</text></svg></div></section>
  <section><div class="sec-h"><h2>Sujets type course aux nombres</h2><p>Meilleure note</p></div><div class="grid">${Array.from({length:NSUJ},(_,k)=>{const bt=best(s,101+k),bc=best(s,201+k);
    return `<div class="sjrow"><b>Sujet ${k+1}</b><span class="pill ${pillClass(bt)}">Entr. ${bt==null?'–':N(bt)+'/20'}</span><span class="pill ${pillClass(bc)}">Chrono ${bc==null?'–':N(bc)+'/20'}</span></div>`;}).join('')}</div></section>
  <section><div class="sec-h"><h2>Historique</h2></div>${at.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Série</th><th>Thème</th><th>Score</th><th>Note</th><th>Temps</th></tr></thead><tbody>
  ${at.map(a=>`<tr><td>${new Date(a.date).toLocaleDateString('fr-FR')}</td><td>${a.s<=36?a.s:'CAN '+a.s%100}</td><td>${shortT(a.s)}</td><td>${a.score}/30</td><td><span class="pill ${pillClass(a.note)}">${N(a.note)}/20</span></td><td>${fmtTime(a.dur||0)}</td></tr>`).join('')}</tbody></table></div>`
  :`<p class="empty">Aucune série terminée pour l'instant. Choisis ta première série depuis l'accueil.</p>`}<div class="row" style="margin-top:14px"><button class="btn" id="home">Retour aux séries</button></div></section>`;
  document.getElementById('home').onclick=()=>renderHome();window.scrollTo(0,0);}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&ST&&ST.mode!=='exam'&&ST.phase==='corrected'&&document.activeElement&&document.activeElement.id!=='replay'){const n=document.getElementById('next');if(n&&document.activeElement!==n){e.preventDefault();n.click();}}});
renderHome();
</script>

<script id="mjn-math-polish">(()=>{const skip='SCRIPT,STYLE,NOSCRIPT,TEXTAREA,INPUT,PRE,CODE,KBD,SAMP,SVG,SUP,SUB';const re=/([A-Za-z0-9π)\]])\^(?:\{([^{}]+)\}|([−-]?[A-Za-z0-9]+))/g;function run(){const root=document.querySelector('main')||document.body;if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue||!n.nodeValue.includes('^'))return NodeFilter.FILTER_REJECT;let p=n.parentElement;while(p){if(p.matches&&p.matches(skip))return NodeFilter.FILTER_REJECT;p=p.parentElement}return NodeFilter.FILTER_ACCEPT}});const nodes=[];let n;while(n=w.nextNode())nodes.push(n);for(const node of nodes){const s=node.nodeValue;re.lastIndex=0;let m,last=0,found=false;const frag=document.createDocumentFragment();while(m=re.exec(s)){found=true;frag.append(document.createTextNode(s.slice(last,m.index)+m[1]));const sup=document.createElement('sup');sup.textContent=m[2]!==undefined?m[2]:m[3];frag.append(sup);last=re.lastIndex}if(found){frag.append(document.createTextNode(s.slice(last)));node.parentNode&&node.parentNode.replaceChild(frag,node)}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();const root=document.querySelector('main')||document.body;new MutationObserver(()=>run()).observe(root,{childList:true,subtree:true})})();</script>
