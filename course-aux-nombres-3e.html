<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course aux nombres 3e</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Mise en page : une feuille de cahier à carreaux, marge rouge à gauche, correction au stylo rouge. */
:root{
  --paper:#f5f7fc; --grid:#e3e9f6; --card:#ffffff; --text:#1c2135; --ink:#1f3290; --muted:#5a6380;
  --line:#d5dcec; --red:#c22e2e; --red-soft:#fcebea; --green:#16764a; --green-soft:#e3f3ea;
  --amber:#9c5800; --amber-soft:#fbefdc; --mark:#ffef9e; --accent:#2a46c4; --accent-soft:#e7ecff;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57; color-scheme:dark }

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--text);font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{background:var(--card);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:10px;background:var(--ink);color:var(--card);display:grid;place-items:center;font:800 18px var(--f-display)}
.brand h1{font-size:1.3rem;font-weight:800;color:var(--ink)}
.brand p{margin:0;font-size:.85rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.brand p b{color:var(--red);letter-spacing:.08em}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:700}
.link{background:none;border:0;padding:4px 6px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.95rem}

main{padding-block:24px 40px;display:flex;flex-direction:column;gap:24px}
footer{padding-block:0 32px;color:var(--muted);font-size:.85rem;text-align:center}

/* Feuille de cahier */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 24px 66px;box-shadow:0 1px 0 var(--line)}
.sheet::before{content:"";position:absolute;left:50px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
.margin-note{position:absolute;left:0;width:50px;top:20px;text-align:center;font:800 1.05rem var(--f-display);color:var(--red)}
@media (max-width:560px){ .sheet{padding:18px 16px 20px 44px} .sheet::before{left:32px} .margin-note{width:32px;font-size:.85rem} }

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--card);padding:10px 20px;border-radius:10px;font-weight:700;font-size:1rem;min-height:46px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--card)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Accueil */
.welcome h2{font-size:1.7rem;color:var(--ink)}
.welcome p{max-width:62ch}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem;min-width:0}
.form input{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:1.05rem;min-width:0}
.form input:focus{border-color:var(--accent)}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:8px 0 0}
.known{margin-top:12px;font-size:.92rem;color:var(--muted)}
.known button{margin:4px 6px 0 0}

.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:1.35rem;color:var(--ink)}
.sec-h p{margin:0;color:var(--muted);font-size:.92rem}
.period{margin-top:18px}
.period h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-family:var(--f-body)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:112px;transition:transform .15s,border-color .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard .num{font:800 .95rem var(--f-display);color:var(--red)}
.scard .th{font-weight:700;line-height:1.3;color:var(--text)}
.scard .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.p-good{background:var(--green-soft);color:var(--green)}
.p-mid{background:var(--amber-soft);color:var(--amber)}
.p-low{background:var(--red-soft);color:var(--red)}
.p-none{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--amber-soft);border:1px solid var(--line);border-radius:8px;padding:12px 16px}

/* Quiz */
.qbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.qbar h2{font-size:1.15rem;color:var(--ink)}
.qbar .stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:.95rem}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .4s}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--green)} .dots i.ko{background:var(--red)} .dots i.cur{outline:2px solid var(--accent);outline-offset:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tag.cat{color:var(--ink);border-color:var(--ink)}

details.example{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:16px}
details.example summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.example .exq{margin:10px 0 6px;font-weight:700}
details.example .exa{margin-top:6px;font-weight:700;color:var(--green)}

.qtext{font-size:1.28rem;font-weight:700;line-height:1.5;margin:4px 0 12px;max-width:64ch}
.hint{color:var(--muted);font-size:.92rem;margin:-4px 0 10px}
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer input{width:min(240px,100%);border:2px solid var(--ink);border-radius:10px;padding:10px 14px;font-size:1.3rem;font-weight:700;background:var(--paper);font-variant-numeric:tabular-nums}
.unit{font-weight:700;font-size:1.1rem;color:var(--muted)}
.keys{display:flex;gap:6px}
.keys button{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-weight:800;font-size:1.1rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:640px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;font-size:1.15rem;font-weight:700;min-height:56px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.picked{border-color:var(--red);background:var(--red-soft)}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice:disabled{cursor:default}

.feedback{margin-top:18px;border-radius:8px;padding:12px 16px;font-weight:700}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.ko{background:var(--red-soft);color:var(--red)}
.feedback .big{font:700 1.7rem var(--f-hand);display:block;line-height:1.1}
.correction{margin-top:14px;border:2px dashed var(--red);border-radius:8px;padding:12px 16px 14px}
.correction h3{font:700 1.7rem var(--f-hand);color:var(--red);margin-bottom:4px}
.steps{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:4px}
.steps li::marker{color:var(--red);font-weight:800}
.steps.anim .step{animation:stepIn .55s ease both;animation-delay:var(--d)}
.steps.anim .step mark{animation:hl .7s ease both;animation-delay:calc(var(--d) + .35s)}
.steps.anim .step .draw{animation:draw 1.2s ease both;animation-delay:calc(var(--d) + .2s)}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hl{from{background-size:0 100%}to{background-size:100% 100%}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
mark{color:inherit;background:linear-gradient(var(--mark),var(--mark)) no-repeat;background-size:100% 100%;padding:0 3px;border-radius:3px;font-weight:700}
.res{display:inline-block;margin-top:2px;padding:4px 12px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.corr-actions{margin-top:14px}
.next-row{margin-top:18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* Maths */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px;font-weight:700}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.rad{white-space:nowrap}.rad span{border-top:2px solid currentColor;padding:0 2px}
.nw{white-space:nowrap}
i{font-family:Georgia,'Times New Roman',serif;font-size:1.05em}
.figbox{overflow-x:auto;margin:6px 0 10px}
.fig{display:block;max-width:100%;height:auto}
.fig .shape{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2.5}
.fig .stroke{fill:none;stroke:var(--ink);stroke-width:2}
.fig .thin{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.fig .gridl{stroke:var(--line);stroke-width:1}
.fig .axis{stroke:var(--text);stroke-width:2}
.fig .lbl{fill:var(--text);font:700 15px var(--f-body)}
.fig .sm{fill:var(--muted);font:600 12px var(--f-body)}
.fig .q{fill:var(--red);font:800 17px var(--f-body)}
.fig .fline{fill:none;stroke:var(--accent);stroke-width:3}
.fig .draw{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:0}
.fig .dot{fill:var(--red)}
.fig .dot0{fill:var(--ink)}
.ctab{overflow-x:auto;margin:8px 0}
.ctab table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.ctab th{border:1px solid var(--line);padding:6px 10px;min-width:46px;background:var(--paper);font-size:.95rem}
.ctab th.from{background:var(--accent-soft);color:var(--ink);border-color:var(--ink)}
.ctab th.to{background:var(--green-soft);color:var(--green);border-color:var(--green)}

/* Résultat */
.result h2{font-size:1.9rem;color:var(--ink)}
.score{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;margin:16px 0}
.scorebox{border:2px solid var(--line);border-radius:10px;padding:10px 18px;min-width:140px}
.scorebox small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem}
.scorebox b{font:800 2.2rem var(--f-display);font-variant-numeric:tabular-nums}
.stamp{border-color:var(--red);color:var(--red);transform:rotate(-3deg)}
.stamp b{font-family:var(--f-hand);font-size:2.8rem;line-height:1}
.msg{font-size:1.15rem;max-width:62ch;background:var(--accent-soft);border-radius:8px;padding:12px 16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.cats div{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.95rem}
.review{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.review details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card)}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.review summary .mk{font-weight:800;width:1.4em}
.review .ok .mk{color:var(--green)} .review .ko .mk{color:var(--red)}
.review .rq{flex:1;min-width:0}
.review .body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.confirm{background:var(--red-soft);border-radius:8px;padding:12px 16px}

/* Progrès */
.chart{overflow-x:auto}
.chart svg{display:block;min-width:620px;width:100%;height:auto}
.chart .bar-good{fill:var(--green)} .chart .bar-mid{fill:var(--amber)} .chart .bar-low{fill:var(--red)}
.chart .gl{stroke:var(--line)} .chart .t{fill:var(--muted);font:600 11px var(--f-body)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted)}
/* Sujets type CAN */
.sujet-intro{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0}
.sujet-intro p{margin:0 0 8px;max-width:70ch}
.durs{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.95rem}
.durs span{font-weight:700}
.durs label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#sujets .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.scard.sj{min-height:0}
.scard.sj .row{margin-top:6px;gap:6px}
.sjrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card)}
.sjrow b{margin-right:auto}
.clock{font:800 2rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:2px 14px}
.clock.low{color:var(--red);border-color:var(--red);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.55}}
.qdots{display:flex;flex-wrap:wrap;gap:5px}
.qd{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;padding:0}
.qd.done{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.qd.cur{outline:3px solid var(--red);outline-offset:1px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.timeout{color:var(--red);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Charte MJN et mode sombre */
:root{--accent:#2563b8;--accent-soft:#e7f0ff;--nav:#173354;--ok:#238451;--ok-soft:#e5f5eb;--ko:#c43d42;--ko-soft:#fbe9ea;--violet:#2563b8;--violet-soft:#e7f0ff}
.btn.vio,.exo.appro .num{background:var(--accent)}
a[href="#accueil"],a[href="#/"],a[data-nav="accueil"],a[data-r="accueil"],[aria-label*="retour" i],[aria-label*="accueil" i],.btn.soft,.btn.ghost,.back-button,.btn-retour{background:var(--accent)!important;border:1px solid var(--accent)!important;color:#fff!important;box-shadow:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1b2535;--ink:#edf2fa;--muted:#b5c0d1;--line:#3a4960;--accent:#79b6ff;--accent-soft:#233c59;--ok:#72d6a0;--ok-soft:#183b2c;--ko:#ff9297;--ko-soft:#48272d;--warn:#f3c56b;--warn-soft:#42351e;--violet:#79b6ff;--violet-soft:#233c59;--nav:#101f33;color-scheme:dark}body{background:var(--bg)!important;color:var(--ink)!important}.card,.tile,.ch,.themes label,details.rap,.recap li,table.t,table.t th,table.t td,.ans input,.tabs button,.corr,.mail{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}.hero,.home-hero{background:#17263a!important;color:var(--ink)!important}.hero h1,.hero .sub,.hero .who,.home-hero h1,.home-hero .sub,.home-hero .who{color:var(--ink)!important}.box.def,.box.demo{background:var(--accent-soft)!important;color:var(--ink)!important}.box.meth{background:var(--ok-soft)!important;color:var(--ink)!important}.box.att,.fb.ko,.ch.ko,.ans input.ko{background:var(--ko-soft)!important;color:var(--ink)!important}.box.ex,.fb.info{background:#263244!important;color:var(--ink)!important}.cheer,.notice,.hint{background:var(--warn-soft)!important;color:#ffe6a8!important;border-color:#806a3c!important}.btn.ghost{background:var(--accent-soft)!important;color:var(--accent)!important}.btn.soft{background:#2b374a!important;color:var(--ink)!important}.btn:not(.ghost):not(.soft),.btn.vio{background:#285b98!important;color:#fff!important}code{background:#263244!important;color:#edf2fa!important}a{color:var(--accent)}}</style>

<style id="mjn-math-polish-css">/* MJN COURS : typographie lisible et exposants mathématiques */
:root{--f-display:Arial,"Segoe UI",sans-serif!important;--f-body:Arial,"Segoe UI",sans-serif!important}
html,body{font-family:Arial,"Segoe UI",sans-serif!important;font-variant-numeric:normal!important;font-feature-settings:"zero" 0!important}
