<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mathématiques en Première spécialité | COURS MJN</title>
<meta name="description" content="Cours et entraînement de mathématiques en Première spécialité : automatismes, exercices interactifs et activités pour consolider les notions.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://mathsavecel.github.io/COURS-MJN/maths-premiere-specialite.html"><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5d6779;--line:#dde3ee;--accent:#2f5bd3;--accent-soft:#e7eefc;--ok:#1f9d55;--ok-soft:#e3f6ea;--ko:#d23c3c;--ko-soft:#fde8e8;--warn:#b26a00;--warn-soft:#fff3dc;--violet:#7b3fc4;--violet-soft:#f1e8fb;--nav:#152044}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit}
/* ---------- en-tête ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;background:var(--nav);color:#fff;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .logo{font-weight:800;font-size:19px;letter-spacing:.2px;white-space:nowrap;cursor:pointer}
.top .logo span{background:#fff;color:var(--nav);border-radius:8px;padding:1px 8px;margin-right:6px}
.top .att{flex:1;font-size:15px;opacity:.9}
.top .prof{font-weight:700;white-space:nowrap}
.top .burger{display:none;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-size:20px;cursor:pointer}
/* ---------- structure ---------- */
.layout{display:flex;max-width:1280px;margin:0 auto;min-height:calc(100vh - 56px)}
nav#nav{width:290px;flex:none;padding:14px 10px 30px;border-right:1px solid var(--line);background:#fbfcff;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav#nav .grp{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:16px 10px 6px}
nav#nav a{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:10px;font-size:15px;line-height:1.3}
nav#nav a:hover{background:var(--accent-soft)}
nav#nav a.on{background:var(--accent);color:#fff}
nav#nav a .n{flex:none;min-width:22px;font-weight:700;color:var(--accent)}
nav#nav a.on .n{color:#fff}
nav#nav a .d{margin-left:auto;color:var(--ok);font-weight:700}
nav#nav a.on .d{color:#fff}
main#main{flex:1;min-width:0;padding:22px 26px 40px}
footer.foot{border-top:1px solid var(--line);background:#fff;color:var(--muted);text-align:center;padding:16px;font-size:15px}
footer.foot b{color:var(--ink)}
@media (max-width:900px){
  .top .burger{display:block}
  .top .att{display:none}
  nav#nav{position:fixed;left:0;top:52px;bottom:0;height:auto;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15);background:#fbfcff}
  nav#nav.open{transform:none}
  main#main{padding:16px}
}
/* ---------- blocs ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 2px 8px rgba(20,30,60,.05);margin-bottom:16px}
h1{font-size:27px;margin:0 0 4px;color:var(--accent);line-height:1.25}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:18px;margin:0 0 8px}
.kicker{color:var(--muted);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--muted);margin:2px 0 14px}
.hero{background:linear-gradient(135deg,#2f5bd3,#6a4ad6);color:#fff;border:0}
.hero h1{color:#fff;font-size:30px}
.hero .sub{color:#e6e9ff}
.hero .who{font-weight:700;font-size:18px}
.cheer{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border:1px solid #f3dca8;border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600;color:#6b4300}
.mail{background:var(--accent-soft);border-radius:12px;padding:12px 16px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;transition:.15s}
.tile:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(47,91,211,.12)}
.tile .t{font-weight:700}
.tile .m{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--ok);transition:width .3s}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin:4px 0}
/* ---------- onglets ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button small{opacity:.8;font-weight:500}
/* ---------- cours ---------- */
.lesson h3{color:var(--accent)}
.box{border-radius:12px;padding:12px 16px;margin:10px 0}
.box .lab{font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.box.def{background:var(--accent-soft);border-left:5px solid var(--accent)}
.box.def .lab{color:var(--accent)}
.box.ex{background:#f6f7fa;border-left:5px solid #8a94a8}
.box.ex .lab{color:#5d6779}
.box.meth{background:var(--ok-soft);border-left:5px solid var(--ok)}
.box.meth .lab{color:var(--ok)}
.box.att{background:var(--ko-soft);border-left:5px solid var(--ko)}
.box.att .lab{color:var(--ko)}
.box.demo{background:var(--violet-soft);border-left:5px solid var(--violet)}
.box.demo .lab{color:var(--violet)}
.lesson p{margin:6px 0}
.lesson ul{margin:6px 0;padding-left:22px}
table.t{border-collapse:collapse;margin:8px 0;background:#fff}
table.t td,table.t th{border:1px solid #b9c2d3;padding:5px 10px;text-align:center;min-width:42px}
table.t th{background:#eef2fa}
.scroll{overflow-x:auto;max-width:100%}
pre.py{background:#1e2433;color:#e8ecf5;border-radius:10px;padding:12px 14px;overflow:auto;font:15px/1.45 Consolas,"Courier New",monospace;margin:8px 0}
pre.py .k{color:#ff9ac1}
pre.py .c{color:#8b95a8;font-style:italic}
code{background:#eef1f7;border-radius:5px;padding:1px 5px;font:15px Consolas,"Courier New",monospace}
.fig{text-align:center;margin:10px 0}
.fig svg{max-width:100%;height:auto}
/* ---------- exercices ---------- */
.exo .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.exo .num{background:var(--accent);color:#fff;border-radius:10px;padding:2px 12px;font-weight:700}
.exo.appro .num{background:var(--violet)}
.exo .done{margin-left:auto;color:var(--ok);font-weight:700;display:none}
.exo.isdone .done{display:inline}
.exo.isdone{border-color:#9bd8b4}
.item{border-top:1px dashed var(--line);padding:12px 0 4px;margin-top:10px}
.item:first-of-type{border-top:0;margin-top:0}
.item .p{margin-bottom:8px}
.item .p b.l{color:var(--accent)}
.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ans label{display:flex;align-items:center;gap:6px}
.ans input{font:inherit;width:130px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.ans input:focus{outline:none;border-color:var(--accent)}
.ans input.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans input.ko{border-color:var(--ko);background:var(--ko-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.soft{background:#eef0f5;color:var(--ink)}
.btn.vio{background:var(--violet)}
.btn:disabled{opacity:.45;cursor:default}
.choices{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ch{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);min-height:48px}
.ch:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.ch .L{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.ch:disabled{cursor:default}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ok .L{background:var(--ok);color:#fff}
.ch.ko{border-color:var(--ko);background:var(--ko-soft);opacity:.8}
.ch.ko .L{background:var(--ko);color:#fff}
.fb{margin-top:8px;border-radius:10px;padding:9px 13px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:#14532d}
.fb.ko{background:var(--ko-soft);color:#7f1d1d}
.fb.info{background:#f2f4f9;color:var(--ink)}
.fb .h{font-weight:700}
.corr{display:none;margin-top:12px;background:#f7f5fd;border:1px solid #ddd0f4;border-radius:12px;padding:12px 16px}
.corr.show{display:block}
.corr .lab{font-weight:800;color:var(--violet);margin-bottom:4px}
.hint{display:none;margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:9px 13px}
.hint.show{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted)}
.score b{color:var(--ink)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
/* ---------- automatismes ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:10px 0}
.themes label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer}
.themes label:hover{border-color:var(--accent)}
.themes input{width:18px;height:18px}
.qbig{font-size:19px;font-weight:600;margin:10px 0}
.prog{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}
.prog i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.prog i.ok{background:var(--ok)}
.prog i.ko{background:var(--ko)}
.prog i.cur{background:var(--accent)}
.recap{margin:10px 0;padding-left:0;list-style:none}
.recap li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;background:#fff}
.recap li.ko{border-color:#f0b4b4}
.big{font-size:42px;font-weight:800;color:var(--accent)}
details.rap{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;padding:0 14px}
details.rap summary{cursor:pointer;font-weight:700;padding:10px 0}
details.rap[open]{padding-bottom:10px}
/* ---------- maths ---------- */
.m{white-space:nowrap}
.m i{font-family:"Cambria Math","Times New Roman",serif;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 .12em;line-height:1.15}
.fr>span{padding:0 .2em}
.fr>.nu{border-bottom:1.4px solid currentColor}
.sq{white-space:nowrap}
.sq>.rad{border-top:1.4px solid currentColor;padding:0 .1em 0 .05em;margin-left:.02em}
.vec{display:inline-block;position:relative;border-top:1.4px solid currentColor;line-height:1.15;margin-top:.25em;padding:0 1px}
.vec::after{content:"";position:absolute;right:-2px;top:-5.2px;border:4.5px solid transparent;border-left:6px solid currentColor;border-right:0}
.ovl{text-decoration:overline}
.hat{display:inline-block;position:relative;padding-top:.3em}
.hat::before{content:"";position:absolute;left:0;right:0;top:.02em;height:.32em;background:linear-gradient(to top right,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) right/50% 100% no-repeat}
.m sup,.m sub{font-size:.75em}
.sys{display:inline-flex;align-items:center;vertical-align:middle}
.sys .br{font-size:2.2em;line-height:1;margin-right:4px;font-weight:200}
.sys .rows{display:flex;flex-direction:column}
@media print{.top,nav#nav,.tools,.tabs{display:none}}
.cv{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:9px;padding:0 .4em;line-height:1.2;font-size:.9em;margin:0 .15em}

.maj{font-size:.85em;color:var(--muted);text-align:center;margin:18px 8px 6px;line-height:1.5}
input[type=checkbox]{flex-shrink:0;width:16px;height:16px}

/* ---------- Accueil de Seconde et Première ---------- */
main#main { background:linear-gradient(180deg,#eef3ff 0,#f4f6fb 360px); }
.home-hero {
  position:relative; isolation:isolate; overflow:hidden;
  padding:clamp(24px,4vw,42px) clamp(20px,4vw,38px);
  border:0; border-radius:22px;
  background:linear-gradient(125deg,#162653 0%,#2852b8 58%,#7053d8 100%);
  color:#fff; box-shadow:0 14px 32px rgba(32,65,150,.19);
}
.home-hero::after {
  content:'π'; position:absolute; z-index:-1; right:5%; top:50%;
  transform:translateY(-55%) rotate(-9deg); font:700 clamp(170px,25vw,300px)/.8 Georgia,serif;
  color:#fff; opacity:.12; pointer-events:none;
}
.home-hero .kicker { color:#dce7ff!important; letter-spacing:1.2px; }
.home-hero h1 { color:#fff; font-size:clamp(32px,4vw,48px); line-height:1.1; max-width:18ch; margin:9px 0 12px; }
.home-hero .sub { color:#e6edff; max-width:68ch; font-size:clamp(16px,1.6vw,19px); line-height:1.65; }
.home-hero .who { display:inline-flex; align-items:center; gap:8px; margin-top:8px; padding:7px 13px; border:1px solid rgba(255,255,255,.24); border-radius:999px; background:rgba(255,255,255,.1); font-size:15px; }
.home-hero .who::before { content:'✦'; color:#f7d879; }
.home-guide { border-color:#dce5f7; }
.home-guide h2, .chapter-group h2 { display:flex; align-items:center; gap:9px; }
.home-guide h2::before { content:'✦'; display:grid; place-items:center; width:30px; height:30px; border-radius:10px; background:#e7eefc; color:#2f5bd3; font-size:15px; }
.home-guide .steps { padding-left:25px; }
.home-guide .steps li { padding-left:3px; margin:8px 0; }
.home-guide .bar { height:10px; margin-top:10px; }
.chapter-group { border-color:#e0e6f2; }
.chapter-group h2 { padding-bottom:9px; border-bottom:1px solid #e8edf6; }
.chapter-group h2::before { content:''; width:5px; height:24px; border-radius:5px; background:linear-gradient(#2f5bd3,#7951d4); }
.chapter-group .grid { gap:14px; }
.chapter-group .tile { position:relative; overflow:hidden; padding:17px 18px; border-radius:14px; border-color:#e0e6f2; box-shadow:0 2px 7px rgba(25,45,90,.035); }
.chapter-group .tile::before { content:''; position:absolute; inset:0 auto 0 0; width:3px; background:linear-gradient(#2f5bd3,#7951d4); opacity:.8; }
.chapter-group .tile .t { margin:4px 0 7px; line-height:1.35; }
.chapter-group .tile .m { line-height:1.45; }
.chapter-group .tile:hover { transform:translateY(-2px); background:#fbfdff; }
.card.mail { border:1px solid #dce5f7; }
@media(max-width:900px) {
  main#main { background:linear-gradient(180deg,#eef3ff 0,#f4f6fb 300px); }
  .home-hero { border-radius:18px; padding:23px 20px; }
  .home-hero::after { right:-12px; opacity:.09; }
}

/* Harmonisation COURS MJN : accueil façon feuille de cahier, boutons d'accès bien visibles */
body{background-color:#f4f6fb!important;background-image:linear-gradient(#e2e8f4 1px,transparent 1px),linear-gradient(90deg,#e2e8f4 1px,transparent 1px)!important;background-size:26px 26px!important}
.top,header{background:#fff!important;border-bottom:2px solid #d4dbeb!important}
.card,.sheet,.home-guide,.contact{border-radius:8px!important;border-color:#d4dbeb!important;box-shadow:0 5px 18px rgba(28,33,53,.06)}
.card.hero,.home-hero,.hero{border-left:5px solid #c22e2e!important}
.kicker{color:#c22e2e!important}
.cheer{border:1px dashed #c22e2e!important;border-radius:10px!important;background:#fff!important;color:#24318a!important;padding:14px 18px!important}
.logo{background:#c22e2e!important;color:#fff!important;border-radius:10px!important}
a[href="#accueil"],a[href="#/"],a[data-nav="accueil"],a[data-r="accueil"],[aria-label*="retour" i],[aria-label*="accueil" i],.btn.soft,.btn.ghost,.back-button,.btn-retour{
 background:#c22e2e!important;border:2px solid #a91f1f!important;color:#fff!important;font-weight:800!important;box-shadow:0 2px 0 rgba(0,0,0,.12)
}
a[href="#accueil"]:hover,a[href="#/"]:hover,a[data-nav="accueil"]:hover,a[data-r="accueil"]:hover,.btn.soft:hover,.btn.ghost:hover{background:#a91f1f!important;color:#fff!important}
nav.tabs a[data-nav="accueil"]{border-radius:9px!important;padding:7px 13px!important}


/* --- Charte MJN : bleu pour le cours, vert pour les méthodes, rouge réservé à la vigilance --- */
:root {
  --accent:#2563b8; --accent-soft:#e7f0ff; --nav:#173354;
  --ok:#238451; --ok-soft:#e5f5eb;
  --ko:#c43d42; --ko-soft:#fbe9ea;
  --violet:#2563b8; --violet-soft:#e7f0ff;
}
.btn.vio,.exo.appro .num { background:var(--accent); }
button.btn:not(.danger):not(.ko),a.btn { background:var(--accent); color:#fff; }
.box.demo { background:var(--accent-soft); border-left-color:var(--accent); }
.box.demo .lab,.corr .lab { color:var(--accent); }
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111827; --card:#1b2535; --ink:#edf2fa; --muted:#b5c0d1; --line:#3a4960;
    --accent:#79b6ff; --accent-soft:#233c59; --ok:#72d6a0; --ok-soft:#183b2c;
    --ko:#ff9297; --ko-soft:#48272d; --warn:#f3c56b; --warn-soft:#42351e;
    --violet:#79b6ff; --violet-soft:#233c59; --nav:#101f33;
    color-scheme:dark;
  }
  body { background:var(--bg) !important; color:var(--ink) !important; }
  nav#nav { background:#162235 !important; border-color:var(--line) !important; }
  nav#nav a,nav#nav .grp { color:var(--ink); }
  .card,.tile,.ch,.themes label,details.rap,.recap li,table.t,table.t th,table.t td,
  .ans input,.tabs button,.corr,.mail { background:var(--card) !important; color:var(--ink) !important; border-color:var(--line) !important; }
  .hero { background:#17263a !important; color:var(--ink) !important; }
  .hero h1,.hero .sub,.hero .who { color:var(--ink) !important; }
  .box.def,.box.demo { background:var(--accent-soft) !important; color:var(--ink) !important; }
  .box.meth { background:var(--ok-soft) !important; color:var(--ink) !important; }
  .box.att,.fb.ko,.ch.ko,.ans input.ko { background:var(--ko-soft) !important; color:var(--ink) !important; }
  .box.ex,.fb.info { background:#263244 !important; color:var(--ink) !important; }
  .cheer,.notice,.hint { background:var(--warn-soft) !important; color:#ffe6a8 !important; border-color:#806a3c !important; }
  .btn.ghost { background:var(--accent-soft) !important; color:var(--accent) !important; }
  .btn.soft { background:#2b374a !important; color:var(--ink) !important; }
  .btn:not(.ghost):not(.soft),.btn.vio { background:#285b98 !important; color:#fff !important; }
  .tabs button.on,nav#nav a.on { background:#285b98 !important; color:#fff !important; }
  .ans input:focus { border-color:var(--accent) !important; }
  code { background:#263244 !important; color:#edf2fa !important; }
  footer.foot { background:#162235 !important; color:var(--muted) !important; border-color:var(--line) !important; }
  a { color:var(--accent); }
}


/* Charte MJN unifiée et lisible en mode sombre */
:root{--accent:#2563b8;--accent-soft:#e7f0ff;--nav:#173354;--ok:#238451;--ok-soft:#e5f5eb;--ko:#c43d42;--ko-soft:#fbe9ea;--violet:#2563b8;--violet-soft:#e7f0ff}
.btn.vio,.exo.appro .num{background:var(--accent)}

/* Petit moteur d'écriture mathématique (hors ligne) : tout ce qui est entre $...$ est mis en forme. */

const FN = ['cos','sin','tan','exp','ln','Card','max','min','lim','det','pgcd','PGCD','arccos','arcsin'];
function tex(src){
  let i = 0, s = src;

      if (c === 'vec') return `<span class="vec">${group()}</span>`;

      if (c === 'norm') return `‖${group()}‖`;

    if (ch === '<'){ i++; return '&lt;'; }
    if (ch === '>'){ i++; return '&gt;'; }
    if (ch === '-'){ i++; return '−'; }

/* Remplace chaque $...$ d'un texte HTML par la formule mise en forme. */
function M(html){

/* Écriture française d'un nombre (virgule, sans erreurs d'arrondi). */
function fr(x, d){
  if (typeof x !== 'number') return String(x);

  if (Object.is(v, -0)) v = 0;
  let t = String(v);

/* Fraction simplifiée a/b sous forme TeX */
function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }

  const g = gcd(a, b); a /= g; b /= g;

function par(c){ return c < 0 ? '(' + fr(c) + ')' : fr(c); }

/* Figures SVG générées : repères et courbes, arbres, cercle trigonométrique, boîtes à moustaches, diagrammes. */
const COL = { b:'#2f5bd3', r:'#d23c3c', g:'#1f9d55', v:'#7b3fc4', o:'#e07b00', k:'#1d2433', gr:'#8a94a8' };
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

}
function arrowHead(x1, y1, x2, y2, col, sz){

  const p1 = [x2 - sz * Math.cos(a - b), y2 - sz * Math.sin(a - b)], p2 = [x2 - sz * Math.cos(a + b), y2 - sz * Math.sin(a + b)];

}
/* Repère + courbes.
   o = {x:[xmin,xmax], y:[ymin,ymax], u:px par unité (ou ux/uy), grid:true, step:1, labStep:1,
        curves:[{f, d:[a,b], c, n:'C_f', nx, w, dash}], poly:[{p:[[x,y],...], c, n, nx}],
        pts:[{x,y,l,c,pos:'ne'}], segs:[{a:[x,y], b:[x,y], c, dash}], vecs:[{a:[x,y], b:[x,y], c, l}],

  s += `<defs><clipPath id="cp${graph.n = (graph.n || 0) + 1}"><rect x="${pad}" y="${pad}" width="${W - 2 * pad}" height="${H - 2 * pad}"/></clipPath></defs>`;

    for (let x = Math.ceil(x0 / step) * step; x <= x1 + 1e-9; x += step) s += `<line x1="${X(x)}" y1="${pad}" x2="${X(x)}" y2="${H - pad}" stroke="#e3e8f2"/>`;
    for (let y = Math.ceil(y0 / step) * step; y <= y1 + 1e-9; y += step) s += `<line x1="${pad}" y1="${Y(y)}" x2="${W - pad}" y2="${Y(y)}" stroke="#e3e8f2"/>`;
  }

  if (x0 <= 0 && x1 >= 0){ s += `<line x1="${X(0)}" y1="${H - pad + 6}" x2="${X(0)}" y2="${pad - 8}" stroke="#333" stroke-width="1.3"/>` + arrowHead(X(0), pad, X(0), pad - 9, '#333', 8); }

    for (let x = Math.ceil(x0 / lab) * lab; x <= x1 + 1e-9; x += lab){ if (Math.abs(x) < 1e-9) continue; s += `<line x1="${X(x)}" y1="${ya - 3}" x2="${X(x)}" y2="${ya + 3}" stroke="#333"/>` + svgTxt(X(x), ya + 15, fr(+x.toFixed(6)), { size: 11, c: '#555' }); }
    for (let y = Math.ceil(y0 / lab) * lab; y <= y1 + 1e-9; y += lab){ if (Math.abs(y) < 1e-9) continue; s += `<line x1="${xa - 3}" y1="${Y(y)}" x2="${xa + 3}" y2="${Y(y)}" stroke="#333"/>` + svgTxt(xa - 6, Y(y) + 4, fr(+y.toFixed(6)), { size: 11, c: '#555', a: 'end' }); }

  (o.vl || []).forEach(h => { s += `<line x1="${X(h.x)}" y1="${pad}" x2="${X(h.x)}" y2="${H - pad}" stroke="${h.c || COL.o}" stroke-width="1.6" stroke-dasharray="6 4"/>`; if (h.l) s += svgTxt(X(h.x) + 5, pad + 12, h.l, { c: h.c || COL.o, a: 'start', size: 13 }); });

    }

  });
  (o.poly || []).forEach(c => {
    s += `<path d="${c.p.map((q, k) => (k ? 'L' : 'M') + X(q[0]) + ' ' + Y(q[1])).join('')}" fill="none" stroke="${c.c || COL.b}" stroke-width="2.4" stroke-linejoin="round" ${clip}/>`;
    if (c.n){ const q = c.p[c.p.length - 1]; s += svgTxt(X(q[0]) + (c.dx || -4), Y(q[1]) + (c.dy || -10), c.n, { c: c.c || COL.b, w: 'bold', a: 'end' }); }

/* Chaîne d'évolutions : st = ['100 €', '× 1,2', '120 €', ...] (valeurs et opérations alternées) ; back = ['÷ 1,2', ...] flèches retour */
function chain(st, back){
  const nv = Math.ceil(st.length / 2), bw = 96, gap = 92, W = nv * bw + (nv - 1) * gap + 20, H = back ? 112 : 70;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" style="background:#fff;border-radius:10px">`;
  for (let k = 0; k < nv; k++){ const x = 10 + k * (bw + gap);
    s += `<rect x="${x}" y="22" width="${bw}" height="34" rx="9" fill="${COL.b}12" stroke="${COL.b}" stroke-width="1.6"/>` + svgTxt(x + bw / 2, 44, st[2 * k], { w: 'bold', size: 14 });
    if (k < nv - 1){ const x1 = x + bw + 6, x2 = x + bw + gap - 6;
      s += `<line x1="${x1}" y1="39" x2="${x2 - 6}" y2="39" stroke="${COL.g}" stroke-width="2"/>` + arrowHead(x1, 39, x2, 39, COL.g, 9) + svgTxt((x1 + x2) / 2, 30, st[2 * k + 1], { c: COL.g, w: 'bold', size: 13 });
      if (back && back[k]) s += `<path d="M${x2 - 4} 62Q${(x1 + x2) / 2} 98 ${x1 + 4} 62" fill="none" stroke="${COL.r}" stroke-width="1.8"/>` + arrowHead(x1 + 14, 72, x1 + 4, 62, COL.r, 8) + svgTxt((x1 + x2) / 2, 100, back[k], { c: COL.r, w: 'bold', size: 13 }); }
  }
  return s + '</svg>';
}

const KW = ['def', 'return', 'for', 'in', 'range', 'while', 'if', 'elif', 'else', 'import', 'from', 'print', 'and', 'or', 'not', 'True', 'False', 'len', 'append', 'int', 'float', 'str', 'input', 'type', 'round', 'abs', 'sum', 'max', 'min', 'break'];
function PY(code){
  let h = code.replace(/^\n/, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  h = h.split('\n').map(line => {

  }).join('\n');
  return `<pre class="py">${h}</pre>`;
}

/* ---------- Lecture des réponses ---------- */
function parseNum(s){
  s = String(s).trim().replace(/\s| /g, '').replace(/[−–]/g, '-').replace(/,/g, '.');
  s = s.replace(/^[^=]*=/, '').replace(/[€%°a-zA-Z²³]+$/, '');
  if (/^[-+]?\d*\.?\d+\/[-+]?\d*\.?\d+$/.test(s)){ const [a, b] = s.split('/'); return +a / +b; }
  if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return +s;
  return NaN;
}
function fmtAns(a){
  if (Math.abs(a * 1e4 - Math.round(a * 1e4)) <= 1e-6) return fr(a);
  for (let q = 2; q <= 200; q++){ const p = Math.round(a * q); if (Math.abs(p / q - a) < 1e-9) return M('$' + fracTex(p, q) + '$') + ' ≈ ' + fr(a, 2); }
  return '≈ ' + fr(a, 3);
}
function near(v, a, tol){
  // réponse non décimale (ex. 2/3) : on accepte aussi un arrondi au centième
  if (tol == null && Math.abs(a * 1e4 - Math.round(a * 1e4)) > 1e-6) tol = 0.006;
  return Math.abs(v - a) <= (tol != null ? tol : 1e-6 * Math.max(1, Math.abs(a)));
}
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Une question (utilisée dans les exercices et les automatismes) ----------
   it = {p, n | c | vf, lab, u, tol, e, fixed}. onDone(bonne réponse au 1er coup ?) */
function renderItem(it, onDone, opts){
  opts = opts || {};
  const box = el('div', 'item');
  if (it.p) box.appendChild(el('div', 'p', M(it.p)));
  const fb = el('div', 'fb');
  let tries = 0, solved = false;
  const finish = (good) => { solved = true; onDone && onDone(tries === 1 && good, good); };
  const showFb = (good, extra) => {
    fb.className = 'fb show ' + (good ? 'ok' : 'ko');
    fb.innerHTML = `<div class="h">${good ? pick(OKS) : pick(KOS)}</div>${extra || ''}`;
  };
  if (it.c || 'vf' in it){
    const isVF = 'vf' in it;
    const list = isVF ? [['Vrai', it.vf === true], ['Faux', it.vf === false]] : it.c.map((t, k) => [t, k === 0]);
    const plain = t => String(t).replace(/<[^>]+>|\$/g, '');
    const order = isVF ? list : it.fixed ? list.slice().sort((a, b) => plain(a[0]).localeCompare(plain(b[0]), 'fr', { numeric: true })) : shuffle(list);
    const wrap = el('div', 'choices');
    order.forEach(([t, good], k) => {
      const b = el('button', 'ch', `<span class="L">${isVF ? t[0] : 'ABCDEF'[k]}</span><span>${M(t)}</span>`);
      b.onclick = () => {
        if (solved) return;
        tries++;
        if (good){
          b.classList.add('ok'); wrap.querySelectorAll('.ch').forEach(x => x.disabled = true);
          showFb(true, it.e ? M(it.e) : ''); finish(true);
        } else {
          b.classList.add('ko'); b.disabled = true;
          if (opts.oneShot){ wrap.querySelectorAll('.ch').forEach(x => { x.disabled = true; }); const g = [...wrap.children][order.findIndex(o => o[1])]; g.classList.add('ok'); showFb(false, (it.e ? M(it.e) : '')); finish(false); }
          else showFb(false, tries >= 2 && it.e ? '<div style="margin-top:6px">' + M(it.e) + '</div>' : '');
          if (!opts.oneShot && tries >= 2){ const g = [...wrap.children][order.findIndex(o => o[1])]; g.classList.add('ok'); wrap.querySelectorAll('.ch').forEach(x => x.disabled = true); finish(false); }
        }
      };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  } else {
    const ans = Array.isArray(it.n) ? it.n : [it.n];
    const labs = it.lab || ans.map(() => '');
    const wrap = el('div', 'ans'), inputs = [];
    ans.forEach((a, k) => {
      const L = el('label', '', labs[k] ? `<span>${M(labs[k])}</span>` : '');
      const inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.placeholder = 'ta réponse';
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      L.appendChild(inp); if (it.u) L.appendChild(el('span', '', M(it.u)));
      wrap.appendChild(L); inputs.push(inp);
    });
    const bt = el('button', 'btn', 'Vérifier');
    wrap.appendChild(bt); box.appendChild(wrap);
    function check(){
      if (solved) return;
      const vals = inputs.map(i => parseNum(i.value));
      if (vals.some(v => isNaN(v))){ fb.className = 'fb show info'; fb.innerHTML = 'Écris un nombre (par exemple <b>-2,5</b> ou <b>7/3</b>).'; return; }
      tries++;
      const goods = vals.map((v, k) => near(v, ans[k], it.tol));
      inputs.forEach((inp, k) => { inp.classList.remove('ok', 'ko'); inp.classList.add(goods[k] ? 'ok' : 'ko'); });
      const good = goods.every(Boolean);
      const sol = ans.map((a, k) => (labs[k] ? M(labs[k]) + ' ' : '') + '<b>' + fmtAns(a) + '</b>' + (it.u ? ' ' + M(it.u) : '')).join(' ; ');
      if (good){ inputs.forEach(i => i.disabled = true); bt.disabled = true; showFb(true, it.e ? M(it.e) : ''); finish(true); }
      else if (opts.oneShot || tries >= 3){ inputs.forEach(i => i.disabled = true); bt.disabled = true; showFb(false, `La bonne réponse : ${sol}.` + (it.e ? '<div style="margin-top:6px">' + M(it.e) + '</div>' : '')); finish(false); }
      else showFb(false, tries === 2 ? 'Encore un essai, puis la réponse s’affichera.' : '');
    }
    bt.onclick = check;
    box.check = check;
  }
  box.appendChild(fb);
  return box;
}

/* ---------- Un exercice ---------- */
function renderExo(ex, idx, kind, chap){
  const key = chap.id + '/' + kind + '/' + idx;
  const card = el('div', 'card exo ' + kind + (DONE[key] ? ' isdone' : ''));
  card.innerHTML = `<div class="head"><span class="num">${kind === 'app' ? 'Exercice' : 'Problème'} ${idx + 1}</span>${ex.t ? `<b>${M(ex.t)}</b>` : ''}<span class="done">✔ Réussi</span></div>`;
  if (ex.q) card.appendChild(el('div', 'stmt', M(ex.q)));
  if (ex.fig) card.appendChild(el('div', 'fig', ex.fig));
  const its = ex.it || [];
  let left = its.length;
  const multi = its.length > 1;
  its.forEach((it, k) => {
    const it2 = Object.assign({}, it);
    if (multi && it.p) it2.p = `<b class="l">${k + 1}.</b> ` + it.p;
    card.appendChild(renderItem(it2, () => { left--; if (left === 0){ card.classList.add('isdone'); markDone(key); if (multi){ const m = el('div', 'fb show ok', `<div class="h">${pick(['Exercice terminé, bravo ! 🌟', 'Tout est juste, félicitations ! 🎉', 'Exercice réussi : tu peux être fier·e de toi !'])}</div>`); card.insertBefore(m, tools); } } }));
  });
  const tools = el('div', 'tools');
  if (ex.aide){ const h = el('div', 'hint', '💡 ' + M(ex.aide)); const b = el('button', 'btn soft', '💡 Un indice'); b.onclick = () => h.classList.toggle('show'); tools.appendChild(b); card.appendChild(h); }
  const corrHtml = [its.filter(i => i.e).map(i => (multi ? `<b>${its.indexOf(i) + 1}.</b> ` : '') + i.e).join('<br>'), ex.corr || ''].filter(Boolean).join('<br>');
  const corr = el('div', 'corr', `<div class="lab">Correction détaillée</div>${M(corrHtml)}`);
  const bc = el('button', 'btn ghost', '📖 Voir la correction');
  bc.onclick = () => { corr.classList.toggle('show'); bc.textContent = corr.classList.contains('show') ? '📕 Cacher la correction' : '📖 Voir la correction'; };
  const br = el('button', 'btn soft', '↺ Recommencer');
  br.onclick = () => { const n = renderExo(ex, idx, kind, chap); card.replaceWith(n); };
  tools.appendChild(bc); tools.appendChild(br);
  card.appendChild(tools); card.appendChild(corr);
  return card;
}

/* ---------- Automatismes ---------- */
const RND = {
  i: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  nz: (a, b) => { let v; do { v = a + Math.floor(Math.random() * (b - a + 1)); } while (v === 0); return v; },
  p: a => a[Math.floor(Math.random() * a.length)],
  sh: shuffle,
  s: () => Math.random() < 0.5 ? -1 : 1
};
function makeQ(th){
  const gens = GENS[th]; let q, n = 0;
  do { q = pick(gens)(RND); n++; } while (q.bad && n < 20);
  q.th = th; return q;
}
function pageAutoHub(only){
  const wrap = el('div');
  const t = only && AUTO_THEMES.find(x => x.id === only);
  wrap.innerHTML = `<div class="kicker">Automatismes</div><h1>${t ? t.t : 'Séries mélangées'}</h1><p class="sub">${SITE.autoIntro}</p><div class="cheer">⚡ <span>${pick(['Quelques minutes par jour, et les réflexes s’installent !', 'Vas-y sans stress : on est là pour s’entraîner.', 'Vise la régularité plutôt que la vitesse.'])}</span></div>`;
  if (t){

  } else {
    const card = el('div', 'card', `<h3>Choisis les thèmes</h3><div class="themes">${AUTO_THEMES.map(x => `<label><input type="checkbox" value="${x.id}" checked> ${x.t}</label>`).join('')}</div><div class="tools"></div>`);
    const b = el('button', 'btn', '▶ Lancer une série de 10 questions');
    b.onclick = () => { const ids = [...card.querySelectorAll('input:checked')].map(i => i.value); if (!ids.length) return alert('Coche au moins un thème.'); runSerie(ids); };
    const all = el('button', 'btn soft', 'Tout cocher / décocher'); all.onclick = () => { const bx = card.querySelectorAll('input'); const v = ![...bx].every(i => i.checked); bx.forEach(i => i.checked = v); };
    card.querySelector('.tools').append(b, all); wrap.appendChild(card);
    const rap = el('div', 'card lesson', `<h3>Les rappels, thème par thème</h3>` + AUTO_THEMES.map(x => `<details class="rap"><summary>${x.t}</summary>${M(x.rappel)}</details>`).join(''));
    wrap.appendChild(rap);
  }
  setPage(wrap);
}
function runSerie(ids){
  const N = 10, qs = [];
  for (let k = 0; k < N; k++) qs.push(makeQ(ids[k % ids.length]));
  const order = shuffle(qs), res = [];
  let cur = 0;
  function show(){
    const q = order[cur], thn = AUTO_THEMES.find(x => x.id === q.th).t;
    const card = el('div', 'card');
    card.innerHTML = `<div class="kicker">Question ${cur + 1} / ${N} · ${thn}</div><div class="prog">${order.map((_, k) => `<i class="${k < cur ? (res[k] ? 'ok' : 'ko') : k === cur ? 'cur' : ''}"></i>`).join('')}</div><div class="qbig">${M(q.q)}</div>${q.fig ? `<div class="fig">${q.fig}</div>` : ''}`;
    const it = Object.assign({}, q); delete it.q;
    const next = el('button', 'btn', cur + 1 < N ? 'Question suivante →' : 'Voir mon score'); next.style.display = 'none';
    card.appendChild(renderItem(it, (first, good) => { res[cur] = good; next.style.display = ''; next.focus(); }, { oneShot: true }));
    next.onclick = () => { cur++; cur < N ? show() : end(); };
    const tl = el('div', 'tools'); tl.appendChild(next); card.appendChild(tl);
    const w = el('div'); w.innerHTML = `<div class="kicker">Automatismes</div><h1>Série en cours</h1>`; w.appendChild(card);
    setPage(w);
    const inp = card.querySelector('input'); if (inp) inp.focus();
  }
  function end(){
    const sc = res.filter(Boolean).length;
    const msg = sc === N ? 'Sans faute ! Tu maîtrises, bravo ! 🏆' : sc >= 8 ? 'Très bien ! Encore un petit effort et c’est parfait. 🌟' : sc >= 5 ? 'C’est un bon début ! Relis les rappels et refais une série, tu vas progresser. 💪' : 'Ne te décourage pas : relis les rappels du thème, puis recommence. Chaque série te fait progresser ! 🌱';
    const w = el('div');
    w.innerHTML = `<div class="kicker">Automatismes</div><h1>Ton score</h1><div class="card" style="text-align:center"><div class="big">${sc} / ${N}</div><p><b>${msg}</b></p></div>`;
    const rc = el('div', 'card', `<h3>Récapitulatif</h3><ul class="recap">${order.map((q, k) => `<li class="${res[k] ? '' : 'ko'}">${res[k] ? '✅' : '❌'} ${M(q.q)}<br><small>Réponse : <b>${q.c ? M(q.c[0]) : 'vf' in q ? (q.vf ? 'Vrai' : 'Faux') : (Array.isArray(q.n) ? q.n : [q.n]).map(fmtAns).join(' ; ') + (q.u ? ' ' + M(q.u) : '')}</b>${q.e ? ' — ' + M(q.e) : ''}</small></li>`).join('')}</ul>`);
    const tl = el('div', 'tools');
    const again = el('button', 'btn', '↺ Nouvelle série (mêmes thèmes)'); again.onclick = () => runSerie(ids);
    const back = el('a', 'btn soft', 'Retour aux automatismes'); back.href = '#auto';
    tl.append(again, back); rc.appendChild(tl); w.appendChild(rc);
    setPage(w);
  }
  show();
}

{ t: 'Fonction polynôme du second degré', h: DEF(r`Une fonction <b>polynôme du second degré</b> est définie sur $\R$ par $f(x) = ax^2 + bx + c$ avec $a \ne 0$ (forme <b>développée</b>). Sa courbe est une <b>parabole</b>.`) + PROP(r`<ul><li><b>Forme canonique</b> : $f(x) = a(x - \alpha)^2 + \beta$, avec $\alpha = -\frac{b}{2a}$ et $\beta = f(\alpha)$. Le sommet est $S(\alpha ; \beta)$ ; la droite $x = \alpha$ est axe de symétrie.</li><li>Si $a > 0$, la parabole est « tournée vers le haut » ($f$ décroissante puis croissante, minimum $\beta$) ; si $a < 0$, vers le bas (maximum $\beta$).</li></ul>`) + FIG(P1G) + EXM(r`$f(x) = x^2 - 4x + 3$. Avec $x^2 - 4x = (x - 2)^2 - 4$ (complétion du carré) : $f(x) = (x - 2)^2 - 4 + 3 = (x - 2)^2 - 1$. Sommet $S(2 ; -1)$, minimum $-1$.`) + METH(r`<b>Complétion du carré</b> : $x^2 + 2kx = (x + k)^2 - k^2$. Exemple : $x^2 + 6x = (x + 3)^2 - 9$.`) },
{ t: 'Forme factorisée, racines, signe', h: DEF(r`Une <b>racine</b> de $f$ est un réel $x_0$ tel que $f(x_0) = 0$. Si $f$ a deux racines $x_1$ et $x_2$, alors $f(x) = a(x - x_1)(x - x_2)$ (forme <b>factorisée</b>).`) + PROP(r`<b>Somme et produit</b> : $x_1 + x_2 = -\frac{b}{a}$ et $x_1 x_2 = \frac{c}{a}$.`) + EXM(r`$x^2 - 5x + 6$ : on cherche deux nombres de somme 5 et de produit 6 : 2 et 3. Donc $x^2 - 5x + 6 = (x - 2)(x - 3)$.<br>Racine évidente : pour $2x^2 + x - 3$, $x = 1$ est racine ($2 + 1 - 3 = 0$) ; le produit vaut $\frac{-3}{2}$, donc l'autre racine est $-\frac{3}{2}$.`) + RET(r`Un polynôme du second degré est <b>du signe de $a$ à l'extérieur des racines</b> et du signe contraire entre les racines.`, 'Signe') },
{ t: 'Discriminant et résolution', h: DEF(r`Le <b>discriminant</b> de $ax^2 + bx + c$ est $\Delta = b^2 - 4ac$.`) + PROP(r`<ul><li>Si $\Delta > 0$ : deux racines $x_1 = \frac{-b - \sqrt{\Delta}}{2a}$ et $x_2 = \frac{-b + \sqrt{\Delta}}{2a}$ ; $f(x) = a(x - x_1)(x - x_2)$.</li><li>Si $\Delta = 0$ : une racine double $x_0 = -\frac{b}{2a}$ ; $f(x) = a(x - x_0)^2$.</li><li>Si $\Delta < 0$ : aucune racine réelle ; $f$ ne se factorise pas et garde le signe de $a$.</li></ul>`) + EXM(r`$2x^2 - 3x - 2 = 0$ : $\Delta = 9 + 16 = 25$. $x_1 = \frac{3 - 5}{4} = -\frac{1}{2}$, $x_2 = \frac{3 + 5}{4} = 2$.`) + DEMO(r`$ax^2 + bx + c = a\left[\left(x + \frac{b}{2a}\right)^2 - \frac{\Delta}{4a^2}\right]$. Si $\Delta < 0$, le crochet est strictement positif : pas de solution. Si $\Delta \ge 0$, on écrit $\frac{\Delta}{4a^2} = \left(\frac{\sqrt{\Delta}}{2a}\right)^2$ et l'identité $A^2 - B^2 = (A - B)(A + B)$ donne les racines $\frac{-b \pm \sqrt{\Delta}}{2a}$.`) + ATT(r`Avant de calculer $\Delta$, regarde si une méthode plus rapide marche : facteur commun ($3x^2 - 6x = 3x(x - 2)$), identité remarquable, racine évidente, ou $b = 0$ ($x^2 = k$).`) },
{ t: 'Inéquations du second degré', h: METH(r`Pour résoudre $ax^2 + bx + c > 0$ : on cherche les racines, puis on utilise la règle du signe.`) + EXM(r`$-x^2 + x + 6 \ge 0$. $\Delta = 1 + 24 = 25$, racines $\frac{-1 \pm 5}{-2}$ : $-2$ et $3$. $a = -1 < 0$ : positif entre les racines.`) + FIG(signTab({ x: ['−∞', '−2', '3', '+∞'], rows: [{ l: '−x² + x + 6', s: ['', '−', '0', '+', '0', '−', ''] }] })) + r`<p>$S = [-2 ; 3]$.</p>` }
],

CH({ id: 'suites', th: 'Algèbre', t: 'Suites numériques : généralités',
intro: r`Définir une suite (formule explicite, récurrence, motif), calculer des termes, la représenter, étudier son sens de variation et conjecturer sa limite.`,
cours: [
{ t: 'Qu\'est-ce qu\'une suite ?', h: DEF(r`Une <b>suite</b> $(u_n)$ associe à chaque entier naturel $n$ un réel $u_n$, appelé <b>terme de rang $n$</b>. On note aussi $u(n)$.`) + PROP(r`<ul><li><b>Formule explicite</b> : $u_n = f(n)$. Exemple : $u_n = n^2 + 1$ ; on calcule directement $u_{10} = 101$.</li><li><b>Relation de récurrence</b> : on donne le premier terme et une relation $u_{n + 1} = f(u_n)$. Exemple : $u_0 = 3$ et $u_{n + 1} = 2u_n - 1$ ; alors $u_1 = 5$, $u_2 = 9$, $u_3 = 17$… Pour calculer $u_{10}$, il faut tous les termes précédents.</li></ul>`, 'Deux façons de définir une suite') + ATT(r`Ne confonds pas $u_{n + 1}$ (le terme suivant) et $u_n + 1$ (le terme plus 1).`) },
{ t: 'Suites et motifs', h: EXM(r`On construit des carrés avec des allumettes alignés : 1 carré = 4 allumettes, 2 carrés = 7, 3 carrés = 10… Chaque nouveau carré ajoute 3 allumettes : $u_{n + 1} = u_n + 3$ avec $u_1 = 4$, et $u_n = 3n + 1$.`) + METH(r`Pour trouver une formule, on calcule les premiers termes, on cherche ce qui se répète (on ajoute toujours la même chose ? on multiplie ?), puis on vérifie la formule sur plusieurs termes.`) },
{ t: 'Représentation graphique', h: r`<p>On représente une suite par le <b>nuage de points</b> de coordonnées $(n ; u_n)$ (points isolés, qu'on ne relie pas).</p>` + FIG(graph({ x: [-0.5, 7], y: [-0.5, 7], u: 34, pts: [0, 1, 2, 3, 4, 5, 6].map(n => ({ x: n, y: 6 / (n + 1) + 0.2 * n, c: COL.b })), xl: 'n', yl: 'uₙ' })) },
{ t: 'Sens de variation', h: DEF(r`La suite $(u_n)$ est <b>croissante</b> si $u_{n + 1} \ge u_n$ pour tout $n$ ; <b>décroissante</b> si $u_{n + 1} \le u_n$ pour tout $n$.`) + METH(r`<ul><li>On étudie le signe de $u_{n + 1} - u_n$.</li><li>Si $u_n = f(n)$ et $f$ est monotone sur $[0 ; +\infty[$, la suite a le même sens de variation.</li><li>Si tous les termes sont strictement positifs, on peut comparer $\frac{u_{n + 1}}{u_n}$ à 1.</li></ul>`) + EXM(r`$u_n = n^2 - 3n$ : $u_{n + 1} - u_n = (n + 1)^2 - 3(n + 1) - n^2 + 3n = 2n - 2$, positif pour $n \ge 1$ : la suite est croissante à partir du rang 1.`) },
{ t: 'Notion de limite (intuitive)', h: DEF(r`<ul><li>Si les termes $u_n$ deviennent aussi grands qu'on veut quand $n$ devient grand, on dit que la suite <b>tend vers $+\infty$</b>.</li><li>Si les termes se rapprochent autant qu'on veut d'un réel $\ell$, on dit que la suite <b>converge vers $\ell$</b>.</li><li>Certaines suites n'ont pas de limite, comme $u_n = (-1)^n$ qui alterne entre $1$ et $-1$.</li></ul>`) + EXM(r`$u_n = \frac{1}{n + 1}$ : $u_{99} = 0,01$, $u_{999} = 0,001$ : la suite semble converger vers 0. $v_n = n^2$ tend vers $+\infty$.`) + METH(r`Un <b>algorithme de seuil</b> cherche le premier rang $n$ à partir duquel $u_n$ dépasse une valeur :` + PY(`
u = 3
n = 0
while u <= 1000:
    u = 2*u - 1
    n = n + 1
print(n)   # premier rang où u dépasse 1000`)) }
],

{ t: 'Suite de Syracuse', q: r`On part d'un entier $u_0$ ; si $u_n$ est pair, $u_{n + 1} = \frac{u_n}{2}$, sinon $u_{n + 1} = 3u_n + 1$.` + PY(`
def syracuse(u0, n):
    L = [u0]
    u = u0
    for i in range(n):
        if u % 2 == 0:
            u = u // 2
        else:
            u = 3*u + 1
        L.append(u)
    return L`), it: [

cours: [
{ t: 'Taux de variation', h: DEF(r`Le <b>taux de variation</b> de $f$ entre $a$ et $a + h$ ($h \ne 0$) est $\frac{f(a + h) - f(a)}{h}$. C'est la <b>pente de la sécante</b> passant par les points d'abscisses $a$ et $a + h$.`) + EXM(r`$f(x) = x^2$, $a = 1$ : $\frac{(1 + h)^2 - 1}{h} = \frac{2h + h^2}{h} = 2 + h$.`) + RET(r`En physique, le taux de variation de la position est une <b>vitesse moyenne</b>.`, 'Interprétation') },
{ t: 'Nombre dérivé', h: DEF(r`Si le taux de variation $\frac{f(a + h) - f(a)}{h}$ se rapproche d'un nombre réel $\ell$ quand $h$ se rapproche de 0, on dit que $f$ est <b>dérivable en $a$</b> et que $\ell$ est le <b>nombre dérivé</b> de $f$ en $a$, noté $f'(a)$. On écrit $f'(a) = \lim_{h \to 0} \frac{f(a + h) - f(a)}{h}$.`) + EXM(r`Pour $f(x) = x^2$ en $a = 1$ : le taux vaut $2 + h$, qui tend vers 2 quand $h$ tend vers 0. Donc $f'(1) = 2$.`) + RET(r`$f'(a)$ s'interprète comme une <b>vitesse instantanée</b>, un <b>coût marginal</b>… et graphiquement comme la pente de la tangente.`, 'Interprétation') },
{ t: 'Tangente à une courbe', h: FIG(D4G) + DEF(r`La <b>tangente</b> à $C_f$ au point $A(a ; f(a))$ est la droite passant par $A$ de pente $f'(a)$ : c'est la position limite des sécantes $(AM)$ quand $M$ se rapproche de $A$.`) + PROP(r`L'équation de la tangente au point d'abscisse $a$ est : $y = f'(a)(x - a) + f(a)$.`) + EXM(r`Sur la figure, $f(x) = \frac{1}{2}x^2 - x$ et $A$ a pour abscisse 3 : $f(3) = 1,5$ et $f'(3) = 2$. Tangente : $y = 2(x - 3) + 1,5 = 2x - 4,5$.`) + DEMO(r`La tangente est une droite de pente $f'(a)$ : son équation est $y = f'(a)x + p$. Elle passe par $A(a ; f(a))$, donc $f(a) = f'(a)a + p$, soit $p = f(a) - f'(a)a$. D'où $y = f'(a)x + f(a) - f'(a)a = f'(a)(x - a) + f(a)$.`) + METH(r`<b>Lire $f'(a)$ sur un graphique</b> : c'est le coefficient directeur de la tangente au point d'abscisse $a$ ($\frac{\text{déplacement vertical}}{\text{déplacement horizontal}}$ entre deux points de la tangente).`) },
{ t: 'Approximation affine', h: PROP(r`Pour $h$ proche de 0 : $f(a + h) \approx f(a) + f'(a)h$. Près du point de contact, la courbe se confond presque avec sa tangente.`) + EXM(r`$f(x) = \sqrt{x}$, $f(4) = 2$ et $f'(4) = \frac{1}{4}$. Donc $\sqrt{4,1} \approx 2 + \frac{1}{4} \times 0,1 = 2,025$ (valeur réelle : $2,0248\ldots$).`) + ATT(r`Une fonction n'est pas toujours dérivable : la fonction racine carrée n'est pas dérivable en 0 (son taux $\frac{\sqrt{h}}{h} = \frac{1}{\sqrt{h}}$ devient infiniment grand), et la valeur absolue n'est pas dérivable en 0 (le taux vaut 1 si $h > 0$ et $-1$ si $h < 0$).`) }

{ t: 'Définition', h: DEF(r`Il existe une unique fonction $f$ dérivable sur $\R$ telle que $f' = f$ et $f(0) = 1$ (on l'admet). On l'appelle <b>fonction exponentielle</b> et on la note $\exp$.<br>Ainsi : $\exp(0) = 1$ et, pour tout réel $x$, $\exp'(x) = \exp(x)$.`) + RET(r`Le nombre $e = \exp(1) \approx 2,718$ s'appelle le <b>nombre d'Euler</b>. On note $\exp(x) = e^x$ : par exemple $e^0 = 1$ et $e^1 = e$.`, 'Notation') },
{ t: 'Propriétés algébriques', h: PROP(r`Pour tous réels $a$ et $b$ et tout entier $n$ :<ul><li>$e^{a + b} = e^a \times e^b$</li><li>$e^{-a} = \frac{1}{e^a}$</li><li>$e^{a - b} = \frac{e^a}{e^b}$</li><li>$(e^a)^n = e^{na}$</li></ul>Ce sont les mêmes règles que pour les puissances !`) + DEMO(r`<b>La fonction exponentielle ne s'annule pas et $e^{-x} = \frac{1}{e^x}$.</b><br>Soit $g(x) = e^x \times e^{-x}$. Avec la dérivée d'un produit (et $(e^{-x})' = -e^{-x}$) : $g'(x) = e^x e^{-x} - e^x e^{-x} = 0$. Donc $g$ est constante, égale à $g(0) = 1 \times 1 = 1$.<br>Ainsi $e^x \times e^{-x} = 1$ pour tout $x$ : $e^x$ ne peut pas valoir 0, et $e^{-x} = \frac{1}{e^x}$.`) + EXM(r`$e^3 \times e^{-5} = e^{-2}$ ; $\frac{e^{7}}{e^{2}} = e^{5}$ ; $(e^{2})^{3} = e^{6}$ ; $e^{2x} \times e^{1 - x} = e^{x + 1}$.`) },
{ t: 'Signe, variations, courbe', h: PROP(r`<ul><li>Pour tout réel $x$, $e^x > 0$.</li><li>La fonction exponentielle est <b>strictement croissante</b> sur $\R$ (car sa dérivée $e^x$ est strictement positive).</li><li>La tangente à la courbe au point d'abscisse 0 a pour équation $y = x + 1$.</li></ul>`) + DEMO(r`$e^x = e^{\frac{x}{2} + \frac{x}{2}} = \left(e^{\frac{x}{2}}\right)^2 \ge 0$, et $e^x \ne 0$, donc $e^x > 0$.`) + FIG(E7G) + PROP(r`Comme $\exp$ est strictement croissante : $e^a = e^b \iff a = b$ et $e^a < e^b \iff a < b$.`, 'Conséquence') + EXM(r`$e^{2x - 1} = e^{3} \iff 2x - 1 = 3 \iff x = 2$.<br>$e^{-x} > e^{4} \iff -x > 4 \iff x < -4$.`) },
{ t: 'Fonctions $x \mapsto e^{ax + b}$', h: PROP(r`La fonction $x \mapsto e^{ax + b}$ est dérivable sur $\R$ et sa dérivée est $x \mapsto a\,e^{ax + b}$.`) + EXM(r`$f(x) = e^{-3x + 2}$ : $f'(x) = -3e^{-3x + 2}$.<br>$g(x) = x e^{x}$ : $g'(x) = 1 \times e^x + x e^x = (x + 1)e^x$.`) + PROP(r`Pour $k$ réel, la fonction $t \mapsto e^{kt}$ est strictement croissante si $k > 0$ et strictement décroissante si $k < 0$ (sa dérivée $ke^{kt}$ a le signe de $k$).`) + FIG(E7K) + METH(r`Pour étudier le signe d'une expression comme $(x - 2)e^x$, on retient que $e^x > 0$ : elle a donc le même signe que $x - 2$.`) },
{ t: 'Lien avec les suites géométriques', h: PROP(r`Pour un réel $a$, la suite $u_n = e^{na}$ est géométrique de raison $e^a$ : en effet $u_{n + 1} = e^{(n + 1)a} = e^{na} \times e^{a} = e^a \times u_n$.`) + RET(r`Une grandeur qui évolue à taux constant est modélisée en temps discret par une suite géométrique, et en temps continu par une fonction $t \mapsto C e^{kt}$ : croissance ($k > 0$) ou décroissance ($k < 0$) <b>exponentielle</b>. On la rencontre en biologie (population de bactéries), en physique (radioactivité, décharge d'un condensateur), en médecine (élimination d'un médicament)…`, 'Modélisation') }
],

const PI = Math.PI;
const T8M = [0, PI / 6, PI / 4, PI / 3, PI / 2, 2 * PI / 3, 3 * PI / 4, 5 * PI / 6, PI, 7 * PI / 6, 5 * PI / 4, 4 * PI / 3, 3 * PI / 2, 5 * PI / 3, 7 * PI / 4, 11 * PI / 6];
CH({ id: 'trigo', th: 'Analyse', t: 'Trigonométrie',
intro: r`Cercle trigonométrique, radian, enroulement de la droite des réels, cosinus et sinus d'un réel, valeurs remarquables et angles associés.`,
cours: [
{ t: 'Cercle trigonométrique et radian', h: DEF(r`Dans un repère orthonormé $(O ; I, J)$, le <b>cercle trigonométrique</b> est le cercle de centre $O$ et de rayon 1, parcouru dans le <b>sens direct</b> (le sens inverse des aiguilles d'une montre).`) + DEF(r`Le <b>radian</b> est l'unité de mesure d'angle telle qu'un angle de 1 radian intercepte, sur le cercle trigonométrique, un arc de longueur 1. Le cercle entier mesure $2\pi$ : <b>$\pi$ radians correspondent à 180°</b>.`) + TAB([['Degrés', '0°', '30°', '45°', '60°', '90°', '180°', '360°'], ['Radians', '$0$', '$\\frac{\\pi}{6}$', '$\\frac{\\pi}{4}$', '$\\frac{\\pi}{3}$', '$\\frac{\\pi}{2}$', '$\\pi$', '$2\\pi$']]) + METH(r`Les mesures sont proportionnelles : pour convertir des degrés en radians, on multiplie par $\frac{\pi}{180}$ ; dans l'autre sens, par $\frac{180}{\pi}$.<br>Exemple : $150° = 150 \times \frac{\pi}{180} = \frac{5\pi}{6}$ rad.`) + PROP(r`Sur un cercle de rayon $R$, un arc d'angle $\alpha$ radians a pour longueur $\ell = R\alpha$.`, 'Longueur d\'arc') },
{ t: 'Enroulement de la droite des réels', h: PROP(r`On « enroule » la droite des réels autour du cercle trigonométrique, en partant du point $I$ : les réels positifs dans le sens direct, les négatifs dans le sens indirect. À chaque réel $x$ correspond ainsi un unique point $M$ du cercle, appelé <b>image</b> de $x$.`) + PROP(r`Comme le cercle mesure $2\pi$, les réels $x$ et $x + 2k\pi$ ($k$ entier) ont la <b>même image</b>.`) + EXM(r`$\frac{13\pi}{6} = \frac{\pi}{6} + 2\pi$ a la même image que $\frac{\pi}{6}$.<br>$-\frac{\pi}{2}$ a pour image le point de coordonnées $(0 ; -1)$, comme $\frac{3\pi}{2}$.`) + METH(r`Pour placer $\frac{a\pi}{b}$, on se ramène entre $-\pi$ et $\pi$ en ajoutant ou retirant des multiples de $2\pi$, puis on compte en parts de $\frac{\pi}{b}$ (demi-cercle découpé en $b$ parts).`) },
{ t: 'Cosinus et sinus d\'un réel', h: FIG(trig([{ a: PI / 3, l: 'M', c: COL.r }], { proj: 1 })) + DEF(r`Si $M$ est l'image du réel $x$ sur le cercle trigonométrique, alors :<ul><li>le <b>cosinus</b> de $x$, noté $\cos x$, est l'abscisse de $M$ ;</li><li>le <b>sinus</b> de $x$, noté $\sin x$, est l'ordonnée de $M$.</li></ul>`) + PROP(r`Pour tout réel $x$ et tout entier $k$ :<ul><li>$-1 \le \cos x \le 1$ et $-1 \le \sin x \le 1$ ;</li><li>$\cos^2 x + \sin^2 x = 1$ (théorème de Pythagore dans le triangle $OHM$) ;</li><li>$\cos(x + 2k\pi) = \cos x$ et $\sin(x + 2k\pi) = \sin x$.</li></ul>`) + RET(r`Si $0 < x < \frac{\pi}{2}$, le triangle $OHM$ est rectangle en $H$ et son hypoténuse mesure $OM = 1$. On retrouve le cosinus et le sinus du collège : $\cos x = \frac{OH}{OM} = OH$ et $\sin x = \frac{HM}{OM} = HM$.`, 'Lien avec le triangle rectangle') },
{ t: 'Valeurs remarquables', h: TAB([['$x$', '$0$', '$\\frac{\\pi}{6}$', '$\\frac{\\pi}{4}$', '$\\frac{\\pi}{3}$', '$\\frac{\\pi}{2}$', '$\\pi$'], ['$\\cos x$', '$1$', '$\\frac{\\sqrt{3}}{2}$', '$\\frac{\\sqrt{2}}{2}$', '$\\frac{1}{2}$', '$0$', '$-1$'], ['$\\sin x$', '$0$', '$\\frac{1}{2}$', '$\\frac{\\sqrt{2}}{2}$', '$\\frac{\\sqrt{3}}{2}$', '$1$', '$0$']]) + DEMO(r`<b>Cas $\frac{\pi}{4}$</b> : soit $M$ l'image de $\frac{\pi}{4}$ et $H$ son projeté sur $(OI)$. Le triangle $OHM$ est rectangle en $H$ avec un angle de 45°, donc il est isocèle : $OH = HM = c$. Par Pythagore, $c^2 + c^2 = 1$, donc $c^2 = \frac{1}{2}$ et $c = \frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2}$. Ainsi $\cos \frac{\pi}{4} = \sin \frac{\pi}{4} = \frac{\sqrt{2}}{2}$.<br><b>Cas $\frac{\pi}{3}$</b> : soit $M$ l'image de $\frac{\pi}{3}$. Le triangle $OIM$ a $OI = OM = 1$ et un angle de 60° en $O$ : il est équilatéral. Le pied $H$ de la hauteur issue de $M$ est donc le milieu de $[OI]$ : $\cos \frac{\pi}{3} = OH = \frac{1}{2}$. Puis $\sin^2 \frac{\pi}{3} = 1 - \frac{1}{4} = \frac{3}{4}$ et, comme le sinus est positif, $\sin \frac{\pi}{3} = \frac{\sqrt{3}}{2}$.`) + METH(r`Astuce pour retenir : les sinus de $0, \frac{\pi}{6}, \frac{\pi}{4}, \frac{\pi}{3}, \frac{\pi}{2}$ valent $\frac{\sqrt{0}}{2}, \frac{\sqrt{1}}{2}, \frac{\sqrt{2}}{2}, \frac{\sqrt{3}}{2}, \frac{\sqrt{4}}{2}$ ; les cosinus, c'est dans l'ordre inverse.`) },
{ t: 'Angles associés', h: FIG(trig([{ a: PI / 6, l: 'x', c: COL.r }, { a: 5 * PI / 6, l: 'π − x', c: COL.g }, { a: -PI / 6, l: '−x', c: COL.b }, { a: 7 * PI / 6, l: 'π + x', c: COL.o }], { proj: 1 })) + PROP(r`Par symétrie sur le cercle :<ul><li>$-x$ (symétrique par rapport à l'axe des abscisses) : $\cos(-x) = \cos x$ et $\sin(-x) = -\sin x$ ;</li><li>$\pi - x$ (symétrique par rapport à l'axe des ordonnées) : $\cos(\pi - x) = -\cos x$ et $\sin(\pi - x) = \sin x$ ;</li><li>$\pi + x$ (symétrique par rapport à $O$) : $\cos(\pi + x) = -\cos x$ et $\sin(\pi + x) = -\sin x$.</li></ul>`) + EXM(r`$\frac{5\pi}{6} = \pi - \frac{\pi}{6}$, donc $\cos \frac{5\pi}{6} = -\frac{\sqrt{3}}{2}$ et $\sin \frac{5\pi}{6} = \frac{1}{2}$.<br>$\frac{4\pi}{3} = \pi + \frac{\pi}{3}$, donc $\cos \frac{4\pi}{3} = -\frac{1}{2}$ et $\sin \frac{4\pi}{3} = -\frac{\sqrt{3}}{2}$.`) + METH(r`Le plus sûr : <b>placer le point sur le cercle</b>, repérer l'angle remarquable associé, puis lire les signes du cosinus (gauche ou droite) et du sinus (haut ou bas).`) }
],

CH({ id: 'scalaire', th: 'Géométrie', t: 'Produit scalaire',
intro: r`Un nouvel outil pour calculer des longueurs, des angles et démontrer des orthogonalités : projection, cosinus, normes, coordonnées, formule d'Al-Kashi.`,
cours: [
{ t: 'Définition par la projection orthogonale', h: DEF(r`Soient $\vec{u} = \vec{AB}$ et $\vec{v} = \vec{AC}$ non nuls, et $H$ le projeté orthogonal de $C$ sur la droite $(AB)$. Le <b>produit scalaire</b> de $\vec{u}$ et $\vec{v}$ est le <b>nombre réel</b> :<ul><li>$\vec{AB} \cdot \vec{AC} = AB \times AH$ si $\vec{AB}$ et $\vec{AH}$ ont le même sens ;</li><li>$\vec{AB} \cdot \vec{AC} = -AB \times AH$ s'ils sont de sens contraires.</li></ul>Si l'un des vecteurs est nul, le produit scalaire vaut 0.`) + FIG(PS9A + ' ' + PS9B) + EXM(r`À gauche, $AB = 5$ et $AH = 3,2$ : $\vec{AB} \cdot \vec{AC} = 5 \times 3,2 = 16$. À droite, $H$ est « de l'autre côté » : $\vec{AB} \cdot \vec{AC} = -3 \times 1,8 = -5,4$.`) + ATT(r`Le produit scalaire de deux vecteurs est un <b>nombre</b>, pas un vecteur !`) },
{ t: 'Formule avec le cosinus', h: PROP(r`Pour $\vec{u}$ et $\vec{v}$ non nuls : $\vec{u} \cdot \vec{v} = \norm{\vec{u}} \times \norm{\vec{v}} \times \cos(\vec{u}, \vec{v})$.<br>Avec des points : $\vec{AB} \cdot \vec{AC} = AB \times AC \times \cos \widehat{BAC}$.`) + DEMO(r`Si l'angle $\widehat{BAC}$ est aigu, dans le triangle $AHC$ rectangle en $H$ : $AH = AC \cos \widehat{BAC}$, donc $AB \times AH = AB \times AC \times \cos \widehat{BAC}$. Si l'angle est obtus, $AH = AC \cos(\pi - \widehat{BAC}) = -AC\cos\widehat{BAC}$ et on retrouve la même formule.`) + EXM(r`$AB = 4$, $AC = 3$ et $\widehat{BAC} = 60°$ : $\vec{AB} \cdot \vec{AC} = 4 \times 3 \times \frac{1}{2} = 6$.`) + PROP(r`<ul><li>$\vec{u} \cdot \vec{u} = \norm{\vec{u}}^2$ (le <b>carré scalaire</b>) ; en particulier $\vec{AB} \cdot \vec{AB} = AB^2$.</li><li>$\vec{u} \cdot \vec{v} = 0 \iff \vec{u}$ et $\vec{v}$ sont <b>orthogonaux</b> (le vecteur nul est orthogonal à tout vecteur).</li><li>Si l'angle est aigu, le produit scalaire est positif ; s'il est obtus, il est négatif.</li></ul>`) },
{ t: 'Propriétés de calcul', h: PROP(r`Pour tous vecteurs $\vec{u}$, $\vec{v}$, $\vec{w}$ et tout réel $k$ :<ul><li><b>Symétrie</b> : $\vec{u} \cdot \vec{v} = \vec{v} \cdot \vec{u}$ ;</li><li><b>Bilinéarité</b> : $\vec{u} \cdot (\vec{v} + \vec{w}) = \vec{u} \cdot \vec{v} + \vec{u} \cdot \vec{w}$ et $(k\vec{u}) \cdot \vec{v} = k(\vec{u} \cdot \vec{v})$.</li></ul>`) + PROP(r`<ul><li>$\norm{\vec{u} + \vec{v}}^2 = \norm{\vec{u}}^2 + 2\vec{u} \cdot \vec{v} + \norm{\vec{v}}^2$</li><li>$\norm{\vec{u} - \vec{v}}^2 = \norm{\vec{u}}^2 - 2\vec{u} \cdot \vec{v} + \norm{\vec{v}}^2$</li><li>$(\vec{u} + \vec{v}) \cdot (\vec{u} - \vec{v}) = \norm{\vec{u}}^2 - \norm{\vec{v}}^2$</li></ul>On en déduit une formule avec les normes : $\vec{u} \cdot \vec{v} = \frac{1}{2}\left(\norm{\vec{u} + \vec{v}}^2 - \norm{\vec{u}}^2 - \norm{\vec{v}}^2\right)$.`, 'Comme des identités remarquables') + EXM(r`Si $\norm{\vec{u}} = 2$, $\norm{\vec{v}} = 3$ et $\norm{\vec{u} + \vec{v}} = 4$ : $\vec{u} \cdot \vec{v} = \frac{1}{2}(16 - 4 - 9) = 1,5$.`) },
{ t: 'Avec les coordonnées', h: PROP(r`Dans une base orthonormée $(\vec{i}, \vec{j})$, si $\vec{u}\col{x}{y}$ et $\vec{v}\col{x'}{y'}$ :<ul><li>$\vec{u} \cdot \vec{v} = xx' + yy'$ ;</li><li>$\norm{\vec{u}} = \sqrt{x^2 + y^2}$ ;</li><li>$\vec{u}$ et $\vec{v}$ sont orthogonaux $\iff xx' + yy' = 0$ ;</li><li>les coordonnées s'obtiennent par produit scalaire : $x = \vec{u} \cdot \vec{i}$ et $y = \vec{u} \cdot \vec{j}$.</li></ul>`) + DEMO(r`$\vec{u} = x\vec{i} + y\vec{j}$ et $\vec{v} = x'\vec{i} + y'\vec{j}$. La base est orthonormée : $\vec{i} \cdot \vec{i} = \vec{j} \cdot \vec{j} = 1$ et $\vec{i} \cdot \vec{j} = 0$. Par bilinéarité : $\vec{u} \cdot \vec{v} = xx'\,\vec{i} \cdot \vec{i} + xy'\,\vec{i} \cdot \vec{j} + yx'\,\vec{j} \cdot \vec{i} + yy'\,\vec{j} \cdot \vec{j} = xx' + yy'$.`) + EXM(r`$\vec{u}\col{3}{-2}$ et $\vec{v}\col{4}{6}$ : $\vec{u} \cdot \vec{v} = 12 - 12 = 0$, les vecteurs sont orthogonaux.`) + METH(r`<b>Choisir sa méthode</b> : une figure avec un angle droit → projection ; une longueur et un angle → cosinus ; trois longueurs → normes ; un repère → coordonnées.`) },
{ t: 'Formule d\'Al-Kashi', h: FIG(fig({ s: 50, pts: { A: [0, 0], B: [5, 0], C: [1.6, 3] }, segs: [['A', 'B'], ['B', 'C', COL.r], ['C', 'A']], txt: [[2.5, -0.45, 'c'], [3.55, 1.75, 'a', COL.r], [0.55, 1.65, 'b'], [0.75, 0.32, 'Â', COL.g]] })) + PROP(r`Dans un triangle $ABC$, avec $a = BC$, $b = AC$, $c = AB$ : $a^2 = b^2 + c^2 - 2bc\cos \widehat{A}$.`, 'Théorème d\'Al-Kashi') + DEMO(r`$\vec{BC} = \vec{AC} - \vec{AB}$, donc $BC^2 = \norm{\vec{AC} - \vec{AB}}^2 = AC^2 - 2\vec{AC} \cdot \vec{AB} + AB^2 = b^2 + c^2 - 2bc\cos \widehat{A}$.`) + RET(r`Si $\widehat{A} = 90°$, $\cos \widehat{A} = 0$ : on retrouve le théorème de Pythagore. Al-Kashi le généralise à tous les triangles.`) + EXM(r`$AB = 5$, $AC = 8$ et $\widehat{A} = 60°$ : $BC^2 = 64 + 25 - 2 \times 8 \times 5 \times \frac{1}{2} = 49$, donc $BC = 7$.`) },

],

{ t: 'Vecteur normal à une droite', h: DEF(r`Un <b>vecteur normal</b> à une droite $d$ est un vecteur non nul orthogonal à un vecteur directeur de $d$.`) + PROP(r`<ul><li>La droite d'équation $ax + by + c = 0$ admet $\vec{n}\col{a}{b}$ comme vecteur normal (et $\vec{u}\col{-b}{a}$ comme vecteur directeur).</li><li>Réciproquement, une droite de vecteur normal $\vec{n}\col{a}{b}$ a une équation de la forme $ax + by + c = 0$.</li></ul>`) + DEMO(r`Soit $A(x_A ; y_A)$ un point de $d$ et $\vec{n}\col{a}{b}$ un vecteur normal. Un point $M(x ; y)$ est sur $d$ si et seulement si $\vec{AM}$ est orthogonal à $\vec{n}$, c'est-à-dire $\vec{AM} \cdot \vec{n} = 0$, soit $a(x - x_A) + b(y - y_A) = 0$. C'est bien une équation de la forme $ax + by + c = 0$ avec $c = -ax_A - by_A$.`) + EXM(r`Droite passant par $A(2 ; -1)$ de vecteur normal $\vec{n}\col{3}{4}$ : $3(x - 2) + 4(y + 1) = 0$, soit $3x + 4y - 2 = 0$.`) + PROP(r`Deux droites sont <b>perpendiculaires</b> si et seulement si leurs vecteurs normaux sont orthogonaux.`) },
{ t: 'Projeté orthogonal d\'un point sur une droite', h: DEF(r`Le <b>projeté orthogonal</b> d'un point $A$ sur une droite $d$ est le point $H$ de $d$ tel que $(AH)$ est perpendiculaire à $d$. La longueur $AH$ est la <b>distance</b> du point $A$ à la droite $d$ : c'est la plus courte distance entre $A$ et un point de $d$.`) + FIG(GR10P) + METH(r`<ol><li>On trouve un vecteur normal $\vec{n}$ de $d$ : il dirige la droite $(AH)$.</li><li>Les points de $(AH)$ s'écrivent $M = A + t\vec{n}$, c'est-à-dire $(x_A + ta ; y_A + tb)$.</li><li>On remplace dans l'équation de $d$ pour trouver $t$, puis on en déduit $H$.</li></ol>`) + EXM(r`$A(5 ; 5)$ et $d : x + 2y - 5 = 0$, donc $\vec{n}\col{1}{2}$. Les points de $(AH)$ sont $(5 + t ; 5 + 2t)$. On remplace : $5 + t + 2(5 + 2t) - 5 = 0 \iff 5t + 10 = 0 \iff t = -2$. Donc $H(3 ; 1)$.<br>Vérification : $3 + 2 - 5 = 0$ ✓. Distance : $AH = \sqrt{4 + 16} = \sqrt{20} = 2\sqrt{5}$.`) },
{ t: 'Équation d\'un cercle', h: FIG(GR10C) + PROP(r`Le cercle de centre $\Omega(a ; b)$ et de rayon $r$ a pour équation : $(x - a)^2 + (y - b)^2 = r^2$.`) + DEMO(r`$M(x ; y)$ est sur le cercle $\iff \Omega M = r \iff \Omega M^2 = r^2 \iff (x - a)^2 + (y - b)^2 = r^2$ (car les longueurs sont positives).`) + EXM(r`Cercle de centre $\Omega(2 ; 1)$ et de rayon 2 : $(x - 2)^2 + (y - 1)^2 = 4$.`) + METH(r`<b>Reconnaître un cercle</b> : on regroupe les termes en $x$ et en $y$, puis on utilise la forme canonique : $x^2 - 2ax = (x - a)^2 - a^2$.<br>Exemple : $x^2 + y^2 - 4x + 6y - 3 = 0 \iff (x - 2)^2 - 4 + (y + 3)^2 - 9 - 3 = 0 \iff (x - 2)^2 + (y + 3)^2 = 16$. C'est le cercle de centre $(2 ; -3)$ et de rayon 4.`) + ATT(r`Si on obtient $(x - a)^2 + (y - b)^2 = k$ avec $k < 0$, aucun point ne convient ; si $k = 0$, seul le point $(a ; b)$ convient.`) + RET(r`Le cercle de diamètre $[AB]$ est l'ensemble des points $M$ tels que $\vec{MA} \cdot \vec{MB} = 0$ : cela donne directement son équation.`) }
],

CH({ id: 'condind', th: 'Probabilités', t: 'Probabilités conditionnelles et indépendance',
intro: r`Rappels sur les probabilités conditionnelles, formule des probabilités totales, indépendance, succession d'épreuves indépendantes et répétition d'épreuves de Bernoulli.`,
cours: [
{ t: 'Rappels : probabilités conditionnelles', h: RET(r`Si $P(A) \ne 0$, la probabilité de $B$ sachant $A$ est $P_A(B) = \frac{P(A \cap B)}{P(A)}$. Donc $P(A \cap B) = P(A) \times P_A(B)$.`, 'Définition') + RET(r`<ul><li>La somme des probabilités des branches issues d'un même nœud vaut 1.</li><li>La probabilité d'un chemin est le produit des probabilités de ses branches.</li><li>Sur les branches du deuxième niveau, on lit des probabilités conditionnelles : $P_A(B)$, $P_{\overline{A}}(B)$…</li></ul>`, 'Règles des arbres pondérés') + ATT(r`Ne confonds pas $P(A \cap B)$ (« $A$ et $B$ »), $P_A(B)$ (« $B$ sachant $A$ ») et $P_B(A)$ (« $A$ sachant $B$ »).`) },
{ t: 'Formule des probabilités totales', h: DEF(r`Des événements $A_1$, $A_2$, …, $A_n$ forment une <b>partition</b> de l'univers $\Omega$ s'ils sont de probabilités non nulles, deux à deux incompatibles, et si leur réunion est $\Omega$. Exemple : $A$ et $\overline{A}$.`) + PROP(r`Si $A_1, \ldots, A_n$ forment une partition de $\Omega$, alors pour tout événement $B$ :<br>$P(B) = P(A_1 \cap B) + P(A_2 \cap B) + \ldots + P(A_n \cap B)$.<br>En particulier : $P(B) = P(A) \times P_A(B) + P(\overline{A}) \times P_{\overline{A}}(B)$.`, 'Formule des probabilités totales') + FIG(P11T) + EXM(r`Une maladie touche 2 % d'une population. Un test est positif chez 95 % des malades et chez 3 % des personnes saines. On note $M$ « être malade » et $T$ « test positif ».<br>$P(T) = P(M \cap T) + P(\overline{M} \cap T) = 0,02 \times 0,95 + 0,98 \times 0,03 = 0,019 + 0,0294 = 0,0484$.<br>Sachant que le test est positif, la probabilité d'être malade est $P_T(M) = \frac{0,019}{0,0484} \approx 0,39$ : moins d'une chance sur deux !`) + METH(r`Pour trouver une probabilité « de deuxième niveau » ($P(T)$), on additionne les probabilités de <b>tous les chemins</b> qui mènent à $T$. Pour « remonter » l'arbre ($P_T(M)$), on revient à la définition : $\frac{P(T \cap M)}{P(T)}$.`) },
{ t: 'Indépendance de deux événements', h: DEF(r`Deux événements $A$ et $B$ sont <b>indépendants</b> si $P(A \cap B) = P(A) \times P(B)$.<br>Si $P(A) \ne 0$, cela revient à dire que $P_A(B) = P(B)$ : savoir que $A$ est réalisé ne change pas la probabilité de $B$.`) + PROP(r`Si $A$ et $B$ sont indépendants, alors $\overline{A}$ et $B$ le sont aussi.`) + DEMO(r`$A \cap B$ et $\overline{A} \cap B$ forment une partition de $B$, donc $P(\overline{A} \cap B) = P(B) - P(A \cap B) = P(B) - P(A)P(B) = P(B)(1 - P(A)) = P(\overline{A}) \times P(B)$.`) + EXM(r`On lance un dé équilibré. $A$ : « pair » $= \{2 ; 4 ; 6\}$ et $B$ : « au plus 2 » $= \{1 ; 2\}$. $P(A \cap B) = P(\{2\}) = \frac{1}{6}$ et $P(A) \times P(B) = \frac{1}{2} \times \frac{1}{3} = \frac{1}{6}$ : $A$ et $B$ sont indépendants.`) + ATT(r`Indépendants ne veut pas dire incompatibles ! Si $A$ et $B$ sont incompatibles et de probabilités non nulles, $P(A \cap B) = 0 \ne P(A)P(B)$ : ils ne sont <b>pas</b> indépendants.`) },
{ t: 'Succession de deux épreuves indépendantes', h: PROP(r`Lorsque deux épreuves sont indépendantes (le résultat de la première n'influence pas la seconde), la probabilité d'obtenir l'issue $a$ puis l'issue $b$ est le produit $P(a) \times P(b)$. On la représente par un arbre (où les probabilités du 2e niveau sont les mêmes sur chaque sous-arbre) ou par un tableau à double entrée.`) + EXM(r`On lance une pièce équilibrée puis un dé équilibré : $P(\text{Pile puis } 6) = \frac{1}{2} \times \frac{1}{6} = \frac{1}{12}$.<br>On tire deux fois <b>avec remise</b> dans une urne contenant 3 boules rouges sur 5 : $P(\text{deux rouges}) = \frac{3}{5} \times \frac{3}{5} = \frac{9}{25}$.`) + ATT(r`Un tirage <b>sans remise</b> n'est pas une succession d'épreuves indépendantes : la composition de l'urne change.`) },
{ t: 'Répétition d\'épreuves de Bernoulli', h: DEF(r`Une <b>épreuve de Bernoulli</b> est une expérience à deux issues : <b>succès</b> $S$, de probabilité $p$, et <b>échec</b> $\overline{S}$, de probabilité $1 - p$.`) + PROP(r`On répète $n$ fois ($n \le 4$ ici) de façon indépendante la même épreuve de Bernoulli. Sur l'arbre :<ul><li>un chemin avec $k$ succès et $n - k$ échecs a pour probabilité $p^k(1 - p)^{n - k}$ ;</li><li>pour obtenir la probabilité de « exactement $k$ succès », on compte les chemins concernés et on multiplie.</li></ul>`) + FIG(tree(B11(3, 'p', '1 − p', ''), { dx: 110, dy: 28, extra: 50 })) + EXM(r`$n = 3$ et $p = 0,2$.<ul><li>$P(\text{3 succès}) = 0,2^3 = 0,008$.</li><li>Exactement 2 succès : 3 chemins ($SS\overline{S}$, $S\overline{S}S$, $\overline{S}SS$), donc $3 \times 0,2^2 \times 0,8 = 0,096$.</li><li>Au moins un succès : $1 - P(\text{aucun succès}) = 1 - 0,8^3 = 0,488$.</li></ul>`) + METH(r`« Au moins un » : on passe presque toujours par l'événement contraire « aucun ».`) }
],

{ t: 'Vocabulaire des ensembles', h: FIG(venn({ shade: 'AB', tA: '2 4 8 10', tAB: '6', tB: '3 9', tOut: '1 5 7' })) + r`<p style="text-align:center">$E = \{1 ; \ldots ; 10\}$, $A$ : les nombres pairs, $B$ : les multiples de 3. La partie colorée est $A \cap B = \{6\}$.</p>` + DEF(r`<ul><li>$x \in A$ : $x$ <b>appartient</b> à $A$. $A \subset B$ : $A$ est <b>inclus</b> dans $B$ (tout élément de $A$ est dans $B$).</li><li>$A \cap B$ (<b>intersection</b>) : les éléments qui sont dans $A$ <b>et</b> dans $B$. $A \cup B$ (<b>réunion</b>) : les éléments qui sont dans $A$ <b>ou</b> dans $B$.</li><li>Le <b>complémentaire</b> de $A$ dans $E$, noté $\overline{A}$ ou $E \setminus A$ : les éléments de $E$ qui ne sont pas dans $A$. $\emptyset$ est l'ensemble vide.</li><li>$\text{Card}(A)$ est le <b>cardinal</b> de $A$ : son nombre d'éléments.</li></ul>`) + DEF(r`Le <b>produit cartésien</b> $A \times B$ est l'ensemble des <b>couples</b> $(a ; b)$ avec $a \in A$ et $b \in B$. On a $\text{Card}(A \times B) = \text{Card}(A) \times \text{Card}(B)$.`) + EXM(r`$E = \{1 ; 2 ; \ldots ; 10\}$, $A$ = les nombres pairs de $E$, $B$ = les multiples de 3 de $E$.<br>$A \cap B = \{6\}$, $A \cup B = \{2 ; 3 ; 4 ; 6 ; 8 ; 9 ; 10\}$, $\overline{B} = \{1 ; 2 ; 4 ; 5 ; 7 ; 8 ; 10\}$.<br>$\text{Card}(A \cup B) = \text{Card}(A) + \text{Card}(B) - \text{Card}(A \cap B) = 5 + 3 - 1 = 7$.`) },
{ t: 'Condition nécessaire, condition suffisante', h: FIG(venn({ sub: 1, A: 'P', B: 'Q', shade: 'A' })) + r`<p style="text-align:center">Si $P \Rightarrow Q$, l'ensemble où $P$ est vraie est inclus dans celui où $Q$ est vraie : être dans $P$ <b>suffit</b> pour être dans $Q$, et être dans $Q$ est <b>nécessaire</b> pour être dans $P$.</p>` + DEF(r`Si l'implication $P \Rightarrow Q$ est vraie :<ul><li>$P$ est une <b>condition suffisante</b> pour avoir $Q$ (il suffit d'avoir $P$) ;</li><li>$Q$ est une <b>condition nécessaire</b> pour avoir $P$ (il faut avoir $Q$).</li></ul>Si $P \iff Q$, $P$ est une condition <b>nécessaire et suffisante</b> pour $Q$ (« si et seulement si »).`) + EXM(r`« Si $x = 2$, alors $x^2 = 4$. » Être égal à 2 est une condition suffisante pour que $x^2 = 4$, mais pas nécessaire ($x = -2$ convient aussi).<br>Pour qu'un quadrilatère soit un carré, il est nécessaire (mais pas suffisant) qu'il soit un rectangle.<br>Un entier est divisible par 9 si et seulement si la somme de ses chiffres est divisible par 9 : condition nécessaire et suffisante.`) },
{ t: 'Quantificateurs et négation', h: PROP(r`<ul><li>La négation de « <b>pour tout</b> $x$, $P(x)$ » est « <b>il existe</b> $x$ tel que non $P(x)$ ».</li><li>La négation de « <b>il existe</b> $x$ tel que $P(x)$ » est « <b>pour tout</b> $x$, non $P(x)$ ».</li></ul>`) + EXM(r`<ul><li>« Pour tout réel $x$, $x^2 \ge 0$ » a pour négation « il existe un réel $x$ tel que $x^2 < 0$ ».</li><li>« Il existe un entier $n$ tel que $n^2 = 2$ » a pour négation « pour tout entier $n$, $n^2 \ne 2$ ».</li></ul>`) + ATT(r`Les quantificateurs sont souvent <b>implicites</b> : « si $n$ est pair, alors $n^2$ est pair » signifie « <b>pour tout</b> entier $n$, si $n$ est pair alors $n^2$ est pair ». De même, « $(a + b)^2 = a^2 + 2ab + b^2$ » est une <b>identité</b> (vraie pour tous $a$ et $b$), alors que « $x^2 = 4$ » est une <b>équation</b> (on cherche les valeurs de l'<b>inconnue</b> $x$). Dans $f(x) = mx + 2$, $m$ est un <b>paramètre</b> et $x$ une <b>variable</b>.`) },
{ t: 'Trois types de raisonnement', h: METH(r`<b>Par contraposée</b> : pour prouver « si $P$ alors $Q$ », on prouve « si non $Q$ alors non $P$ ».`) + DEMO(r`<b>Si $n^2$ est pair, alors $n$ est pair.</b> Contraposée : si $n$ est impair, alors $n^2$ est impair. En effet, si $n = 2k + 1$, alors $n^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1$ est impair.`) + METH(r`<b>Par l'absurde</b> : on suppose le contraire de ce qu'on veut démontrer, et on aboutit à une contradiction.`) + DEMO(r`<b>$\sqrt{2}$ est irrationnel.</b> Supposons $\sqrt{2} = \frac{p}{q}$ avec une fraction <b>irréductible</b>. Alors $p^2 = 2q^2$, donc $p^2$ est pair, donc $p$ est pair (ci-dessus) : $p = 2k$. Alors $4k^2 = 2q^2$, soit $q^2 = 2k^2$ : $q$ est pair aussi. Ainsi $p$ et $q$ sont tous deux pairs : la fraction n'était pas irréductible. Contradiction !`) + METH(r`<b>Par disjonction des cas</b> : on découpe en cas qui couvrent toutes les possibilités.`) + EXM(r`Pour tout réel $x$, $|x - 1| + |x + 1| \ge 2$. Cas $x \ge 1$ : la somme vaut $2x \ge 2$. Cas $-1 \le x < 1$ : elle vaut $(1 - x) + (x + 1) = 2$. Cas $x < -1$ : elle vaut $-2x > 2$.`) }
],

CH({ id: 'pyanalyse', th: 'Python', t: 'Python 5 : algorithmes d\'analyse',
intro: r`Des programmes plus élaborés liés aux fonctions : pentes des sécantes et nombre dérivé, résolution approchée d'une équation (dichotomie, méthode de Newton), construction de l'exponentielle par la méthode d'Euler, approximation de $e$.`,

{ t: 'Pentes des sécantes et nombre dérivé', h: DEF(r`La pente de la sécante entre les points d'abscisses $a$ et $a + h$ est $\frac{f(a + h) - f(a)}{h}$. Quand $h$ se rapproche de 0, elle se rapproche du nombre dérivé $f'(a)$.`) + PY(`
def f(x):
    return x ** 2

def pentes(a):
    L = []
    for h in [1, 0.1, 0.01, 0.001]:
        L.append((f(a + h) - f(a)) / h)
    return L

print(pentes(1))      # environ [3, 2.1, 2.01, 2.001] : on conjecture f'(1) = 2`) + RET(r`Pour $f(x) = x^2$ : $\frac{(1 + h)^2 - 1}{h} = \frac{2h + h^2}{h} = 2 + h$, qui tend bien vers 2.`, 'Vérification par le calcul') },
{ t: 'Résoudre f(x) = 0 : dichotomie et Newton', h: METH(r`<b>Dichotomie</b> : si $f$ change de signe sur $[a ; b]$, on regarde le signe au milieu $m$ et on garde la moitié où $f$ change de signe. <b>Newton</b> : on remplace la courbe par sa tangente et on prend le point où la tangente coupe l'axe des abscisses : $x \leftarrow x - \frac{f(x)}{f'(x)}$.`) + PY(`
def f(x):
    return x ** 3 + x - 1

def fp(x):                          # dérivée de f
    return 3 * x ** 2 + 1

def dichotomie(a, b, precision):
    while b - a > precision:
        m = (a + b) / 2
        if f(a) * f(m) <= 0:        # changement de signe sur [a ; m]
            b = m
        else:
            a = m
    return a, b

def newton(x, n):
    for i in range(n):
        x = x - f(x) / fp(x)        # abscisse où la tangente coupe l'axe
    return x

print(dichotomie(0, 1, 0.001))      # (0.681640625, 0.6826171875) en 10 étapes
print(newton(1, 4))                 # 0.6823278... : 7 décimales exactes en 4 étapes`) + ATT(r`La dichotomie marche toujours (si $f$ est continue et change de signe), mais lentement. Newton est beaucoup plus rapide quand on part assez près de la solution.`) },
{ t: 'Méthode d\'Euler pour l\'exponentielle', h: DEF(r`La fonction exponentielle vérifie $f' = f$ et $f(0) = 1$. Pour un petit pas $h$, $f(x + h) \approx f(x) + h f'(x) = f(x)(1 + h)$. On construit ainsi, de proche en proche, des valeurs approchées.`) + PY(`
def euler(n):                  # valeur approchée de exp(1) avec n pas
    h = 1 / n
    y = 1                      # f(0) = 1
    for i in range(n):
        y = y * (1 + h)        # y(x + h) = y(x) + h * y(x)
    return y

print(euler(10))               # 2.5937...
print(euler(1000))             # 2.7169...  (e = 2.71828...)`) + RET(r`<code>euler(n)</code> calcule $\left(1 + \frac{1}{n}\right)^n$, qui se rapproche de $e \approx 2,718$ quand $n$ devient grand.`) }

 { p: r`La formule $x - \frac{f(x)}{f'(x)}$ ne marche pas si :`, c: [r`$f'(x) = 0$`, r`$f(x) = 0$`, r`$x = 0$`, r`$x < 0$`], e: r`On diviserait par 0 : la tangente est horizontale et ne coupe pas l'axe des abscisses.` } ] }
],
appro: [
{ t: 'Construire l\'exponentielle', q: r`On reprend <code>euler(n)</code> du cours.`, it: [
 { p: `<code>euler(1)</code>`, n: 2 },
 { p: `<code>euler(2)</code>`, n: 2.25, e: r`$h = 0,5$ : $1 \times 1,5 \times 1,5 = 2,25$.` },
 { p: `<code>euler(10)</code> (au millième) :`, n: 2.594, tol: 0.0006 },
 { p: `Les valeurs approchées obtenues sont :`, c: [r`inférieures à $e$ et de plus en plus proches`, r`supérieures à $e$`, r`égales à $e$`, r`de plus en plus éloignées de $e$`], e: r`2 ; 2,25 ; 2,594 ; … ; 2,7169 pour $n = 1000$ : on approche $e \approx 2,7183$ par en dessous.` } ] },
{ t: 'Tableau de valeurs par Euler', q: r`On construit la liste des valeurs approchées de $\exp$ en $0 ; 0,5 ; 1 ; 1,5 ; 2$ avec le pas $h = 0,5$.` + PY(`
def tableau_euler(h, n):
    x = 0
    y = 1
    X = [x]
    Y = [y]
    for i in range(n):
        y = y + h * y
        x = x + h
        X.append(x)
        Y.append(y)
    return X, Y`), it: [
 { p: `Pour <code>tableau_euler(0.5, 4)</code>, dernier élément de <code>X</code> :`, n: 2 },
 { p: `Dernier élément de <code>Y</code> :`, n: 5.0625, e: r`$1,5^4 = 5,0625$, alors que $e^2 \approx 7,39$ : le pas est trop grand pour être précis.` },
 { p: `Combien d'éléments contient <code>Y</code> ?`, n: 5 },
 { p: `Pour être plus précis, il faut :`, c: [r`diminuer $h$ et augmenter $n$`, r`augmenter $h$`, r`diminuer $n$`, r`partir de $y = 0$`] } ] },
{ t: 'Un problème d\'optimisation', q: r`Dans un carré de carton de 12 cm de côté, on découpe un carré de côté $x$ à chaque coin pour former une boîte sans couvercle. Son volume est $V(x) = x(12 - 2x)^2$ pour $x \in [0 ; 6]$.` + PY(`
def V(x):
    return x * (12 - 2 * x) ** 2

def maximum(pas):
    x = 0
    meilleur_x = 0
    while x <= 6:
        if V(x) > V(meilleur_x):
            meilleur_x = x
        x = x + pas
    return meilleur_x`), it: [
 { p: `<code>V(1)</code>`, n: 100 },
 { p: `<code>maximum(1)</code>`, n: 2, e: r`$V(1) = 100$, $V(2) = 128$, $V(3) = 108$ : le plus grand est en 2.` },
 { p: `Par le calcul : $V'(x) = (12 - 2x)(12 - 6x)$. Sur $]0 ; 6[$, $V'$ s'annule en :`, n: 2, e: r`$12 - 6x = 0 \iff x = 2$ ; $V'$ est positive avant et négative après : maximum en 2.` },
 { p: `Volume maximal (en cm³) :`, n: 128 } ] }
]
});

<style id="mjn-angle-notation-fix">
.mjn-angle3{display:inline-block;position:relative;white-space:nowrap;padding-top:.32em;line-height:1.15;vertical-align:baseline}
.mjn-angle3::before{content:"";position:absolute;left:0;right:0;top:.02em;height:.30em;background:linear-gradient(to top right,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) right/50% 100% no-repeat;box-sizing:border-box}

</style>
<script id="mjn-angle-notation-fix-script">
(function(){
 if(window.__mjnAngleNotationFix)return;
 window.__mjnAngleNotationFix=true;
 const rx=/(∠\s*)([A-Z]{3}\b)|(\bangle\s+)([A-Z]{3}\b|[xy]O[xy])|(\bcos\s*\()([A-Z]{3})(\))/g;
 function fix(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
   const p=n.parentElement;
   if(!p||p.closest('script,style,textarea,input,pre,code,.mjn-angle3,.mjn-angle-notation'))return NodeFilter.FILTER_REJECT;
   rx.lastIndex=0;
   return rx.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
   rx.lastIndex=0;const value=n.nodeValue;let m,last=0,changed=false;const frag=document.createDocumentFragment();
   while((m=rx.exec(value))){
    changed=true;frag.appendChild(document.createTextNode(value.slice(last,m.index)));
    if(m[1]){
      const s=document.createElement('span');s.className='mjn-angle-notation';s.textContent=m[2];frag.appendChild(s);
    }else if(m[3]){
      frag.appendChild(document.createTextNode(m[3]));
      const s=document.createElement('span');s.className='mjn-angle-notation';s.textContent=m[4];frag.appendChild(s);
    }else{
      frag.appendChild(document.createTextNode(m[5]));
      const s=document.createElement('span');s.className='mjn-angle-notation';s.textContent=m[6];frag.appendChild(s);
      frag.appendChild(document.createTextNode(m[7]));
    }
    last=rx.lastIndex;
   }
   if(changed){frag.appendChild(document.createTextNode(value.slice(last)));n.parentNode.replaceChild(frag,n);}
  });
 }
 function run(){fix(document.body);}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fix(n);else if(n.nodeType===3&&n.parentNode)fix(n.parentNode);}))).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
