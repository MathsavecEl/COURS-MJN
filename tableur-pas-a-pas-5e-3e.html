<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableur pas à pas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Même famille visuelle que « Scratch pas à pas » et la course aux nombres : feuille de cahier.
   Au centre des exercices : un tableur simulé (grille, barre de formule, poignée de recopie). */
:root{
  --paper:#f4f6fb; --grid:#e2e8f4; --card:#ffffff; --text:#1c2135; --ink:#24318a; --muted:#596282;
  --line:#d4dbeb; --red:#c22e2e; --red-soft:#fcebea; --green:#16764a; --green-soft:#e2f3e9;
  --amber:#985600; --amber-soft:#fbefdc; --mark:#ffef9e; --accent:#3d5bd9; --accent-soft:#e8edff;
  --violet:#6b3fc9; --violet-soft:#f0eaff;
  --xl:#1d7044; --xl-soft:#e3f2e9; --xl-head:#eef1f6; --xl-gl:#dfe3ec; --xl-sel:rgba(33,115,70,.13); --xl-cell:#ffffff; --xl-lock:#f6f7fa;
  --pt-y:#fff2a8; --pt-b:#bfe0ff; --pt-r:#ffb9b3; --pt-v:#dcc8ff; --pt-g:#c8f0cf;
  --s0:#2f6fdf; --s1:#d1392f; --r0:#2f6fdf; --r1:#d1392f; --r2:#8a4fd8; --r3:#1b8a5a;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --f-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050;
  --xl:#5fd59c; --xl-soft:#12321f; --xl-head:#20284a; --xl-gl:#2c355c; --xl-sel:rgba(95,213,156,.16); --xl-cell:#141a30; --xl-lock:#1a2140;
  --pt-y:#5e5214; --pt-b:#1d4470; --pt-r:#6a2722; --pt-v:#45306e; --pt-g:#1f5631;
  --s0:#5b8cf0; --s1:#e8665c; --r0:#7ea6ff; --r1:#ff8a80; --r2:#c4a0ff; --r3:#62d39b; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050;
  --xl:#5fd59c; --xl-soft:#12321f; --xl-head:#20284a; --xl-gl:#2c355c; --xl-sel:rgba(95,213,156,.16); --xl-cell:#141a30; --xl-lock:#1a2140;
  --pt-y:#5e5214; --pt-b:#1d4470; --pt-r:#6a2722; --pt-v:#45306e; --pt-g:#1f5631;
  --s0:#5b8cf0; --s1:#e8665c; --r0:#7ea6ff; --r1:#ff8a80; --r2:#c4a0ff; --r3:#62d39b; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background-color:var(--paper);color:var(--text);font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse}
code.fx{font:700 .92em var(--f-mono);background:var(--xl-soft);color:var(--xl);border-radius:5px;padding:1px 6px;white-space:nowrap}
code.ad{font:700 .92em var(--f-mono);background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:1px 6px;white-space:nowrap}
kbd{font:700 .85em var(--f-body);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:0 6px;background:var(--card)}

/* En-tête */
.top{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{width:42px;height:42px;flex:none;border-radius:10px;background:#1d7044;display:grid;place-items:center}
.logo svg{width:28px;height:28px}
.brand h1{font-size:1.2rem;font-weight:800;color:var(--ink)}
.brand p{font-size:.78rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.brand p b{color:var(--red);letter-spacing:.08em}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.93rem}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a.on{color:var(--ink);background:var(--accent-soft)}

main{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
footer{padding-block:4px 32px;color:var(--muted);font-size:.85rem;text-align:center}

/* Feuille de cahier */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 24px 62px;min-width:0}
.sheet::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
@media (max-width:600px){ .sheet{padding:18px 14px 20px 30px} .sheet::before{left:18px} }
.sheet > * + *{margin-top:14px}
.sheet h2{font-size:1.45rem;color:var(--ink)}
.sheet h3{font-size:1.15rem;color:var(--ink)}
.lead{max-width:66ch}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:10px;font-weight:700;font-size:.98rem;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 12px;min-height:36px;font-size:.9rem}
.btn.check{background:var(--xl);border-color:var(--xl);color:var(--card)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:2rem;font-weight:800}
.hero .kicker{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
.hero .demo{min-width:0}
.namebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.namebox input{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:1rem;width:min(220px,100%)}
.parcours{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.parcours{grid-template-columns:1fr}}
.pc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 16px}
.pc:hover{border-color:var(--accent)}
.pc.on{border-color:var(--ink);background:var(--accent-soft)}
.pc .pt{font:800 1.08rem var(--f-display);color:var(--ink)}
.pc .pd{font-size:.92rem;color:var(--muted)}
.pc .ps{font-size:.82rem;font-weight:700;color:var(--text)}
.pc .on-flag{font-size:.78rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}

.year{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:600px){.year{grid-template-columns:1fr}}
.year-lab{font:800 1.6rem var(--f-display);color:#fff;background:var(--ink);border-radius:10px;text-align:center;padding:10px 0 8px;line-height:1}
.year-lab small{display:block;font:700 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;opacity:.85}
.y5 .year-lab{background:#2f7d4f}.y4 .year-lab{background:#b86200}.y3 .year-lab{background:#a52a4a}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;text-decoration:none;color:var(--text);min-height:118px;transition:transform .15s,border-color .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard.off{opacity:.55}
.scard.reco{border:2px solid var(--green)}
.scard .num{font:800 .9rem var(--f-display);color:var(--red)}
.scard .th{font-weight:700;line-height:1.3}
.scard .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);width:100%}
.minibar{flex:1;min-width:50px;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.minibar span{display:block;height:100%;background:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green);border-color:transparent}

/* Test de positionnement */
.diag-q{border-top:1px dashed var(--line);padding-top:12px}
.diag-q .dq{font-weight:700;margin-bottom:8px}
.diag-res{border-radius:8px;padding:12px 16px;background:var(--green-soft);color:var(--text)}

/* Page d'étape */
.band{border-radius:10px;padding:18px 20px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.band.y5{background:#2f7d4f}.band.y4{background:#b86200}.band.y3{background:#a52a4a}
.band .bn{grid-row:span 3;font:800 3rem/1 var(--f-display);text-align:center;min-width:70px}
.band .bn small{display:block;font:700 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.band h2{font-size:1.65rem;font-weight:800;color:#fff}
.band p{opacity:.92}
.band .bt{display:flex;gap:6px;flex-wrap:wrap}
.band .bt span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px}
.objectifs{display:grid;gap:4px;padding-left:1.2em;margin:0}

.box{border-radius:8px;padding:14px 16px;border-left:5px solid var(--bc);background:var(--bs);min-width:0}
.box > * + *{margin-top:10px}
.box h4{font:700 .8rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--bc)}
.box h4 b{color:var(--text);text-transform:none;letter-spacing:0;font-size:.95rem}
.box ul,.box ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.box.def{--bc:var(--accent);--bs:var(--accent-soft)}
.box.sav{--bc:var(--violet);--bs:var(--violet-soft)}
.box.met{--bc:var(--amber);--bs:var(--amber-soft)}
.box.exe{--bc:var(--green);--bs:var(--green-soft)}
.box.pie{--bc:var(--red);--bs:var(--red-soft)}
.box.ast{--bc:var(--muted);--bs:var(--paper)}
.box.ret{--bc:var(--ink);--bs:var(--card);border:2px solid var(--ink);border-left-width:6px}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{min-width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:700;font-size:.85rem}
.faux{color:var(--red);font-weight:700}.vrai{color:var(--green);font-weight:700}
mark{color:inherit;background:var(--mark);padding:0 3px;border-radius:3px;font-weight:700}
.hand{font:700 1.45rem var(--f-hand);color:var(--red)}

/* Exercices */
.lvl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:22px!important}
.lvl-h .stars{color:var(--amber);font-size:1.15rem;letter-spacing:2px}
.lvl-h h3{font-size:1.15rem}
.lvl-h span.muted{font-size:.9rem}
.lvl-h .reco-tag{font-size:.75rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.ex{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);min-width:0}
.ex > * + *{margin-top:10px}
.ex.done{border-color:var(--green)}
.ex-h{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.ex-h .en{font:800 1rem var(--f-display);color:var(--red)}
.ex-h h4{font-size:1.05rem;color:var(--ink)}
.ex-h .src{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:1px 7px}
.ex-h .ok-flag{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--green)}
.qs{display:grid;gap:10px;margin:0;padding-left:1.5em}
.qs > li::marker{font-weight:800;color:var(--ink)}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.qa input{width:min(200px,100%);border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.qa input.fxin{font-family:var(--f-mono);width:min(260px,100%)}
.qa input.ok{border-color:var(--green);background:var(--green-soft)}
.qa input.ko{border-color:var(--red);background:var(--red-soft)}
.qa .choice{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-weight:700;min-height:38px}
.qa .choice:hover{border-color:var(--accent)}
.qa .choice.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.qa .choice.ko{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fb{font-weight:700;font-size:.92rem}
.fb.ok{color:var(--green)}.fb.ko{color:var(--red)}
.fb small{display:block;font-weight:400;color:var(--text)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{background:var(--amber-soft);border-radius:8px;padding:10px 14px;border-left:4px solid var(--amber)}
.hint b.hl{color:var(--amber)}
.corr{border:2px dashed var(--red);border-radius:8px;padding:10px 16px 14px}
.corr > * + *{margin-top:8px}
.corr .ct{font:700 1.6rem/1 var(--f-hand);color:var(--red)}
.corr ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.res{display:inline-block;padding:2px 10px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.tasks li .tk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--card)}
.tasks li.ok{border-color:var(--green);background:var(--green-soft)}
.tasks li.ok .tk{border-color:var(--green);background:var(--green);color:#fff}
.tasks li.ko{border-color:var(--red)}
.tasks li.ko .tk{border-color:var(--red);color:var(--red)}
.tasks li .tm{display:block;font-size:.88rem;color:var(--red);font-weight:700;margin-top:2px}
.checkline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.checkline .fb{font-size:.95rem}

/* ===== Tableur simulé ===== */
.xl{border:1px solid var(--line);border-radius:8px;background:var(--xl-cell);min-width:0;max-width:100%;overflow:hidden}
.xl-bar{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid var(--line);background:var(--xl-head)}
.xl-name{flex:none;width:58px;text-align:center;font:700 .88rem var(--f-mono);border:1px solid var(--line);background:var(--card);border-radius:4px;padding:5px 2px}
.xl-fx{flex:none;font:italic 700 .95rem Georgia,serif;color:var(--muted);padding:0 2px}
.xl-in{flex:1;min-width:0;font:600 .95rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--card)}
.xl-in:focus{outline:2px solid var(--xl);outline-offset:0;border-color:var(--xl)}
.xl-in[readonly]{color:var(--muted)}
.xl-scroll{overflow:auto;max-width:100%;max-height:440px;outline:none;position:relative}
.xl-scroll:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
table.xl-t{border-collapse:separate;border-spacing:0;font:.92rem/1.2 var(--f-body);font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;background:var(--xl-cell)}
.xl-t th{background:var(--xl-head);color:var(--muted);font:600 .76rem var(--f-body);border-right:1px solid var(--xl-gl);border-bottom:1px solid var(--xl-gl);position:sticky;top:0;z-index:2;height:24px;padding:0 4px;text-align:center;cursor:pointer}
.xl-t th.corner{left:0;z-index:3;width:38px;min-width:38px;cursor:default}
.xl-t th.rh{position:sticky;left:0;z-index:1;width:38px;min-width:38px}
.xl-t th.hi{background:var(--xl-soft);color:var(--xl)}
.xl-t td{border-right:1px solid var(--xl-gl);border-bottom:1px solid var(--xl-gl);height:29px;min-width:var(--cw,86px);max-width:var(--cw,86px);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;cursor:cell;position:relative;color:var(--text)}
.xl-t td.n{text-align:right}
.xl-t td.b{font-weight:700}
.xl-t td.h{font-weight:700;text-align:center;background:var(--xl-head)}
.xl-t td.lk{background:var(--xl-lock)}
.xl-t td.e{color:var(--red);font-weight:700;text-align:center}
.xl-t td.f-y{background:var(--pt-y)}.xl-t td.f-b{background:var(--pt-b)}.xl-t td.f-r{background:var(--pt-r)}.xl-t td.f-v{background:var(--pt-v)}.xl-t td.f-g{background:var(--pt-g)}
.xl-t td.sel{background-image:linear-gradient(var(--xl-sel),var(--xl-sel))}
.xl-t td.act{box-shadow:inset 0 0 0 2px var(--xl)}
.xl-t td.ed{box-shadow:inset 0 0 0 2px var(--xl);background:var(--card);font-family:var(--f-mono);font-size:.86rem;text-align:left;overflow:visible;z-index:4}
.xl-t td.fp{outline:2px dashed var(--xl);outline-offset:-3px}
.xl-t td.showf{font-family:var(--f-mono);font-size:.8rem;color:var(--xl);text-align:left}
.xl-t td.rf0{box-shadow:inset 0 0 0 2px var(--r0)}.xl-t td.rf1{box-shadow:inset 0 0 0 2px var(--r1)}.xl-t td.rf2{box-shadow:inset 0 0 0 2px var(--r2)}.xl-t td.rf3{box-shadow:inset 0 0 0 2px var(--r3)}
.xl-t td.flash{animation:flash .9s ease-out}
@keyframes flash{from{background-color:var(--mark)}to{background-color:transparent}}
.fh{position:absolute;right:0;bottom:0;width:9px;height:9px;background:var(--xl);border:1px solid var(--xl-cell);cursor:crosshair;touch-action:none;z-index:5}
.fh::before{content:"";position:absolute;inset:-10px}
.xl-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-top:1px solid var(--line);background:var(--xl-head)}

<script>

  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[−–]/g, '-').replace(/\s+/g, '').replace(/(\d),(\d)/g, '$1.$2').replace(/[€%°]|cm³|cm²|cm$/g, '').replace(/\.$/, '');
}
function same(given, ans){
  const list = Array.isArray(ans) ? ans : [ans], g = normA(given);
  return list.some(a => { const b = normA(a); if (g === b) return true; const x = parseFloat(g), y = parseFloat(b); return /^-?\d+(\.\d+)?$/.test(g) && /^-?\d+(\.\d+)?$/.test(b) && Math.abs(x - y) < 1e-9; });

function wireEx(e, s){
  const el = document.getElementById(exId(e));
  const ok = new Set(); let tasksOk = !e.tasks;
  let grid = null;
  if (e.g){ grid = mountGrid(el.querySelector('[data-exg]'), e.g); }
  const finish = () => {
    if (tasksOk && ok.size === (e.qs ? e.qs.length : 0) && !ST.done[e.n]){
      ST.done[e.n] = true; save();
      el.classList.add('done'); el.querySelector('.ok-flag').textContent = '✔ réussi';
      stepEnd(s, true);
    }
  };
  if (e.tasks){
    const cfb = el.querySelector('[data-cfb]');
    const run = silent => {
      let all = true;
      e.tasks.forEach((k, i) => {
        const li = el.querySelector('[data-k="'+i+'"]'), r = checkTask(grid.sheet, k, grid.fills), tm = li.querySelector('.tm');
        li.classList.toggle('ok', r === true); li.classList.toggle('ko', r !== true && !silent);
        li.querySelector('.tk').textContent = r === true ? '✓' : (i + 1);
        tm.hidden = r === true || silent; tm.textContent = r === true ? '' : r;
        if (r !== true) all = false;
      });
      if (!silent){
        const nOk = e.tasks.filter((k, i) => el.querySelector('[data-k="'+i+'"]').classList.contains('ok')).length;
        cfb.className = 'fb ' + (all ? 'ok' : 'ko');
        cfb.innerHTML = all ? pick(BRAVO) + (e.qs && e.qs.length ? ' <small>Réponds maintenant aux questions ci-dessous.</small>' : '') : (nOk ? nOk+' consigne'+(nOk > 1 ? 's' : '')+' sur '+e.tasks.length+' réussie'+(nOk > 1 ? 's' : '')+'. ' : '') + pick(ENCORE);
      }
      tasksOk = all; finish();
    };
    el.querySelector('[data-check]').addEventListener('click', () => run(false));
    grid.onChange = () => { // on coche en direct ce qui est réussi, sans afficher les erreurs
      e.tasks.forEach((k, i) => { const li = el.querySelector('[data-k="'+i+'"]'); if (li.classList.contains('ko') || li.classList.contains('ok')){ const r = checkTask(grid.sheet, k, grid.fills); li.classList.toggle('ok', r === true); li.classList.toggle('ko', r !== true); li.querySelector('.tk').textContent = r === true ? '✓' : (i + 1); const tm = li.querySelector('.tm'); tm.hidden = r === true; tm.textContent = r === true ? '' : r; } });
    };
    const fs = el.querySelector('[data-fillsol]');
    if (fs) fs.addEventListener('click', () => { if (e.solD) grid.setRaw(e.solD); if (e.solF) grid.fillsSet(e.solF); run(false); });
    if (ST.done[e.n]){ tasksOk = true; }  }
  (e.qs || []).forEach((q, i) => {
    const box = el.querySelector('[data-q="'+i+'"]'), fb = box.querySelector('.fb');
    const verdict = (good, extra) => {
      fb.className = 'fb ' + (good ? 'ok' : 'ko');
      fb.innerHTML = (good ? pick(BRAVO) : pick(ENCORE)) + (extra ? '<small>'+esc(extra)+'</small>' : '');
      if (good) ok.add(i); finish();
    };
    if (q.choices){
      box.addEventListener('click', ev => {
        const b = ev.target.closest('.choice'); if (!b || ok.has(i)) return;
        const good = b.dataset.c === q.a;
        b.classList.add(good ? 'ok' : 'ko'); verdict(good);
      });
    } else {
      const inp = box.querySelector('input');
      const chk = () => {
        if (!inp.value.trim()) return;
        let good, extra = '';
        if (q.fa){ const base = q.base || M(e.g ? e.g.d : {}, e.solD || {}); const r = checkFormulaAnswer(base, q, inp.value); good = r.ok; extra = r.msg; }
        else good = same(inp.value, q.a);
        inp.classList.toggle('ok', good); inp.classList.toggle('ko', !good); if (good) inp.readOnly = true;
        verdict(good, extra);
      };
      box.querySelector('[data-chk]').addEventListener('click', chk);
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') chk(); });
    }
  });
  const hb = el.querySelector('[data-hint]');
  hb.addEventListener('click', () => {
    const hid = [...el.querySelectorAll('.hint')].find(x => x.hidden);
    if (hid) hid.hidden = false;
    if (![...el.querySelectorAll('.hint')].some(x => x.hidden)){ hb.disabled = true; hb.textContent = '💡 Tous les indices sont affichés'; }
  });
  el.querySelector('[data-sol]').addEventListener('click', ev => {
    const c = el.querySelector('.corr'); c.hidden = !c.hidden;
    ev.target.textContent = c.hidden ? 'J\'ai cherché : voir la correction' : 'Cacher la correction';
  });
}

    '<section class="sheet">'+B('ast','Idées pour t\'entraîner','<ul><li>Écris les nombres de 1 à 30 en colonne A, puis leurs carrés en colonne B avec '+F('=A1^2')+'.</li><li>Fais ton propre devis pour une sortie (transport, entrées, repas).</li><li>Calcule ta moyenne trimestrielle avec '+F('=MOYENNE(…)')+'.</li><li>Lance 30 dés avec '+F('=ALEA.ENTRE.BORNES(1;6)')+' et compte les 6.</li></ul>')+'</section>';

/* ---------- Mémo ---------- */
function viewMemo(){
  const rows = [
    ['=A1+B1','Formule : commence toujours par ='],['+ - * / ^','Addition, soustraction, multiplication, division, puissance'],['A1:A10','Plage de A1 à A10'],['A1;A10','A1 et A10 seulement'],
    ['=SOMME(A1:A10)','Somme'],['=MOYENNE(A1:A10)','Moyenne'],['=MIN(…) =MAX(…)','Plus petite / plus grande valeur'],['=MAX(…)-MIN(…)','Étendue'],['=MEDIANE(A1:A10)','Médiane'],
    ['=NB(A1:A10)','Nombre de cellules qui contiennent un nombre'],['=NB.SI(A1:A10;">=10")','Nombre de valeurs qui vérifient une condition'],['$A$1','Référence absolue : ne bouge pas lors d\'une recopie'],['$A1 · A$1','Références mixtes : colonne bloquée · ligne bloquée'],
    ['=B1*(1-20%)','Diminuer de 20 %'],['=B1*(1+20%)','Augmenter de 20 %'],['=(C2-B2)/B2*100','Taux d\'évolution en %'],['=SI(B2>=10;"oui";"non")','Test : si… alors… sinon'],
    ['=ALEA.ENTRE.BORNES(1;6)','Entier au hasard entre 1 et 6'],['=MOD(A1;2)','Reste de la division par 2'],['=RACINE(A1) =ARRONDI(A1;2)','Racine carrée · arrondi à 2 décimales']];
  const errs = Object.keys(ERR_HELP).map(k => [k, ERR_HELP[k]]);
  const src = [];
  STEPS.forEach(s => s.ex.forEach(e => { if (e.src && /DNB/.test(e.src)) src.push('<li><a href="#e'+s.n+'">Exercice '+e.n+' · '+e.t+'</a> <span class="muted">(étape '+s.n+')</span></li>'); }));
  app.innerHTML = '<section class="sheet"><h2>Mémo du tableur</h2><div class="tbl memo"><table><thead><tr><th>J\'écris</th><th>Ce que ça fait</th></tr></thead><tbody>'+rows.map(r => '<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table></div></section>' +
    '<section class="sheet">'+B('met','Répondre à une question de tableur au brevet','<ol><li>Je repère ce que la cellule doit calculer.</li><li>J\'écris <b>=</b> puis la formule avec les <b>adresses</b> des cellules (jamais x, jamais les nombres du tableau).</li><li>J\'utilise <b>*</b> pour multiplier, <b>^</b> pour les puissances, des <b>parenthèses</b> si besoin.</li><li>Je pense à la recopie : une cellule doit-elle rester fixe ? Alors <b>$</b>.</li><li>Je vérifie ma formule sur une valeur du tableau.</li></ol>') +
    B('sav','Les messages d\'erreur', T(['Code','Signification'], errs)) + '</section>' +
    '<section class="sheet"><h2>Exercices type brevet</h2><ul style="display:grid;gap:6px;padding-left:1.2em;margin:0">'+src.join('')+'</ul><p class="muted">Ces exercices reprennent les situations et les formulations qui reviennent chaque année au DNB (fonctions, programmes de calcul, statistiques, pourcentages, comparaison de tarifs) ; les nombres sont inventés.</p></section>' +
    '<section class="box ret"><h4>Conseil</h4><p>Garde ce mémo sous la main pendant tes révisions. Et souviens-toi : une formule commence toujours par =, et une erreur n\'est qu\'une étape vers la bonne réponse.</p></section>';
  window.scrollTo(0, 0);
}

/* ---------- Routeur ---------- */
function route(){
  const h = (location.hash || '#accueil').slice(1);
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.nav === h || (h === 'parcours' && a.dataset.nav === 'accueil')));
  const m = h.match(/^e(\d+)$/);
  if (m) viewStep(+m[1]);
  else if (h === 'memo') viewMemo();
  else if (h === 'feuille') viewFree();
  else if (h === 'etapes' || h === 'diag' || h === 'parcours') viewHome(h);
  else viewHome();
}
window.addEventListener('hashchange', route);
document.getElementById('brandHome').addEventListener('click', () => { location.hash = '#accueil'; });
document.getElementById('profBtn').addEventListener('click', ev => {
  PROF = !PROF; document.body.classList.toggle('prof', PROF);
  ev.target.textContent = PROF ? 'Mode professeur activé : cliquer pour masquer les corrections' : 'Mode professeur : afficher toutes les corrections';
  route();
});
route();

<script id="mjn-math-polish">(()=>{const skip='SCRIPT,STYLE,NOSCRIPT,TEXTAREA,INPUT,PRE,CODE,KBD,SAMP,SVG,SUP,SUB';const re=/([A-Za-z0-9π)\]])\^(?:\{([^{}]+)\}|([−-]?[A-Za-z0-9]+))/g;function run(){const root=document.querySelector('main')||document.body;if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue||!n.nodeValue.includes('^'))return NodeFilter.FILTER_REJECT;let p=n.parentElement;while(p){if(p.matches&&p.matches(skip))return NodeFilter.FILTER_REJECT;p=p.parentElement}return NodeFilter.FILTER_ACCEPT}});const nodes=[];let n;while(n=w.nextNode())nodes.push(n);for(const node of nodes){const s=node.nodeValue;re.lastIndex=0;let m,last=0,found=false;const frag=document.createDocumentFragment();while(m=re.exec(s)){found=true;frag.append(document.createTextNode(s.slice(last,m.index)+m[1]));const sup=document.createElement('sup');sup.textContent=m[2]!==undefined?m[2]:m[3];frag.append(sup);last=re.lastIndex}if(found){frag.append(document.createTextNode(s.slice(last)));node.parentNode&&node.parentNode.replaceChild(frag,node)}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();const root=document.querySelector('main')||document.body;new MutationObserver(()=>run()).observe(root,{childList:true,subtree:true})})();</script>
