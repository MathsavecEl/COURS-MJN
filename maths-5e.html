CH({ id: 'triangles', th: 'Géométrie', per: 'Période 1', t: 'Construire des triangles, médiatrices',
intro: r`Savoir si un triangle existe (inégalité triangulaire), le construire à partir de longueurs et d'angles, et utiliser les médiatrices et le cercle circonscrit, en particulier dans les triangles rectangles, isocèles et équilatéraux.`,
cours: [
{ t: 'L’inégalité triangulaire', h: PROP(r`Pour trois points A, B, C quelconques : $AB \le AC + CB$.<br>Autrement dit, le chemin le plus court pour aller de A à B est la ligne droite : passer par C rallonge (ou, au mieux, ne change rien si C est sur le segment [AB]).`, 'Inégalité triangulaire') + PROP(r`On peut construire un triangle avec trois longueurs si et seulement si <b>la plus grande longueur est inférieure à la somme des deux autres</b>.<ul><li>Plus grande $<$ somme des deux autres : le triangle existe.</li><li>Plus grande $=$ somme des deux autres : les trois points sont <b>alignés</b> (on dit parfois triangle « aplati »).</li><li>Plus grande $>$ somme des deux autres : <b>impossible</b>, les arcs de cercle ne se coupent pas.</li></ul>`) + FIG(triangles_figIneg) + METH(r`Je repère la <b>plus grande</b> longueur, puis je la compare à la somme des deux autres. Exemple : 4 cm, 7 cm et 2 cm. La plus grande est 7 et $4 + 2 = 6$. Comme $7 > 6$, le triangle n'existe pas.`) + ATT(r`Il suffit de tester la plus grande longueur. Pour 4, 7 et 2 : $2 < 4 + 7$ est vrai, mais cela ne suffit pas !`) },
{ t: 'Construire un triangle avec trois longueurs', h: METH(r`Construire ABC avec AB = 6 cm, AC = 4 cm et BC = 5 cm.<ol><li>Je vérifie qu'il existe : $6 < 4 + 5$. ✔</li><li>Je trace le segment [AB] de 6 cm.</li><li>Je trace un arc de cercle de centre A et de rayon 4 cm (car AC = 4 cm).</li><li>Je trace un arc de cercle de centre B et de rayon 5 cm (car BC = 5 cm).</li><li>Le point C est à l'intersection des deux arcs. Je trace [AC] et [BC] et je code la figure.</li></ol>`, 'Méthode : au compas') + FIG(triangles_figCompas) + RET(r`Les points situés à 4 cm de A sont sur le <b>cercle de centre A et de rayon 4 cm</b> : c'est pour cela que le compas permet de placer C.`, 'Pourquoi ça marche') + ATT(r`Commence par un <b>schéma à main levée</b> codé avec les longueurs : il évite de se tromper d'écartement de compas.`) },
{ t: 'Avec des angles', h: METH(r`<b>Deux longueurs et l'angle compris entre elles</b> : AB = 5 cm, AC = 3,5 cm et $\widehat{BAC} = 50°$.<ol><li>Je trace [AB] de 5 cm.</li><li>Avec le rapporteur, je trace une demi-droite d'origine A qui fait un angle de $50°$ avec [AB].</li><li>Je place C sur cette demi-droite à 3,5 cm de A, puis je trace [BC].</li></ol>`, 'Méthode : deux longueurs et un angle') + FIG(triangles_figLAL) + METH(r`<b>Une longueur et les deux angles qui la touchent</b> : AB = 6 cm, $\widehat{BAC} = 40°$ et $\widehat{ABC} = 60°$.<ol><li>Je trace [AB] de 6 cm.</li><li>Je trace en A une demi-droite qui fait $40°$ avec [AB], puis en B une demi-droite qui fait $60°$ avec [BA].</li><li>C est l'intersection des deux demi-droites.</li></ol>`, 'Méthode : une longueur et deux angles') + FIG(triangles_figALA) + ATT(r`Si on donne AB = 6 cm, $\widehat{A} = 40°$ et $\widehat{C} = 80°$, l'angle $\widehat{C}$ ne touche pas [AB]. Je calcule d'abord $\widehat{B} = 180° - 40° - 80° = 60°$, puis je construis comme ci-dessus.`) },
{ t: 'La médiatrice d’un segment', h: DEF(r`La <b>médiatrice</b> d'un segment est la droite qui est <b>perpendiculaire</b> à ce segment et qui passe par son <b>milieu</b>.`) + FIG(triangles_figMed) + PROP(r`<ul><li>Si un point est sur la médiatrice de [AB], alors il est <b>à égale distance</b> de A et de B : MA = MB.</li><li>Réciproquement, si un point est à égale distance de A et de B, alors il est sur la médiatrice de [AB].</li></ul>`) + METH(r`Avec le compas, sans règle graduée : je prends un écartement plus grand que la moitié de AB. Je trace deux arcs de centre A, puis deux arcs de centre B avec le même écartement. Les deux points d'intersection sont à égale distance de A et de B : ils sont sur la médiatrice. Je les relie.`, 'Méthode : tracer une médiatrice au compas') },
{ t: 'Le cercle circonscrit', h: PROP(r`Les trois médiatrices d'un triangle sont <b>concourantes</b> : elles se coupent en un même point O. Ce point est à la même distance des trois sommets : OA = OB = OC. Le cercle de centre O qui passe par A, B et C s'appelle le <b>cercle circonscrit</b> au triangle.`) + FIG(triangles_circ([0, 0], [6, 0], [2, 4])) + EXM(r`Pourquoi ? O est sur la médiatrice de [AB], donc OA = OB. O est sur la médiatrice de [BC], donc OB = OC. Donc OA = OB = OC : O est aussi sur la médiatrice de [AC].`) + METH(r`Pour tracer le cercle circonscrit, <b>deux médiatrices suffisent</b> : leur point d'intersection est le centre. La troisième sert à vérifier.`) + PROP(r`Si le triangle a un angle obtus, le centre du cercle circonscrit est <b>à l'extérieur</b> du triangle.`) + FIG(triangles_circ([0, 0], [6, 0], [1, 1.5], { s: 32, lp: { O: 'se', C: 'n' } })) },
{ t: 'Triangles particuliers', h: PROP(r`Dans un triangle <b>rectangle</b>, le centre du cercle circonscrit est le <b>milieu de l'hypoténuse</b>. Le triangle est inscrit dans le cercle (ou le demi-cercle) dont l'hypoténuse est un diamètre. Le rayon est la moitié de l'hypoténuse.`, 'Triangle rectangle (propriété admise)') + FIG(triangles_circ([0, 0], [6, 0], [0, 4], { extra: { right: [['B', 'A', 'C']] }, lp: { O: 'ne' }, meds: [1, 3] })) + PROP(r`Dans un triangle <b>isocèle</b> en A, la médiatrice de la base [BC] passe par le sommet A (car AB = AC). C'est l'axe de symétrie du triangle.`, 'Triangle isocèle') + PROP(r`Dans un triangle <b>équilatéral</b>, chaque médiatrice passe par le sommet opposé : les trois médiatrices sont les trois axes de symétrie du triangle.`, 'Triangle équilatéral') + FIG(triangles_circ([0, 0], [5, 0], [2.5, 4], { s: 32, meds: [1], extra: { ticks: [['A', '_m1', 1], ['_m1', 'B', 1], ['A', 'C', 2], ['B', 'C', 2]] } }) + ' ' + triangles_circ([0, 0], [5, 0], [2.5, 2.5 * Math.sqrt(3)], { s: 32 })) + `<p style="text-align:center"><small>À gauche : ABC isocèle en C, la médiatrice de [AB] passe par C. À droite : ABC équilatéral, les trois médiatrices passent par les sommets.</small></p>` + RET(r`<ul><li>Triangle constructible ⟺ plus grand côté $<$ somme des deux autres.</li><li>Médiatrice de [AB] : perpendiculaire en son milieu ; ses points sont à égale distance de A et B.</li><li>Les 3 médiatrices se coupent au centre du cercle circonscrit.</li><li>Triangle rectangle : centre au milieu de l'hypoténuse, rayon $=$ hypoténuse $\div 2$.</li></ul>`) }
],
app: [
{ t: 'Constructible ou pas ?', q: r`Peut-on construire un triangle avec ces trois longueurs ?`, aide: r`Compare la plus grande longueur à la somme des deux autres.`, it: [
 { p: r`3 cm ; 4 cm ; 5 cm`, c: ['Oui', 'Non', 'Les points sont alignés'], fixed: true, e: r`Plus grande : 5. $3 + 4 = 7$ et $5 < 7$ : oui.` },
 { p: r`2 cm ; 3 cm ; 6 cm`, c: ['Non', 'Oui', 'Les points sont alignés'], fixed: true, e: r`Plus grande : 6. $2 + 3 = 5$ et $6 > 5$ : impossible.` },
 { p: r`4 cm ; 5 cm ; 9 cm`, c: ['Les points sont alignés', 'Oui', 'Non'], fixed: true, e: r`$4 + 5 = 9$ : égalité, les trois points sont alignés (triangle aplati).` },
 { p: r`7 cm ; 7 cm ; 13 cm`, c: ['Oui', 'Non', 'Les points sont alignés'], fixed: true, e: r`$7 + 7 = 14$ et $13 < 14$ : oui, c'est un triangle isocèle très « plat ».` },
 { p: r`1,5 cm ; 2,5 cm ; 4,5 cm`, c: ['Non', 'Oui', 'Les points sont alignés'], fixed: true, e: r`$1,5 + 2,5 = 4$ et $4,5 > 4$ : impossible.` } ] },
{ t: 'Encadrer une longueur', q: r`Dans un triangle ABC, AB = 5 cm et BC = 8 cm.`, aide: r`AC doit être plus petit que $AB + BC$, et BC doit être plus petit que $AB + AC$.`, it: [
 { p: r`AC est forcément plus petit que :`, n: 13, u: 'cm', e: r`$AC < AB + BC = 5 + 8 = 13$ cm.` },
 { p: r`AC est forcément plus grand que :`, n: 3, u: 'cm', e: r`Il faut $BC < AB + AC$, soit $8 < 5 + AC$, donc $AC > 3$ cm.` },
 { p: r`AC peut-il mesurer 2,5 cm ?`, c: ['Non', 'Oui'], fixed: true, e: r`$5 + 2,5 = 7,5 < 8$ : le côté de 8 cm serait trop long.` },
 { p: r`AC peut-il mesurer 12 cm ?`, c: ['Oui', 'Non'], fixed: true, e: r`$12 < 5 + 8 = 13$ : oui.` } ] },
{ t: 'Programme de construction', q: r`On veut construire le triangle RST avec RS = 7 cm, RT = 4 cm et ST = 6 cm.`, fig: (() => { const T = triangles_3l(7, 4, 6); return geo({ s: 38, pts: { R: [0, 0], S: [7, 0], T }, lp: { T: 'n' }, polys: [{ p: ['R', 'S', 'T'], fill: '#2f5bd314', c: COL.k }], arcs: [{ o: 'R', r: 4, a1: 40, a2: 75, c: COL.b }, { o: 'S', r: 6, a1: 135, a2: 160, c: COL.o }], lab: [['R', 'S', '7 cm', { side: 1 }]] }); })(), it: [
 { p: r`Le triangle existe-t-il ?`, c: ['Oui car 7 < 4 + 6', 'Non car 7 > 6', 'Oui car 4 < 6'], e: r`La plus grande longueur 7 est inférieure à $4 + 6 = 10$.` },
 { p: r`Après avoir tracé [RS], quel rayon prend-on pour l'arc de centre R ?`, n: 4, u: 'cm', e: r`T est à 4 cm de R (RT = 4 cm) : arc de centre R et de rayon 4 cm.` },
 { p: r`Et pour l'arc de centre S ?`, n: 6, u: 'cm', e: r`ST = 6 cm : arc de centre S et de rayon 6 cm.` },
 { p: r`Combien y a-t-il de points possibles pour T (de part et d'autre de (RS)) ?`, n: 2, e: r`Les deux cercles se coupent en deux points, un de chaque côté de (RS). Les deux triangles obtenus sont superposables (symétriques par rapport à (RS)).` } ] },
{ t: 'Calculer avant de construire', q: r`On veut construire un triangle ABC avec AB = 6 cm, $\widehat{BAC} = 35°$ et $\widehat{ACB} = 80°$.`, aide: r`Pour construire à partir de [AB], il faut les angles en A et en B.`, it: [
 { p: r`Mesure de $\widehat{ABC}$ :`, n: 65, u: '°', fig: geo({ s: 38, pts: { A: [0, 0], B: [6, 0], C: triangles_tri(6, 35, 65) }, lp: { C: 'n' }, polys: [{ p: ['A', 'B', 'C'], fill: '#1f9d5514', c: COL.k }], angles: [['B', 'A', 'C', { l: '35°', c: COL.b }], ['A', 'C', 'B', { l: '80°', c: COL.b, r: 0.6 }], ['C', 'B', 'A', { l: '?', c: COL.r }]], lab: [['A', 'B', '6 cm', { side: 1 }]] }), e: r`Somme des angles : $\widehat{ABC} = 180° - 35° - 80° = 65°$.` },
 { p: r`Quelles données suffisent pour construire un triangle ?`, c: ['Un côté et les deux angles qui le touchent', 'Trois angles', 'Deux angles seulement'], e: r`Avec trois angles seulement, on obtient des triangles de toutes les tailles (agrandissements). Il faut au moins une longueur.` } ] },
{ t: 'Utiliser la médiatrice', q: r`La droite (d) est la médiatrice du segment [AB]. M et N sont deux points de (d), P est un point qui n'est pas sur (d).`, fig: geo({ s: 38, pts: { A: [0, 0], B: [5, 0], M: [2.5, 2.4], N: [2.5, -1.8], P: [4.2, 2.6], _i: [2.5, 0], _h: [2.5, -2.6], _k: [2.5, 3.4] }, lp: { M: 'w', N: 'w', P: 'e' }, segs: [['A', 'B']], lines: [['_h', '_k', { c: COL.g }]], right: [['B', '_i', '_k']], ticks: [['A', '_i', 1], ['_i', 'B', 1]], txt: [[2.9, 3.1, '(d)', { c: COL.g }]] }), it: [
 { p: r`On sait que MA = 4,2 cm. Combien mesure MB ?`, n: 4.2, u: 'cm', e: r`M est sur la médiatrice de [AB] : il est à égale distance de A et de B. MB = MA = 4,2 cm.` },
 { p: r`Le triangle MAB est :`, c: ['isocèle en M', 'équilatéral', 'rectangle en M'], e: r`MA = MB : le triangle MAB est isocèle en M.` },
 { p: r`Un point K vérifie KA = KB = 3 cm. K est-il sur (d) ?`, vf: true, e: r`Un point à égale distance de A et de B est sur la médiatrice de [AB].` },
 { p: r`P n'est pas sur (d). Peut-on avoir PA = PB ?`, c: ['Non', 'Oui'], fixed: true, e: r`Si PA = PB, alors P serait sur la médiatrice. Comme il n'y est pas, $PA \ne PB$ (ici P est plus près de B).` } ] },
{ t: 'Le cercle circonscrit', q: r`O est le point de concours des médiatrices du triangle ABC, et OA = 3 cm.`, fig: triangles_circ([0, 0], [6, 0], [2, 4], { s: 32 }), it: [

 { p: r`Quel est le diamètre du cercle circonscrit ?`, n: 6, u: 'cm', e: r`Le rayon est OA = 3 cm, le diamètre $2 \times 3 = 6$ cm.` },
 { p: r`Combien de médiatrices faut-il tracer au minimum pour trouver O ?`, n: 2, e: r`Deux médiatrices suffisent : leur intersection est O. La troisième passe aussi par O.` } ] },
{ t: 'Triangle rectangle et cercle', q: r`ABC est un triangle rectangle en A tel que BC = 10 cm.`, fig: triangles_circ([0, 0], [6, 0], [0, 4], { s: 32, extra: { right: [['B', 'A', 'C']] }, lp: { O: 'ne' }, meds: [1, 3] }), it: [
 { p: r`Où se trouve le centre de son cercle circonscrit ?`, c: ['Au milieu de [BC]', 'Au point A', 'Au milieu de [AB]', 'À l’extérieur du triangle'], e: r`Dans un triangle rectangle, le centre du cercle circonscrit est le milieu de l'hypoténuse [BC].` },
 { p: r`Rayon du cercle circonscrit :`, n: 5, u: 'cm', e: r`Le diamètre est l'hypoténuse : $10 \div 2 = 5$ cm.` },
 { p: r`Si O est le milieu de [BC], combien mesure OA ?`, n: 5, u: 'cm', e: r`A est sur le cercle de centre O et de rayon 5 cm : OA = 5 cm.` } ] },
{ t: 'Où est le centre ?', q: r`Où se trouve le centre du cercle circonscrit ?`, it: [
 { p: r`Dans un triangle dont tous les angles sont aigus :`, c: ['À l’intérieur du triangle', 'À l’extérieur du triangle', 'Sur un côté'], fixed: true, e: r`Les trois médiatrices se coupent à l'intérieur quand les trois angles sont aigus.` },
 { p: r`Dans un triangle qui a un angle obtus :`, c: ['À l’extérieur du triangle', 'À l’intérieur du triangle', 'Sur un côté'], fixed: true, e: r`Le centre est à l'extérieur, du côté opposé à l'angle obtus.` },
 { p: r`Dans un triangle rectangle :`, c: ['Au milieu de l’hypoténuse', 'Au sommet de l’angle droit', 'À l’extérieur du triangle'], fixed: true, e: r`Le centre est le milieu de l'hypoténuse.` } ] },
{ t: 'Isocèle et équilatéral', q: r`Vrai ou faux ?`, it: [
 { p: r`Dans un triangle ABC isocèle en A, la médiatrice de [BC] passe par A.`, vf: true, e: r`AB = AC : A est à égale distance de B et de C, donc il est sur la médiatrice de [BC].` },
 { p: r`Dans un triangle équilatéral, chaque médiatrice passe par un sommet.`, vf: true, e: r`Les trois côtés sont égaux : chaque sommet est à égale distance des deux autres, donc sur la médiatrice du côté opposé.` },
 { p: r`Un triangle isocèle de côtés 3 cm, 3 cm et 7 cm existe.`, vf: false, e: r`$3 + 3 = 6 < 7$ : impossible.` },
 { p: r`Un triangle isocèle a pour périmètre 20 cm et sa base mesure 6 cm. Ses deux autres côtés mesurent 7 cm.`, vf: true, e: r`$20 - 6 = 14$ et $14 \div 2 = 7$ cm. Et $7 < 7 + 6$ : il existe bien.` } ] }
],
appro: [
{ t: 'Le triangle de corde', q: r`Mila a une corde de 24 m pour délimiter un potager triangulaire. Un des côtés doit mesurer 10 m (le long du mur).`, aide: r`Les deux autres côtés mesurent ensemble $24 - 10$ m. Teste l'inégalité triangulaire avec la plus grande longueur.`, it: [
 { p: r`Quelle longueur de corde reste-t-il pour les deux autres côtés ?`, n: 14, u: 'm', e: r`$24 - 10 = 14$ m.` },
 { p: r`Peut-elle faire un triangle de côtés 10 m, 9 m et 5 m ?`, c: ['Oui', 'Non'], fixed: true, e: r`$9 + 5 = 14$ ✔ (toute la corde) et la plus grande, 10, vérifie $10 < 9 + 5 = 14$ : oui.` },
 { p: r`Peut-elle faire un triangle de côtés 10 m, 12 m et 2 m ?`, c: ['Non, les points seraient alignés', 'Oui'], fixed: true, e: r`$10 + 2 = 12$ : égalité, les trois piquets seraient alignés.` },
 { p: r`Elle veut un triangle isocèle avec deux côtés égaux (en plus du côté de 10 m). Combien mesure chacun d'eux ?`, n: 7, u: 'm', e: r`$14 \div 2 = 7$ m. Vérification : $10 < 7 + 7 = 14$ ✔.` },
 { p: r`Quelle est la plus grande longueur possible (en m, nombre entier) pour un des deux autres côtés ?`, n: 11, u: 'm', e: r`Si un côté mesure $x$, l'autre mesure $14 - x$. Il faut $x < 10 + (14 - x)$, soit $2x < 24$, donc $x < 12$. En entier : 11 m (côtés 10, 11 et 3 : $11 < 13$ ✔).` } ] },
{ t: 'La fontaine du village', q: r`Trois maisons A, B et C sont placées comme sur le plan (1 carreau = 1 km, figure en vraie grandeur à l'échelle). La mairie veut installer une fontaine à la même distance des trois maisons.`, fig: triangles_circ([0, 0], [8, 0], [0, 6], { s: 30, extra: { grid: true, right: [['B', 'A', 'C']] }, lp: { O: 'ne' }, meds: [1, 3] }), aide: r`Un point à égale distance de A, B et C est sur les médiatrices du triangle. Ici, le triangle est rectangle en A.`, it: [
 { p: r`Où faut-il placer la fontaine ?`, c: ['Au centre du cercle circonscrit, ici le milieu de [BC]', 'Au milieu de [AB]', 'Au point A', 'Au centre de gravité'], e: r`La fontaine doit être sur les trois médiatrices : au centre du cercle circonscrit. Le triangle est rectangle en A, donc c'est le milieu de l'hypoténuse [BC].` },
 { p: r`Sur le plan, BC mesure 10 carreaux. À quelle distance (en km) de chaque maison sera la fontaine ?`, n: 5, u: 'km', e: r`Le rayon est la moitié de l'hypoténuse : $10 \div 2 = 5$ km.` },
 { p: r`Coordonnées de la fontaine si A est à l'origine, B à 8 carreaux à droite et C à 6 carreaux en haut : (x ; y) =`, n: [4, 3], lab: [r`$x =$`, r`$y =$`], e: r`Milieu de [BC] : à mi-chemin entre (8 ; 0) et (0 ; 6), soit (4 ; 3).` } ] },
{ t: 'Dans un demi-cercle', q: r`[BC] est un diamètre d'un cercle de centre O et de rayon 3,5 cm. A est un point du cercle, différent de B et C.`, fig: geo({ s: 40, pts: { B: [-3.5, 0], C: [3.5, 0], O: [0, 0], A: triangles_P([0, 0], 3.5, 56) }, lp: { O: 's', A: 'n' }, circles: [{ o: 'O', r: 3.5, c: COL.r }], polys: [{ p: ['A', 'B', 'C'], fill: '#2f5bd314', c: COL.k }], segs: [['O', 'A', { c: COL.o, dash: true }]], right: [['B', 'A', 'C']] }), aide: r`Utilise la propriété du triangle rectangle et de son cercle circonscrit (dans l'autre sens) : on l'admet en 5e.`, it: [
 { p: r`Longueur de l'hypoténuse [BC] :`, n: 7, u: 'cm', e: r`[BC] est un diamètre : $2 \times 3,5 = 7$ cm.` },
 { p: r`Combien mesure OA ?`, n: 3.5, u: 'cm', e: r`A est sur le cercle de centre O : OA est un rayon, 3,5 cm.` },
 { p: r`Les triangles OAB et OAC sont :`, c: ['isocèles en O', 'équilatéraux', 'rectangles en O'], e: r`OA = OB = OC = 3,5 cm (rayons) : OAB et OAC sont isocèles en O.` },
 { p: r`Si $\widehat{ABC} = 28°$, quelle est la mesure de $\widehat{ACB}$ ?`, n: 62, u: '°', e: r`Le triangle ABC est rectangle en A (inscrit dans un demi-cercle) : les angles aigus sont complémentaires, $90° - 28° = 62°$.` } ] },
{ t: 'Données partielles', q: r`Lucas doit construire un triangle EFG avec EF = 7 cm, $\widehat{FEG} = 30°$ et $\widehat{EGF} = 100°$. Lina doit construire un triangle avec trois angles de $50°$, $60°$ et $70°$.`, aide: r`Calcule l'angle qui manque pour Lucas. Pour Lina, regarde s'il y a une longueur.`, it: [

/* pied de la perpendiculaire à (ab) passant par p */
const hauteurs_foot = (p, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy); return [a[0] + t * dx, a[1] + t * dy]; };
/* intersection des droites (ab) et (cd) */
const hauteurs_inter = (a, b, c, d) => { const x1 = b[0] - a[0], y1 = b[1] - a[1], x2 = d[0] - c[0], y2 = d[1] - c[1], den = x1 * y2 - y1 * x2, t = ((c[0] - a[0]) * y2 - (c[1] - a[1]) * x2) / den; return [a[0] + t * x1, a[1] + t * y1]; };

CH({ id: 'hauteurs-aires', th: 'Géométrie', per: 'Périodes 3 et 5', t: 'Hauteurs, aire du triangle et médianes',
intro: r`Tracer les hauteurs d'un triangle, calculer son aire avec la formule « base × hauteur ÷ 2 », tracer les médianes et démontrer qu'une médiane partage un triangle en deux triangles de même aire.`,
cours: [
{ t: 'Les hauteurs d’un triangle', h: DEF(r`Une <b>hauteur</b> d'un triangle est la droite qui passe par un <b>sommet</b> et qui est <b>perpendiculaire au côté opposé</b>. Le point d'intersection avec ce côté s'appelle le <b>pied</b> de la hauteur.<br>On appelle aussi « hauteur » la <b>longueur</b> du segment entre le sommet et le pied.`) + FIG(hauteurs_fig1) + EXM(r`Ci-dessus, la hauteur issue de C est la droite (CH), perpendiculaire à [AB] en H. On dit que c'est la hauteur <b>relative au côté [AB]</b> : [AB] est la base associée.`) + METH(r`Je pose un côté de l'équerre le long du côté opposé, je fais glisser l'équerre jusqu'à ce que l'autre côté de l'angle droit passe par le sommet, puis je trace. Je code l'angle droit.`, 'Méthode : tracer une hauteur à l’équerre') + ATT(r`Si le triangle a un angle obtus, certaines hauteurs sont <b>à l'extérieur</b> du triangle : il faut d'abord <b>prolonger</b> le côté opposé.`) + FIG(hauteurs_fig2) },
{ t: 'Les trois hauteurs sont concourantes', h: PROP(r`Les trois hauteurs d'un triangle sont <b>concourantes</b> : elles se coupent en un même point, appelé l'<b>orthocentre</b> du triangle.`) + FIG(hauteurs_fig3) + `<p style="text-align:center"><small>Les trois hauteurs (rouge, verte, violette) se coupent au point K, l'orthocentre.</small></p>` + PROP(r`Dans un triangle <b>rectangle</b>, les deux côtés de l'angle droit sont aussi des hauteurs : l'orthocentre est le sommet de l'angle droit.`, 'Cas du triangle rectangle') + ATT(r`Ne confonds pas : <b>médiatrice</b> = perpendiculaire au <b>milieu</b> d'un côté ; <b>hauteur</b> = perpendiculaire qui passe par le <b>sommet opposé</b>. En général, ce ne sont pas les mêmes droites.`) },
{ t: 'L’aire d’un triangle', h: PROP(r`L'aire d'un triangle est égale à la moitié du produit d'une base par la hauteur associée :
<p style="text-align:center">$\text{Aire} = \frac{\text{base} \times \text{hauteur}}{2} = \frac{b \times h}{2}$</p>`) + FIG(hauteurs_fig4) + DEMO(r`La hauteur [CH] partage le triangle en deux triangles rectangles 1 et 2. Chacun est la moitié d'un rectangle (on le coupe par sa diagonale). Les deux rectangles forment le grand rectangle de longueur $b$ et de largeur $h$, d'aire $b \times h$. Le triangle en est donc la moitié : $\frac{b \times h}{2}$.`, 'Pourquoi ?') + EXM(r`Base AB = 6 cm et hauteur CH = 3,5 cm : $\text{Aire} = \frac{6 \times 3,5}{2} = \frac{21}{2} = 10,5$ cm².`) + METH(r`<ol><li>Je choisis une base et je repère la <b>hauteur associée</b> (perpendiculaire à cette base).</li><li>Je vérifie que les deux longueurs sont dans la <b>même unité</b>.</li><li>Je calcule $b \times h \div 2$ et j'écris l'unité d'aire (cm², m²…).</li></ol>`, 'Méthode') + ATT(r`On ne multiplie pas deux côtés quelconques ! La hauteur doit être <b>perpendiculaire</b> à la base. Dans un triangle rectangle, on peut prendre les deux côtés de l'angle droit (mais pas l'hypoténuse avec un autre côté).`) },
{ t: 'Choisir la base, comparer des aires', h: PROP(r`On peut prendre <b>n'importe quel côté</b> comme base, à condition d'utiliser la hauteur associée : on trouve toujours la même aire.`) + EXM(r`Le triangle à angle obtus ci-dessous a pour base AB = 4 cm et hauteur associée CH = 3 cm (à l'extérieur) : $\text{Aire} = \frac{4 \times 3}{2} = 6$ cm².`) + FIG(hauteurs_fig2) + PROP(r`Des triangles qui ont des <b>bases de même longueur</b> et des <b>hauteurs de même longueur</b> ont la <b>même aire</b>.`) + FIG(hauteurs_fig5) + EXM(r`Les triangles ABC, ABD et ABE ont la même base [AB] de 5 cm. Leurs sommets C, D, E sont sur une parallèle à (AB) située à 3 cm : leurs hauteurs mesurent toutes 3 cm. Ils ont tous une aire de $\frac{5 \times 3}{2} = 7,5$ cm², même s'ils n'ont pas la même forme !`) },
{ t: 'Les médianes', h: DEF(r`Une <b>médiane</b> d'un triangle est le segment (ou la droite) qui joint un <b>sommet</b> au <b>milieu du côté opposé</b>.`) + FIG(hauteurs_fig6) + PROP(r`Les trois médianes d'un triangle sont <b>concourantes</b> en un point appelé le <b>centre de gravité</b> du triangle (ici G). Si on découpe le triangle dans du carton, il tient en équilibre sur la pointe d'un crayon placée en G !`) + METH(r`Pour tracer la médiane issue de A : je place le milieu I de [BC] (avec la règle graduée ou le compas), puis je trace [AI]. Je code les deux longueurs égales.`, 'Méthode') + ATT(r`Une médiane ne coupe pas forcément le côté à angle droit : ce n'est pas une hauteur (sauf cas particulier).`) },
{ t: 'Médiane et aire', h: PROP(r`Une médiane partage un triangle en <b>deux triangles de même aire</b>.`) + FIG(hauteurs_fig7) + DEMO(r`Soit M le milieu de [BC]. Les triangles ABM et AMC ont :<ul><li>des bases de même longueur : BM = MC (M est le milieu de [BC]) ;</li><li>la même hauteur : la hauteur [AH] issue de A, perpendiculaire à (BC), sert pour les deux.</li></ul>
Donc $\text{Aire}(ABM) = \frac{BM \times AH}{2} = \frac{MC \times AH}{2} = \text{Aire}(AMC)$. Chacun a la moitié de l'aire de ABC.`) + EXM(r`Ici BC = 6 et AH = 4 : $\text{Aire}(ABC) = \frac{6 \times 4}{2} = 12$, et $\text{Aire}(ABM) = \text{Aire}(AMC) = \frac{3 \times 4}{2} = 6$.`) + PROP(r`Dans un triangle <b>isocèle en A</b>, la médiane issue de A est aussi la hauteur, la médiatrice de [BC] et l'axe de symétrie. Dans un triangle <b>équilatéral</b>, c'est vrai pour les trois médianes.`, 'Triangles particuliers') + FIG(geo({ s: 40, pad: 44, pts: { B: [0, 0], C: [5, 0], A: [2.5, 4], M: [2.5, 0] }, lp: { A: 'n', M: 's' }, polys: [{ p: ['A', 'B', 'C'], fill: '#1f9d5518', c: COL.k }], segs: [['A', 'M', { c: COL.r }]], right: [['C', 'M', 'A']], ticks: [['A', 'B', 2], ['A', 'C', 2], ['B', 'M', 1], ['M', 'C', 1]] })) + RET(r`<ul><li>Hauteur : passe par un sommet, perpendiculaire au côté opposé ; les 3 hauteurs sont concourantes (orthocentre).</li><li>Aire du triangle $= \frac{\text{base} \times \text{hauteur}}{2}$.</li><li>Médiane : joint un sommet au milieu du côté opposé ; les 3 médianes sont concourantes (centre de gravité).</li><li>Une médiane partage le triangle en deux triangles de même aire.</li></ul>`) }
],

/* ===== 5e — La symétrie centrale (demi-tour) ===== */
const symcen_img = (p, o) => [2 * o[0] - p[0], 2 * o[1] - p[1]];
/* points d'une figure F1..Fn et de son image G1..Gn par la transformation f */
function symcen_pts(F, f, pre, pre2){
  const P = {}; F.forEach((p, k) => { P['_' + (pre || 'f') + k] = p; P['_' + (pre2 || 'g') + k] = f(p); }); return P;
}
const symcen_names = (n, pre) => Array.from({ length: n }, (_, k) => '_' + pre + k);
const symcen_L = [[1, 1], [3, 1], [3, 2], [2, 2], [2, 4], [1, 4]];
/* figure en L et son image par le demi-tour de centre O */
const symcen_figL = geo({ s: 34, grid: true, pts: Object.assign({ O: [4, 2], _c1: [0, -0.5], _c2: [8, 4.5] }, symcen_pts(symcen_L, p => symcen_img(p, [4, 2]))), hide: ['_c1', '_c2'], lp: { O: 'n' }, polys: [{ p: symcen_names(6, 'f'), fill: '#2f5bd344', c: COL.b }, { p: symcen_names(6, 'g'), fill: '#e07b0044', c: COL.o }], segs: [['_f0', '_g0', { c: COL.r, dash: true, w: 1.4 }], ['_f4', '_g4', { c: COL.r, dash: true, w: 1.4 }]], txt: [[1.5, 4.5, 'F', { c: COL.b }], [6.5, -0.4, 'F’', { c: COL.o }]] });
/* symétrique d'un point */
const symcen_figPt = geo({ s: 44, pts: { M: [0, 0], O: [3, 1.2], 'M’': [6, 2.4] }, lp: { O: 'n', 'M’': 'e', M: 'w' }, segs: [['M', 'M’', { c: '#8a94a8', dash: true }]], ticks: [['M', 'O', 2], ['O', 'M’', 2]], arcs: [{ o: 'O', r: Math.hypot(3, 1.2), a1: 190, a2: 215, c: '#8a94a8' }, { o: 'O', r: Math.hypot(3, 1.2), a1: 10, a2: 35, c: '#8a94a8' }] });
/* symétrique d'un segment, d'une droite, d'un cercle */
const symcen_O = [4, 2.5];
const symcen_figSeg = geo({ s: 36, pts: { A: [1, 3], B: [3.5, 5], O: symcen_O, 'A’': symcen_img([1, 3], symcen_O), 'B’': symcen_img([3.5, 5], symcen_O) }, lp: { O: 'e', A: 'w', B: 'n', 'A’': 'e', 'B’': 's' }, segs: [['A', 'B', { c: COL.b, w: 3 }], ['A’', 'B’', { c: COL.o, w: 3 }], ['A', 'A’', { c: '#8a94a8', dash: true, w: 1.2 }], ['B', 'B’', { c: '#8a94a8', dash: true, w: 1.2 }]], ticks: [['A', 'O', 1], ['O', 'A’', 1], ['B', 'O', 2], ['O', 'B’', 2]], txt: [[4, -0.6, 'A’B’ = AB et (A’B’) // (AB)', { c: COL.k, size: 12 }]] });
const symcen_figCer = geo({ s: 30, pts: { C: [1.5, 1.5], O: [4, 2.5], 'C’': symcen_img([1.5, 1.5], [4, 2.5]) }, lp: { O: 'n', 'C’': 'e', C: 'w' }, circles: [{ o: 'C', r: 1.4, c: COL.b }, { o: 'C’', r: 1.4, c: COL.o }], segs: [['C', 'C’', { c: '#8a94a8', dash: true, w: 1.2 }]], ticks: [['C', 'O', 1], ['O', 'C’', 1]], txt: [[4, -0.6, 'même rayon', { c: COL.k, size: 12 }]] });
/* triangle et image : conservation */
const symcen_T = { A: [0, 0], B: [3, 0.5], C: [1, 2.5] }, symcen_TO = [4, 1.5];
const symcen_figTri = geo({ s: 40, pts: { A: symcen_T.A, B: symcen_T.B, C: symcen_T.C, O: symcen_TO, 'A’': symcen_img(symcen_T.A, symcen_TO), 'B’': symcen_img(symcen_T.B, symcen_TO), 'C’': symcen_img(symcen_T.C, symcen_TO) }, lp: { O: 'n', A: 'sw', 'A’': 'ne', C: 'n', 'C’': 's' }, polys: [{ p: ['A', 'B', 'C'], fill: '#2f5bd333', c: COL.b }, { p: ['A’', 'B’', 'C’'], fill: '#e07b0033', c: COL.o }], segs: [['A', 'A’', { c: '#8a94a8', dash: true, w: 1.2 }], ['B', 'B’', { c: '#8a94a8', dash: true, w: 1.2 }], ['C', 'C’', { c: '#8a94a8', dash: true, w: 1.2 }]], angles: [['B', 'A', 'C', { c: COL.r, fill: true }], ['B’', 'A’', 'C’', { c: COL.r, fill: true }]], ticks: [['A', 'B', 1, COL.b], ['A’', 'B’', 1, COL.b], ['B', 'C', 2, COL.g], ['B’', 'C’', 2, COL.g]] });
/* figures avec ou sans centre de symétrie */
const symcen_figCentres = geo({ s: 30, pts: { _a: [0, 0], _b: [4, 0], _c: [5.5, 2.5], _d: [1.5, 2.5], O: [2.75, 1.25] }, lp: { O: 's' }, polys: [{ p: ['_a', '_b', '_c', '_d'], fill: '#1f9d5533', c: COL.g }], segs: [['_a', '_c', { c: '#8a94a8', dash: true, w: 1.2 }], ['_b', '_d', { c: '#8a94a8', dash: true, w: 1.2 }]], txt: [[2.75, -0.8, 'parallélogramme : centre O', { c: COL.k, size: 12 }]] })
  + ' ' + geo({ s: 30, pts: { O: [0, 0] }, lp: { O: 's' }, circles: [{ o: 'O', r: 1.6, c: COL.b }], txt: [[0, -2.3, 'cercle : son centre', { c: COL.k, size: 12 }]] })
  + ' ' + geo({ s: 30, pts: { _a: [0, 0], _b: [4, 0], _c: [1.5, 3] }, polys: [{ p: ['_a', '_b', '_c'], fill: '#d23c3c22', c: COL.r }], txt: [[2, -0.8, 'triangle : pas de centre', { c: COL.k, size: 12 }]] });
/* axiale ou centrale */
const symcen_figAxe = geo({ s: 30, grid: true, pts: Object.assign({ _u: [4, -0.5], _v: [4, 4.5] }, symcen_pts(symcen_L, p => [8 - p[0], p[1]])), polys: [{ p: symcen_names(6, 'f'), fill: '#2f5bd344', c: COL.b }, { p: symcen_names(6, 'g'), fill: '#1f9d5544', c: COL.g }], segs: [['_u', '_v', { c: COL.r, w: 2.6 }]], txt: [[4, -1.1, 'symétrie axiale : on retourne', { c: COL.k, size: 12 }]] });
const symcen_figDemi = geo({ s: 30, grid: true, pts: Object.assign({ O: [4, 2], _c1: [0, -0.5], _c2: [8, 4.5] }, symcen_pts(symcen_L, p => symcen_img(p, [4, 2]))), hide: ['_c1', '_c2'], lp: { O: 'n' }, polys: [{ p: symcen_names(6, 'f'), fill: '#2f5bd344', c: COL.b }, { p: symcen_names(6, 'g'), fill: '#e07b0044', c: COL.o }], txt: [[4, -1.1, 'demi-tour : on fait tourner', { c: COL.k, size: 12 }]] });
/* point B tel que l'angle OAB mesure 50° (A = origine, O = [2.4, 2]) */
const symcen_B50 = (() => { const t = Math.atan2(2, 2.4) - 50 * Math.PI / 180; return [3.2 * Math.cos(t), 3.2 * Math.sin(t)]; })();
/* exercice : trois images d'un drapeau */
const symcen_D = [[1, 1], [1, 4], [3, 3.5], [1, 3]];
const symcen_quiz = (f, extra) => geo(Object.assign({ s: 26, grid: true, pts: Object.assign({ _c1: [0, -0.5], _c2: [8, 4.5] }, symcen_pts(symcen_D, f)), hide: ['_c1', '_c2'], polys: [{ p: symcen_names(4, 'f'), fill: '#2f5bd355', c: COL.b }, { p: symcen_names(4, 'g'), fill: '#e07b0055', c: COL.o }] }, extra || {}));

intro: r`Découvrir le demi-tour (la symétrie centrale), construire le symétrique d'un point, d'un segment, d'une droite, d'un cercle, connaître ce qu'il conserve et ne pas le confondre avec la symétrie axiale.`,
cours: [
{ t: 'Le demi-tour', h: DEF(r`Faire un <b>demi-tour</b> autour d'un point O, c'est faire tourner la figure d'un demi-tour ($180°$) autour de O, comme une aiguille qui passe de midi à six heures. On l'appelle aussi la <b>symétrie centrale de centre O</b>.`) + FIG(symcen_figL) + `<p style="text-align:center"><small>La figure F’ (orange) est l'image de la figure F (bleue) par le demi-tour de centre O.</small></p>` + EXM(r`Pour vérifier, on peut décalquer la figure F, piquer la pointe du compas en O sur le calque et faire tourner le calque d'un demi-tour : F vient se poser exactement sur F’.`) + ATT(r`Un demi-tour ne « retourne » pas la figure : il la fait tourner. Le haut devient le bas et la gauche devient la droite.`) },
{ t: 'Le symétrique d’un point', h: DEF(r`Le <b>symétrique</b> d'un point M par rapport à un point O est le point M’ tel que <b>O est le milieu du segment [MM’]</b>.<br>Le symétrique de O est O lui-même.`) + FIG(symcen_figPt) + METH(r`<ol><li>Je trace la demi-droite [MO).</li><li>Je pique le compas en O et je prends l'écartement OM.</li><li>Je reporte cette longueur de l'autre côté de O sur la demi-droite : j'obtiens M’.</li><li>Je code : OM = OM’.</li></ol>`, 'Méthode : à la règle et au compas') + METH(r`Je compte les carreaux pour aller de M à O (par exemple 3 à droite et 1 en haut), puis je refais <b>le même déplacement</b> à partir de O : 3 à droite et 1 en haut. J'arrive en M’.`, 'Méthode : sur quadrillage') + FIG(geo({ s: 34, grid: true, pts: { M: [0, 0], O: [3, 1], 'M’': [6, 2], _a: [3, 0], _b: [6, 1] }, lp: { M: 'sw', O: 'nw', 'M’': 'ne' }, arrows: [['M', '_a', { c: COL.b }], ['_a', 'O', { c: COL.g }], ['O', '_b', { c: COL.b }], ['_b', 'M’', { c: COL.g }]], txt: [[1.5, -0.45, '3', { c: COL.b }], [3.35, 0.5, '1', { c: COL.g }], [4.5, 0.55, '3', { c: COL.b }], [6.35, 1.5, '1', { c: COL.g }]] })) + EXM(r`Dans un repère, le symétrique du point $A(3 ; 2)$ par rapport à l'origine O est le point $A’(-3 ; -2)$ : on prend les <b>opposés</b> des coordonnées.`) },
{ t: 'Segments, droites et cercles', h: PROP(r`<ul><li>Le symétrique d'un <b>segment</b> est un segment <b>de même longueur</b>, et il est <b>parallèle</b> au segment de départ.</li><li>Le symétrique d'une <b>droite</b> est une droite <b>parallèle</b> à la droite de départ. (Une droite qui passe par O est sa propre image.)</li><li>Le symétrique d'un <b>cercle</b> est un cercle <b>de même rayon</b> ; son centre est le symétrique du centre.</li></ul>`) + FIG(symcen_figSeg + ' ' + symcen_figCer) + METH(r`Pour construire le symétrique d'un segment [AB], je construis les symétriques A’ et B’ de ses extrémités, puis je trace [A’B’]. Pour un cercle, je construis le symétrique du centre et je garde le même rayon. Pour un polygone, je construis le symétrique de chaque sommet.`) },

CH({ id: 'parallelogrammes', th: 'Géométrie', per: 'Période 4', t: 'Les parallélogrammes',
intro: r`Définir et construire un parallélogramme, connaître et utiliser ses propriétés (côtés, angles, diagonales), reconnaître un rectangle, un losange ou un carré, et calculer l'aire d'un parallélogramme.`,
cours: [
{ t: 'Définition', h: DEF(r`Un <b>parallélogramme</b> est un quadrilatère dont les <b>côtés opposés sont parallèles</b> deux à deux.`) + FIG(parallelo_figDef) + PROP(r`Un parallélogramme a un <b>centre de symétrie</b> : le point d'intersection O de ses diagonales. Le demi-tour de centre O échange A et C, et échange B et D.`) + ATT(r`On nomme un quadrilatère en tournant autour : ABCD veut dire que les côtés sont [AB], [BC], [CD], [DA] et que les diagonales sont [AC] et [BD]. Ne saute pas de sommet !`) },
{ t: 'Les propriétés du parallélogramme', h: PROP(r`Si un quadrilatère est un parallélogramme, alors :<ul><li>ses <b>côtés opposés ont la même longueur</b> : AB = DC et AD = BC ;</li><li>ses <b>diagonales se coupent en leur milieu</b> : O est le milieu de [AC] et de [BD] ;</li><li>ses <b>angles opposés ont la même mesure</b> : $\widehat{A} = \widehat{C}$ et $\widehat{B} = \widehat{D}$ ;</li><li>deux angles <b>consécutifs</b> sont <b>supplémentaires</b> : $\widehat{A} + \widehat{B} = 180°$.</li></ul>`) + FIG(parallelo_figProp) + DEMO(r`Le demi-tour de centre O transforme A en C et B en D. Donc il transforme [AB] en [CD] : comme il conserve les longueurs, AB = CD. De même, il transforme l'angle $\widehat{DAB}$ en $\widehat{BCD}$ : les angles opposés sont égaux.<br>Les angles $\widehat{A}$ et $\widehat{B}$ sont supplémentaires : ce sont des angles « intérieurs du même côté » de la sécante (AB) pour les parallèles (AD) et (BC) (l'angle $\widehat{A}$ est égal au correspondant de l'angle voisin de $\widehat{B}$).`, 'Pourquoi ?') + EXM(r`ABCD est un parallélogramme avec AB = 5 cm, AD = 3 cm et $\widehat{A} = 70°$. Alors DC = 5 cm, BC = 3 cm, $\widehat{C} = 70°$ et $\widehat{B} = \widehat{D} = 180° - 70° = 110°$. Périmètre : $2 \times (5 + 3) = 16$ cm.`) },
{ t: 'Reconnaître un parallélogramme', h: PROP(r`Un quadrilatère est un parallélogramme si l'une de ces conditions est vraie :<ul><li>ses côtés opposés sont parallèles (c'est la définition) ;</li><li>ses <b>diagonales ont le même milieu</b> ;</li><li>(quadrilatère non croisé) ses <b>côtés opposés ont la même longueur deux à deux</b> ;</li><li>(quadrilatère non croisé) deux côtés opposés sont <b>parallèles et de même longueur</b>.</li></ul>`, 'Propriétés caractéristiques') + METH(r`<b>On sait que</b> les diagonales [AC] et [BD] du quadrilatère ABCD ont le même milieu O.<br><b>Or</b> si les diagonales d'un quadrilatère ont le même milieu, alors c'est un parallélogramme.<br><b>Donc</b> ABCD est un parallélogramme.`, 'Méthode : rédiger') + ATT(r`Un quadrilatère avec seulement <b>deux</b> côtés parallèles est un <b>trapèze</b>, pas forcément un parallélogramme. Et on ne prouve jamais avec « on voit que » ou une mesure sur le dessin.`) + FIG(geo({ s: 34, pts: { A: [0, 0], B: [6, 0], C: [4.5, 2.5], D: [1, 2.5] }, lp: { C: 'ne', D: 'nw' }, polys: [{ p: ['A', 'B', 'C', 'D'], fill: '#d23c3c18', c: COL.r }], txt: [[3, -0.8, 'trapèze : (AB) // (DC) mais pas (AD) // (BC)', { c: COL.r, size: 12 }]] })) },
{ t: 'Construire un parallélogramme', h: METH(r`On donne A, B, C. Pour placer D tel que ABCD soit un parallélogramme :<ol><li>Je trace un arc de cercle de centre A et de rayon BC.</li><li>Je trace un arc de cercle de centre C et de rayon AB.</li><li>D est le point d'intersection des arcs (du bon côté !). Ainsi AD = BC et DC = AB.</li></ol>`, 'Méthode 1 : au compas (côtés opposés égaux)') + FIG(parallelo_figConst) + METH(r`Je trace [AC], je place son milieu O, puis je place D symétrique de B par rapport à O (D sur la demi-droite [BO) avec OD = OB). Les diagonales ont le même milieu.`, 'Méthode 2 : avec les diagonales') + METH(r`Je trace la parallèle à (BC) passant par A et la parallèle à (AB) passant par C (avec la règle et l'équerre). D est à leur intersection.`, 'Méthode 3 : avec des parallèles') + METH(r`Sur un quadrillage : pour aller de B à A, je fais un certain déplacement (par exemple 4 carreaux à gauche) ; je fais le <b>même déplacement</b> à partir de C pour obtenir D.`, 'Méthode 4 : sur quadrillage') },
{ t: 'Rectangle, losange et carré', h: DEF(r`<ul><li>Un <b>rectangle</b> est un parallélogramme qui a <b>un angle droit</b> (il en a alors quatre).</li><li>Un <b>losange</b> est un parallélogramme qui a <b>deux côtés consécutifs de même longueur</b> (il a alors ses quatre côtés égaux).</li><li>Un <b>carré</b> est à la fois un rectangle et un losange.</li></ul>`) + FIG(parallelo_figRect + ' ' + parallelo_figLos + ' ' + parallelo_figCar) + TAB([['', 'Parallélogramme', 'Rectangle', 'Losange', 'Carré'], ['Côtés opposés parallèles et de même longueur', '✔', '✔', '✔', '✔'], ['Diagonales de même milieu', '✔', '✔', '✔', '✔'], ['Quatre angles droits', '', '✔', '', '✔'], ['Quatre côtés égaux', '', '', '✔', '✔'], ['Diagonales de même longueur', '', '✔', '', '✔'], ['Diagonales perpendiculaires', '', '', '✔', '✔']]) + PROP(r`<ul><li>Un parallélogramme dont les diagonales ont la <b>même longueur</b> est un <b>rectangle</b>.</li><li>Un parallélogramme dont les diagonales sont <b>perpendiculaires</b> est un <b>losange</b>.</li><li>Un parallélogramme dont les diagonales sont perpendiculaires et de même longueur est un <b>carré</b>.</li></ul>`, 'Propriétés caractéristiques') + ATT(r`Tous les carrés sont des rectangles et des losanges, mais un rectangle n'est pas toujours un carré !`) },
{ t: 'Aire d’un parallélogramme', h: PROP(r`L'aire d'un parallélogramme est égale au produit d'une base par la hauteur associée :
<p style="text-align:center">$\text{Aire} = \text{base} \times \text{hauteur} = b \times h$</p>`) + FIG(parallelo_figAire) + DEMO(r`On découpe le triangle orange (le long de la hauteur) et on le recolle de l'autre côté : on obtient un rectangle de longueur $b$ et de largeur $h$, de même aire que le parallélogramme. Donc $\text{Aire} = b \times h$.`, 'Pourquoi ?') + EXM(r`Base AB = 5 cm et hauteur associée DH = 3 cm : $\text{Aire} = 5 \times 3 = 15$ cm².`) + ATT(r`On ne divise pas par 2 (c'est le triangle qui est la moitié d'un parallélogramme). Et on prend la <b>hauteur</b>, pas le côté oblique [AD].`) + RET(r`<ul><li>Parallélogramme : côtés opposés parallèles ; côtés opposés égaux ; diagonales de même milieu ; angles opposés égaux ; centre de symétrie.</li><li>Rectangle : + angle droit, diagonales de même longueur. Losange : + côtés égaux, diagonales perpendiculaires. Carré : les deux.</li><li>Aire du parallélogramme $= b \times h$.</li></ul>`) }
],
app: [
{ t: 'Côtés d’un parallélogramme', q: r`ABCD est un parallélogramme avec AB = 5 cm et AD = 3 cm (figure en vraie forme).`, fig: parallelo_fig({ lab: [['A', 'B', '5 cm', { side: 1 }], ['A', 'D', '3 cm']] }), it: [
 { p: r`Longueur DC :`, n: 5, u: 'cm', e: r`Les côtés opposés d'un parallélogramme ont la même longueur : DC = AB = 5 cm.` },
 { p: r`Longueur BC :`, n: 3, u: 'cm', e: r`BC = AD = 3 cm.` },
 { p: r`Périmètre de ABCD :`, n: 16, u: 'cm', e: r`$5 + 3 + 5 + 3 = 16$ cm.` },
 { p: r`Quelle droite est parallèle à (AD) ?`, c: ['(BC)', '(AB)', '(DC)', '(AC)'], e: r`Les côtés opposés sont parallèles : (AD) // (BC).` } ] },
{ t: 'Les diagonales', q: r`ABCD est un parallélogramme de centre O.`, aide: r`Les diagonales se coupent en leur milieu O.`, it: [
 { p: r`AC = 8 cm. Combien mesure OA ?`, n: 4, u: 'cm', e: r`O est le milieu de [AC] : $OA = 8 \div 2 = 4$ cm.` },
 { p: r`OB = 2,5 cm. Combien mesure BD ?`, n: 5, u: 'cm', e: r`O est le milieu de [BD] : $BD = 2 \times 2,5 = 5$ cm.` },
 { p: r`OC = 3 cm et OD = 3 cm. Les diagonales ont la même longueur. ABCD est :`, c: ['un rectangle', 'un losange', 'un trapèze'], e: r`AC = 6 cm et BD = 6 cm : un parallélogramme dont les diagonales ont la même longueur est un rectangle.` } ] },
{ t: 'Les angles', q: r`ABCD est un parallélogramme et $\widehat{DAB} = 70°$.`, fig: parallelo_fig({ angles: [['B', 'A', 'D', { c: COL.b, l: '70°' }]] }), it: [
 { p: r`Mesure de $\widehat{BCD}$ :`, n: 70, u: '°', e: r`Les angles opposés ont la même mesure : $70°$.` },
 { p: r`Mesure de $\widehat{ABC}$ :`, n: 110, u: '°', e: r`Deux angles consécutifs sont supplémentaires : $180° - 70° = 110°$.` },
 { p: r`Somme des quatre angles :`, n: 360, u: '°', e: r`$70 + 110 + 70 + 110 = 360°$.` } ] },
{ t: 'Est-ce un parallélogramme ?', q: r`Un quadrilatère ABCD (non croisé) vérifie la condition donnée. Est-ce forcément un parallélogramme ?`, it: [
 { p: r`Ses diagonales ont le même milieu.`, c: ['Oui', 'Non'], fixed: true, e: r`C'est une propriété caractéristique du parallélogramme.` },
 { p: r`AB = DC et AD = BC.`, c: ['Oui', 'Non'], fixed: true, e: r`Côtés opposés de même longueur deux à deux (quadrilatère non croisé) : c'est un parallélogramme.` },
 { p: r`(AB) // (DC) seulement.`, c: ['Non', 'Oui'], fixed: true, e: r`Un seul couple de côtés parallèles : c'est un trapèze, pas forcément un parallélogramme.` },
 { p: r`(AB) // (DC) et AB = DC.`, c: ['Oui', 'Non'], fixed: true, e: r`Deux côtés opposés parallèles et de même longueur : c'est un parallélogramme.` },
 { p: r`Ses diagonales sont perpendiculaires.`, c: ['Non', 'Oui'], fixed: true, e: r`Contre-exemple : un cerf-volant a des diagonales perpendiculaires mais ce n'est pas un parallélogramme (ses diagonales n'ont pas le même milieu).` } ] },
{ t: 'Rectangle et losange', q: r`Utilise les propriétés des parallélogrammes particuliers.`, it: [
 { p: r`ABCD est un rectangle de centre O avec AC = 10 cm. Combien mesure OB ?`, n: 5, u: 'cm', e: r`Les diagonales d'un rectangle ont la même longueur et le même milieu : BD = 10 cm et $OB = 5$ cm.` },
 { p: r`EFGH est un losange de côté 4,5 cm. Son périmètre :`, n: 18, u: 'cm', e: r`Quatre côtés égaux : $4 \times 4,5 = 18$ cm.` },
 { p: r`Quel angle font les diagonales d'un losange ?`, n: 90, u: '°', fig: parallelo_figLos, e: r`Les diagonales d'un losange sont perpendiculaires : $90°$.` } ] },
{ t: 'Vrai ou faux ?', q: r`Réfléchis bien aux définitions.`, it: [
 { p: r`Un carré est un losange.`, vf: true, e: r`Un carré a quatre côtés égaux : c'est un losange (particulier).` },
 { p: r`Un losange est un carré.`, vf: false, e: r`Un losange n'a pas forcément d'angle droit.` },
 { p: r`Un rectangle est un parallélogramme.`, vf: true, e: r`Par définition, un rectangle est un parallélogramme qui a un angle droit.` },
 { p: r`Les diagonales d'un parallélogramme ont toujours la même longueur.`, vf: false, e: r`Seulement pour le rectangle (et le carré). En général, elles ont seulement le même milieu.` } ] },
{ t: 'Quelle nature ?', q: r`ABCD est un parallélogramme. Que peut-on dire de plus ?`, it: [
 { p: r`Ses diagonales sont perpendiculaires.`, c: ['C’est un losange', 'C’est un rectangle', 'C’est un carré'], e: r`Parallélogramme + diagonales perpendiculaires = losange.` },
 { p: r`Il a un angle droit.`, c: ['C’est un rectangle', 'C’est un losange', 'C’est un carré'], e: r`Par définition, c'est un rectangle.` },
 { p: r`Ses diagonales sont perpendiculaires et de même longueur.`, c: ['C’est un carré', 'C’est un rectangle', 'C’est un losange'], e: r`Il est à la fois losange et rectangle : c'est un carré.` },
 { p: r`AB = BC.`, c: ['C’est un losange', 'C’est un rectangle', 'Rien de plus'], e: r`Deux côtés consécutifs égaux : c'est un losange.` } ] },
{ t: 'Placer le quatrième sommet', q: r`Dans le repère, $A(1 ; 1)$, $B(5 ; 1)$ et $C(6 ; 4)$. On cherche D tel que ABCD soit un parallélogramme.`, fig: geo({ s: 32, grid: true, axes: { x: [0, 7], y: [0, 5] }, pts: { A: [1, 1], B: [5, 1], C: [6, 4] }, lp: { A: 'nw', B: 'se', C: 'ne' }, segs: [['A', 'B'], ['B', 'C']] }), aide: r`Pour aller de B à A : 4 carreaux vers la gauche. Fais le même déplacement à partir de C.`, it: [

 { p: r`Coordonnées du centre O (milieu de [AC]) :`, n: [3.5, 2.5], lab: [r`$x =$`, r`$y =$`], e: r`Milieu de [AC] : $\left(\frac{1 + 6}{2} ; \frac{1 + 4}{2}\right) = (3,5 ; 2,5)$. C'est aussi le milieu de [BD] : $\left(\frac{5 + 2}{2} ; \frac{1 + 4}{2}\right)$. ✔` } ] },
{ t: 'Aire d’un parallélogramme', q: r`Calcule l'aire du parallélogramme.`, aide: r`Aire $=$ base $\times$ hauteur (sans diviser par 2).`, it: [

 { p: r`Sur le quadrillage (1 carreau = 1 cm) :`, fig: geo({ s: 30, grid: true, pts: { A: [1, 1], B: [6, 1], C: [8, 4], D: [3, 4], H: [3, 1], _o: [0, 0], _f: [9, 5] }, lp: { A: 'sw', B: 'se', C: 'ne', D: 'nw', H: 's' }, polys: [{ p: ['A', 'B', 'C', 'D'], fill: '#1f9d5533', c: COL.k }], segs: [['D', 'H', { c: COL.r, dash: true }]], right: [['B', 'H', 'D']] }), n: 15, u: 'cm²', e: r`Base AB = 5 cm (5 carreaux), hauteur DH = 3 cm : $5 \times 3 = 15$ cm².` } ] },

 { p: r`Un triangle a la même base (7 cm) et la même hauteur. Son aire :`, n: 21, u: 'cm²', e: r`$\frac{7 \times 6}{2} = 21$ cm² : la moitié de celle du parallélogramme.` } ] }

 { p: r`Le quadrilatère DOLE est d'abord un parallélogramme car :`, c: ['ses diagonales ont le même milieu R', 'il a quatre côtés', 'il a un angle droit'], e: r`Les diagonales [DL] et [OE] ont le même milieu R : c'est un parallélogramme.` },

{ t: 'Deux aires égales', q: r`ABCD est un parallélogramme de centre O, d'aire 48 cm².`, fig: geo({ s: 40, pad: 36, pts: Object.assign({}, parallelo_base, { O: parallelo_O }), lp: { C: 'ne', D: 'nw', O: 's' }, polys: [{ p: ['A', 'B', 'O'], fill: '#2f5bd344' }, { p: ['B', 'C', 'O'], fill: '#e07b0044' }, { p: ['A', 'B', 'C', 'D'], fill: 'none', c: COL.k }], segs: [['A', 'C', { c: COL.k, w: 1.4 }], ['B', 'D', { c: COL.k, w: 1.4 }]], ticks: [['A', 'O', 1], ['O', 'C', 1]] }), aide: r`La diagonale [AC] coupe le parallélogramme en deux triangles superposables. Puis, dans le triangle ABC, [BO] est une médiane.`, it: [

/* couleur hex mélangée avec du blanc (t = part de blanc) */
const solides_mix = (hex, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - t) + 255 * t).toString(16).padStart(2, '0')).join('');
/* élargit une figure SVG à droite (étiquettes coupées) */
const solides_wide = (svg, e) => svg.replace(/viewBox="0 0 (\d+) (\d+)" width="(\d+)"/, (m, w, h) => `viewBox="0 0 ${+w + e} ${h}" width="${+w + e}"`);
const solides_pave = (L, l, h, o) => solides_wide(pave(L, l, h, o), 40);
/* Empilement de cubes unité en perspective cavalière : solides_cubes([[x, y, z], ...], {u, k}) (y = profondeur) */
function solides_cubes(list, o){
  o = o || {}; const u = o.u || 30, k = o.k || 0.5, cx = Math.cos(Math.PI / 4) * k, cy = Math.sin(Math.PI / 4) * k;
  const xs = [], ys = [];
  list.forEach(([x, y, z]) => { [[x, y, z], [x + 1, y + 1, z + 1]].forEach(([a, b, c]) => { xs.push((a + b * cx) * u); ys.push(-(c + b * cy) * u); }); });
  const x0 = Math.min(...xs) - 12, y0 = Math.min(...ys) - 12, W = Math.max(...xs) - x0 + 12, H = Math.max(...ys) - y0 + 12;
  const pr = (a, b, c) => [((a + b * cx) * u - x0).toFixed(1), (-(c + b * cy) * u - y0).toFixed(1)].join(' ');
  const q = (pts, f) => `<path d="M${pts.map(p => pr(...p)).join('L')}Z" fill="${f}" stroke="#1d2433" stroke-width="1.2" stroke-linejoin="round"/>`;
  const c = o.c || '#2f5bd3', f1 = solides_mix(c, 0.55), f2 = solides_mix(c, 0.75), f3 = solides_mix(c, 0.35);
  let s = SVG0(W, H);
  list.slice().sort((A, B) => (B[1] - A[1]) || (A[2] - B[2]) || (A[0] - B[0])).forEach(([x, y, z]) => {
    s += q([[x, y, z], [x + 1, y, z], [x + 1, y, z + 1], [x, y, z + 1]], f1) + q([[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], f2) + q([[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]], f3);
  });
  return s + '</svg>';
}
const solides_bloc = (L, l, h) => { const a = []; for (let y = 0; y < l; y++) for (let z = 0; z < h; z++) for (let x = 0; x < L; x++) a.push([x, y, z]); return a; };
/* Prisme droit en perspective cavalière : face avant = base (polygone, en unités), profondeur d.
   solides_prisme([[0,0],[4,0],[0,3]], 6, {s, k, hid:[0], labs:[[0,1,'4 cm'],...], dl:'6 cm', c}) */
function solides_prisme(F, d, o){
  o = o || {}; const s0 = o.s || 30, k = o.k || 0.5, dx = d * k * Math.cos(Math.PI / 4), dy = d * k * Math.sin(Math.PI / 4), c = o.c || COL.b, hid = o.hid || [];
  const B = F.map(p => [p[0] + dx, p[1] + dy]);
  const all = F.concat(B), x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  const pad = 40, W = (x1 - x0) * s0 + 2 * pad + 20, H = (y1 - y0) * s0 + 2 * pad;
  const X = p => pad + (p[0] - x0) * s0, Y = p => pad + (y1 - p[1]) * s0;
  const ln = (a, b, dash, col) => `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${col || c}" stroke-width="2.2" ${dash ? 'stroke-dasharray="6 4" stroke-opacity=".75"' : ''}/>`;
  let s = SVG0(W, H) + `<path d="M${F.map(p => X(p) + ' ' + Y(p)).join('L')}Z" fill="${c}33"/>`;
  const n = F.length;
  for (let i = 0; i < n; i++){ const j = (i + 1) % n; s += ln(B[i], B[j], hid.includes(i) || hid.includes(j)); s += ln(F[i], B[i], hid.includes(i)); }
  for (let i = 0; i < n; i++) s += ln(F[i], F[(i + 1) % n]);
  (o.labs || []).forEach(([i, j, t, back]) => { const P = back ? B : F, a = P[i], b = P[j], mx = (X(a) + X(b)) / 2, my = (Y(a) + Y(b)) / 2, ddx = X(b) - X(a), ddy = Y(b) - Y(a), L = Math.hypot(ddx, ddy), cxm = (X([x0, 0]) + X([x1, 0])) / 2, cym = (Y([0, y0]) + Y([0, y1])) / 2;
    let nx = -ddy / L, ny = ddx / L; if ((mx - cxm) * nx + (my - cym) * ny < 0){ nx = -nx; ny = -ny; }
    s += svgTxt(mx + nx * 16, my + ny * 16 + 5, t, { c: COL.r, w: 'bold', size: 13 }); });
  if (o.dl){ const i = o.dli != null ? o.dli : 1, a = F[i], b = B[i]; s += svgTxt((X(a) + X(b)) / 2 + 10, (Y(a) + Y(b)) / 2 + 14, o.dl, { c: COL.r, w: 'bold', size: 13, a: 'start' }); }
  if (o.right) o.right.forEach(i => { const p = F[i], u1 = F[(i + 1) % n], u2 = F[(i + n - 1) % n], e = 0.32, v1 = [(u1[0] - p[0]), (u1[1] - p[1])], v2 = [(u2[0] - p[0]), (u2[1] - p[1])], l1 = Math.hypot(...v1), l2 = Math.hypot(...v2);
    const a = [p[0] + v1[0] / l1 * e, p[1] + v1[1] / l1 * e], b = [a[0] + v2[0] / l2 * e, a[1] + v2[1] / l2 * e], cc = [p[0] + v2[0] / l2 * e, p[1] + v2[1] / l2 * e];
    s += `<path d="M${X(a)} ${Y(a)}L${X(b)} ${Y(b)}L${X(cc)} ${Y(cc)}" fill="none" stroke="#333" stroke-width="1.3"/>`; });
  return s + '</svg>';
}
/* Cylindre de révolution : solides_cyl({R (px), H (px), lr:'r = 3 cm', lh:'h = 5 cm', c}) */
function solides_cyl(o){
  o = o || {}; const R = o.R || 55, Hh = o.H || 110, ry = R * 0.3, c = o.c || COL.b, W = 2 * R + 110, H = Hh + 2 * ry + 40, cx = R + 20, top = ry + 16, bot = top + Hh;
  let s = SVG0(W, H);
  s += `<path d="M${cx - R} ${top}L${cx - R} ${bot}A${R} ${ry} 0 0 0 ${cx + R} ${bot}L${cx + R} ${top}Z" fill="${c}1c"/>`;
  s += `<ellipse cx="${cx}" cy="${top}" rx="${R}" ry="${ry}" fill="${c}33" stroke="${c}" stroke-width="2.2"/>`;
  s += `<line x1="${cx - R}" y1="${top}" x2="${cx - R}" y2="${bot}" stroke="${c}" stroke-width="2.2"/><line x1="${cx + R}" y1="${top}" x2="${cx + R}" y2="${bot}" stroke="${c}" stroke-width="2.2"/>`;
  s += `<path d="M${cx - R} ${bot}A${R} ${ry} 0 0 0 ${cx + R} ${bot}" fill="none" stroke="${c}" stroke-width="2.2"/><path d="M${cx - R} ${bot}A${R} ${ry} 0 0 1 ${cx + R} ${bot}" fill="none" stroke="${c}" stroke-width="2.2" stroke-dasharray="6 4" stroke-opacity=".7"/>`;
  s += `<line x1="${cx}" y1="${top}" x2="${cx}" y2="${bot}" stroke="#8a94a8" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${top}" r="2.6" fill="#1d2433"/><circle cx="${cx}" cy="${bot}" r="2.6" fill="#1d2433"/>`;
  if (o.lr) s += `<line x1="${cx}" y1="${bot}" x2="${cx + R}" y2="${bot}" stroke="${COL.r}" stroke-width="1.8"/>` + svgTxt(cx + R / 2, bot - 6, o.lr, { c: COL.r, w: 'bold', size: 12 });
  if (o.lh) s += svgTxt(cx + R + 8, (top + bot) / 2 + 5, o.lh, { c: COL.r, w: 'bold', size: 13, a: 'start' });
  return s + '</svg>';
}
/* Patron d'un prisme droit à base triangulaire rectangle (côtés a, b, c avec c hypoténuse, hauteur h) */
const solides_patronPrisme = (a, b, c, h, o) => geo(Object.assign({ s: 20, pad: 30, pts: { _p0: [0, 0], _p1: [a, 0], _p2: [a + b, 0], _p3: [a + b + c, 0], _q0: [0, h], _q1: [a, h], _q2: [a + b, h], _q3: [a + b + c, h], _t: [a, h + a], _u: [a, -a] }, polys: [{ p: ['_p0', '_p1', '_q1', '_q0'], fill: '#2f5bd333', c: COL.k }, { p: ['_p1', '_p2', '_q2', '_q1'], fill: '#e07b0033', c: COL.k }, { p: ['_p2', '_p3', '_q3', '_q2'], fill: '#2f5bd333', c: COL.k }, { p: ['_q1', '_q2', '_t'], fill: '#1f9d5544', c: COL.k }, { p: ['_p1', '_p2', '_u'], fill: '#1f9d5544', c: COL.k }], lab: [['_p0', '_p1', String(a)], ['_p1', '_p2', String(b), { side: 1 }], ['_p2', '_p3', String(c), { side: 1 }], ['_p3', '_q3', String(h)]], right: [['_q2', '_q1', '_t'], ['_p2', '_p1', '_u']] }, o || {}));
/* Patron d'un cylindre : rectangle 2πr × h et deux disques */
const solides_patronCyl = (r0, h, o) => { const L = 2 * Math.PI * r0; return geo(Object.assign({ s: 20, pad: 30, pts: { _a: [0, 0], _b: [L, 0], _c: [L, h], _d: [0, h], _o1: [L / 2, h + r0], _o2: [L / 2, -r0] }, polys: [{ p: ['_a', '_b', '_c', '_d'], fill: '#2f5bd333', c: COL.k }], circles: [{ o: '_o1', r: r0, c: COL.k, fill: '#e07b0033' }, { o: '_o2', r: r0, c: COL.k, fill: '#e07b0033' }], lab: [['_b', '_c', 'h']], txt: [[L / 2, h / 2 + 0.5, 'longueur =', { size: 11 }], [L / 2, h / 2 - 0.6, 'périmètre du disque', { size: 11 }]] }, o || {})); };

<li>Un <b>prisme droit</b> a deux <b>bases</b> superposables et parallèles (des polygones : triangles, parallélogrammes…) et des <b>faces latérales</b> rectangulaires. La longueur d'une arête latérale est la <b>hauteur</b> du prisme.</li>

{ t: 'Les patrons', h: DEF(r`Un <b>patron</b> d'un solide est une figure plane qui, après pliage, permet de fabriquer ce solide, sans que deux faces se superposent.`) + FIG(patronPave(4, 3, 2, { s: 18 }) + ' ' + solides_patronPrisme(3, 4, 5, 6)) + `<p style="text-align:center"><small>À gauche : un patron de pavé droit de 4 × 3 × 2. À droite : un patron de prisme droit de hauteur 6 dont la base est un triangle rectangle de côtés 3, 4 et 5.</small></p>` + FIG(solides_patronCyl(1.5, 5)) + `<p style="text-align:center"><small>Patron d'un cylindre : un rectangle et deux disques.</small></p>` + PROP(r`Dans le patron d'un cylindre de rayon $r$ et de hauteur $h$, la surface latérale est un <b>rectangle</b> de largeur $h$ et de longueur égale au <b>périmètre du disque de base</b> : $2 \times \pi \times r$.`) + METH(r`Pour vérifier un patron : chaque arête doit avoir la <b>même longueur</b> que l'arête avec laquelle elle sera collée, et il doit y avoir le bon nombre de faces (6 pour un pavé, 5 pour un prisme à base triangulaire).`) },

/* ===== 5e — Aire du disque et volume du cylindre ===== */
/* Disque découpé en n secteurs (n pair), puis secteurs rangés tête-bêche : presque un parallélogramme de base π × r et de hauteur r */
function disque_secteurs(n, R){
  const a = 2 * Math.PI / n, w = 2 * R * Math.sin(a / 2), hh = R * Math.cos(a / 2), gap = 50, D = 2 * R + 20;
  const W = D + gap + (n / 2) * w + w / 2 + 40, H = Math.max(D, R + 60) + 30, y0 = 20 + R + (H - 30 - R) / 2 - R / 2, oy = H - 34;
  let s = SVG0(W, H);
  const cx = R + 10, cy = H / 2 - 4;
  for (let k = 0; k < n; k++){ const t1 = k * a, t2 = (k + 1) * a, col = k % 2 ? PAL[1] : PAL[0];
    s += `<path d="M${cx} ${cy}L${cx + R * Math.cos(t1)} ${cy - R * Math.sin(t1)}A${R} ${R} 0 0 0 ${cx + R * Math.cos(t2)} ${cy - R * Math.sin(t2)}Z" fill="${col}55" stroke="#1d2433" stroke-width="1"/>`; }
  s += svgTxt(D + gap / 2, cy + 6, '→', { size: 26, c: COL.r, w: 'bold' });
  const x0 = D + gap;
  for (let j = 0; j < n / 2; j++){
    const ax = x0 + j * w + w / 2, ay = oy;
    s += `<path d="M${ax} ${ay}L${ax + w / 2} ${ay - hh}A${R} ${R} 0 0 0 ${ax - w / 2} ${ay - hh}Z" fill="${PAL[0]}55" stroke="#1d2433" stroke-width="1"/>`;
    const bx = x0 + (j + 1) * w, by = oy - hh;
    s += `<path d="M${bx} ${by}L${bx - w / 2} ${oy}A${R} ${R} 0 0 0 ${bx + w / 2} ${oy}Z" fill="${PAL[1]}55" stroke="#1d2433" stroke-width="1"/>`;
  }
  const L = (n / 2) * w;
  s += `<line x1="${x0 + w / 2}" y1="${oy + 14}" x2="${x0 + w / 2 + L}" y2="${oy + 14}" stroke="${COL.r}" stroke-width="1.6"/>` + svgTxt(x0 + w / 2 + L / 2, oy + 28, 'moitié du périmètre : π × r', { c: COL.r, size: 12, w: 'bold' });
  s += `<line x1="${x0 + L + w + 10}" y1="${oy}" x2="${x0 + L + w + 10}" y2="${oy - hh}" stroke="${COL.g}" stroke-width="1.6"/>` + svgTxt(x0 + L + w + 16, oy - hh / 2 + 4, 'r', { c: COL.g, size: 14, w: 'bold', a: 'start' });
  return s + '</svg>';
}
/* Cylindre (même dessin que dans le chapitre Solides, recopié ici pour l'indépendance des fichiers) */
function disque_cyl(o){
  o = o || {}; const R = o.R || 55, Hh = o.H || 110, ry = R * 0.3, c = o.c || COL.b, W = 2 * R + 120, H = Hh + 2 * ry + 46, cx = R + 20, top = ry + 16, bot = top + Hh;
  let s = SVG0(W, H);
  s += `<path d="M${cx - R} ${top}L${cx - R} ${bot}A${R} ${ry} 0 0 0 ${cx + R} ${bot}L${cx + R} ${top}Z" fill="${c}1c"/><ellipse cx="${cx}" cy="${top}" rx="${R}" ry="${ry}" fill="${c}33" stroke="${c}" stroke-width="2.2"/>`;
  s += `<line x1="${cx - R}" y1="${top}" x2="${cx - R}" y2="${bot}" stroke="${c}" stroke-width="2.2"/><line x1="${cx + R}" y1="${top}" x2="${cx + R}" y2="${bot}" stroke="${c}" stroke-width="2.2"/>`;
  s += `<path d="M${cx - R} ${bot}A${R} ${ry} 0 0 0 ${cx + R} ${bot}" fill="none" stroke="${c}" stroke-width="2.2"/><path d="M${cx - R} ${bot}A${R} ${ry} 0 0 1 ${cx + R} ${bot}" fill="none" stroke="${c}" stroke-width="2.2" stroke-dasharray="6 4" stroke-opacity=".7"/>`;
  s += `<line x1="${cx}" y1="${top}" x2="${cx}" y2="${bot}" stroke="#8a94a8" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${bot}" r="2.6" fill="#1d2433"/><circle cx="${cx}" cy="${top}" r="2.6" fill="#1d2433"/>`;
  if (o.lr) s += `<line x1="${cx}" y1="${bot}" x2="${cx + R}" y2="${bot}" stroke="${COL.r}" stroke-width="1.8"/>` + svgTxt(cx + R / 2, bot + ry + 15, o.lr, { c: COL.r, w: 'bold', size: 12 });
  if (o.lh) s += svgTxt(cx + R + 8, (top + bot) / 2 + 5, o.lh, { c: COL.r, w: 'bold', size: 13, a: 'start' });
  return s + '</svg>';
}
const disque_figCercle = geo({ s: 40, pts: { O: [0, 0], A: [2.5, 0], _b: [-2.5 * Math.cos(Math.PI / 4), 2.5 * Math.sin(Math.PI / 4)], _c: [2.5 * Math.cos(Math.PI / 4), -2.5 * Math.sin(Math.PI / 4)] }, lp: { O: 's', A: 'e' }, circles: [{ o: 'O', r: 2.5, c: COL.b, fill: '#2f5bd318' }], segs: [['O', 'A', { c: COL.r }], ['_b', '_c', { c: COL.g }]], lab: [['O', 'A', 'r', { c: COL.r, side: -1 }]], txt: [[0, -2.95, 'diamètre d = 2 × r', { c: COL.g, size: 12 }]] });

CH({ id: 'disque-cylindre', th: 'Grandeurs et mesures', per: 'Période 4', t: 'Aire du disque et volume du cylindre',
intro: r`Calculer le périmètre d'un cercle et l'aire d'un disque, puis le volume d'un cylindre, en donnant une valeur exacte (avec $\pi$) ou une valeur approchée, pour résoudre des problèmes concrets.`,
cours: [
{ t: 'Rappel : le périmètre du cercle', h: DEF(r`Le nombre $\pi$ (« pi ») est le quotient du périmètre d'un cercle par son diamètre. Il vaut environ $3,14$ : $\pi \approx 3,14159$. On ne peut pas l'écrire exactement avec un nombre décimal.`) + FIG(disque_figCercle) + PROP(r`Le périmètre d'un cercle de rayon $r$ et de diamètre $d = 2 \times r$ est :
<p style="text-align:center">$P = 2 \times \pi \times r = \pi \times d$</p>`) + EXM(r`Cercle de rayon 5 cm : $P = 2 \times \pi \times 5 = 10\pi$ cm (valeur exacte) $\approx 31,4$ cm (arrondi au dixième).`) },
{ t: 'L’aire du disque', h: PROP(r`L'aire d'un disque de rayon $r$ est :
<p style="text-align:center">$\text{Aire} = \pi \times r \times r = \pi \times r^{2}$</p>`) + FIG(disque_secteurs(16, 60)) + DEMO(r`On découpe le disque en parts très fines, puis on les range tête-bêche. On obtient presque un parallélogramme. Sa base est la moitié du périmètre du cercle, $\pi \times r$, et sa hauteur est le rayon $r$. Son aire vaut donc base $\times$ hauteur $= (\pi \times r) \times r = \pi \times r^{2}$. Plus les parts sont fines, plus la figure ressemble à un parallélogramme (et même à un rectangle).`, 'Une preuve presque sans mots') + EXM(r`Disque de rayon 3 cm : $\text{Aire} = \pi \times 3^{2} = \pi \times 9 = 9\pi$ cm².`) + ATT(r`$r^{2} = r \times r$, et non $2 \times r$ ! Pour $r = 3$ : $3^{2} = 9$, pas 6.<br>Si on connaît le <b>diamètre</b>, on calcule d'abord le rayon : $d = 10$ cm donne $r = 5$ cm et $\text{Aire} = 25\pi$ cm².`) },
{ t: 'Valeur exacte, valeur approchée', h: DEF(r`<ul><li>$9\pi$ cm² est la <b>valeur exacte</b> de l'aire du disque de rayon 3 cm.</li><li>Avec la touche $\pi$ de la calculatrice : $9 \times \pi \approx 28,274$. L'<b>arrondi au dixième</b> est $28,3$ cm².</li><li>Avec $\pi \approx 3,14$ : $9 \times 3,14 = 28,26$ cm², une valeur <b>approchée</b> un peu moins précise.</li></ul>`) + METH(r`<ol><li>J'écris la formule.</li><li>Je remplace par les valeurs (le rayon !).</li><li>J'écris la valeur exacte avec $\pi$.</li><li>Je donne une valeur approchée avec la calculatrice, arrondie comme demandé, avec le symbole $\approx$ et l'unité.</li></ol>`, 'Méthode : rédiger') + EXM(r`Aire d'un disque de diamètre 8 cm :<br>$r = 8 \div 2 = 4$ cm ; $\text{Aire} = \pi \times 4^{2} = 16\pi$ cm² $\approx 50,3$ cm² (au dixième).`) + ATT(r`On n'écrit pas $16\pi = 50,3$ : c'est faux, car $16\pi = 50,265\ldots$ On écrit $16\pi \approx 50,3$.`) },
{ t: 'Le volume du cylindre', h: PROP(r`Le volume d'un cylindre de révolution de rayon $r$ et de hauteur $h$ est :
<p style="text-align:center">$V = \text{aire de la base} \times \text{hauteur} = \pi \times r^{2} \times h$</p>`) + FIG(disque_cyl({ lr: 'r = 3 cm', lh: 'h = 10 cm' })) + EXM(r`Cylindre de rayon 3 cm et de hauteur 10 cm :<br>aire de la base : $\pi \times 3^{2} = 9\pi$ cm² ;<br>volume : $V = 9\pi \times 10 = 90\pi$ cm³ $\approx 282,7$ cm³.`) + RET(r`C'est la même idée que pour le prisme droit : on empile des « tranches » identiques à la base. Pour le prisme comme pour le cylindre : <b>volume $=$ aire de la base $\times$ hauteur</b>.`, 'Le lien avec le prisme') + PROP(r`Pour une contenance : $1$ cm³ $= 1$ mL, $1$ dm³ $= 1$ L, $1$ m³ $= 1\,000$ L. Ici, $282,7$ cm³ $\approx 283$ mL, soit environ 28 cL.`) },
{ t: 'Problèmes avec des disques', h: EXM(r`Une figure est formée d'un rectangle de 6 cm sur 4 cm et d'un demi-disque de diamètre 4 cm collé sur un petit côté.<br>Aire du rectangle : $6 \times 4 = 24$ cm². Demi-disque : $r = 2$ cm, aire $\frac{\pi \times 2^{2}}{2} = 2\pi$ cm².<br>Aire totale : $24 + 2\pi \approx 30,3$ cm².`) + FIG(geo({ s: 40, pad: 56, pts: { A: [0, 0], B: [6, 0], C: [6, 4], D: [0, 4], _o: [6, 2] }, hide: ['A', 'B', 'C', 'D'], box: [0, 0, 8, 4], polys: [{ p: ['A', 'B', 'C', 'D'], fill: '#2f5bd322', c: COL.k }], arcs: [{ o: '_o', r: 2, a1: -90, a2: 90, c: COL.k }], lab: [['A', 'B', '6 cm', { side: 1 }]], txt: [[-0.2, 1.85, '4 cm', { a: 'end' }], [6.9, 1.9, '½ disque', { c: COL.o, size: 12 }]] })) + EXM(r`Une couronne (un disque troué, comme un CD) : aire du grand disque $-$ aire du petit disque.`) + RET(r`<ul><li>Périmètre du cercle : $P = 2\pi r = \pi d$.</li><li>Aire du disque : $\pi r^{2}$ (attention : on utilise le <b>rayon</b>).</li><li>Volume du cylindre : $\pi r^{2} h$ (aire de la base $\times$ hauteur).</li><li>Valeur exacte avec $\pi$, valeur approchée avec $\approx$ et l'unité.</li></ul>`) }
],

/* Tracé du lutin (stylo) : cmds = [['av', 50], ['td', 90] (↻ droite), ['tg', 90] (↺ gauche), ['up'], ['down']] ; départ orienté vers la droite */
function scratch_trace(cmds, o){
  o = o || {}; const k = o.k || 1.4, grid = o.grid || 10;
  let x = 0, y = 0, dir = 90, pen = true; const segs = [], pts = [[0, 0]];
  cmds.forEach(c => {
    if (c[0] === 'av'){ const nx = x + c[1] * Math.sin(dir * Math.PI / 180), ny = y + c[1] * Math.cos(dir * Math.PI / 180); if (pen) segs.push([x, y, nx, ny]); x = nx; y = ny; pts.push([x, y]); }
    else if (c[0] === 'td') dir += c[1]; else if (c[0] === 'tg') dir -= c[1]; else if (c[0] === 'up') pen = false; else if (c[0] === 'down') pen = true;
  });
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = 26;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = Math.max(160, o.cap ? o.cap.length * 6.6 + 20 : 0, (x1 - x0) * k + 2 * pad), H = Math.max(80, (y1 - y0) * k + 2 * pad);
  const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const X = v => ox + (v - x0) * k, Y = v => H - oy - (v - y0) * k;
  let s = SVG0(W, H);
  if (o.grid !== false){ for (let gx = Math.floor((x0 - pad / k) / grid) * grid; gx <= x1 + pad / k; gx += grid) s += `<line x1="${X(gx)}" y1="0" x2="${X(gx)}" y2="${H}" stroke="#edf1f7"/>`; for (let gy = Math.floor((y0 - pad / k) / grid) * grid; gy <= y1 + pad / k; gy += grid) s += `<line x1="0" y1="${Y(gy)}" x2="${W}" y2="${Y(gy)}" stroke="#edf1f7"/>`; }
  segs.forEach(([a, b, c, d]) => { s += `<line x1="${X(a).toFixed(1)}" y1="${Y(b).toFixed(1)}" x2="${X(c).toFixed(1)}" y2="${Y(d).toFixed(1)}" stroke="${o.c || COL.b}" stroke-width="3" stroke-linecap="round"/>`; });
  s += `<circle cx="${X(0)}" cy="${Y(0)}" r="5" fill="${COL.g}"/>`;
  const a = dir * Math.PI / 180, ex = X(x), ey = Y(y), ux = Math.sin(a), uy = -Math.cos(a);
  s += `<path d="M${ex + ux * 10} ${ey + uy * 10}L${ex - ux * 6 - uy * 7} ${ey - uy * 6 + ux * 7}L${ex - ux * 6 + uy * 7} ${ey - uy * 6 - ux * 7}Z" fill="${COL.o}" stroke="#1d2433"/>`;
  if (o.cap) s += svgTxt(W / 2, 14, o.cap, { size: 12, w: 'bold' });
  return s + '</svg>';
}

<script id="mjn-math-polish">
(()=>{
 const skip='SCRIPT,STYLE,NOSCRIPT,TEXTAREA,INPUT,PRE,CODE,KBD,SAMP,SVG,SUP,SUB';
 const re=/([A-Za-z0-9π)\]])\^(?:\{([^{}]+)\}|([−-]?[A-Za-z0-9]+))/g;
 function polish(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
   if(!n.nodeValue||n.nodeValue.indexOf('^')<0)return NodeFilter.FILTER_REJECT;
   let p=n.parentElement;while(p){if(p.matches&&p.matches(skip))return NodeFilter.FILTER_REJECT;p=p.parentElement}
   return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let n;while((n=walker.nextNode()))nodes.push(n);
  for(const node of nodes){
   const s=node.nodeValue;re.lastIndex=0;let m,last=0,found=false;const frag=document.createDocumentFragment();
   while((m=re.exec(s))){found=true;frag.append(document.createTextNode(s.slice(last,m.index)+m[1]));const exp=m[2]!==undefined?m[2]:m[3];const sup=document.createElement('sup');sup.textContent=exp;frag.append(sup);last=re.lastIndex;}
   if(found){frag.append(document.createTextNode(s.slice(last)));node.parentNode&&node.parentNode.replaceChild(frag,node)}
  }
 }
 function run(){const root=document.querySelector('main')||document.body;if(!root)return;root.querySelectorAll('.formula,.exemple,.box').forEach(el=>{const h=el.innerHTML;const v=h.replace(/\^<i>([^<]+)<\/i>/g,'<sup><i>$1</i></sup>');if(v!==h)el.innerHTML=v});polish(root)}

})();

   }
   if(!nodes.length||queued)return;

    const batch=nodes;nodes=[];

   }).finally(()=>{queued=false;if(nodes.length)obs.takeRecords();});
  });
  obs.observe(document.body,{childList:true,subtree:true});
 }

})();
