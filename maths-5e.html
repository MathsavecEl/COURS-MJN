<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maths</title><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5d6779;--line:#dde3ee;--accent:#2f5bd3;--accent-soft:#e7eefc;--ok:#1f9d55;--ok-soft:#e3f6ea;--ko:#d23c3c;--ko-soft:#fde8e8;--warn:#b26a00;--warn-soft:#fff3dc;--violet:#7b3fc4;--violet-soft:#f1e8fb;--nav:#152044}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit}
/* ---------- en-tête ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;background:var(--nav);color:#fff;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .logo{font-weight:800;font-size:19px;letter-spacing:.2px;white-space:nowrap;cursor:pointer}
.top .logo span{background:#fff;color:var(--nav);border-radius:8px;padding:1px 8px;margin-right:6px}
.top .att{flex:1;font-size:15px;opacity:.9}
.top .prof{font-weight:700;white-space:nowrap}
.top .burger{display:none;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-size:20px;cursor:pointer}
/* ---------- structure ---------- */
.layout{display:flex;max-width:1280px;margin:0 auto;min-height:calc(100vh - 56px)}
nav#nav{width:290px;flex:none;padding:14px 10px 30px;border-right:1px solid var(--line);background:#fbfcff;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav#nav .grp{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:16px 10px 6px}
nav#nav a{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:10px;font-size:15px;line-height:1.3}
nav#nav a:hover{background:var(--accent-soft)}
nav#nav a.on{background:var(--accent);color:#fff}
nav#nav a .n{flex:none;min-width:22px;font-weight:700;color:var(--accent)}
nav#nav a.on .n{color:#fff}
nav#nav a .d{margin-left:auto;color:var(--ok);font-weight:700}
nav#nav a.on .d{color:#fff}
main#main{flex:1;min-width:0;padding:22px 26px 40px}
footer.foot{border-top:1px solid var(--line);background:#fff;color:var(--muted);text-align:center;padding:16px;font-size:15px}
footer.foot b{color:var(--ink)}
@media (max-width:900px){
  .top .burger{display:block}
  .top .att{display:none}
  nav#nav{position:fixed;left:0;top:52px;bottom:0;height:auto;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15);background:#fbfcff}
  nav#nav.open{transform:none}
  main#main{padding:16px}
}
/* ---------- blocs ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 2px 8px rgba(20,30,60,.05);margin-bottom:16px}
h1{font-size:27px;margin:0 0 4px;color:var(--accent);line-height:1.25}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:18px;margin:0 0 8px}
.kicker{color:var(--muted);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--muted);margin:2px 0 14px}
.hero{background:linear-gradient(135deg,#2f5bd3,#6a4ad6);color:#fff;border:0}
.hero h1{color:#fff;font-size:30px}
.hero .sub{color:#e6e9ff}
.hero .who{font-weight:700;font-size:18px}
.cheer{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border:1px solid #f3dca8;border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600;color:#6b4300}
.mail{background:var(--accent-soft);border-radius:12px;padding:12px 16px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;transition:.15s}
.tile:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(47,91,211,.12)}
.tile .t{font-weight:700}
.tile .m{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--ok);transition:width .3s}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin:4px 0}
/* ---------- onglets ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button small{opacity:.8;font-weight:500}
/* ---------- cours ---------- */
.lesson h3{color:var(--accent)}
.box{border-radius:12px;padding:12px 16px;margin:10px 0}
.box .lab{font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.box.def{background:var(--accent-soft);border-left:5px solid var(--accent)}
.box.def .lab{color:var(--accent)}
.box.ex{background:#f6f7fa;border-left:5px solid #8a94a8}
.box.ex .lab{color:#5d6779}
.box.meth{background:var(--ok-soft);border-left:5px solid var(--ok)}
.box.meth .lab{color:var(--ok)}
.box.att{background:var(--ko-soft);border-left:5px solid var(--ko)}
.box.att .lab{color:var(--ko)}
.box.demo{background:var(--violet-soft);border-left:5px solid var(--violet)}
.box.demo .lab{color:var(--violet)}
.lesson p{margin:6px 0}
.lesson ul{margin:6px 0;padding-left:22px}
table.t{border-collapse:collapse;margin:8px 0;background:#fff}
table.t td,table.t th{border:1px solid #b9c2d3;padding:5px 10px;text-align:center;min-width:42px}
table.t th{background:#eef2fa}
.scroll{overflow-x:auto;max-width:100%}
pre.py{background:#1e2433;color:#e8ecf5;border-radius:10px;padding:12px 14px;overflow:auto;font:15px/1.45 Consolas,"Courier New",monospace;margin:8px 0}
pre.py .k{color:#ff9ac1}
pre.py .c{color:#8b95a8;font-style:italic}
code{background:#eef1f7;border-radius:5px;padding:1px 5px;font:15px Consolas,"Courier New",monospace}
.fig{text-align:center;margin:10px 0}
.fig svg{max-width:100%;height:auto}
/* ---------- exercices ---------- */
.exo .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.exo .num{background:var(--accent);color:#fff;border-radius:10px;padding:2px 12px;font-weight:700}
.exo.appro .num{background:var(--violet)}
.exo .done{margin-left:auto;color:var(--ok);font-weight:700;display:none}
.exo.isdone .done{display:inline}
.exo.isdone{border-color:#9bd8b4}
.item{border-top:1px dashed var(--line);padding:12px 0 4px;margin-top:10px}
.item:first-of-type{border-top:0;margin-top:0}
.item .p{margin-bottom:8px}
.item .p b.l{color:var(--accent)}
.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ans label{display:flex;align-items:center;gap:6px}
.ans input{font:inherit;width:130px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.ans input:focus{outline:none;border-color:var(--accent)}
.ans input.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans input.ko{border-color:var(--ko);background:var(--ko-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.soft{background:#eef0f5;color:var(--ink)}
.btn.vio{background:var(--violet)}
.btn:disabled{opacity:.45;cursor:default}
.choices{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ch{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);min-height:48px}
.ch:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.ch .L{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.ch:disabled{cursor:default}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ok .L{background:var(--ok);color:#fff}
.ch.ko{border-color:var(--ko);background:var(--ko-soft);opacity:.8}
.ch.ko .L{background:var(--ko);color:#fff}
.fb{margin-top:8px;border-radius:10px;padding:9px 13px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:#14532d}
.fb.ko{background:var(--ko-soft);color:#7f1d1d}
.fb.info{background:#f2f4f9;color:var(--ink)}
.fb .h{font-weight:700}
.corr{display:none;margin-top:12px;background:#f7f5fd;border:1px solid #ddd0f4;border-radius:12px;padding:12px 16px}
.corr.show{display:block}
.corr .lab{font-weight:800;color:var(--violet);margin-bottom:4px}
.hint{display:none;margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:9px 13px}
.hint.show{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted)}
.score b{color:var(--ink)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
/* ---------- automatismes ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:10px 0}
.themes label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer}
.themes label:hover{border-color:var(--accent)}
.themes input{width:18px;height:18px}
.qbig{font-size:19px;font-weight:600;margin:10px 0}
.prog{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}
.prog i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.prog i.ok{background:var(--ok)}
.prog i.ko{background:var(--ko)}
.prog i.cur{background:var(--accent)}
.recap{margin:10px 0;padding-left:0;list-style:none}
.recap li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;background:#fff}
.recap li.ko{border-color:#f0b4b4}
.big{font-size:42px;font-weight:800;color:var(--accent)}
details.rap{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;padding:0 14px}
details.rap summary{cursor:pointer;font-weight:700;padding:10px 0}
details.rap[open]{padding-bottom:10px}
/* ---------- maths ---------- */
.m{white-space:nowrap}
.m i{font-family:"Cambria Math","Times New Roman",serif;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 .12em;line-height:1.15}
.fr>span{padding:0 .2em}
.fr>.nu{border-bottom:1.4px solid currentColor}
.sq{display:inline-flex;align-items:stretch;white-space:nowrap;vertical-align:middle;line-height:1.15}
.sq>.rad{display:inline-flex;align-items:center;border-top:1.4px solid currentColor;padding:.12em .1em 0 .05em;margin-left:.02em}
.vec{display:inline-block;position:relative;border-top:1.4px solid currentColor;line-height:1.15;margin-top:.25em;padding:0 1px}
.vec::after{content:"";position:absolute;right:-2px;top:-5.2px;border:4.5px solid transparent;border-left:6px solid currentColor;border-right:0}
.ovl{text-decoration:overline}
.hat{display:inline-block;position:relative;padding-top:.3em}
.hat::before{content:"";position:absolute;left:0;right:0;top:.02em;height:.32em;background:linear-gradient(to top right,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) right/50% 100% no-repeat}
.m sup,.m sub{font-size:.75em}
.sys{display:inline-flex;align-items:center;vertical-align:middle}
.sys .br{font-size:2.2em;line-height:1;margin-right:4px;font-weight:200}
.sys .rows{display:flex;flex-direction:column}
@media print{.top,nav#nav,.tools,.tabs{display:none}}
.cv{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:9px;padding:0 .4em;line-height:1.2;font-size:.9em;margin:0 .15em}

.maj{font-size:.85em;color:var(--muted);text-align:center;margin:18px 8px 6px;line-height:1.5}
input[type=checkbox]{flex-shrink:0;width:16px;height:16px}
/* ---------- collège ---------- */
.per{background:var(--warn-soft);color:#6b4300;border-radius:6px;padding:0 6px;text-transform:none;letter-spacing:0;font-weight:700}
.prog-y{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.prog-y .pp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcff}
.prog-y .ph{font-weight:800;color:var(--accent);margin-bottom:4px}
.prog-y a{display:block;text-decoration:none;font-size:14.5px;padding:2px 0;line-height:1.3}
.prog-y a:hover{text-decoration:underline}
/* opérations posées */
table.pose{border-collapse:collapse;margin:8px auto;font:20px/1.25 Consolas,"Courier New",monospace}
table.pose td{width:1.15em;height:1.35em;text-align:center;padding:0 1px}
table.pose td.rt{color:#d23c3c;font-size:13px;vertical-align:bottom}
table.pose tr.ln td{border-top:2px solid #1d2433}
table.pose td.op{color:#2f5bd3;font-weight:700}
table.pose .h{background:#fff3dc;border-radius:4px}
.div{display:inline-flex;font:20px/1.3 Consolas,"Courier New",monospace;margin:8px auto}
.div .l{padding:2px 12px 2px 4px;border-right:2px solid #1d2433;white-space:pre;text-align:right}
.div .r{padding:2px 4px 2px 10px}
.div .r .d{border-bottom:2px solid #1d2433;padding-bottom:2px;margin-bottom:2px}
/* blocs Scratch */
.scr{display:inline-block;text-align:left;margin:8px auto;font:600 14.5px/1.2 "Segoe UI",Arial,sans-serif}
.scr .b{color:#fff;border-radius:6px;padding:7px 12px;margin:2px 0;width:max-content;max-width:100%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.scr .b.hat{border-radius:16px 16px 6px 6px;padding-top:11px}
.scr .b i{font-style:normal;background:#fff;color:#1d2433;border-radius:10px;padding:1px 8px;margin:0 3px;font-weight:600}
.scr .b i.v{background:#ff8c1a;color:#fff}
.scr .c{border-left:16px solid;border-radius:6px;padding:2px 0 2px 6px;margin:2px 0}
.scr .c>.b:first-child{margin-left:-22px;border-radius:6px 6px 6px 0}
.scr .c .end{height:14px;margin-left:-22px;border-radius:0 0 6px 6px;width:90px}
.scr .ev{background:#ffbf00;color:#3d2c00}.scr .mv{background:#4c97ff}.scr .lk{background:#9966ff}.scr .ct{background:#ffab19}.scr .se{background:#5cb1d6}.scr .op{background:#59c059}.scr .va{background:#ff8c1a}.scr .pn{background:#0fbd8c}.scr .my{background:#ff6680}

/* Harmonisation COURS MJN : accueil façon feuille de cahier, boutons d'accès bien visibles */
body{background-color:#f4f6fb!important;background-image:linear-gradient(#e2e8f4 1px,transparent 1px),linear-gradient(90deg,#e2e8f4 1px,transparent 1px)!important;background-size:26px 26px!important}
.top,header{background:#fff!important;border-bottom:2px solid #d4dbeb!important}
.card,.sheet,.home-guide,.contact{border-radius:8px!important;border-color:#d4dbeb!important;box-shadow:0 5px 18px rgba(28,33,53,.06)}
.card.hero,.home-hero,.hero{border-left:5px solid #c22e2e!important}
.kicker{color:#c22e2e!important}
.cheer{border:1px dashed #c22e2e!important;border-radius:10px!important;background:#fff!important;color:#24318a!important;padding:14px 18px!important}
.logo{background:#c22e2e!important;color:#fff!important;border-radius:10px!important}
a[href="#accueil"],a[href="#/"],a[data-nav="accueil"],a[data-r="accueil"],[aria-label*="retour" i],[aria-label*="accueil" i],.btn.soft,.btn.ghost,.back-button,.btn-retour{
 background:#c22e2e!important;border:2px solid #a91f1f!important;color:#fff!important;font-weight:800!important;box-shadow:0 2px 0 rgba(0,0,0,.12)
}
a[href="#accueil"]:hover,a[href="#/"]:hover,a[data-nav="accueil"]:hover,a[data-r="accueil"]:hover,.btn.soft:hover,.btn.ghost:hover{background:#a91f1f!important;color:#fff!important}
nav.tabs a[data-nav="accueil"]{border-radius:9px!important;padding:7px 13px!important}


/* --- Charte MJN : bleu pour le cours, vert pour les méthodes, rouge réservé à la vigilance --- */
:root {
  --accent:#2563b8; --accent-soft:#e7f0ff; --nav:#173354;
  --ok:#238451; --ok-soft:#e5f5eb;
  --ko:#c43d42; --ko-soft:#fbe9ea;
  --violet:#2563b8; --violet-soft:#e7f0ff;
}
.btn.vio,.exo.appro .num { background:var(--accent); }
button.btn:not(.danger):not(.ko),a.btn { background:var(--accent); color:#fff; }
.box.demo { background:var(--accent-soft); border-left-color:var(--accent); }
.box.demo .lab,.corr .lab { color:var(--accent); }
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111827; --card:#1b2535; --ink:#edf2fa; --muted:#b5c0d1; --line:#3a4960;
    --accent:#79b6ff; --accent-soft:#233c59; --ok:#72d6a0; --ok-soft:#183b2c;
    --ko:#ff9297; --ko-soft:#48272d; --warn:#f3c56b; --warn-soft:#42351e;
    --violet:#79b6ff; --violet-soft:#233c59; --nav:#101f33;
    color-scheme:dark;
  }
  body { background:var(--bg) !important; color:var(--ink) !important; }
  nav#nav { background:#162235 !important; border-color:var(--line) !important; }
  nav#nav a,nav#nav .grp { color:var(--ink); }
  .card,.tile,.ch,.themes label,details.rap,.recap li,table.t,table.t th,table.t td,
  .ans input,.tabs button,.corr,.mail { background:var(--card) !important; color:var(--ink) !important; border-color:var(--line) !important; }
  .hero { background:#17263a !important; color:var(--ink) !important; }
  .hero h1,.hero .sub,.hero .who { color:var(--ink) !important; }
  .box.def,.box.demo { background:var(--accent-soft) !important; color:var(--ink) !important; }
  .box.meth { background:var(--ok-soft) !important; color:var(--ink) !important; }
  .box.att,.fb.ko,.ch.ko,.ans input.ko { background:var(--ko-soft) !important; color:var(--ink) !important; }
  .box.ex,.fb.info { background:#263244 !important; color:var(--ink) !important; }
  .cheer,.notice,.hint { background:var(--warn-soft) !important; color:#ffe6a8 !important; border-color:#806a3c !important; }
  .btn.ghost { background:var(--accent-soft) !important; color:var(--accent) !important; }
  .btn.soft { background:#2b374a !important; color:var(--ink) !important; }
  .btn:not(.ghost):not(.soft),.btn.vio { background:#285b98 !important; color:#fff !important; }
  .tabs button.on,nav#nav a.on { background:#285b98 !important; color:#fff !important; }
  .ans input:focus { border-color:var(--accent) !important; }
  code { background:#263244 !important; color:#edf2fa !important; }
  footer.foot { background:#162235 !important; color:var(--muted) !important; border-color:var(--line) !important; }
  a { color:var(--accent); }
}

@media print{#mjnPrintBtn{display:none!important} body{background:#fff!important;color:#000!important} a{color:#000!important;text-decoration:none!important} .top,nav#nav,.tools,.tabs,.burger{display:none!important}}

<style id="mjn-angle-notation-final">
.mjn-angle-notation{display:inline-block;position:relative;white-space:nowrap;padding-top:.30em;line-height:1.15;font-style:italic;vertical-align:baseline}
.mjn-angle-notation::before{content:"";position:absolute;left:0;right:0;top:.02em;height:.30em;background:linear-gradient(to top right,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 46%,currentColor 48%,currentColor 53%,transparent 55%) right/50% 100% no-repeat;box-sizing:border-box}

    if (d.show) s += svgTxt(pl + k * bw + bw / 2, Y(v) - 5, fr(v), { size: 12, w: 'bold', c }); });
  s += `<line x1="${pl}" y1="${H - pb}" x2="${W - 10}" y2="${H - pb}" stroke="#333"/><line x1="${pl}" y1="${H - pb}" x2="${pl}" y2="${pt - 8}" stroke="#333"/>`;
  if (d.unit) s += svgTxt(pl + 6, pt - 8, d.unit, { size: 11, c: '#555', a: 'start' });

/* ---------- Solides en perspective cavalière ---------- */
/* pave(L, l, h, {lab:['5 cm','3 cm','2 cm'], k:0.5, c, s:px par unité, names:'ABCDEFGH'}) */
function pave(L, l, h, o){
  o = o || {}; const sc = o.s || 34, k = o.k || 0.5, ang = Math.PI / 4, dx = l * k * Math.cos(ang) * sc, dy = l * k * Math.sin(ang) * sc;
  const W = L * sc + dx + 110, H = h * sc + dy + 50, x0 = 30, y0 = H - 25, c = o.c || COL.b;
  const p = { A: [x0, y0], B: [x0 + L * sc, y0], C: [x0 + L * sc + dx, y0 - dy], D: [x0 + dx, y0 - dy] };
  p.E = [p.A[0], p.A[1] - h * sc]; p.F = [p.B[0], p.B[1] - h * sc]; p.G = [p.C[0], p.C[1] - h * sc]; p.H = [p.D[0], p.D[1] - h * sc];

  ['AB', 'BC', 'AE', 'BF', 'CG', 'EF', 'FG', 'GH', 'HE'].forEach(e => { s += ln(e[0], e[1]); });
  if (o.lab){ s += svgTxt((p.A[0] + p.B[0]) / 2, y0 + 18, o.lab[0], { c: COL.r, w: 'bold', size: 13 }) + svgTxt((p.B[0] + p.C[0]) / 2 + 12, (p.B[1] + p.C[1]) / 2 + 12, o.lab[1], { c: COL.r, w: 'bold', size: 13, a: 'start' }) + svgTxt(p.C[0] + 8, (p.C[1] + p.G[1]) / 2 + 5, o.lab[2], { c: COL.r, w: 'bold', size: 13, a: 'start' }); }
  if (o.names){ const nm = o.names, off = { A: [-10, 14], B: [8, 14], C: [10, 4], D: [-12, -2], E: [-12, -4], F: [6, -8], G: [10, -6], H: [-4, -10] };
     'ABCDEFGH'.split('').forEach((q, i) => { s += svgTxt(p[q][0] + off[q][0], p[q][1] + off[q][1], nm[i], { w: 'bold', size: 14, c: COL.k }); }); }

}
/* Autres solides : solid('cube'|'prisme'|'cylindre'|'pyramide'|'cone'|'boule', {c, lab:{}}) */
function solid(t, o){
  o = o || {}; const c = o.c || COL.b, W = 200, H = 190;
  let s = SVG0(W, H);
  const L = (pts, dash) => `<path d="M${pts.map(q => q.join(' ')).join('L')}" fill="none" stroke="${c}" stroke-width="2.2" ${dash ? 'stroke-dasharray="6 4" stroke-opacity=".7"' : ''}/>`;
  const E = (cx, cy, rx, ry, part) => part === 'front' ? `<path d="M${cx - rx} ${cy}A${rx} ${ry} 0 0 0 ${cx + rx} ${cy}" fill="none" stroke="${c}" stroke-width="2.2"/>` : part === 'back' ? `<path d="M${cx - rx} ${cy}A${rx} ${ry} 0 0 1 ${cx + rx} ${cy}" fill="none" stroke="${c}" stroke-width="2.2" stroke-dasharray="6 4" stroke-opacity=".7"/>` : `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}22" stroke="${c}" stroke-width="2.2"/>`;
  if (t === 'cube') return pave(3.4, 3.4, 3.4, Object.assign({ s: 32, k: 0.55 }, o));
  if (t === 'prisme'){ // prisme droit à base triangulaire, couché : triangles devant et derrière
    const A = [30, 165], B = [110, 165], C = [55, 95], dx = 60, dy = -45;
    const A2 = [A[0] + dx, A[1] + dy], B2 = [B[0] + dx, B[1] + dy], C2 = [C[0] + dx, C[1] + dy];
    s += `<path d="M${A}L${B}L${C}Z" fill="${c}30"/><path d="M${B}L${B2}L${C2}L${C}Z" fill="${c}14"/>`;
    s += L([A, B, C, A]) + L([B, B2, C2, C]) + L([A2, B2], 1) + L([A2, C2], 1) + L([A, A2], 1);

    if (o.lab){ s += `<line x1="100" y1="150" x2="155" y2="150" stroke="${COL.r}" stroke-width="1.8"/><circle cx="100" cy="150" r="3" fill="${COL.r}"/>` + svgTxt(128, 145, o.lab.r || 'r', { c: COL.r, w: 'bold', size: 13 }) + svgTxt(170, 100, o.lab.h || 'h', { c: COL.r, w: 'bold', size: 13 }); }
    return s + '</svg>';
  }
  if (t === 'pyramide'){
    const S = [100, 18], A = [35, 160], B = [125, 160], C = [170, 125], D = [80, 125];
    s += `<path d="M${A}L${B}L${S}Z" fill="${c}14"/><path d="M${B}L${C}L${S}Z" fill="${c}0a"/>` + L([A, B, C]) + L([A, S, B]) + L([S, C]) + L([A, D, C], 1) + L([D, S], 1);
    return s + '</svg>';
  }
  if (t === 'cone'){
    s += `<path d="M45 150L100 20L155 150A55 16 0 0 1 45 150Z" fill="${c}14"/>` + L([[45, 150], [100, 20], [155, 150]]) + E(100, 150, 55, 16, 'front') + E(100, 150, 55, 16, 'back');
    if (o.lab) s += `<line x1="100" y1="20" x2="100" y2="150" stroke="${COL.r}" stroke-dasharray="4 3"/>`;
    return s + '</svg>';
  }
  if (t === 'boule'){
    s += `<circle cx="100" cy="95" r="70" fill="${c}14" stroke="${c}" stroke-width="2.2"/>` + E(100, 95, 70, 20, 'front') + E(100, 95, 70, 20, 'back') + `<circle cx="100" cy="95" r="3" fill="${c}"/>`;
    return s + '</svg>';
  }
  return s + '</svg>';
}
/* Patron d'un pavé droit L × l × h (croix) */
function patronPave(L, l, h, o){
  o = o || {}; const sc = o.s || 22, c = o.c || COL.b, pad = 14;

  const R = (x, y, w, hh, col) => `<rect x="${pad + x * sc}" y="${pad + y * sc}" width="${w * sc}" height="${hh * sc}" fill="${col}" stroke="#1d2433" stroke-width="1.8"/>`;
  let s = SVG0(W, H);
  s += R(0, l, h, L, PAL[0] + '33') + R(h, l, l, L, PAL[1] + '33') + R(h + l, l, h, L, PAL[0] + '33') + R(2 * h + l, l, l, L, PAL[1] + '33') + R(h, 0, l, l, PAL[2] + '33') + R(h, l + L, l, l, PAL[2] + '33');

/* ---------- Rapporteur ---------- */

  for (let k = 0; k <= 180; k++){ const a = k * Math.PI / 180, r1 = R - (k % 10 === 0 ? 14 : k % 5 === 0 ? 9 : 5); s += `<line x1="${cx + r1 * Math.cos(a)}" y1="${cy - r1 * Math.sin(a)}" x2="${cx + R * Math.cos(a)}" y2="${cy - R * Math.sin(a)}" stroke="#b26a00" stroke-width="${k % 10 === 0 ? 1.4 : 0.7}"/>`;

/* ---------- Schéma en barres (modélisation de problèmes) ----------
   barModel([{l:'Léa', parts:[{v:3, t:'?', c}], ...}], {u: px par unité, total:{t:'45 €', row:0}}) ; chaque ligne = une suite de rectangles de longueur v */
function barModel(rows, o){

/* ---------- Opérations posées (HTML) ----------
   pose('+', [345, 78]) ; pose('-', [503, 128]) ; pose('×', [47, 23]) (avec produits partiels) ; nombres décimaux acceptés en chaîne ('12,5') */
function pose(op, nums, o){
  o = o || {};
  const strs = nums.map(n => String(n).replace('.', ','));
  const dec = s => (s.split(',')[1] || '').length;
  let res, partial = [];
  const val = s => +s.replace(',', '.');
  const D = Math.max(...strs.map(dec));
  const fmt = (v, d) => { let t = (Math.round(v * 10 ** d) / 10 ** d).toFixed(d).replace('.', ','); return t; };
  if (op === '+') res = fmt(strs.reduce((t, s) => t + val(s), 0), D);
  else if (op === '-') res = fmt(val(strs[0]) - val(strs[1]), D);
  else { const d = dec(strs[0]) + dec(strs[1]); res = fmt(val(strs[0]) * val(strs[1]), d);
    const a = Math.round(val(strs[0]) * 10 ** dec(strs[0])), b = String(Math.round(val(strs[1]) * 10 ** dec(strs[1])));
    if (b.length > 1) b.split('').reverse().forEach((ch, k) => { partial.push(String(a * +ch) + (k ? '0'.repeat(k) : '')); }); }
  let lines;
  if (op === '+' || op === '-'){ // alignement des virgules
    const pad = s => { const d = dec(s); return (d < D ? s + (d === 0 && D ? ',' : '') + '0'.repeat(D - d) : s); };
    lines = strs.map(pad).concat([pad(res)]);
  } else lines = strs.concat(partial, [res]);
  const w = Math.max(...lines.map(l => l.length)) + 1;
  const row = (t, sign, cls) => `<tr class="${cls || ''}"><td class="op">${sign || ''}</td>${' '.repeat(w - t.length).split('').map(() => '<td></td>').join('')}${t.split('').map(ch => `<td>${ch}</td>`).join('')}</tr>`;
  let h = '<table class="pose">';
  if (op === '×'){
    h += row(strs[0]) + row(strs[1], '×');
    if (partial.length){ h += partial.map((p, k) => row(p, k ? '+' : '', k ? '' : 'ln')).join(''); h += row(res, '', 'ln'); }
    else h += row(res, '', 'ln');
  } else {
    h += lines.slice(0, -1).map((l, k) => row(l, k ? op : '')).join('') + row(o.hide ? lines[lines.length - 1].replace(/\d/g, '?') : lines[lines.length - 1], '', 'ln');
  }
  return `<div class="fig">${h}</table></div>`;
}
/* Division posée (potence) : potence(dividende, diviseur) avec toutes les étapes de la division euclidienne (entiers) */
function potence(a, b){
  const A = String(a), n = A.length, q = Math.floor(a / b), rows = [];
  const put = (str, end, sign, line) => { const cells = Array(n + 1).fill(''); for (let k = 0; k < str.length; k++) cells[end - str.length + 1 + k + 1] = str[k]; if (sign) cells[end - str.length + 1] = sign; rows.push({ cells, line }); };
  put(A, n - 1);
  let cur = 0, started = false;
  for (let i = 0; i < n; i++){
    cur = cur * 10 + +A[i];
    if (!started && cur < b && i < n - 1) continue;
    started = true;
    const sub = Math.floor(cur / b) * b, rest = cur - sub;
    put(String(sub), i, '−'); rows[rows.length - 1].u = true;
    const nxt = i < n - 1 ? String(rest) + A[i + 1] : String(rest);
    put(nxt, i < n - 1 ? i + 1 : i, '', true);
    cur = rest;
  }
  const tab = `<table class="pose" style="margin:0">${rows.map(r => `<tr>${r.cells.map((c, k) => `<td class="${c === '−' ? 'op' : ''}" style="${r.u && c ? 'border-bottom:2px solid #1d2433' : ''}">${c}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<div class="fig"><div class="div"><div class="l" style="padding-right:8px">${tab}</div><div class="r"><div class="d">${b}</div><div><b>${q}</b></div></div></div></div>`;
}
/* ---------- Programmes Scratch (HTML) ----------
   scratch([['ev','quand 🏳 est cliqué'], ['se','demander {Quel nombre ?} et attendre'], ['va','mettre [x] à (réponse)'], ['ct','répéter {4} fois', [ ...blocs... ]], ['mv','avancer de {50} pas'], ['pn','stylo en position d’écriture'], ['lk','dire {Bonjour} pendant {2} secondes']])
   {texte} = case blanche ; [x] = variable orange ; catégories : ev (événements), mv (mouvement), lk (apparence), ct (contrôle), se (capteurs), op (opérateurs), va (variables), pn (stylo), my (mes blocs) */
const SCRC = { ev: '#ffbf00', mv: '#4c97ff', lk: '#9966ff', ct: '#ffab19', se: '#5cb1d6', op: '#59c059', va: '#ff8c1a', pn: '#0fbd8c', my: '#ff6680' };
function scratch(blocks){
  const fmt = t => esc(t).replace(/\{([^}]*)\}/g, '<i>$1</i>').replace(/\[([^\]]*)\]/g, '<i class="v">$1</i>');
  const one = (b, first) => {
    const [k, t, inner, inner2] = b;
    if (inner){ let h = `<div class="c" style="border-color:${SCRC[k]}"><div class="b ${k}">${fmt(t)}</div>${inner.map(x => one(x)).join('')}`;
      if (inner2){ h += `<div class="b ${k}" style="margin-left:-22px;border-radius:0">sinon</div>` + inner2.map(x => one(x)).join(''); }
      return h + `<div class="end" style="background:${SCRC[k]}"></div></div>`; }
    return `<div class="b ${k}${k === 'ev' || k === 'myh' ? ' hat' : ''}">${fmt(t)}</div>`;
  };
  return `<div class="fig"><div class="scr">${blocks.map((b, i) => one(b, i === 0)).join('')}</div></div>`;
}

/* ---------- Tableau de numération ---------- */

function numTab(n, o){

  const cols = ['C', 'D', 'U', 'C', 'D', 'U', 'C', 'D', 'U', 'C', 'D', 'U'], cls = ['milliards', 'millions', 'milliers', 'unités'];

  h += cols.slice(12 - 3 * nE).map(c => `<th>${c}</th>`).join('') + decs.map(c => `<th style="background:#fff3dc;font-size:12px">${c}</th>`).join('') + '</tr><tr>';
  const digs = e.padStart(3 * nE, ' ').split('');

/* ---------- Mémoire du navigateur (facultative) ---------- */
const LSK = 'college-' + SITE.code + '-';
function load(k, d){ try { const v = localStorage.getItem(LSK + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v){ try { localStorage.setItem(LSK + k, JSON.stringify(v)); } catch (e) {} }
let DONE = load('done', {});
function markDone(key){ DONE[key] = 1; save('done', DONE); refreshNav(); }
function chapStats(c){ const keys = [...c.app.map((_, i) => c.id + '/app/' + i), ...c.appro.map((_, i) => c.id + '/appro/' + i)]; return { n: keys.length, d: keys.filter(k => DONE[k]).length }; }

/* ---------- Lecture des réponses ---------- */
function parseNum(s){
  s = String(s).trim().replace(/\s| /g, '').replace(/[−–]/g, '-').replace(/,/g, '.');
  s = s.replace(/^[^=]*=/, '').replace(/[€%°a-zA-Z²³]+$/, '');
  if (/^[-+]?\d*\.?\d+\/[-+]?\d*\.?\d+$/.test(s)){ const [a, b] = s.split('/'); return +a / +b; }
  if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return +s;
  return NaN;
}
function fmtAns(a){
  if (Math.abs(a * 1e4 - Math.round(a * 1e4)) <= 1e-6) return fr(a);
  for (let q = 2; q <= 200; q++){ const p = Math.round(a * q); if (Math.abs(p / q - a) < 1e-9) return M('$' + fracTex(p, q) + '$') + ' ≈ ' + fr(a, 2); }
  return '≈ ' + fr(a, 3);
}
function near(v, a, tol){
  // réponse non décimale (ex. 2/3) : on accepte aussi un arrondi au centième
  if (tol == null && Math.abs(a * 1e4 - Math.round(a * 1e4)) > 1e-6) tol = 0.006;
  return Math.abs(v - a) <= (tol != null ? tol : 1e-6 * Math.max(1, Math.abs(a)));
}
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Une question (utilisée dans les exercices et les automatismes) ----------
   it = {p, n | c | vf, lab, u, tol, e, fixed}. onDone(bonne réponse au 1er coup ?) */
function renderItem(it, onDone, opts){
  opts = opts || {};
  const box = el('div', 'item');
  if (it.p) box.appendChild(el('div', 'p', M(it.p)));
  if (it.fig) box.appendChild(el('div', 'fig', it.fig));
  const fb = el('div', 'fb');
  let tries = 0, solved = false;
  const finish = (good) => { solved = true; onDone && onDone(tries === 1 && good, good); };
  const showFb = (good, extra) => {
    fb.className = 'fb show ' + (good ? 'ok' : 'ko');
    fb.innerHTML = `<div class="h">${good ? pick(OKS) : pick(KOS)}</div>${extra || ''}`;
  };
  if (it.w){
    // réponse en mots : it.w = liste des réponses acceptées
    const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
    const wrap = el('div', 'ans'), L = el('label', '', it.lab ? `<span>${M(it.lab)}</span>` : '');
    const inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.placeholder = 'ta réponse'; inp.style.width = '16em';
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    L.appendChild(inp); wrap.appendChild(L); const bt = el('button', 'btn', 'Vérifier'); wrap.appendChild(bt); box.appendChild(wrap);
    function check(){
      if (solved) return; if (!inp.value.trim()){ fb.className = 'fb show info'; fb.innerHTML = 'Écris ta réponse dans la case.'; return; }
      tries++; const good = it.w.some(x => norm(x) === norm(inp.value));
      inp.classList.remove('ok', 'ko'); inp.classList.add(good ? 'ok' : 'ko');
      if (good){ inp.disabled = bt.disabled = true; showFb(true, it.e ? M(it.e) : ''); finish(true); }
      else if (opts.oneShot || tries >= 3){ inp.disabled = bt.disabled = true; showFb(false, `La bonne réponse : <b>${M(it.w[0])}</b>.` + (it.e ? '<div style="margin-top:6px">' + M(it.e) + '</div>' : '')); finish(false); }
      else showFb(false, tries === 2 ? 'Encore un essai, puis la réponse s’affichera.' : '');
    }
    bt.onclick = check; box.check = check;
  } else if (it.c || 'vf' in it){
    const isVF = 'vf' in it;
    const list = isVF ? [['Vrai', it.vf === true], ['Faux', it.vf === false]] : it.c.map((t, k) => [t, k === 0]);
    const plain = t => String(t).replace(/<[^>]+>|\$/g, '');
    const order = isVF ? list : it.fixed ? list.slice().sort((a, b) => plain(a[0]).localeCompare(plain(b[0]), 'fr', { numeric: true })) : shuffle(list);
    const wrap = el('div', 'choices');
    order.forEach(([t, good], k) => {
      const b = el('button', 'ch', `<span class="L">${isVF ? t[0] : 'ABCDEF'[k]}</span><span>${M(t)}</span>`);
      b.onclick = () => {
        if (solved) return;
        tries++;
        if (good){
          b.classList.add('ok'); wrap.querySelectorAll('.ch').forEach(x => x.disabled = true);
          showFb(true, it.e ? M(it.e) : ''); finish(true);
        } else {
          b.classList.add('ko'); b.disabled = true;
          if (opts.oneShot){ wrap.querySelectorAll('.ch').forEach(x => { x.disabled = true; }); const g = [...wrap.children][order.findIndex(o => o[1])]; g.classList.add('ok'); showFb(false, (it.e ? M(it.e) : '')); finish(false); }
          else showFb(false, tries >= 2 && it.e ? '<div style="margin-top:6px">' + M(it.e) + '</div>' : '');
          if (!opts.oneShot && tries >= 2){ const g = [...wrap.children][order.findIndex(o => o[1])]; g.classList.add('ok'); wrap.querySelectorAll('.ch').forEach(x => x.disabled = true); finish(false); }
        }
      };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  } else {
    const ans = Array.isArray(it.n) ? it.n : [it.n];
    const labs = it.lab || ans.map(() => '');
    const wrap = el('div', 'ans'), inputs = [];
    ans.forEach((a, k) => {
      const L = el('label', '', labs[k] ? `<span>${M(labs[k])}</span>` : '');
      const inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.placeholder = 'ta réponse';
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      L.appendChild(inp); if (it.u) L.appendChild(el('span', '', M(it.u)));
      wrap.appendChild(L); inputs.push(inp);
    });
    const bt = el('button', 'btn', 'Vérifier');
    wrap.appendChild(bt); box.appendChild(wrap);
    function check(){
      if (solved) return;
      const vals = inputs.map(i => parseNum(i.value));
      if (vals.some(v => isNaN(v))){ fb.className = 'fb show info'; fb.innerHTML = 'Écris un nombre (par exemple <b>-2,5</b> ou <b>7/3</b>).'; return; }
      tries++;
      const goods = vals.map((v, k) => near(v, ans[k], it.tol));
      inputs.forEach((inp, k) => { inp.classList.remove('ok', 'ko'); inp.classList.add(goods[k] ? 'ok' : 'ko'); });
      const good = goods.every(Boolean);
      const sol = ans.map((a, k) => (labs[k] ? M(labs[k]) + ' ' : '') + '<b>' + fmtAns(a) + '</b>' + (it.u ? ' ' + M(it.u) : '')).join(' ; ');
      if (good){ inputs.forEach(i => i.disabled = true); bt.disabled = true; showFb(true, it.e ? M(it.e) : ''); finish(true); }
      else if (opts.oneShot || tries >= 3){ inputs.forEach(i => i.disabled = true); bt.disabled = true; showFb(false, `La bonne réponse : ${sol}.` + (it.e ? '<div style="margin-top:6px">' + M(it.e) + '</div>' : '')); finish(false); }
      else showFb(false, tries === 2 ? 'Encore un essai, puis la réponse s’affichera.' : '');
    }
    bt.onclick = check;
    box.check = check;
  }
  box.appendChild(fb);
  return box;
}

/* ---------- Un exercice ---------- */
function renderExo(ex, idx, kind, chap){
  const key = chap.id + '/' + kind + '/' + idx;
  const card = el('div', 'card exo ' + kind + (DONE[key] ? ' isdone' : ''));
  card.innerHTML = `<div class="head"><span class="num">${kind === 'app' ? 'Exercice' : 'Problème'} ${idx + 1}</span>${ex.t ? `<b>${M(ex.t)}</b>` : ''}<span class="done">✔ Réussi</span></div>`;
  if (ex.q) card.appendChild(el('div', 'stmt', M(ex.q)));
  if (ex.fig) card.appendChild(el('div', 'fig', ex.fig));
  const its = ex.it || [];
  let left = its.length;
  const multi = its.length > 1;
  its.forEach((it, k) => {
    const it2 = Object.assign({}, it);
    if (multi && it.p) it2.p = `<b class="l">${k + 1}.</b> ` + it.p;
    card.appendChild(renderItem(it2, () => { left--; if (left === 0){ card.classList.add('isdone'); markDone(key); if (multi){ const m = el('div', 'fb show ok', `<div class="h">${pick(['Exercice terminé, bravo ! 🌟', 'Tout est juste, félicitations ! 🎉', 'Exercice réussi : tu peux être fier·e de toi !'])}</div>`); card.insertBefore(m, tools); } } }));
  });
  const tools = el('div', 'tools');
  if (ex.aide){ const h = el('div', 'hint', '💡 ' + M(ex.aide)); const b = el('button', 'btn soft', '💡 Un indice'); b.onclick = () => h.classList.toggle('show'); tools.appendChild(b); card.appendChild(h); }
  const corrHtml = [its.filter(i => i.e).map(i => (multi ? `<b>${its.indexOf(i) + 1}.</b> ` : '') + i.e).join('<br>'), ex.corr || ''].filter(Boolean).join('<br>');
  const corr = el('div', 'corr', `<div class="lab">Correction détaillée</div>${M(corrHtml)}`);
  const bc = el('button', 'btn ghost', '📖 Voir la correction');
  bc.onclick = () => { corr.classList.toggle('show'); bc.textContent = corr.classList.contains('show') ? '📕 Cacher la correction' : '📖 Voir la correction'; };
  const br = el('button', 'btn soft', '↺ Recommencer');
  br.onclick = () => { const n = renderExo(ex, idx, kind, chap); card.replaceWith(n); };
  tools.appendChild(bc); tools.appendChild(br);
  card.appendChild(tools); card.appendChild(corr);
  return card;
}

/* ---------- Automatismes ---------- */
const RND = {
  i: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  nz: (a, b) => { let v; do { v = a + Math.floor(Math.random() * (b - a + 1)); } while (v === 0); return v; },
  p: a => a[Math.floor(Math.random() * a.length)],
  sh: shuffle,
  s: () => Math.random() < 0.5 ? -1 : 1
};
function makeQ(th){
  const gens = GENS[th]; let q, n = 0;
  do { q = pick(gens)(RND); n++; } while (q.bad && n < 20);
  q.th = th; return q;
}
function pageAutoHub(only){
  const wrap = el('div');
  const t = only && AUTO_THEMES.find(x => x.id === only);
  wrap.innerHTML = `<div class="kicker">Automatismes</div><h1>${t ? t.t : 'Séries mélangées'}</h1><p class="sub">${SITE.autoIntro}</p><div class="cheer">⚡ <span>${pick(['Quelques minutes par jour, et les réflexes s’installent !', 'Vas-y sans stress : on est là pour s’entraîner.', 'Vise la régularité plutôt que la vitesse.'])}</span></div>`;
  if (t){
    wrap.appendChild(el('div', 'card lesson', `<h3>Rappels utiles</h3>${M(t.rappel)}`));
    const go = el('div', 'card', `<b>Série de 10 questions sur ce thème</b><div class="tools"></div>`);
    const b = el('button', 'btn', '▶ Commencer la série'); b.onclick = () => runSerie([t.id]);
    go.querySelector('.tools').appendChild(b); wrap.appendChild(go);
  } else {
    const card = el('div', 'card', `<h3>Choisis les thèmes</h3><div class="themes">${AUTO_THEMES.map(x => `<label><input type="checkbox" value="${x.id}" checked> ${x.t}</label>`).join('')}</div><div class="tools"></div>`);
    const b = el('button', 'btn', '▶ Lancer une série de 10 questions');
    b.onclick = () => { const ids = [...card.querySelectorAll('input:checked')].map(i => i.value); if (!ids.length) return alert('Coche au moins un thème.'); runSerie(ids); };
    const all = el('button', 'btn soft', 'Tout cocher / décocher'); all.onclick = () => { const bx = card.querySelectorAll('input'); const v = ![...bx].every(i => i.checked); bx.forEach(i => i.checked = v); };
    card.querySelector('.tools').append(b, all); wrap.appendChild(card);
    const rap = el('div', 'card lesson', `<h3>Les rappels, thème par thème</h3>` + AUTO_THEMES.map(x => `<details class="rap"><summary>${x.t}</summary>${M(x.rappel)}</details>`).join(''));
    wrap.appendChild(rap);
  }
  setPage(wrap);
}
function runSerie(ids){
  const N = 10, qs = [];
  for (let k = 0; k < N; k++) qs.push(makeQ(ids[k % ids.length]));
  const order = shuffle(qs), res = [];
  let cur = 0;
  function show(){
    const q = order[cur], thn = AUTO_THEMES.find(x => x.id === q.th).t;
    const card = el('div', 'card');
    card.innerHTML = `<div class="kicker">Question ${cur + 1} / ${N} · ${thn}</div><div class="prog">${order.map((_, k) => `<i class="${k < cur ? (res[k] ? 'ok' : 'ko') : k === cur ? 'cur' : ''}"></i>`).join('')}</div><div class="qbig">${M(q.q)}</div>${q.fig ? `<div class="fig">${q.fig}</div>` : ''}`;
    const it = Object.assign({}, q); delete it.q;
    const next = el('button', 'btn', cur + 1 < N ? 'Question suivante →' : 'Voir mon score'); next.style.display = 'none';
    card.appendChild(renderItem(it, (first, good) => { res[cur] = good; next.style.display = ''; next.focus(); }, { oneShot: true }));
    next.onclick = () => { cur++; cur < N ? show() : end(); };
    const tl = el('div', 'tools'); tl.appendChild(next); card.appendChild(tl);
    const w = el('div'); w.innerHTML = `<div class="kicker">Automatismes</div><h1>Série en cours</h1>`; w.appendChild(card);
    setPage(w);
    const inp = card.querySelector('input'); if (inp) inp.focus();
  }
  function end(){
    const sc = res.filter(Boolean).length;

    const w = el('div');
    w.innerHTML = `<div class="kicker">Automatismes</div><h1>Ton score</h1><div class="card" style="text-align:center"><div class="big">${sc} / ${N}</div><p><b>${msg}</b></p></div>`;
    const rc = el('div', 'card', `<h3>Récapitulatif</h3><ul class="recap">${order.map((q, k) => `<li class="${res[k] ? '' : 'ko'}">${res[k] ? '✅' : '❌'} ${M(q.q)}<br><small>Réponse : <b>${q.w ? M(q.w[0]) : q.c ? M(q.c[0]) : 'vf' in q ? (q.vf ? 'Vrai' : 'Faux') : (Array.isArray(q.n) ? q.n : [q.n]).map(fmtAns).join(' ; ') + (q.u ? ' ' + M(q.u) : '')}</b>${q.e ? ' — ' + M(q.e) : ''}</small></li>`).join('')}</ul>`);
    const tl = el('div', 'tools');
    const again = el('button', 'btn', '↺ Nouvelle série (mêmes thèmes)'); again.onclick = () => runSerie(ids);
    const back = el('a', 'btn soft', 'Retour aux automatismes'); back.href = '#auto';
    tl.append(again, back); rc.appendChild(tl); w.appendChild(rc);
    setPage(w);
  }
  show();
}

CH({ id: 'problemes', th: 'Méthodes', per: 'Toute l’année', t: 'Résoudre un problème',
intro: r`Apprendre une démarche pour résoudre un problème : comprendre l'énoncé, le représenter avec un <b>modèle en barres</b>, calculer, puis contrôler que le résultat est vraisemblable.`,
cours: [
{ t: 'Une démarche en quatre étapes', h: METH(r`<ol>
<li><b>Je comprends</b> : je lis l'énoncé deux fois. Qu'est-ce qu'on cherche ? Quelles sont les données utiles ?</li>
<li><b>Je représente</b> : je fais un schéma (un <b>modèle en barres</b>), un tableau ou un dessin.</li>
<li><b>Je calcule</b> : j'écris chaque calcul et je dis ce qu'il donne (« prix des pommes : … »).</li>
<li><b>Je contrôle et je réponds</b> : mon résultat est-il possible ? Je réponds par une phrase, avec l'unité.</li></ol>`, 'Méthode : résoudre un problème') + EXM(r`<b>Énoncé.</b> Au marché, Inès achète un melon à $2,80$ € et 3 kg de pommes à $2,40$ € le kg. Elle paie avec un billet de 20 €. Combien lui rend-on ?<br>
<b>1. Je comprends.</b> On cherche la monnaie rendue. Les données : $2,80$ € ; 3 kg ; $2,40$ € le kg ; 20 €.<br>
<b>2. Je représente</b> : le billet de 20 € est partagé entre le melon, les pommes et la monnaie.`) + FIG(problemes_bm([{ l: 'Billet', parts: [{ v: 2.8, t: '2,80' }, { v: 7.2, t: 'pommes' }, { v: 10, t: 'rendu : ?', blank: true, dash: true }] }], { total: { t: '20 €' } })) + EXM(r`<b>3. Je calcule.</b> Prix des pommes : $3 \times 2,40 = 7,20$ €. Prix total : $2,80 + 7,20 = 10$ €. Monnaie : $20 - 10 = 10$ €.<br>
<b>4. Je contrôle.</b> $10$ € est moins que 20 € : c'est possible. Et $10 + 10 = 20$ ✔.<br>
<b>Phrase réponse :</b> on rend 10 € à Inès.`) + RET(r`Un schéma n'est pas une perte de temps : il t'aide à <b>choisir les bonnes opérations</b>. Les longueurs des barres n'ont pas besoin d'être exactes, mais une plus grande quantité doit avoir une barre plus longue.`) },
{ t: 'Problèmes additifs : le tout et les parties', h: DEF(r`Dans un problème additif, un <b>tout</b> est formé de plusieurs <b>parties</b>.<br>
• Pour trouver le <b>tout</b>, on <b>additionne</b> les parties.<br>
• Pour trouver une <b>partie</b>, on <b>soustrait</b> les autres parties du tout.`, 'Le tout et les parties') + FIG(problemes_bm([{ l: 'Livres', parts: [{ v: 8, t: '568 romans' }, { v: 6, t: '392 BD' }, { v: 5, t: '?', blank: true, dash: true }] }], { total: { t: '1 245 livres au CDI' } })) + EXM(r`Le CDI possède 1 245 livres : 568 romans, 392 BD et des documentaires. Combien de documentaires ?<br>

Contrôle : $568 + 392 + 285 = 1\,245$ ✔.`) + DEF(r`Pour <b>comparer</b> deux quantités, on dessine <b>deux barres</b> l'une sous l'autre : la différence est le morceau qui dépasse.`, 'Comparer : le modèle à deux barres') + FIG(problemes_bm([{ l: 'Léo', parts: [{ v: 10, t: '35 €' }] }, { l: 'Sarah', parts: [{ v: 6.6, t: '?', c: COL.o }, { v: 3.4, t: '12 €', blank: true, dash: true, c: COL.o }] }])) + EXM(r`Léo a 35 €. Il a 12 € <b>de plus</b> que Sarah. Combien Sarah a-t-elle ?<br>
Le schéma montre que la barre de Sarah est <b>plus courte</b> de 12 € : $35 - 12 = 23$. Sarah a 23 €.`) + ATT(r`« De plus » ne veut pas toujours dire qu'il faut additionner ! Ici Léo a plus que Sarah, donc Sarah a <b>moins</b> : on soustrait. Le schéma évite ce piège.`) },
{ t: 'Problèmes multiplicatifs et partages', h: DEF(r`Quand un tout est formé de <b>parts égales</b> :<br>
• le tout $=$ nombre de parts $\times$ valeur d'une part (multiplication) ;<br>
• une part $=$ tout $\div$ nombre de parts (division) ;<br>
• le nombre de parts $=$ tout $\div$ valeur d'une part (division).`, 'Parts égales') + FIG(problemes_bm([{ l: 'Lot', parts: [1, 2, 3, 4, 5, 6].map(() => ({ v: 3, t: '?' })) }], { total: { t: '9,30 € pour 6 cahiers' } })) + EXM(r`Un lot de 6 cahiers identiques coûte $9,30$ €. Le prix d'un cahier est $9,30 \div 6 = 1,55$ €.`) + DEF(r`Dans un <b>partage inégal</b>, on cherche une « <b>brique unité</b> » : la plus petite part, avec laquelle on peut construire toutes les autres.`, 'Partage inégal : la brique unité') + FIG(problemes_bm([{ l: 'Léa', parts: [{ v: 3, t: '?' }] }, { l: 'Tom', parts: [{ v: 3, t: '?', c: PAL[1] }, { v: 3, t: '?', c: PAL[1] }, { v: 3, t: '?', c: PAL[1] }] }], { total: { t: '4 briques = 48 bonbons' } })) + EXM(r`Tom et Léa se partagent 48 bonbons. Tom en a <b>3 fois plus</b> que Léa.<br>
Léa a 1 brique, Tom a 3 briques : en tout $1 + 3 = 4$ briques. Une brique vaut $48 \div 4 = 12$.<br>
Léa a 12 bonbons et Tom $3 \times 12 = 36$ bonbons. Contrôle : $12 + 36 = 48$ ✔.`) + FIG(problemes_bm([{ l: 'Ali', parts: [{ v: 7, t: '?' }] }, { l: 'Zoé', parts: [{ v: 7, t: '?', c: PAL[2] }, { v: 3, t: '8 €', c: PAL[2], dash: true }] }], { total: { t: 'Ali + Zoé = 50 €' } })) + EXM(r`Ali et Zoé ont 50 € à eux deux. Zoé a 8 € de plus qu'Ali.<br>

/* Arbre de calcul : operations_arbre({o:'+', a:7, b:{o:'×', a:3, b:5, v:'15'}, v:'22'}) ; les feuilles sont des nombres ou des textes ; v = résultat affiché (facultatif) */
function operations_arbre(t, o){
  o = o || {}; let leaves = 0; const nodes = [];
  const lay = (n, d) => {
    if (typeof n !== 'object'){ const nd = { t: String(n), x: leaves++, d, leaf: true }; nodes.push(nd); return nd; }

  };
  lay(t, 0);
  const maxd = Math.max(...nodes.map(n => n.d)), dx = o.dx || 72, dy = 60, W = leaves * dx + 40, H = maxd * dy + 56;
  const X = n => 20 + dx / 2 + n.x * dx, Y = n => 28 + n.d * dy;
  let s = SVG0(W, H);
  nodes.forEach(n => { if (!n.leaf) [n.A, n.B].forEach(m => { s += `<line x1="${X(n)}" y1="${Y(n)}" x2="${X(m)}" y2="${Y(m)}" stroke="#8a94a8" stroke-width="2"/>`; }); });
  nodes.forEach(n => {
    if (n.leaf){ s += `<rect x="${X(n) - 26}" y="${Y(n) - 15}" width="52" height="30" rx="7" fill="#fff" stroke="#1d2433" stroke-width="1.6"/>` + svgTxt(X(n), Y(n) + 5, n.t, { w: 'bold', size: 14 }); return; }
    const c = n.c || (n.d === 0 ? COL.r : COL.b);
    s += `<circle cx="${X(n)}" cy="${Y(n)}" r="17" fill="${c}22" stroke="${c}" stroke-width="2"/>` + svgTxt(X(n), Y(n) + 6, n.t, { w: 'bold', size: 18, c });
    if (n.v != null) s += svgTxt(X(n) + 22, Y(n) - 12, '= ' + n.v, { w: 'bold', size: 13, c: COL.g, a: 'start' });
  });
  return s + '</svg>';
}
/* Sauts réguliers sur une demi-droite graduée (combien de fois b dans a) */
const operations_sauts = (a, b, n, sub) => gline({ a: 0, b: a, sub: sub, half: true, W: 520, labs: Array.from({ length: n + 1 }, (_, k) => [k * b, fr(+(k * b).toFixed(4))]), arcs: Array.from({ length: n }, (_, k) => ({ x1: k * b, x2: (k + 1) * b, l: fr(b), c: PAL[k % 2 ? 1 : 0] })) });

CH({ id: 'operations', th: 'Nombres et calculs', per: 'Période 1', t: 'Opérations et priorités',
intro: r`Choisir la bonne opération, diviser par un nombre décimal, connaître les <b>priorités opératoires</b> et écrire un problème ou un programme de calcul en <b>une seule expression</b>.`,
cours: [
{ t: 'Le sens des opérations et leur vocabulaire', h: DEF(TAB([['Opération', 'Résultat', 'Les nombres s’appellent', 'Exemple'],
['addition $+$', 'une <b>somme</b>', 'des <b>termes</b>', r`$12 + 8 = 20$ : la somme de 12 et 8`],
['soustraction $-$', 'une <b>différence</b>', 'des <b>termes</b>', r`$12 - 8 = 4$ : la différence de 12 et 8`],
['multiplication $\\times$', 'un <b>produit</b>', 'des <b>facteurs</b>', r`$12 \times 8 = 96$ : le produit de 12 par 8`],
['division $\\div$', 'un <b>quotient</b>', 'dividende et diviseur', r`$12 \div 8 = 1,5$ : le quotient de 12 par 8`]]), 'Vocabulaire') + METH(r`• On <b>additionne</b> pour réunir, ajouter, chercher un tout.<br>
• On <b>soustrait</b> pour enlever, chercher une partie, un écart, « combien de plus / de moins ».<br>
• On <b>multiplie</b> pour répéter des parts égales (« 6 paquets de 4 »), pour un prix à l'unité.<br>
• On <b>divise</b> pour partager en parts égales, ou pour chercher combien de fois une quantité « entre » dans une autre.`, 'Quand utiliser chaque opération ?') + EXM(r`Le mot « quotient » désigne le résultat d'une division, mais aussi l'écriture de la division elle-même : $\frac{12}{8}$ ou $12 \div 8$ est « le quotient de 12 par 8 ».`) + ATT(r`La « différence de 12 et 8 » s'écrit $12 - 8$ (dans l'ordre de la phrase). Le « quotient de 12 par 8 » s'écrit $12 \div 8$, pas $8 \div 12$.`) },
{ t: 'Diviser par un nombre décimal', h: PROP(r`Un quotient ne change pas si on multiplie le dividende <b>et</b> le diviseur par le même nombre (10, 100, 1 000…).<br>Pour diviser par un décimal, on multiplie les deux nombres pour que le <b>diviseur devienne entier</b>.`) + EXM(r`$1,5 \div 0,3 = \frac{1,5}{0,3} = \frac{15}{3} = 5$ (on a multiplié les deux nombres par 10).<br>
Sens : combien de fois $0,3$ « entre » dans $1,5$ ? On compte les sauts de $0,3$ :`) + FIG(operations_sauts(1.5, 0.3, 5, 10)) + EXM(r`$7,2 \div 0,08$ : le diviseur a deux décimales, on multiplie par 100 : $720 \div 8 = 90$.<br>
$2,45 \div 0,7$ : on multiplie par 10 : $24,5 \div 7 = 3,5$.`) + METH(r`<ol><li>Je compte les chiffres après la virgule du <b>diviseur</b>.</li><li>Je multiplie dividende et diviseur par 10, 100 ou 1 000 pour que le diviseur soit entier.</li><li>Je fais la division (de tête ou posée).</li></ol>`) + ATT(r`Diviser par un nombre plus petit que 1 donne un résultat <b>plus grand</b> que le nombre de départ : $12 \div 0,4 = 120 \div 4 = 30$. C'est normal : $0,4$ entre 30 fois dans 12.`) },
{ t: 'Priorités opératoires sans parenthèses', h: PROP(r`Dans un calcul <b>sans parenthèses</b> :<br>
1. on effectue d'abord les <b>multiplications et divisions</b>, de gauche à droite ;<br>
2. puis les <b>additions et soustractions</b>, de gauche à droite.`, 'Règle de priorité') + EXM(r`$A = 7 + 3 \times 5$ : la multiplication est prioritaire.<br>$A = 7 + 15 = 22$.`) + FIG(operations_arbre({ o: '+', a: 7, b: { o: '×', a: 3, b: 5, v: '15' }, v: '22' })) + EXM(r`$B = 50 - 8 \times 2 + 12 \div 4$<br>$B = 50 - 16 + 3$ (on fait $8 \times 2$ et $12 \div 4$)<br>$B = 34 + 3 = 37$ (de gauche à droite).`) + EXM(r`Seulement des additions et soustractions : de gauche à droite. $18 - 6 + 2 = 12 + 2 = 14$.<br>Seulement des multiplications et divisions : de gauche à droite. $36 \div 4 \times 3 = 9 \times 3 = 27$.`) + ATT(r`$18 - 6 + 2$ n'est pas égal à $18 - 8$ ! Sans priorité entre $+$ et $-$, on calcule <b>de gauche à droite</b>.`) },
{ t: 'Calculs avec parenthèses', h: PROP(r`On effectue <b>d'abord les calculs entre parenthèses</b>. S'il y a des parenthèses dans des parenthèses, on commence par les plus intérieures.<br>Dans une parenthèse, les règles de priorité s'appliquent aussi.`, 'Règle des parenthèses') + EXM(r`$C = (7 + 3) \times 5 = 10 \times 5 = 50$. Les parenthèses changent le résultat : comparer avec $7 + 3 \times 5 = 22$.`) + FIG(operations_arbre({ o: '×', a: { o: '+', a: 7, b: 3, v: '10' }, b: 5, v: '50' })) + EXM(r`$D = 2 \times (15 - (4 + 3))$<br>$D = 2 \times (15 - 7)$<br>$D = 2 \times 8 = 16$.`) + DEF(r`Le trait de fraction joue le rôle de parenthèses : $\frac{12 + 8}{4} = (12 + 8) \div 4 = 20 \div 4 = 5$.`, 'Le trait de fraction') + METH(r`Pour ne pas se tromper, je <b>souligne</b> l'opération que je fais, et je recopie tout le reste du calcul sans le changer, ligne après ligne.`) + ATT(r`Devant une parenthèse, le signe $\times$ est souvent sous-entendu : $3(2 + 4)$ veut dire $3 \times (2 + 4) = 18$.`) },
{ t: 'Somme ou produit ? Traduire en une seule expression', h: DEF(r`La <b>dernière opération</b> à effectuer donne le nom de l'expression :<br>

$(7 + 3) \times 5$ est un <b>produit</b> (on termine par $\times$) ; ses facteurs sont $(7 + 3)$ et $5$.`, 'Nature d’une expression') + FIG(operations_arbre({ o: '−', a: { o: '×', a: 4, b: 6, v: '24' }, b: { o: '÷', a: 10, b: 2, v: '5' }, v: '19' })) + EXM(r`$4 \times 6 - 10 \div 2$ : la dernière opération est la soustraction (en haut de l'arbre). C'est une <b>différence</b>, qui vaut $24 - 5 = 19$.`) + METH(r`Pour écrire une suite d'opérations en <b>une seule expression</b> : j'écris la première étape, puis je l'entoure de parenthèses si l'étape suivante est une multiplication ou une division.`, 'Traduire un programme de calcul') + scratch([['ev', 'quand 🏳 est cliqué'], ['se', 'demander {Choisis un nombre} et attendre'], ['va', 'mettre [n] à (réponse)'], ['va', 'ajouter {4} à [n]'], ['va', 'mettre [n] à ([n] × {3})'], ['va', 'ajouter {-5} à [n]'], ['lk', 'dire [n]']]) + EXM(r`Programme : « choisir un nombre, ajouter 4, multiplier par 3, soustraire 5 ». Avec 6 :<br>
$6 + 4$ ; puis $(6 + 4) \times 3$ (parenthèses obligatoires !) ; puis $(6 + 4) \times 3 - 5$.<br>
En une seule ligne : $(6 + 4) \times 3 - 5 = 10 \times 3 - 5 = 30 - 5 = 25$.`) + EXM(r`<b>Problème.</b> Ewan achète 3 cahiers à $2,10$ € et une trousse à $5,50$ €. Expression du prix : $3 \times 2,10 + 5,50 = 6,30 + 5,50 = 11,80$ €. Ici, pas besoin de parenthèses.`) + RET(r`× et ÷ avant + et − ; les parenthèses d'abord ; à égalité de priorité, de gauche à droite. La dernière opération donne le nom : somme, différence, produit ou quotient.`) }
],

/* Rectangle découpé : distributivite_rect({h: hauteur px, kl: 'largeur', tot: 'texte sous la figure'}, [{w: px, l: 'longueur', a: 'aire', cut: true (partie enlevée)}]) */
function distributivite_rect(o, parts){
  const h = o.h || 90, pl = 48, pt = 32, totW = parts.reduce((t, p) => t + p.w, 0), W = pl + totW + 24, H = pt + h + (o.tot ? 44 : 14);
  let s = SVG0(W, H), x = pl;
  parts.forEach((p, k) => {
    const c = p.c || PAL[k % PAL.length];
    if (p.cut) s += `<rect x="${x}" y="${pt}" width="${p.w}" height="${h}" fill="#fff" stroke="${COL.r}" stroke-width="2" stroke-dasharray="6 4"/>` + `<path d="M${x} ${pt + h}L${x + p.w} ${pt}" stroke="${COL.r}" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    else s += `<rect x="${x}" y="${pt}" width="${p.w}" height="${h}" fill="${c}33" stroke="${c}" stroke-width="2.2"/>`;
    s += svgTxt(x + p.w / 2, pt - 10, p.l, { w: 'bold', size: 14, c: p.cut ? COL.r : c });
    if (p.a) s += svgTxt(x + p.w / 2, pt + h / 2 + 5, p.a, { w: 'bold', size: 14, c: p.cut ? COL.r : COL.k });
    x += p.w;
  });
  s += svgTxt(pl - 10, pt + h / 2 + 5, o.kl, { w: 'bold', size: 14, a: 'end', c: COL.v });
  if (o.tot){ const tw = o.totW || totW, y = pt + h + 8; s += `<path d="M${pl} ${y}q0 8 8 8H${pl + tw / 2 - 7}q7 0 7 7q0 -7 7 -7H${pl + tw - 8}q8 0 8 -8" fill="none" stroke="${COL.g}" stroke-width="2"/>` + svgTxt(pl + tw / 2, y + 32, o.tot, { w: 'bold', size: 13, c: COL.g }); }
  return s + '</svg>';
}

/* Objets rangés par paquets : divisibilite_paquets(17, 3) → 5 paquets de 3 et un reste de 2 (en rouge) */
function divisibilite_paquets(n, b, o){
  o = o || {}; const q = Math.floor(n / b), rest = n - q * b, d = 16, gw = b * d + 12, perRow = o.perRow || Math.max(1, Math.floor(500 / (gw + 10)));
  const rows = Math.ceil((q + (rest ? 1 : 0)) / perRow), W = Math.min(q + (rest ? 1 : 0), perRow) * (gw + 10) + 20, H = rows * 40 + 34;
  let s = SVG0(W, H);
  for (let k = 0; k <= q; k++){
    const cnt = k < q ? b : rest; if (!cnt) continue;
    const x = 10 + (k % perRow) * (gw + 10), y = 8 + Math.floor(k / perRow) * 40, c = k < q ? COL.b : COL.r;
    s += `<rect x="${x}" y="${y}" width="${k < q ? gw : cnt * d + 12}" height="30" rx="8" fill="${c}14" stroke="${c}" stroke-width="1.6" ${k < q ? '' : 'stroke-dasharray="5 4"'}/>`;
    for (let j = 0; j < cnt; j++) s += `<circle cx="${x + 14 + j * d}" cy="${y + 15}" r="6" fill="${c}"/>`;
  }
  s += svgTxt(W / 2, H - 8, o.t || `${n} = ${b} × ${q} + ${rest}`, { w: 'bold', size: 14, c: COL.k });
  return s + '</svg>';
}
/* Grille des nombres de 1 à N, nombres premiers colorés (crible d'Ératosthène) */
function divisibilite_crible(N){
  const u = 38, cols = 10, rows = Math.ceil(N / cols), W = cols * u + 20, H = rows * u + 20;
  const prem = k => { if (k < 2) return false; for (let d = 2; d * d <= k; d++) if (k % d === 0) return false; return true; };
  let s = SVG0(W, H);
  for (let k = 1; k <= N; k++){ const i = (k - 1) % cols, j = Math.floor((k - 1) / cols), x = 10 + i * u, y = 10 + j * u, p = prem(k);
    s += `<rect x="${x}" y="${y}" width="${u}" height="${u}" fill="${p ? COL.g + '44' : k === 1 ? '#eee' : '#fff'}" stroke="#8a94a8"/>` + svgTxt(x + u / 2, y + u / 2 + 5, String(k), { size: 14, w: p ? 'bold' : 'normal', c: p ? COL.g : '#999' }); }
  return s + '</svg>';
}

  list.forEach((th, i) => {
    const cx = 70 + i * 110;
    for (let v = mn; v <= mx; v += st){ s += `<line x1="${cx - 18}" y1="${Y(v)}" x2="${cx - 10}" y2="${Y(v)}" stroke="#555" stroke-width="${v === 0 ? 2.2 : 1}"/>` + svgTxt(cx - 22, Y(v) + 4, fr(v), { size: 11, a: 'end', c: v === 0 ? COL.k : '#666', w: v === 0 ? 'bold' : 'normal' }); }
    s += `<rect x="${cx - 8}" y="${top - 8}" width="16" height="${bot - top + 16}" rx="8" fill="#fff" stroke="#1d2433" stroke-width="1.6"/>`;
    s += `<rect x="${cx - 4}" y="${Y(th.t)}" width="8" height="${bot - Y(th.t) + 10}" fill="${th.t < 0 ? COL.b : COL.r}"/><circle cx="${cx}" cy="${bot + 16}" r="12" fill="${th.t < 0 ? COL.b : COL.r}" stroke="#1d2433" stroke-width="1.6"/>`;
    s += svgTxt(cx + 14, Y(th.t) + 5, fr(th.t) + ' °C', { size: 13, w: 'bold', a: 'start', c: th.t < 0 ? COL.b : COL.r });
    if (th.l) s += svgTxt(cx, H - 6, th.l, { size: 13, w: 'bold' });
  });
  s += `<line x1="20" y1="${Y(0)}" x2="${W - 10}" y2="${Y(0)}" stroke="${COL.g}" stroke-dasharray="5 4"/>`;
  return s + '</svg>';
}
const relatifs_plan = (pts, o) => geo(Object.assign({ s: 34, grid: true, axes: { x: [-5, 5], y: [-4, 4] }, pts, cross: true }, o || {}));

CH({ id: 'relatifs', th: 'Nombres et calculs', per: 'Périodes 1 et 2', t: 'Les nombres relatifs',
intro: r`Découvrir les <b>nombres négatifs</b>, utiles pour les températures, les altitudes ou les dates. Les placer sur une droite graduée, les comparer, les ranger, puis repérer des points dans un plan avec des <b>coordonnées</b>.`,
cours: [
{ t: 'Des nombres plus petits que zéro', h: EXM(r`En hiver, le thermomètre peut descendre <b>sous zéro</b>. On écrit $-5$ °C (« moins cinq degrés ») pour 5 degrés en dessous de zéro, et $+12$ °C ou simplement $12$ °C pour 12 degrés au-dessus de zéro.`) + FIG(relatifs_thermos([{ t: -5, l: 'Lille' }, { t: 0, l: 'Paris' }, { t: 12, l: 'Nice' }, { t: -15, l: 'Montagne' }])) + EXM(r`• <b>Altitudes</b> : le sommet du mont Blanc est à environ $+4\,806$ m ; le bord de la mer Morte est à environ $-430$ m (sous le niveau de la mer, qui est à 0 m).<br>
• <b>Ascenseur</b> : le rez-de-chaussée est l'étage 0, le parking du sous-sol est l'étage $-2$.<br>
• <b>Dates</b> : l'an $-300$, c'est 300 ans avant J.-C.`) + RET(r`Les nombres relatifs servent à repérer une grandeur par rapport à un <b>zéro</b> de référence : au-dessus (nombres positifs, signe $+$) ou au-dessous (nombres négatifs, signe $-$).`) + ATT(r`Historiquement, ces nombres ont mis longtemps à être acceptés : le mathématicien indien <b>Brahmagupta</b> les utilisait vers l'an 630 pour parler de dettes, mais en Europe on doutait encore de leur existence au XVIIe siècle !`, 'Le savais-tu ?') },
{ t: 'Nombres positifs, négatifs et opposés', h: DEF(r`Un <b>nombre relatif</b> est formé d'un <b>signe</b> ($+$ ou $-$) et d'une <b>distance à zéro</b>.<br>
• Un nombre <b>positif</b> est supérieur ou égal à 0 : $3$ ; $+7,5$ ; $0$.<br>
• Un nombre <b>négatif</b> est inférieur ou égal à 0 : $-2$ ; $-0,8$ ; $0$.<br>
• <b>Strictement</b> positif (ou négatif) veut dire : positif (ou négatif) <b>et différent de 0</b>.<br>
• $0$ est à la fois positif et négatif : c'est le seul !`, 'Définitions') + DEF(r`Deux nombres sont <b>opposés</b> quand leur somme vaut 0 : $3 + (-3) = 0$.<br>L'opposé de $a$ se note $-a$. Ainsi l'opposé de 3 est $-3$, l'opposé de $-3$ est $3$ : $-(-3) = 3$. L'opposé de 0 est 0.`, 'Nombres opposés') + FIG(gline({ a: -5, b: 5, W: 520, pts: [{ x: -3, l: '−3', c: COL.b }, { x: 3, l: '3', c: COL.r }], arcs: [{ x1: 0, x2: 3, l: '3 unités', c: COL.r }, { x1: 0, x2: -3, l: '3 unités', c: COL.b }] })) + DEF(r`La <b>distance à zéro</b> d'un nombre s'appelle sa <b>valeur absolue</b>. Deux nombres opposés ont la même distance à zéro : $3$ et $-3$ sont tous les deux à 3 unités de 0. (Ce mot sera utilisé plus tard ; retiens surtout l'idée de « distance à zéro ».)`, 'Distance à zéro') + ATT(r`$-a$ n'est pas toujours négatif ! Si $a = -4$, alors $-a = -(-4) = 4$, qui est positif.`) },
{ t: 'La droite graduée et l’abscisse', h: DEF(r`Sur une <b>droite graduée</b>, on place 0 (l'<b>origine</b>), les nombres positifs à droite et les nombres négatifs à gauche, avec la même unité de chaque côté : c'est la demi-droite de 6e complétée par symétrie.<br>
Le nombre qui repère un point s'appelle son <b>abscisse</b>.`) + FIG(gline({ a: -5, b: 5, W: 520, pts: [{ x: -4, l: 'A', t: '−4' }, { x: -1.5, l: 'B', t: '−1,5', c: COL.b }, { x: 2, l: 'C', t: '2', c: COL.g }, { x: 0, l: 'O', c: COL.k }] , sub: 2 })) + EXM(r`$A$ a pour abscisse $-4$, on note $A(-4)$. $B(-1,5)$ est au milieu entre $-2$ et $-1$. $C(2)$. L'origine $O$ a pour abscisse 0.`) + METH(r`Pour lire une abscisse : <ol><li>je repère l'unité et la valeur d'une petite graduation ;</li><li>je pars de 0 et je compte les graduations ;</li><li>je mets le signe $-$ si le point est à gauche de 0.</li></ol>`, 'Lire une abscisse') + FIG(gline({ a: -2, b: 2, sub: 4, W: 520, pts: [{ x: -1.25, l: 'D', c: COL.v }, { x: 0.75, l: 'E', c: COL.o }] })) + EXM(r`Ici une unité est partagée en 4 : une petite graduation vaut $0,25$. $D(-1,25)$ et $E(0,75)$.`) + ATT(r`À gauche de 0, on compte <b>vers la gauche</b> à partir de 0 : le point juste après $-1$ (vers la gauche) n'est pas $-0,75$ mais $-1,25$.`) },
{ t: 'Comparer et ranger', h: PROP(r`Sur la droite graduée, le plus petit nombre est <b>le plus à gauche</b>. Donc :<br>
• un nombre négatif est plus petit qu'un nombre positif : $-7 < 2$ ;<br>
• deux positifs : le plus petit est celui qui a la plus petite distance à zéro : $3 < 5$ ;<br>
• deux négatifs : le plus petit est celui qui a la <b>plus grande</b> distance à zéro : $-5 < -3$.`, 'Comparer deux relatifs') + FIG(gline({ a: -6, b: 6, W: 520, pts: [{ x: -5, l: '−5', c: COL.b }, { x: -3, l: '−3', c: COL.b }, { x: 3, l: '3', c: COL.r }, { x: 5, l: '5', c: COL.r }] })) + EXM(r`Il fait $-5$ °C à Moscou et $-3$ °C à Berlin : il fait plus froid à Moscou, donc $-5 < -3$.<br>
Verbaliser : $-5$ c'est 2 de moins que $-3$ ; 5 c'est 2 de moins que 7.`) + METH(r`Pour <b>ranger</b> des nombres relatifs dans l'ordre croissant : les négatifs d'abord (du plus loin de 0 au plus près), puis 0, puis les positifs (du plus près au plus loin).<br>
Exemple : $-4,5 < -2 < -0,5 < 0 < 1 < 3,2$.`, 'Ranger') + ATT(r`$-8$ n'est pas plus grand que $-2$ ! Pense au thermomètre : $-8$ °C est plus froid que $-2$ °C.`) },
{ t: 'Se repérer dans le plan', h: DEF(r`Un <b>repère</b> du plan est formé de deux droites graduées perpendiculaires qui se coupent en l'<b>origine</b> $O$ :<br>
• l'axe horizontal est l'<b>axe des abscisses</b> ;<br>
• l'axe vertical est l'<b>axe des ordonnées</b>.<br>
Chaque point est repéré par deux nombres, ses <b>coordonnées</b> : d'abord l'<b>abscisse</b>, puis l'<b>ordonnée</b>. On écrit $A(3 ; 2)$.`) + FIG(relatifs_plan({ A: [3, 2], B: [-4, 1], C: [-2, -3], D: [2, -2], E: [0, 3] }, { lp: { E: 'e' }, segs: [['A', '_a', { c: COL.r, dash: 1, w: 1.5 }], ['A', '_b', { c: COL.r, dash: 1, w: 1.5 }]], pts: { A: [3, 2], B: [-4, 1], C: [-2, -3], D: [2, -2], E: [0, 3], _a: [3, 0], _b: [0, 2] } })) + EXM(r`$A(3 ; 2)$ : on avance de 3 vers la droite, puis on monte de 2.<br>
$B(-4 ; 1)$ ; $C(-2 ; -3)$ ; $D(2 ; -2)$ ; $E(0 ; 3)$ est sur l'axe des ordonnées. L'origine est $O(0 ; 0)$.`) + METH(r`Pour lire les coordonnées d'un point, je descends (ou monte) verticalement jusqu'à l'axe horizontal : c'est l'<b>abscisse</b>. Puis je vais horizontalement jusqu'à l'axe vertical : c'est l'<b>ordonnée</b>.`, 'Lire des coordonnées') + ATT(r`L'ordre compte : $(3 ; 2)$ et $(2 ; 3)$ ne sont pas le même point. Toujours l'abscisse <b>en premier</b> (comme dans l'alphabet : a avant o).`) }
],

/* ===== c05-relatifs-add.js ===== */
/* Chapitre « Additionner et soustraire des relatifs » (5e, périodes 3 et 4) */
/* Déplacement sur la droite graduée : départ x0, sauts successifs */
const reladd_moves = (a, b, x0, steps, o) => { let x = x0; const arcs = steps.map((d, k) => { const g = { x1: x, x2: x + d, l: (d > 0 ? '+' : '−') + fr(Math.abs(d)), c: d > 0 ? COL.r : COL.b }; x += d; return g; });
  return gline(Object.assign({ a, b, W: 520, arcs, pts: [{ x: x0, l: 'départ', c: COL.k }, { x, t: 'arrivée : ' + fr(x), c: COL.g }] }, o || {})); };
/* Pyramide de briques : rows du bas vers le haut, chaque case = texte */
function reladd_pyr(rows){
  const bw = 70, bh = 34, n = rows[0].length, W = n * bw + 20, H = rows.length * bh + 20;
  let s = SVG0(W, H);
  rows.forEach((row, j) => row.forEach((t, i) => { const x = 10 + i * bw + j * bw / 2, y = H - 10 - (j + 1) * bh; s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${t === '?' ? '#fff8e1' : PAL[j % PAL.length] + '22'}" stroke="#1d2433" stroke-width="1.5"/>` + svgTxt(x + bw / 2, y + bh / 2 + 5, t, { w: 'bold', size: 15, c: t === '?' ? COL.o : COL.k }); }));
  return s + '</svg>';
}

const fraccomp_bars = list => list.map(([n, d, c]) => fracBar(n, d, { lab: true, c, W: 360 })).join('<br>');

CH({ id: 'fractions-comparer', th: 'Nombres et calculs', per: 'Période 2', t: 'Fractions égales et comparaison',
intro: r`Reconnaître des <b>fractions égales</b>, <b>simplifier</b> une fraction, <b>comparer</b> des fractions (à 1, à $\frac{1}{2}$, ou entre elles) et écrire un même nombre de plusieurs façons.`,
cours: [
{ t: 'Des fractions égales', h: PROP(r`On ne change pas une fraction quand on <b>multiplie</b> (ou qu'on <b>divise</b>) son numérateur <b>et</b> son dénominateur par un même nombre (non nul) :<br>
$\frac{a}{b} = \frac{a \times k}{b \times k}$.`, 'Fractions égales') + FIG(fraccomp_bars([[2, 3, COL.b], [4, 6, COL.o], [8, 12, COL.g]])) + EXM(r`Les trois bandes ont la même partie coloriée : $\frac{2}{3} = \frac{4}{6} = \frac{8}{12}$. On a multiplié par 2, puis encore par 2.<br>
$\frac{2}{3} = \frac{\ldots}{15}$ : on passe de 3 à 15 en multipliant par 5, donc $\frac{2}{3} = \frac{2 \times 5}{3 \times 5} = \frac{10}{15}$.`) + ATT(r`On ne peut pas <b>ajouter</b> le même nombre en haut et en bas : $\frac{2}{3} \ne \frac{2 + 1}{3 + 1} = \frac{3}{4}$. Compare les bandes : $\frac{3}{4}$ est plus grand !`) + METH(r`Pour compléter $\frac{4}{7} = \frac{\ldots}{14}$ : je cherche par combien on multiplie 7 pour obtenir 14 (ici 2), puis je multiplie 4 par ce nombre : $\frac{8}{14}$.`) },
{ t: 'Simplifier une fraction', h: DEF(r`<b>Simplifier</b> une fraction, c'est trouver une fraction égale avec un numérateur et un dénominateur plus petits, en les <b>divisant</b> par un même diviseur commun.<br>Quand on ne peut plus simplifier, la fraction est dite <b>irréductible</b>.`) + EXM(r`$\frac{18}{24}$ : 18 et 24 sont pairs, on divise par 2 : $\frac{9}{12}$. 9 et 12 sont dans la table de 3 : $\frac{3}{4}$. On ne peut plus simplifier.<br>
Plus vite : on divise directement par 6 : $\frac{18}{24} = \frac{18 \div 6}{24 \div 6} = \frac{3}{4}$.`) + FIG(fracBar(18, 24, { W: 480 }) + '<br>' + fracBar(3, 4, { W: 480, lab: '18/24 = 3/4' })) + METH(r`Pour trouver un diviseur commun, utilise les tables et les critères de divisibilité : par 2 (pairs), par 5 (finit par 0 ou 5), par 10, par 3 ou 9 (somme des chiffres).`, 'Astuce') + EXM(r`$\frac{35}{49} = \frac{5 \times 7}{7 \times 7} = \frac{5}{7}$ ; $\frac{45}{60} = \frac{3}{4}$ (on divise par 15) ; $\frac{12}{4} = 3$.`) },
{ t: 'Comparer à 1 et à un demi', h: PROP(r`• Si le numérateur est <b>plus petit</b> que le dénominateur, la fraction est <b>inférieure à 1</b> : $\frac{7}{9} < 1$.<br>

{ t: 'Comparer deux fractions', h: PROP(r`• <b>Même dénominateur</b> : la plus grande est celle qui a le plus grand numérateur. $\frac{2}{7} < \frac{5}{7}$.<br>

{ t: 'Entier + fraction et écritures d’un même nombre', h: METH(r`Une fraction supérieure à 1 peut s'écrire comme la somme d'un <b>entier</b> et d'une fraction <b>inférieure à 1</b>, grâce à la division euclidienne.<br>
$\frac{17}{5}$ : $17 = 5 \times 3 + 2$, donc $\frac{17}{5} = \frac{15}{5} + \frac{2}{5} = 3 + \frac{2}{5}$.`, 'Entier + fraction') + FIG(fracBar(17, 5, { W: 300, lab: '17/5 = 3 + 2/5' })) + FIG(gline({ a: 0, b: 4, sub: 5, W: 520, half: true, pts: [{ x: 3.4, l: '17/5', c: COL.r }] })) + EXM(r`Sur la droite graduée, chaque unité est partagée en 5 : $\frac{17}{5}$ est entre 3 et 4, à 2 graduations après 3.`) + DEF(r`Un même nombre a <b>plusieurs écritures</b> :<br>

• $\frac{17}{5} = 3 + \frac{2}{5}$ grâce à $17 = 5 \times 3 + 2$.`) }
],

/* ===== c07-fractions-add.js ===== */
/* Chapitre « Additionner et soustraire des fractions » (5e, période 4) */
/* Barre partagée en d parts, par groupes colorés : fracadd_bar(24, [[4, 'matin', c], [15, 'retour', c], [5, '?', null]]) */
function fracadd_bar(d, groups, o){
  o = o || {}; const u = o.u || Math.min(40, Math.floor(480 / d)), W = d * u + 20, top = 30, h = 34, H = top + h + (o.total ? 40 : 12);
  let s = SVG0(W, H), k = 0;
  groups.forEach(([n, t, c]) => {
    const x0 = 10 + k * u;
    for (let j = 0; j < n; j++) s += `<rect x="${10 + (k + j) * u}" y="${top}" width="${u}" height="${h}" fill="${c ? c + '55' : '#fff'}" stroke="#1d2433" stroke-width="1.2"/>`;
    s += `<rect x="${x0}" y="${top}" width="${n * u}" height="${h}" fill="none" stroke="${c || COL.gr}" stroke-width="2.6"/>`;
    if (t) s += svgTxt(x0 + n * u / 2, top - 9, t, { w: 'bold', size: 13, c: c || COL.k });
    k += n;
  });
  if (o.total){ const y = top + h + 6, tw = d * u; s += `<path d="M10 ${y}q0 8 8 8H${10 + tw / 2 - 7}q7 0 7 7q0 -7 7 -7H${2 + tw}q8 0 8 -8" fill="none" stroke="${COL.r}" stroke-width="2"/>` + svgTxt(10 + tw / 2, y + 30, o.total, { w: 'bold', size: 13, c: COL.r }); }
  return s + '</svg>';
}

intro: r`Additionner et soustraire des fractions : d'abord avec le même dénominateur, puis avec des dénominateurs différents en cherchant un <b>multiple commun</b>. Résoudre des problèmes avec un <b>modèle en barres</b>.`,
cours: [
{ t: 'Avec le même dénominateur', h: PROP(r`Pour additionner (ou soustraire) deux fractions de <b>même dénominateur</b>, on additionne (ou on soustrait) les <b>numérateurs</b> et on <b>garde</b> le dénominateur :<br>
$\frac{a}{d} + \frac{b}{d} = \frac{a + b}{d}$ et $\frac{a}{d} - \frac{b}{d} = \frac{a - b}{d}$.`) + FIG(barModel([{ l: '1 unité', parts: [{ v: 1, t: '1/5' }, { v: 1, t: '1/5' }, { v: 1, t: '1/5' }, { v: 1, t: '1/5', c: COL.o }, { v: 1, t: '1/5', c: COL.o }] }, { l: '1 unité', parts: [{ v: 1, t: '1/5', c: COL.o }, { v: 1, t: '1/5', c: COL.o }, { v: 1, t: '', blank: true }, { v: 1, t: '', blank: true }, { v: 1, t: '', blank: true }] }], { u: 60, total: { t: '3/5 (bleu) + 4/5 (orange) = 7/5' } })) + EXM(r`$\frac{3}{5} + \frac{4}{5} = \frac{7}{5}$ : 3 cinquièmes plus 4 cinquièmes font 7 cinquièmes (c'est plus que 1).<br>
$\frac{7}{9} - \frac{2}{9} = \frac{5}{9}$.`) + ATT(r`On n'additionne <b>jamais</b> les dénominateurs : $\frac{3}{5} + \frac{4}{5} \ne \frac{7}{10}$. Des cinquièmes plus des cinquièmes donnent des cinquièmes, comme 3 pommes plus 4 pommes donnent 7 pommes.`) + EXM(r`$\frac{2}{5} + \frac{2}{5} + \frac{1}{5} = \frac{5}{5} = 1$ ; $\frac{9}{4} - \frac{1}{4} = \frac{8}{4} = 2$.`) },
{ t: 'Quand un dénominateur est multiple de l’autre', h: METH(r`Si un dénominateur est un <b>multiple</b> de l'autre, on transforme une seule fraction pour avoir le même dénominateur, puis on calcule.`, 'Méthode') + EXM(r`$\frac{1}{2} + \frac{3}{4}$ : 4 est un multiple de 2, et $\frac{1}{2} = \frac{2}{4}$.<br>Donc $\frac{1}{2} + \frac{3}{4} = \frac{2}{4} + \frac{3}{4} = \frac{5}{4}$.`) + FIG(fracBar(1, 2, { lab: '1/2', W: 360 }) + '<br>' + fracBar(2, 4, { lab: '= 2/4', W: 360 }) + '<br>' + fracBar(3, 4, { lab: '3/4', W: 360, c: COL.o })) + EXM(r`$\frac{2}{3} + \frac{4}{21}$ : $21 = 3 \times 7$, donc $\frac{2}{3} = \frac{14}{21}$. $\frac{14}{21} + \frac{4}{21} = \frac{18}{21} = \frac{6}{7}$ (on simplifie par 3).<br>
$\frac{5}{6} - \frac{1}{3} = \frac{5}{6} - \frac{2}{6} = \frac{3}{6} = \frac{1}{2}$.`) + ATT(r`Quand tu multiplies le dénominateur, n'oublie pas de multiplier <b>aussi le numérateur</b> : $\frac{1}{2} = \frac{2}{4}$, pas $\frac{1}{4}$.`) },
{ t: 'Avec des dénominateurs quelconques', h: METH(r`<ol><li>J'écris la liste des <b>multiples</b> de chaque dénominateur.</li><li>Je choisis un <b>multiple commun</b> (le plus petit, pour avoir des calculs simples).</li><li>J'écris les deux fractions avec ce dénominateur commun.</li><li>J'additionne ou je soustrais les numérateurs, puis je simplifie si possible.</li></ol>`, 'Méthode : dénominateur commun') + EXM(r`$\frac{3}{8} + \frac{7}{6}$.<br>
Multiples de 8 : 8, 16, <b>24</b>, 32… ; multiples de 6 : 6, 12, 18, <b>24</b>… On choisit 24.<br>
$\frac{3}{8} = \frac{9}{24}$ ; $\frac{7}{6} = \frac{28}{24}$. Donc $\frac{3}{8} + \frac{7}{6} = \frac{9}{24} + \frac{28}{24} = \frac{37}{24}$.`) + EXM(r`$\frac{5}{12} - \frac{2}{9}$ : multiples de 12 : 12, 24, <b>36</b> ; multiples de 9 : 9, 18, 27, <b>36</b>.<br>
$\frac{15}{36} - \frac{8}{36} = \frac{7}{36}$.`) + EXM(r`$\frac{2}{5} + \frac{1}{4}$ : on prend $5 \times 4 = 20$. $\frac{8}{20} + \frac{5}{20} = \frac{13}{20}$.`) + FIG(fracBar(8, 20, { lab: '2/5 = 8/20', W: 440 }) + '<br>' + fracBar(5, 20, { lab: '1/4 = 5/20', W: 440, c: COL.o })) + METH(r`Le produit des deux dénominateurs est toujours un multiple commun ($5 \times 4 = 20$), mais pas toujours le plus petit : pour 8 et 6, $8 \times 6 = 48$ marche aussi, mais 24 est plus simple.`, 'Astuce') },
{ t: 'Entiers et fractions', h: METH(r`Un entier s'écrit comme une fraction de n'importe quel dénominateur : $1 = \frac{5}{5}$ ; $3 = \frac{15}{5}$ ; $7 = \frac{21}{3}$.`, 'Méthode') + EXM(r`$3 + \frac{2}{5} = \frac{15}{5} + \frac{2}{5} = \frac{17}{5}$.<br>
$1 - \frac{3}{4} = \frac{4}{4} - \frac{3}{4} = \frac{1}{4}$.<br>
$7 - \frac{2}{3} = \frac{21}{3} - \frac{2}{3} = \frac{19}{3}$.`) + FIG(fracBar(3, 4, { lab: '1 − 3/4 = 1/4 (la partie blanche)', W: 360 })) + EXM(r`$\frac{2}{5} + \frac{2}{5} + \frac{1}{4}$ : $\frac{4}{5} + \frac{1}{4} = \frac{16}{20} + \frac{5}{20} = \frac{21}{20}$.`) + ATT(r`$3 + \frac{2}{5}$ n'est pas $\frac{5}{5}$ ni $\frac{3 + 2}{5}$ : le 3 représente 3 unités entières, soit $\frac{15}{5}$.`) },
{ t: 'Résoudre des problèmes avec des barres', h: EXM(r`<b>Énoncé</b> (exemple du programme). Sarah lit un roman dans le bus. Ce matin, elle a lu $\frac{1}{6}$ de son livre. Au retour, elle en a lu $\frac{5}{8}$. Il lui reste 15 pages à lire.<br>
• Quelle fraction du livre lui reste-t-il à lire ? • Combien de pages compte son roman ?`) + METH(r`On choisit une barre partagée en <b>24 parts</b> (multiple commun de 6 et 8) : $\frac{1}{6} = \frac{4}{24}$ et $\frac{5}{8} = \frac{15}{24}$.`, 'Modèle en barres') + FIG(fracadd_bar(24, [[4, 'matin', COL.b], [15, 'retour', COL.o], [5, '15 p.', null]], { total: 'le livre : 24 parts' })) + EXM(r`Lu en tout : $\frac{4}{24} + \frac{15}{24} = \frac{19}{24}$. Il reste $1 - \frac{19}{24} = \frac{24}{24} - \frac{19}{24} = \frac{5}{24}$ du livre.<br>
5 parts valent 15 pages, donc 1 part vaut $15 \div 5 = 3$ pages. Le livre a $24 \times 3 = 72$ pages.<br>
Contrôle : matin $\frac{1}{6}$ de 72 $= 12$ pages ; retour $\frac{5}{8}$ de 72 $= 45$ pages ; $12 + 45 + 15 = 72$ ✔.`) + RET(r`• Même dénominateur : on additionne les numérateurs, on garde le dénominateur.<br>

],
