/* Chapitre « Carrés et cubes » (5e, période 2) */
/* Cube formé de n × n × n petits cubes, en perspective cavalière */
function carrecube_cube(n, o){
  o = o || {}; const c = o.c || Math.min(40, Math.floor(150 / n)), dx = c * 0.5 * Math.SQRT1_2 * 1.0, dy = -c * 0.5 * Math.SQRT1_2, L = n * c;
  const x0 = 20, yT = 20 + n * -dy, yB = yT + L, W = x0 + L + n * dx + 30, H = yB + 20 + (o.lab ? 18 : 0), col = o.col || COL.b;
  const P = pts => pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
  let s = SVG0(W, H);
  s += `<path d="M${P([[x0, yT], [x0 + L, yT], [x0 + L, yB], [x0, yB]])}Z" fill="${col}22" stroke="${col}" stroke-width="2"/>`;
  s += `<path d="M${P([[x0, yT], [x0 + L, yT], [x0 + L + n * dx, yT + n * dy], [x0 + n * dx, yT + n * dy]])}Z" fill="${col}44" stroke="${col}" stroke-width="2"/>`;
  s += `<path d="M${P([[x0 + L, yT], [x0 + L + n * dx, yT + n * dy], [x0 + L + n * dx, yB + n * dy], [x0 + L, yB]])}Z" fill="${col}11" stroke="${col}" stroke-width="2"/>`;
  const ln = (a, b) => `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
  for (let i = 1; i < n; i++){
    s += ln([x0 + i * c, yT], [x0 + i * c, yB]) + ln([x0, yT + i * c], [x0 + L, yT + i * c]);
    s += ln([x0 + i * dx, yT + i * dy], [x0 + L + i * dx, yT + i * dy]) + ln([x0 + i * c, yT], [x0 + i * c + n * dx, yT + n * dy]);
    s += ln([x0 + L + i * dx, yT + i * dy], [x0 + L + i * dx, yB + i * dy]) + ln([x0 + L, yT + i * c], [x0 + L + n * dx, yT + i * c + n * dy]);
  }
  if (o.lab) s += svgTxt(x0 + L / 2, H - 6, o.lab, { w: 'bold', size: 14, c: col });
  return s + '</svg>';
}
/* Carré quadrillé de côté n */
const carrecube_carre = (n, lab, c) => gridFrac(n * n, n, n, { u: Math.min(30, Math.floor(180 / n)), c: c || COL.o });

/* Frises de carrés en allumettes : une ligne par rang demandé */
function litintro_allum(ranks, o){
  o = o || {}; const u = o.u || 40, lw = 74, gap = 26;
  const W = lw + Math.max(...ranks) * u + 30, H = ranks.length * (u + gap) + 10;
  let s = SVG0(W, H);
  const stick = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d9a35b" stroke-width="5" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="4" fill="${COL.r}"/>`;
  ranks.forEach((n, j) => {
    const y = 14 + j * (u + gap), x0 = lw;
    s += svgTxt(lw - 12, y + u / 2 + 5, 'Rang ' + n, { a: 'end', w: 'bold', size: 13 });
    for (let i = 0; i < n; i++){ s += stick(x0 + i * u + 5, y, x0 + (i + 1) * u - 5, y) + stick(x0 + i * u + 5, y + u, x0 + (i + 1) * u - 5, y + u); }
    for (let i = 0; i <= n; i++) s += stick(x0 + i * u, y + u - 5, x0 + i * u, y + 5);
  });
  return s + '</svg>';
}
/* Motifs de jetons en croix : un jeton central (rouge) et 4 bras de n jetons (bleus) */
function litintro_croix(ranks){
  const c = 16, gap = 30, sizes = ranks.map(n => (2 * n + 1) * c);
  const W = sizes.reduce((t, v) => t + v + gap, 10), H = Math.max(...sizes) + 40;
  let s = SVG0(W, H), x = 20;
  ranks.forEach((n, k) => {
    const sz = sizes[k], y0 = (H - 30 - sz) / 2 + 4;
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++){
      if (i !== 0 && j !== 0) continue;
      const cx = x + (n + i + 0.5) * c, cy = y0 + (n + j + 0.5) * c;
      s += `<circle cx="${cx}" cy="${cy}" r="${c / 2 - 1.5}" fill="${i === 0 && j === 0 ? COL.r : COL.b}" opacity="0.85"/>`;
    }
    s += svgTxt(x + sz / 2, H - 10, 'Rang ' + n, { w: 'bold', size: 13 });
    x += sz + gap;
  });
  return s + '</svg>';
}
/* Tuiles : groupes de barres « x » (bleues) et de petits carrés « 1 » (orange) ; g = [{x:3}, {u:2}, ...] */
function litintro_tuiles(g, lab){
  const tw = 54, th = 26, uw = 26, sep = 34;
  let W = 20; g.forEach(p => { W += p.x ? p.x * (tw + 4) : p.u * (uw + 4); W += sep; });
  let s = SVG0(W, lab ? 84 : 56), x = 10;
  g.forEach((p, k) => {
    if (p.x) for (let i = 0; i < p.x; i++){ s += `<rect x="${x}" y="12" width="${tw}" height="${th}" rx="4" fill="${COL.b}33" stroke="${COL.b}" stroke-width="2"/>` + svgTxt(x + tw / 2, 30, p.l || 'x', { w: 'bold', it: true, c: COL.b }); x += tw + 4; }
    if (p.u) for (let i = 0; i < p.u; i++){ s += `<rect x="${x}" y="12" width="${uw}" height="${th}" rx="4" fill="${COL.o}33" stroke="${COL.o}" stroke-width="2"/>` + svgTxt(x + uw / 2, 30, '1', { w: 'bold', c: COL.o }); x += uw + 4; }
    if (k < g.length - 1) s += svgTxt(x + sep / 2 - 2, 31, '+', { w: 'bold', size: 18 });
    x += sep;
  });
  if (lab) s += svgTxt(W / 2, 70, lab, { w: 'bold', c: COL.g, size: 14 });
  return s + '</svg>';
}
/* Frise de triangles en allumettes (n triangles) */
function litintro_tri(n){
  const pts = {}, segs = [];
  for (let k = 0; k < n + 2; k++) pts['_' + k] = k % 2 === 0 ? [k, 0] : [k, 1.73];
  for (let k = 0; k < n + 1; k++) segs.push(['_' + k, '_' + (k + 1), { c: '#d9a35b', w: 5 }]);
  for (let k = 0; k + 2 < n + 2; k++) segs.push(['_' + k, '_' + (k + 2), { c: '#d9a35b', w: 5 }]);
  return geo({ s: 34, pts, segs });
}

/* ===== Calcul littéral 2 : calculer une expression, tester une égalité ===== */
/* Test d'une égalité : deux plateaux (membre de gauche, membre de droite) et le verdict */
function litsubst_test(x, gl, gv, dl, dv){
  const W = 520, H = 150, ok = Math.abs(gv - dv) < 1e-9, c = ok ? COL.g : COL.r;
  let s = SVG0(W, H);
  s += svgTxt(W / 2, 22, 'Pour x = ' + fr(x), { w: 'bold', size: 15, c: COL.v });
  [[20, gl, gv, 'membre de gauche'], [300, dl, dv, 'membre de droite']].forEach(([x0, l, v, t]) => {
    s += `<rect x="${x0}" y="38" width="200" height="74" rx="12" fill="${COL.b}10" stroke="${COL.b}" stroke-width="2"/>`;
    s += svgTxt(x0 + 100, 62, l, { size: 14 }) + svgTxt(x0 + 100, 94, '= ' + fr(v), { w: 'bold', size: 18, c: COL.b }) + svgTxt(x0 + 100, 132, t, { size: 12, c: '#666' });
  });
  s += svgTxt(W / 2, 86, ok ? '=' : '≠', { w: 'bold', size: 30, c });
  s += svgTxt(W / 2, 146, ok ? 'égalité VRAIE' : 'égalité FAUSSE', { w: 'bold', size: 13, c });
  return s + '</svg>';
}

/* ===== Calcul littéral 3 : développer et factoriser ===== */
/* Modèle des aires : rectangle de hauteur h (étiquette kl) découpé en parts [{w, l (largeur écrite dessous), t (aire écrite dedans), c, out:true (part retirée, hachurée)}] */
function litdistri_aire(kl, h, parts, o){
  o = o || {}; const u = o.u || 34, W0 = parts.reduce((t, p) => t + p.w, 0) * u, W = W0 + 90, H = h * u + 60;
  let s = SVG0(W, H) + `<defs><pattern id="ldh${litdistri_aire.n = (litdistri_aire.n || 0) + 1}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="${COL.r}" stroke-width="2"/></pattern></defs>`;
  const x0 = 50, y0 = 14; let x = x0;
  parts.forEach((p, k) => {
    const c = p.c || PAL[k % PAL.length];
    s += `<rect x="${x}" y="${y0}" width="${p.w * u}" height="${h * u}" fill="${p.out ? `url(#ldh${litdistri_aire.n})` : c + '30'}" stroke="${p.out ? COL.r : c}" stroke-width="2" ${p.out ? 'stroke-dasharray="6 4"' : ''}/>`;
    if (p.t) s += svgTxt(x + p.w * u / 2, y0 + h * u / 2 + 6, p.t, { w: 'bold', size: 16, c: p.out ? COL.r : COL.k });
    s += svgTxt(x + p.w * u / 2, y0 + h * u + 20, p.l, { w: 'bold', size: 15, c: p.out ? COL.r : c });
    x += p.w * u;
  });
  s += svgTxt(x0 - 10, y0 + h * u / 2 + 6, kl, { w: 'bold', size: 15, a: 'end', c: COL.v });
  if (o.top) s += svgTxt(x0 + W0 / 2, y0 + h * u + 44, o.top, { w: 'bold', size: 14, c: COL.g });
  return s + '</svg>';
}

CH({ id: 'litteral-distributivite', th: 'Calcul littéral', per: 'Période 5', t: 'Développer et factoriser',

{ t: 'Rappel : la distributivité avec des nombres', h: r`<p>Un rectangle de 7 sur 12 peut être coupé en deux rectangles : 7 sur 10 et 7 sur 2.</p>` + FIG(litdistri_aire('7', 3.5, [{ w: 5, l: '10', t: '7 × 10' }, { w: 1.6, l: '2', t: '7 × 2', c: COL.o }], { top: '7 × 12 = 7 × 10 + 7 × 2 = 70 + 14 = 84' })) + EXM(r`<ul><li>$7 \times 12 = 7 \times (10 + 2) = 7 \times 10 + 7 \times 2 = 70 + 14 = 84$ ;</li>

{ t: 'Développer k(a − b)', h: PROP(r`Pour tous nombres $k$, $a$ et $b$ : <div style="text-align:center;font-size:1.15em;margin:6px 0">$k(a - b) = ka - kb$</div>`) + r`<p>Avec les aires : du rectangle $4 \times x$, on retire le rectangle $4 \times 3$ (hachuré). Il reste $4(x - 3)$.</p>` + FIG(litdistri_aire('4', 3, [{ w: 4.5, l: 'x − 3', t: '4(x − 3)', c: COL.b }, { w: 2.5, l: '3', t: '4 × 3', out: true }], { top: '4(x − 3) = 4x − 12' })) + EXM(r`<ul><li>$4(x - 3) = 4 \times x - 4 \times 3 = 4x - 12$ ;</li>

{ t: 'Factoriser', h: DEF(r`<b>Factoriser</b> une somme, c'est l'écrire sous la forme d'un <b>produit</b>. On utilise l'égalité dans l'autre sens : <div style="text-align:center;font-size:1.15em;margin:6px 0">$ka + kb = k(a + b) \quad \text{et} \quad ka - kb = k(a - b)$</div> Le nombre $k$ qui apparaît dans chaque terme s'appelle le <b>facteur commun</b>.`, 'Factoriser') + FIG(chain(['3(x + 2)', 'développer →', '3x + 6'], ['← factoriser'])) + EXM(r`<ul><li>$6x + 12 = 6 \times x + 6 \times 2 = 6(x + 2)$ ;</li>

$3x + 5x = (3 + 5)x = 8x$ ; $\quad 9y - 4y = (9 - 4)y = 5y$ ; $\quad 4x + x = 4x + 1x = (4 + 1)x = 5x$.`, 'Réduire avec la distributivité') + FIG(litdistri_aire('x', 2.5, [{ w: 3, l: '3', t: '3x' }, { w: 5, l: '5', t: '5x', c: COL.o }], { top: '3x + 5x = (3 + 5)x = 8x' })) + ATT(r`Dans $7x + 7$, le facteur commun est 7 : $7 = 7 \times 1$, donc $7x + 7 = 7(x + 1)$ et pas $7x$.<br>Et $x + x = 2x$, alors que $x \times x = x^{2}$.`) },
{ t: 'Prouver avec le calcul littéral', h: r`<p>Le calcul littéral permet de montrer qu'une propriété est vraie <b>pour tous les nombres</b>, et pas seulement sur quelques exemples.</p>` + EXM(r`<b>Propriété</b> : « La somme de trois entiers consécutifs est un multiple de 3. » Exemples : $4 + 5 + 6 = 15 = 3 \times 5$ ; $10 + 11 + 12 = 33 = 3 \times 11$.<br>
<b>Preuve</b> : soit $n$ le premier entier. Les suivants sont $n + 1$ et $n + 2$.<br>
$n + (n + 1) + (n + 2) = 3n + 3 = 3(n + 1)$.<br>
C'est 3 fois un entier : c'est toujours un multiple de 3. Et on voit même que c'est 3 fois le nombre du milieu !`, 'Exemple de preuve') + FIG(barModel([{ l: 'n', parts: [{ v: 4, t: 'n' }] }, { l: 'n + 1', parts: [{ v: 4, t: 'n' }, { v: 1, t: '1', c: COL.o }] }, { l: 'n + 2', parts: [{ v: 4, t: 'n' }, { v: 1, t: '1', c: COL.o }, { v: 1, t: '1', c: COL.o }] }], { u: 34 })) + EXM(r`<b>Programme</b> : choisir un nombre $x$, ajouter 2, multiplier par 3, enlever 6.<br>
On obtient $3(x + 2) - 6 = 3x + 6 - 6 = 3x$ : le résultat est <b>toujours le triple</b> du nombre choisi.`) + RET(r`<ul><li><b>Développer</b> (produit → somme) : $k(a + b) = ka + kb$ et $k(a - b) = ka - kb$.</li>

/* ===== Calcul littéral 4 : équations ax = c et x + b = c ===== */
/* Balance en équilibre : plateau gauche (texte), plateau droit (texte) ; o.boxL / o.boxR = nombre de boîtes x dessinées, o.wL / o.wR = masses (étiquettes) */
function equations_bal(lt, rt, o){
  o = o || {}; const W = 460, H = 210, cx = W / 2;
  let s = SVG0(W, H);
  s += `<path d="M${cx - 34} ${H - 12}L${cx} ${110}L${cx + 34} ${H - 12}Z" fill="#c8cfdc" stroke="#5d6779" stroke-width="2"/>`;
  s += `<line x1="${cx - 180}" y1="110" x2="${cx + 180}" y2="110" stroke="#5d6779" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="110" r="6" fill="#1d2433"/>`;
  [[cx - 150, lt, o.boxL || 0, o.wL || []], [cx + 150, rt, o.boxR || 0, o.wR || []]].forEach(([x, t, nb, ws]) => {
    s += `<line x1="${x}" y1="110" x2="${x - 60}" y2="90" stroke="#8a94a8"/><line x1="${x}" y1="110" x2="${x + 60}" y2="90" stroke="#8a94a8"/>`;
    s += `<path d="M${x - 70} 88h140l-12 8h-116z" fill="#5d6779"/>`;
    const items = []; for (let k = 0; k < nb; k++) items.push(['x', 34, COL.b]); ws.forEach(w => items.push([w, 30 + 6 * String(w).length, COL.o]));
    const tot = items.reduce((t, it) => t + it[1] + 4, -4); let xx = x - tot / 2;    items.forEach(([l, w, c]) => { const hh = l === 'x' ? 34 : 26; s += `<rect x="${xx}" y="${88 - hh}" width="${w}" height="${hh}" rx="5" fill="${c}33" stroke="${c}" stroke-width="2"/>` + svgTxt(xx + w / 2, 88 - hh / 2 + 5, l, { w: 'bold', c, it: l === 'x' }); xx += w + 4; });
    s += svgTxt(x, 140, t, { w: 'bold', size: 16, c: COL.k });
  });
  if (o.cap) s += svgTxt(cx, 22, o.cap, { w: 'bold', size: 14, c: COL.g });
  return s + '</svg>';
}

intro: r`Une lettre peut aussi désigner un nombre <b>inconnu</b> qu'on cherche. Tu vas apprendre à écrire et résoudre des <b>équations</b> simples comme $x + 7 = 12$ ou $4x = 28$, grâce aux <b>opérations inverses</b>, à vérifier une solution et à mettre un problème en équation.`,

{ t: 'Des opérations à trous aux équations', h: r`<p>Tu sais déjà compléter des opérations à trous grâce à l'<b>opération inverse</b> :</p>` + TAB([['Opération à trou', 'On calcule…', 'Réponse'],

Une <b>solution</b> de l'équation est une valeur de $x$ qui rend l'égalité vraie. <b>Résoudre</b> l'équation, c'est trouver sa solution.`, 'Équation, inconnue, solution') + FIG(equations_bal('x + 7', '12', { boxL: 1, wL: ['7'], wR: ['12'], cap: 'La balance est en équilibre : x + 7 = 12' })) + EXM(r`$x + 7 = 12$ : quel nombre ajouté à 7 donne 12 ? C'est $12 - 7 = 5$. La solution est $x = 5$.`) },
{ t: 'Résoudre x + b = c', h: PROP(r`Pour résoudre $x + b = c$, on <b>soustrait</b> $b$ : $x = c - b$.`, 'Opération inverse de l’addition') + FIG(barModel([{ l: '', parts: [{ v: 7, t: 'x', c: COL.b }, { v: 4, t: '7', c: COL.o }] }], { u: 28, lw: 10, total: { t: '12' } })) + EXM(r`<ul><li>$x + 7 = 12$, donc $x = 12 - 7 = 5$ ;</li>

{ t: 'Résoudre ax = c', h: PROP(r`Pour résoudre $ax = c$ (avec $a \ne 0$), on <b>divise</b> par $a$ : $x = \frac{c}{a} = c \div a$.`, 'Opération inverse de la multiplication') + FIG(barModel([{ l: '', parts: [{ v: 3, t: 'x' }, { v: 3, t: 'x' }, { v: 3, t: 'x' }, { v: 3, t: 'x' }] }], { u: 28, lw: 10, total: { t: '28' } })) + EXM(r`<ul><li>$4x = 28$ : 4 fois $x$ font 28, donc $x = 28 \div 4 = 7$ ;</li>

/* ===== Proportions et pourcentages ===== */
/* Bande de pourcentage : une barre graduée de 0 % à 100 % avec la quantité correspondante en dessous */
function proportions_bande(pct, tot, o){
  o = o || {}; const W = 520, L = 440, x0 = 40, H = 104, c = o.c || COL.g;
  let s = SVG0(W, H);
  s += `<rect x="${x0}" y="24" width="${L}" height="30" rx="4" fill="#fff" stroke="#1d2433" stroke-width="2"/><rect x="${x0}" y="24" width="${L * pct / 100}" height="30" rx="4" fill="${c}88"/>`;
  for (let k = 0; k <= 10; k++){ const x = x0 + L * k / 10; s += `<line x1="${x}" y1="54" x2="${x}" y2="62" stroke="#555"/>`; }
  s += svgTxt(x0, 16, '0 %', { size: 12, c: '#555' }) + svgTxt(x0 + L, 16, '100 %', { size: 12, c: '#555' }) + svgTxt(x0 + L * pct / 100, 16, fr(pct) + ' %', { size: 13, w: 'bold', c });
  s += svgTxt(x0, 80, '0', { size: 12, c: '#555' }) + svgTxt(x0 + L, 80, o.totl || fr(tot), { size: 13, w: 'bold' }) + svgTxt(x0 + L * pct / 100, 80, o.partl || fr(tot * pct / 100), { size: 13, w: 'bold', c });
  if (o.cap) s += svgTxt(W / 2, 100, o.cap, { size: 13, c: COL.k });
  return s + '</svg>';
}

/* ===== La proportionnalité ===== */
/* Repère du premier quadrant avec graduations libres.
   o = {x:[max, pas], y:[max, pas], W, H, xl, yl, ser:[{p:[[x,y],...], c, line:true, dots:true, n:'nom'}], read:[[x, y, c]] (pointillés de lecture)} */
function proportionnalite_rep(o){
  const W = o.W || 420, H = o.H || 280, pl = 52, pb = 42, pt = 26, pr = 26, [xm, xs] = o.x, [ym, ys] = o.y;
  const X = x => pl + x / xm * (W - pl - pr), Y = y => H - pb - y / ym * (H - pb - pt);
  let s = SVG0(W, H);
  for (let x = 0; x <= xm + 1e-9; x += xs) s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(ym)}" stroke="#e3e8f2"/>` + svgTxt(X(x), Y(0) + 16, fr(+x.toFixed(4)), { size: 11, c: '#555' });
  for (let y = 0; y <= ym + 1e-9; y += ys) s += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(xm)}" y2="${Y(y)}" stroke="#e3e8f2"/>` + (y ? svgTxt(X(0) - 6, Y(y) + 4, fr(+y.toFixed(4)), { size: 11, c: '#555', a: 'end' }) : '');
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xm) + 14}" y2="${Y(0)}" stroke="#333" stroke-width="1.4"/>` + arrowHead(X(0), Y(0), X(xm) + 16, Y(0), '#333', 8);
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(ym) - 14}" stroke="#333" stroke-width="1.4"/>` + arrowHead(X(0), Y(0), X(0), Y(ym) - 16, '#333', 8);
  if (o.xl) s += svgTxt(X(xm) + 14, Y(0) + 32, o.xl, { size: 12, c: COL.k, a: 'end', w: 'bold' });
  if (o.yl) s += svgTxt(X(0) + 6, 14, o.yl, { size: 12, c: COL.k, a: 'start', w: 'bold' });
  (o.read || []).forEach(([x, y, c]) => { c = c || COL.r; s += `<path d="M${X(x)} ${Y(0)}V${Y(y)}H${X(0)}" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="5 4"/>`; });
  (o.ser || []).forEach((q, k) => {
    const c = q.c || PAL[k % PAL.length];
    if (q.line) s += `<path d="${q.p.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>`;
    if (q.dots !== false) q.p.forEach(p => { s += q.cross ? `<path d="M${X(p[0]) - 5} ${Y(p[1]) - 5}l10 10m0 -10l-10 10" stroke="${c}" stroke-width="2.4"/>` : `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.2" fill="${c}"/>`; });
    if (q.n){ const p = q.p[q.p.length - 1]; s += svgTxt(X(p[0]) - 6, Y(p[1]) - 10, q.n, { c, w: 'bold', size: 13, a: 'end' }); }
  });
  (o.txt || []).forEach(([x, y, t, c]) => { s += svgTxt(X(x), Y(y), t, { c: c || COL.k, w: 'bold', size: 13 }); });
  return s + '</svg>';
}
/* Tableau à deux lignes avec flèche « × k » à droite et flèches de linéarité au-dessus : o = {k:'× 3,5', top:[[i, j, '× 2']]} */
function proportionnalite_tab(l1, l2, v1, v2, o){
  o = o || {}; const cw = 66, lw = 130, n = v1.length, top = (o.top || []).length ? 40 : 10, W = lw + n * cw + (o.k ? 30 + 9 * o.k.length : 20), H = top + 84;
  let s = SVG0(W, H);
  const x0 = 10, y0 = top;
  s += `<rect x="${x0}" y="${y0}" width="${lw + n * cw}" height="72" fill="#fff" stroke="#1d2433" stroke-width="1.6"/><line x1="${x0}" y1="${y0 + 36}" x2="${x0 + lw + n * cw}" y2="${y0 + 36}" stroke="#1d2433" stroke-width="1.2"/>`;
  s += `<rect x="${x0}" y="${y0}" width="${lw}" height="72" fill="${COL.b}12"/>`;
  for (let k = 0; k <= n; k++) s += `<line x1="${x0 + lw + k * cw}" y1="${y0}" x2="${x0 + lw + k * cw}" y2="${y0 + 72}" stroke="#1d2433" stroke-width="1.2"/>`;
  s += svgTxt(x0 + lw / 2, y0 + 23, l1, { size: 13, w: 'bold' }) + svgTxt(x0 + lw / 2, y0 + 59, l2, { size: 13, w: 'bold' });
  v1.forEach((v, k) => { s += svgTxt(x0 + lw + k * cw + cw / 2, y0 + 23, v, { size: 15, c: v === '?' ? COL.r : COL.k, w: v === '?' ? 'bold' : 'normal' }); });
  v2.forEach((v, k) => { s += svgTxt(x0 + lw + k * cw + cw / 2, y0 + 59, v, { size: 15, c: v === '?' ? COL.r : COL.k, w: v === '?' ? 'bold' : 'normal' }); });
  if (o.k){ const xa = x0 + lw + n * cw + 12; s += `<path d="M${xa} ${y0 + 18}C${xa + 30} ${y0 + 22},${xa + 30} ${y0 + 50},${xa} ${y0 + 54}" fill="none" stroke="${COL.g}" stroke-width="2"/>` + arrowHead(xa + 10, y0 + 52, xa, y0 + 54, COL.g, 8) + svgTxt(xa + 30, y0 + 41, o.k, { c: COL.g, w: 'bold', size: 14, a: 'start' }); }
  (o.top || []).forEach(([i, j, t]) => { const xa = x0 + lw + i * cw + cw / 2, xb = x0 + lw + j * cw + cw / 2; s += `<path d="M${xa} ${y0 - 2}Q${(xa + xb) / 2} ${y0 - 34} ${xb} ${y0 - 2}" fill="none" stroke="${COL.o}" stroke-width="1.8"/>` + arrowHead(xb - 4, y0 - 10, xb, y0 - 2, COL.o, 8) + svgTxt((xa + xb) / 2, y0 - 22, t, { c: COL.o, w: 'bold', size: 13 }); });
  return s + '</svg>';
}

CH({ id: 'proportionnalite', th: 'Proportionnalité et fonctions', per: 'Période 5', t: 'La proportionnalité',
intro: r`Le prix des tomates dépend de leur masse, la distance parcourue dépend de la durée… Tu vas apprendre à <b>reconnaître</b> une situation de proportionnalité, à utiliser le <b>coefficient de proportionnalité</b>, la <b>linéarité</b> et le <b>passage à l'unité</b> (prix unitaire, vitesse moyenne, échelle), et à reconnaître la proportionnalité sur un <b>graphique</b>.`,
cours: [
{ t: 'Reconnaître une situation de proportionnalité', h: DEF(r`Deux grandeurs sont <b>proportionnelles</b> quand on obtient les valeurs de l'une en <b>multipliant</b> les valeurs de l'autre <b>toujours par le même nombre</b>. Ce nombre s'appelle le <b>coefficient de proportionnalité</b>.`, 'Proportionnalité') + EXM(r`Les tomates coûtent 3 € le kg. Le prix est proportionnel à la masse : on multiplie toujours la masse par 3 (€/kg). Si la masse est 2 fois (3 fois) plus grande, le prix est 2 fois (3 fois) plus grand.`) + TAB([['Situation', 'Proportionnelle ?', 'Pourquoi'],
['Masse de tomates et prix payé', '✔ oui', 'prix = 3 × masse'],
['Côté d’un carré et périmètre', '✔ oui', 'périmètre = 4 × côté'],
['Durée et distance à vitesse constante', '✔ oui', 'distance = vitesse × durée'],
['Distance sur une carte et distance réelle', '✔ oui', 'on multiplie par l’échelle'],
['Côté d’un carré et aire', '✘ non', 'côté 1 → aire 1 ; côté 2 → aire 4 (pas 2)'],
['Âge et taille d’une personne', '✘ non', 'à 20 ans, on ne mesure pas 2 fois sa taille de 10 ans'],
['Course en taxi avec prise en charge', '✘ non', 'prix = 2,50 € + 1,20 € par km']]) + ATT(r`« Quand l'une augmente, l'autre augmente » ne suffit pas ! L'aire d'un carré augmente avec son côté, mais elle n'est pas proportionnelle au côté.`) },
{ t: 'Le tableau et le coefficient', h: r`<p>On range les valeurs des deux grandeurs dans un tableau à deux lignes.</p>` + FIG(proportionnalite_tab('Masse (kg)', 'Prix (€)', ['1', '2', '5', '8'], ['3,5', '7', '17,5', '28'], { k: '× 3,5 €/kg' })) + PROP(r`Un tableau est un <b>tableau de proportionnalité</b> si on passe de la 1<sup>re</sup> ligne à la 2<sup>de</sup> en multipliant toujours par le même nombre. Pour le vérifier, on calcule les quotients $\frac{\text{2e ligne}}{\text{1re ligne}}$ : ils doivent être <b>tous égaux</b>.<br>
Ici : $\frac{7}{2} = 3,5$ ; $\frac{17,5}{5} = 3,5$ ; $\frac{28}{8} = 3,5$. Le coefficient est $3,5$ €/kg : c'est le <b>prix d'un kilogramme</b>.`) + EXM(r`Ce tableau n'est <b>pas</b> un tableau de proportionnalité :` + TAB([['Nombre de places', '1', '2', '4'], ['Prix (€)', '12', '20', '36']]) + r`$\frac{12}{1} = 12$ mais $\frac{20}{2} = 10$ : les quotients ne sont pas égaux.`) + RET(r`Le coefficient a une <b>unité</b> : €/kg (euros par kilogramme), km/h (kilomètres par heure)… Garde les unités dans tes calculs : elles donnent le sens du coefficient.`, 'Conseil') },
{ t: 'Linéarité et passage à l’unité', h: r`<p>Voici une recette pour 4 personnes : 200 g de farine, 3 œufs, 50 cL de lait. Comment l'adapter ?</p>` + FIG(proportionnalite_tab('Personnes', 'Farine (g)', ['4', '2', '8', '6'], ['200', '100', '400', '300'], { top: [[0, 1, '÷ 2'], [0, 2, '× 2']] })) + PROP(r`Dans une situation de proportionnalité :<ul>
<li>si on <b>multiplie</b> (ou divise) une grandeur par un nombre, l'autre est multipliée (ou divisée) par le même nombre : pour 8 personnes ($4 \times 2$), il faut $200 \times 2 = 400$ g ;</li>
<li>on peut <b>additionner</b> des colonnes : 6 personnes = 4 personnes + 2 personnes, donc $200 + 100 = 300$ g.</li></ul>`, 'Linéarité') + METH(r`On calcule d'abord la valeur pour <b>une</b> unité, puis on multiplie.<br>
3 kg de tomates coûtent 7,50 €. Pour 1 kg : $7,50 \div 3 = 2,50$ €. Pour $4,3$ kg : $4,3 \times 2,50 = 10,75$ €.`, 'Passage à l’unité') + ATT(r`Choisis la méthode la plus simple selon les nombres : linéarité quand les nombres sont « ronds » entre eux, passage à l'unité sinon. Dans tous les cas, garde le <b>sens</b> : « 2 fois plus de personnes, 2 fois plus de farine ».`) },
{ t: 'Prix unitaire, vitesse moyenne, échelle', h: DEF(r`Le <b>prix unitaire</b> est le prix d'<b>une</b> unité (un kilogramme, un litre, un objet). C'est le coefficient de proportionnalité entre la quantité et le prix. Il permet de comparer des offres.`, 'Prix unitaire') + EXM(r`Pack A : 6 bouteilles pour 4,20 €, soit $4,20 \div 6 = 0,70$ € la bouteille. Pack B : 8 bouteilles pour 5,20 €, soit $5,20 \div 8 = 0,65$ € la bouteille. Le pack B est plus avantageux.`) + DEF(r`Quand on roule à vitesse constante, la distance est proportionnelle à la durée. La <b>vitesse moyenne</b> est la distance parcourue en <b>une</b> heure (en km/h) : $\text{vitesse} = \frac{\text{distance}}{\text{durée}}$.`, 'Vitesse moyenne') + FIG(proportionnalite_tab('Durée (h)', 'Distance (km)', ['1', '2', '3', '0,5'], ['75', '150', '225', '37,5'], { k: '× 75 km/h' })) + EXM(r`Un car parcourt 150 km en 2 h. Sa vitesse moyenne est $150 \div 2 = 75$ km/h. En 3 h, il parcourt $3 \times 75 = 225$ km ; en 30 min (0,5 h), $37,5$ km.`) + DEF(r`Sur une carte à l'<b>échelle</b> $\frac{1}{25\,000}$, 1 cm sur la carte représente $25\,000$ cm en réalité, c'est-à-dire 250 m. Les distances réelles sont proportionnelles aux distances sur la carte.`, 'Échelle') + EXM(r`Sur cette carte, un sentier mesure 6 cm. En réalité : $6 \times 25\,000 = 150\,000$ cm $= 1\,500$ m $= 1,5$ km.`) },
{ t: 'Proportionnalité et graphique', h: PROP(r`Si deux grandeurs sont proportionnelles, les points qui les représentent dans un repère sont <b>alignés avec l'origine</b> du repère.<br>
Réciproquement, si les points sont alignés avec l'origine, les grandeurs sont proportionnelles.`, 'Propriété') + FIG(proportionnalite_rep({ x: [8, 1], y: [28, 4], W: 330, H: 250, xl: 'masse (kg)', yl: 'prix (€)', ser: [{ p: [[0, 0], [2, 7], [5, 17.5], [8, 28]], c: COL.b }, { p: [[0, 0], [8, 28]], line: true, dots: false, c: COL.b }] }) + ' ' + proportionnalite_rep({ x: [4, 1], y: [16, 2], W: 300, H: 250, xl: 'côté (cm)', yl: 'aire (cm²)', ser: [{ p: [[0, 0], [1, 1], [2, 4], [3, 9], [4, 16]], c: COL.r }] })) + r`<p>À gauche : points alignés avec l'origine → <b>proportionnalité</b>. À droite (aire d'un carré) : les points ne sont pas alignés → <b>pas de proportionnalité</b>.</p>` + FIG(proportionnalite_rep({ x: [8, 1], y: [24, 4], W: 330, H: 250, xl: 'distance (km)', yl: 'prix (€)', ser: [{ p: [[0, 2.5], [8, 12.1]], line: true, dots: false, c: COL.o }, { p: [[2, 4.9], [4, 7.3], [6, 9.7]], c: COL.o }], txt: [[5.4, 15, 'taxi', COL.o]] })) + ATT(r`Pour le taxi, les points sont alignés, mais la droite ne passe <b>pas par l'origine</b> (elle part de 2,50 €) : ce n'est <b>pas</b> une situation de proportionnalité.`) + RET(r`<ul><li>Proportionnalité : on multiplie toujours par le même coefficient (avec son unité).</li>
<li>Tableau : tous les quotients $\frac{\text{2e ligne}}{\text{1re ligne}}$ sont égaux.</li>
<li>Linéarité : 2 fois plus d'un côté → 2 fois plus de l'autre ; on peut additionner des colonnes.</li>
<li>Passage à l'unité : prix unitaire, vitesse moyenne (km/h), échelle.</li>
<li>Graphique : points alignés avec l'origine.</li></ul>`) }
],
app: [
{ t: 'Proportionnel ou non ?', q: r`Ces situations sont-elles des situations de proportionnalité ?`, it: [
 { p: 'Le prix payé et le nombre de baguettes achetées (1,10 € la baguette).', vf: true, e: r`Prix $= 1,10 \times$ nombre de baguettes : on multiplie toujours par $1,10$.` },
 { p: 'Le périmètre d’un triangle équilatéral et la longueur de son côté.', vf: true, e: r`Périmètre $= 3 \times$ côté.` },
 { p: 'L’aire d’un carré et la longueur de son côté.', vf: false, e: r`Côté 1 cm → aire 1 cm² ; côté 3 cm → aire 9 cm². Le côté est multiplié par 3 mais l'aire par 9.` },
 { p: 'La taille d’un enfant et son âge.', vf: false, e: r`Un enfant ne grandit pas toujours de la même façon : à 2 ans on mesure environ 85 cm, à 10 ans environ 1,40 m, pas 5 fois plus.` },
 { p: 'Le prix d’un abonnement de 15 € par mois plus 2 € par séance, et le nombre de séances.', vf: false, e: r`À cause des 15 € fixes : 1 séance → 17 €, 2 séances → 19 €, ce n'est pas le double.` } ] },
{ t: 'Tableau de proportionnalité ?', q: r`Chaque tableau est-il un tableau de proportionnalité ?`, it: [
 { p: TAB([['Nombre de cahiers', '1', '2', '5'], ['Prix (€)', '3', '6', '15']]), vf: true, e: r`$\frac{3}{1} = \frac{6}{2} = \frac{15}{5} = 3$ : on multiplie toujours par 3 €/cahier.` },
 { p: TAB([['Durée (h)', '2', '4', '6'], ['Distance (km)', '5', '9', '13']]), vf: false, e: r`$\frac{5}{2} = 2,5$ mais $\frac{9}{4} = 2,25$ : les quotients sont différents.` },
 { p: TAB([['Longueur sur le plan (cm)', '10', '20', '30'], ['Longueur réelle (m)', '4', '8', '12']]), vf: true, e: r`$\frac{4}{10} = \frac{8}{20} = \frac{12}{30} = 0,4$ (m par cm).` } ] },
{ t: 'Utiliser le coefficient', q: r`Le prix des cerises est proportionnel à leur masse.`, fig: proportionnalite_tab('Masse (kg)', 'Prix (€)', ['2', '5', '8', '0,5'], ['7', '17,5', '?', '?']), it: [
 { p: 'Quel est le coefficient de proportionnalité (le prix d’un kilogramme) ?', n: 3.5, u: '€/kg', e: r`$7 \div 2 = 3,5$ €/kg (et $17,5 \div 5 = 3,5$ ✔).` },
 { p: 'Quel est le prix de 8 kg ?', n: 28, u: '€', e: r`$8 \times 3,5 = 28$ €.` },
 { p: 'Quel est le prix de 0,5 kg ?', n: 1.75, u: '€', e: r`$0,5 \times 3,5 = 1,75$ €.` },
 { p: 'Quelle masse peut-on acheter avec 14 € ?', n: 4, u: 'kg', e: r`On divise par le coefficient : $14 \div 3,5 = 4$ kg. (On peut aussi voir que 14 € $= 2 \times 7$ €, donc $2 \times 2 = 4$ kg.)` } ] },
{ t: 'Adapter une recette', q: r`Pour 4 personnes, il faut 200 g de farine, 3 œufs et 50 cL de lait.`, fig: proportionnalite_tab('Personnes', 'Farine (g)', ['4', '2', '8', '6'], ['200', '?', '?', '?'], { top: [[0, 1, '÷ 2'], [0, 2, '× 2']] }), it: [
 { p: 'Quelle masse de farine pour 2 personnes ?', n: 100, u: 'g', e: r`2 personnes, c'est 2 fois moins : $200 \div 2 = 100$ g.` },
 { p: 'Combien d’œufs pour 8 personnes ?', n: 6, e: r`2 fois plus de personnes : $3 \times 2 = 6$ œufs.` },
 { p: 'Quelle masse de farine pour 6 personnes ?', n: 300, u: 'g', e: r`6 = 4 + 2 : $200 + 100 = 300$ g.` },
 { p: 'Quelle quantité de lait pour 6 personnes ?', n: 75, u: 'cL', e: r`Pour 2 personnes : $50 \div 2 = 25$ cL. Pour 6 : $50 + 25 = 75$ cL.` } ] },
{ t: 'Passage à l’unité', q: r`Utilise le prix d'une unité.`, it: [
 { p: '3 kg de tomates coûtent 7,50 €. Quel est le prix de 1 kg ?', n: 2.5, u: '€', e: r`$7,50 \div 3 = 2,50$ €.` },
 { p: 'Quel est le prix de 4,3 kg de ces tomates ?', n: 10.75, u: '€', e: r`$4,3 \times 2,50 = 10,75$ €.` },
 { p: '5 cahiers coûtent 6 €. Combien coûtent 7 cahiers ?', n: 8.4, u: '€', e: r`1 cahier : $6 \div 5 = 1,20$ €. 7 cahiers : $7 \times 1,20 = 8,40$ €.` },
 { p: 'Une imprimante imprime 90 pages en 6 minutes. Combien en imprime-t-elle en 10 minutes ?', n: 150, e: r`En 1 minute : $90 \div 6 = 15$ pages. En 10 minutes : $15 \times 10 = 150$ pages.` } ] },
{ t: 'Le meilleur achat', q: r`Compare les prix unitaires.`, it: [
 { p: 'Pack A : 6 bouteilles pour 4,20 €. Pack B : 8 bouteilles pour 5,20 €. Quel est le prix d’une bouteille dans le pack A ?', n: 0.7, u: '€', e: r`$4,20 \div 6 = 0,70$ €.` },
 { p: 'Et dans le pack B ?', n: 0.65, u: '€', e: r`$5,20 \div 8 = 0,65$ €.` },
 { p: 'Quel pack est le plus avantageux ?', c: ['Le pack B', 'Le pack A', 'Ils sont au même prix'], e: r`$0,65 < 0,70$ : la bouteille est moins chère dans le pack B.` },
 { p: 'Un paquet de 750 g de riz coûte 1,80 € et un paquet de 2 kg coûte 4,40 €. Quel est le prix d’un kilogramme pour le grand paquet ?', n: 2.2, u: '€', e: r`$4,40 \div 2 = 2,20$ €/kg. (Petit paquet : $1,80 \div 0,75 = 2,40$ €/kg : le grand paquet est plus avantageux.)` } ] },
{ t: 'Vitesse moyenne', q: r`On suppose que la vitesse est constante.`, it: [
 { p: 'Un car parcourt 150 km en 2 h. Quelle est sa vitesse moyenne ?', n: 75, u: 'km/h', e: r`$150 \div 2 = 75$ km/h.` },
 { p: 'Une voiture roule à 60 km/h pendant 3 h. Quelle distance parcourt-elle ?', n: 180, u: 'km', e: r`$60 \times 3 = 180$ km.` },
 { p: 'À 60 km/h, quelle distance parcourt-on en 30 minutes ?', n: 30, u: 'km', e: r`30 min, c'est une demi-heure : $60 \div 2 = 30$ km.` },
 { p: 'Un cycliste parcourt 45 km en 1 h 30 min. Quelle est sa vitesse moyenne ?', n: 30, u: 'km/h', e: r`1 h 30 min $= 1,5$ h. $45 \div 1,5 = 30$ km/h. (Ou : 15 km par demi-heure, donc 30 km en une heure.)` } ] },
{ t: 'Utiliser une échelle', q: r`Une carte de randonnée est à l'échelle $\frac{1}{25\,000}$ : 1 cm sur la carte représente $25\,000$ cm en réalité.`, it: [
 { p: 'Combien de mètres représente 1 cm sur la carte ?', n: 250, u: 'm', e: r`$25\,000$ cm $= 250$ m.` },
 { p: 'Un chemin mesure 4 cm sur la carte. Quelle est sa longueur réelle en km ?', n: 1, u: 'km', e: r`$4 \times 250 = 1\,000$ m $= 1$ km.` },
 { p: 'Deux refuges sont à 2,5 km l’un de l’autre. Quelle distance les sépare sur la carte ?', n: 10, u: 'cm', e: r`$2,5$ km $= 2\,500$ m, et $2\,500 \div 250 = 10$ cm.` },
 { p: 'Sur le plan d’une maison à l’échelle 1/100, une pièce mesure 3,5 cm de long. Quelle est sa longueur réelle en mètres ?', n: 3.5, u: 'm', e: r`$3,5 \times 100 = 350$ cm $= 3,5$ m.` } ] },
{ t: 'Reconnaître sur un graphique', q: r`Quels graphiques représentent une situation de proportionnalité ?`, it: [
 { p: 'Graphique 1', fig: proportionnalite_rep({ x: [6, 1], y: [12, 2], W: 280, H: 210, ser: [{ p: [[1, 2], [2, 4], [3, 6], [4, 8], [5, 10]], c: COL.b }, { p: [[0, 0], [6, 12]], line: true, dots: false, c: COL.b }] }), vf: true, e: r`Les points sont alignés avec l'origine : proportionnalité (coefficient 2).` },
 { p: 'Graphique 2', fig: proportionnalite_rep({ x: [6, 1], y: [12, 2], W: 280, H: 210, ser: [{ p: [[1, 5], [2, 6.4], [3, 7.8], [4, 9.2], [5, 10.6]], c: COL.o }, { p: [[0, 3.6], [6, 12]], line: true, dots: false, c: COL.o }] }), vf: false, e: r`Les points sont alignés, mais la droite ne passe pas par l'origine : ce n'est pas de la proportionnalité.` },
 { p: 'Graphique 3', fig: proportionnalite_rep({ x: [6, 1], y: [12, 2], W: 280, H: 210, ser: [{ p: [[1, 1], [2, 3], [3, 4], [4, 7], [5, 11]], c: COL.r }] }), vf: false, e: r`Les points ne sont pas alignés : pas de proportionnalité.` } ] },
{ t: 'Lire un graphique de proportionnalité', q: r`Ce graphique donne le prix de la peinture en fonction du volume acheté.`, fig: proportionnalite_rep({ x: [10, 1], y: [80, 10], W: 420, H: 280, xl: 'volume (L)', yl: 'prix (€)', ser: [{ p: [[0, 0], [10, 80]], line: true, dots: false, c: COL.g }], read: [[5, 40]] }), it: [
 { p: 'Quel est le prix de 5 L ?', n: 40, u: '€', e: r`On part de 5 sur l'axe horizontal, on monte jusqu'à la droite, puis on lit 40 € sur l'axe vertical.` },
 { p: 'Quel est le prix d’un litre ?', n: 8, u: '€', e: r`$40 \div 5 = 8$ €/L. C'est le coefficient de proportionnalité.` },
 { p: 'Quel volume peut-on acheter avec 56 € ?', n: 7, u: 'L', e: r`$56 \div 8 = 7$ L (on peut aussi le lire sur le graphique).` } ] }

appro: [
{ t: 'Deux tarifs au cinéma', q: r`Tarif A : 9 € la place. Tarif B : une carte à 30 € pour l'année, puis 5 € la place.`, aide: r`Calcule le prix pour 2, 4, 6 et 8 places avec chaque tarif. Le tarif B est-il proportionnel ?`, fig: proportionnalite_rep({ x: [8, 1], y: [80, 10], W: 420, H: 290, xl: 'places', yl: 'prix (€)', ser: [{ p: [[2, 18], [4, 36], [6, 54], [8, 72]], c: COL.b, n: 'A' }, { p: [[2, 40], [4, 50], [6, 60], [8, 70]], c: COL.o, cross: true, n: 'B' }] }), it: [
 { p: 'Combien coûtent 8 places avec chaque tarif ?', n: [72, 70], lab: ['A :', 'B :'], e: r`A : $8 \times 9 = 72$ €. B : $30 + 8 \times 5 = 30 + 40 = 70$ €.` },
 { p: 'Le prix avec le tarif B est-il proportionnel au nombre de places ?', vf: false, e: r`2 places : 40 € ; 4 places : 50 €. Le nombre de places double mais pas le prix. Sur le graphique, les croix sont alignées mais pas avec l'origine.` },

{ t: 'Le voyage en TGV', q: r`Un TGV parcourt 420 km en 3 heures, à vitesse constante.`, fig: proportionnalite_tab('Durée (h)', 'Distance (km)', ['3', '1', '5', '?'], ['420', '?', '?', '1050'], { k: '× v' }), aide: r`Calcule la distance parcourue en 1 heure : c'est la vitesse moyenne.`, it: [

{ t: 'Des crêpes pour la classe', q: r`Pour 6 personnes, il faut 250 g de farine, 4 œufs et 0,5 L de lait. Il y a 15 personnes à la fête de la classe.`, fig: proportionnalite_tab('Personnes', 'Farine (g)', ['6', '3', '15'], ['250', '?', '?'], { top: [[0, 1, '÷ 2']] }), aide: r`15 = 6 + 6 + 3. Calcule d'abord pour 3 personnes.`, it: [
 { p: 'Quelle masse de farine pour 15 personnes ?', n: 625, u: 'g', e: r`Pour 3 personnes : $250 \div 2 = 125$ g. Pour 15 = 6 + 6 + 3 : $250 + 250 + 125 = 625$ g.` },

{ t: 'Le robinet', q: r`Un robinet remplit une baignoire. Le graphique donne le volume d'eau en fonction du temps.`, fig: proportionnalite_rep({ x: [10, 1], y: [60, 6], W: 440, H: 290, xl: 'temps (min)', yl: 'volume (L)', ser: [{ p: [[0, 0], [10, 60]], line: true, dots: false, c: COL.b }], read: [[2, 12]] }), aide: r`La droite passe par l'origine : le volume est proportionnel au temps. Lis le volume au bout de 2 minutes.`, it: [

/* Repère du premier quadrant avec graduations libres.
   o = {x:[max, pas], y:[max, pas], W, H, xl, yl, ser:[{p:[[x,y],...], c, line:true, dots:true, n, lab:['A',...]}], read:[[x, y, c]], f:{f, a, b, c} (courbe)} */
function fonctions_rep(o){
  const W = o.W || 440, H = o.H || 290, pl = 52, pb = 42, pt = 26, pr = 26, [xm, xs] = o.x, [ym, ys] = o.y;
  const X = x => pl + x / xm * (W - pl - pr), Y = y => H - pb - y / ym * (H - pb - pt);
  let s = SVG0(W, H);
  for (let x = 0; x <= xm + 1e-9; x += xs) s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(ym)}" stroke="#e3e8f2"/>` + svgTxt(X(x), Y(0) + 16, fr(+x.toFixed(4)), { size: 11, c: '#555' });
  for (let y = 0; y <= ym + 1e-9; y += ys) s += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(xm)}" y2="${Y(y)}" stroke="#e3e8f2"/>` + (y ? svgTxt(X(0) - 6, Y(y) + 4, fr(+y.toFixed(4)), { size: 11, c: '#555', a: 'end' }) : '');
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xm) + 14}" y2="${Y(0)}" stroke="#333" stroke-width="1.4"/>` + arrowHead(X(0), Y(0), X(xm) + 16, Y(0), '#333', 8);
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(ym) - 14}" stroke="#333" stroke-width="1.4"/>` + arrowHead(X(0), Y(0), X(0), Y(ym) - 16, '#333', 8);
  if (o.xl) s += svgTxt(X(xm) + 14, Y(0) + 32, o.xl, { size: 12, c: COL.k, a: 'end', w: 'bold' });
  if (o.yl) s += svgTxt(X(0) + 6, 14, o.yl, { size: 12, c: COL.k, a: 'start', w: 'bold' });
  (o.read || []).forEach(([x, y, c]) => { c = c || COL.r; s += `<path d="M${X(x)} ${Y(0)}V${Y(y)}H${X(0)}" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="5 4"/>`; });
  if (o.f){ const F = o.f, n = 200; let d = ''; for (let k = 0; k <= n; k++){ const x = F.a + (F.b - F.a) * k / n; d += (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(F.f(x)).toFixed(1); } s += `<path d="${d}" fill="none" stroke="${F.c || COL.b}" stroke-width="2.6"/>`; }
  (o.ser || []).forEach((q, k) => {
    const c = q.c || PAL[k % PAL.length];
    if (q.line) s += `<path d="${q.p.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round"/>`;
    if (q.dots !== false) q.p.forEach((p, i) => { s += q.cross ? `<path d="M${X(p[0]) - 5} ${Y(p[1]) - 5}l10 10m0 -10l-10 10" stroke="${c}" stroke-width="2.4"/>` : `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.2" fill="${c}"/>`; if (q.lab) s += svgTxt(X(p[0]) + 8, Y(p[1]) - 8, q.lab[i], { c, w: 'bold', size: 14, a: 'start' }); });
    if (q.n){ const p = q.p[q.p.length - 1]; s += svgTxt(X(p[0]) - 6, Y(p[1]) - 10, q.n, { c, w: 'bold', size: 13, a: 'end' }); }
  });
  (o.txt || []).forEach(([x, y, t, c]) => { s += svgTxt(X(x), Y(y), t, { c: c || COL.k, w: 'bold', size: 13 }); });
  return s + '</svg>';
}

{ t: 'Lire et interpréter un graphique', h: r`<p>Ce graphique donne la température relevée à Lyon un jour d'avril, en fonction de l'heure.</p>` + FIG(fonctions_rep({ x: [24, 2], y: [20, 2], W: 500, H: 300, xl: 'heure (h)', yl: 'température (°C)', ser: [{ p: fonctions_temp, line: true, dots: false, c: COL.r }], read: [[10, 13, COL.b]] })) + EXM(r`• À 10 h, il faisait 13 °C (lecture en pointillés : on part de l'heure, on monte jusqu'à la courbe, on lit la température).<br>

/* ===== 5e — Statistiques : effectifs, fréquences et représentations ===== */
/* Diagramme en barres avec axe vertical qui peut commencer ailleurs qu'à 0 (graphiques trompeurs).
   stats_barres({lab, val, ymin:0, ymax, ystep, unit, show, c, W}) */
function stats_barres(d){
  const n = d.val.length, ymin = d.ymin || 0, W = d.W || Math.max(340, 70 + n * 64), H = 250, pl = 46, pb = 40, pt = 24;
  const bw = (W - pl - 14) / n, Y = v => H - pb - ((v - ymin) / (d.ymax - ymin)) * (H - pb - pt);
  let s = SVG0(W, H);
  for (let v = ymin; v <= d.ymax + 1e-9; v += d.ystep){ s += `<line x1="${pl}" y1="${Y(v)}" x2="${W - 10}" y2="${Y(v)}" stroke="#e3e8f2"/>` + svgTxt(pl - 6, Y(v) + 4, fr(+v.toFixed(4)), { size: 11, c: '#555', a: 'end' }); }
  d.val.forEach((v, k) => { const x = pl + k * bw + bw * 0.2, w = bw * 0.6, c = d.c || PAL[k % PAL.length];
    s += `<rect x="${x}" y="${Y(v)}" width="${w}" height="${H - pb - Y(v)}" fill="${c}cc" stroke="${c}"/>` + svgTxt(pl + k * bw + bw / 2, H - pb + 17, d.lab[k], { size: 12 });
    if (d.show) s += svgTxt(pl + k * bw + bw / 2, Y(v) - 5, fr(v), { size: 12, w: 'bold', c }); });
  s += `<line x1="${pl}" y1="${H - pb}" x2="${W - 10}" y2="${H - pb}" stroke="#333"/><line x1="${pl}" y1="${H - pb}" x2="${pl}" y2="${pt - 8}" stroke="#333"/>`;
  if (d.unit) s += svgTxt(pl + 6, pt - 10, d.unit, { size: 11, c: '#555', a: 'start' });
  return s + '</svg>';
}
/* Graphique cartésien avec étiquettes libres sur l'axe horizontal (mois, semaines…).
   stats_courbe({lab:[...], series:[{v:[...], c, n:'légende'}], ymin:0, ymax, ystep, unit, xl}) */
function stats_courbe(d){
  const n = d.lab.length, ymin = d.ymin || 0, W = d.W || Math.max(360, 80 + n * 42), H = 250, pl = 46, pb = 40, pt = 26;
  const bw = (W - pl - 20) / n, X = k => pl + bw * (k + 0.5), Y = v => H - pb - ((v - ymin) / (d.ymax - ymin)) * (H - pb - pt);
  let s = SVG0(W, H);
  for (let v = ymin; v <= d.ymax + 1e-9; v += d.ystep){ s += `<line x1="${pl}" y1="${Y(v)}" x2="${W - 10}" y2="${Y(v)}" stroke="#e3e8f2"/>` + svgTxt(pl - 6, Y(v) + 4, fr(+v.toFixed(4)), { size: 11, c: '#555', a: 'end' }); }
  d.lab.forEach((l, k) => { s += `<line x1="${X(k)}" y1="${H - pb - 3}" x2="${X(k)}" y2="${H - pb + 3}" stroke="#333"/>` + svgTxt(X(k), H - pb + 17, l, { size: 12 }); });
  d.series.forEach((se, j) => { const c = se.c || PAL[j];
    s += `<path d="${se.v.map((v, k) => (k ? 'L' : 'M') + X(k) + ' ' + Y(v)).join('')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>`;
    se.v.forEach((v, k) => { s += `<circle cx="${X(k)}" cy="${Y(v)}" r="3.8" fill="${c}"/>`; });
    if (se.n) s += `<rect x="${W - 150}" y="${8 + j * 18}" width="12" height="12" rx="2" fill="${c}"/>` + svgTxt(W - 132, 18 + j * 18, se.n, { size: 12, a: 'start' }); });
  s += `<line x1="${pl}" y1="${H - pb}" x2="${W - 10}" y2="${H - pb}" stroke="#333"/><line x1="${pl}" y1="${H - pb}" x2="${pl}" y2="${pt - 10}" stroke="#333"/>`;
  if (d.unit) s += svgTxt(pl + 6, pt - 12, d.unit, { size: 11, c: '#555', a: 'start' });
  if (d.xl) s += svgTxt(W - 12, H - 4, d.xl, { size: 11, c: '#555', a: 'end' });
  return s + '</svg>';
}

CH({ id: 'stats', th: 'Statistiques et probabilités', per: 'Périodes 1 et 3', t: 'Effectifs, fréquences et représentations',
intro: r`Organiser des données dans un tableau, calculer des effectifs et des fréquences, lire et construire des diagrammes en barres, des diagrammes circulaires et des graphiques, et choisir la bonne représentation.`,
cours: [
{ t: 'Le vocabulaire des statistiques', h: DEF(r`<ul>
<li>La <b>population</b> : l'ensemble des personnes (ou des objets) étudiés. Chaque membre est un <b>individu</b>.</li>
<li>Le <b>caractère</b> : ce que l'on étudie (la couleur préférée, la taille, le nombre de frères et sœurs…).
Il est <b>quantitatif</b> si c'est un nombre (taille, âge, note) et <b>qualitatif</b> sinon (couleur, sport préféré).</li>
<li>Les <b>valeurs</b> du caractère : les réponses possibles.</li>
<li>L'<b>effectif</b> d'une valeur : le nombre d'individus qui ont donné cette valeur.</li>
<li>L'<b>effectif total</b> : le nombre total d'individus. C'est la somme de tous les effectifs.</li></ul>`) + EXM(r`On a demandé aux 20 élèves d'un club leur nombre de frères et sœurs. Les <b>données brutes</b> sont :
<p style="text-align:center"><b>1 · 0 · 2 · 1 · 3 · 1 · 0 · 2 · 1 · 4 · 2 · 1 · 0 · 1 · 2 · 3 · 1 · 2 · 0 · 1</b></p>
Population : les 20 élèves du club. Caractère : le nombre de frères et sœurs (quantitatif).
On compte chaque valeur (on peut barrer les nombres au fur et à mesure) et on range les résultats dans un <b>tableau d'effectifs</b> :` + TAB([['Nombre de frères et sœurs', '0', '1', '2', '3', '4', 'Total'], ['Effectif', '4', '8', '5', '2', '1', '<b>20</b>']])) + METH(r`Pour ne rien oublier : compte valeur par valeur, puis <b>vérifie</b> que la somme des effectifs est égale au nombre de données. Ici : $4 + 8 + 5 + 2 + 1 = 20$. ✔`, 'Méthode : construire un tableau d’effectifs') + ATT(r`« Au moins 2 » veut dire « 2 ou plus » : $5 + 2 + 1 = 8$ élèves ont au moins 2 frères et sœurs.<br>« Moins de 2 » veut dire « 0 ou 1 » : $4 + 8 = 12$ élèves.`) },
{ t: 'Les fréquences', h: DEF(r`La <b>fréquence</b> d'une valeur, c'est la <b>proportion</b> des individus qui ont cette valeur :
$$\text{fréquence} = \frac{\text{effectif de la valeur}}{\text{effectif total}}$$
On peut l'écrire sous forme de <b>fraction</b>, de <b>nombre décimal</b> ou de <b>pourcentage</b>.`.replace(/\$\$/g, '$')) + EXM(r`Dans le club de 20 élèves, 8 élèves ont 1 frère ou sœur.<br>
Fréquence : $\frac{8}{20} = \frac{2}{5} = 0,4 = \frac{40}{100} = 40$ %. Donc 40 % des élèves du club ont un frère ou une sœur.` + TAB([['Valeur', '0', '1', '2', '3', '4', 'Total'], ['Effectif', '4', '8', '5', '2', '1', '20'], ['Fréquence (fraction)', r`$\frac{4}{20}$`, r`$\frac{8}{20}$`, r`$\frac{5}{20}$`, r`$\frac{2}{20}$`, r`$\frac{1}{20}$`, r`$\frac{20}{20} = 1$`], ['Fréquence (décimal)', '0,2', '0,4', '0,25', '0,1', '0,05', '1'], ['Fréquence (%)', '20 %', '40 %', '25 %', '10 %', '5 %', '100 %']])) + FIG(gridFrac(40, 10, 10, { c: '#1f9d55', u: 16 })) + `<p style="text-align:center"><small>40 % : 40 carreaux sur 100.</small></p>` + PROP(r`<ul><li>Une fréquence est toujours comprise entre 0 et 1 (entre 0 % et 100 %).</li><li>La <b>somme de toutes les fréquences</b> vaut 1, c'est-à-dire 100 %.</li></ul>`) + METH(r`Pour passer en pourcentage : on multiplie l'écriture décimale par 100 ($0,25 \to 25$ %), ou on écrit une fraction de dénominateur 100 ($\frac{5}{20} = \frac{25}{100}$).<br>Pour calculer avec un pourcentage : $30$ % de $40$ élèves, c'est $\frac{30}{100} \times 40 = 12$ élèves.`) + ATT(r`On ne peut pas comparer des effectifs de deux groupes de tailles différentes : on compare leurs <b>fréquences</b>. 12 élèves sur 20 (60 %), c'est plus que 15 élèves sur 30 (50 %) !`) },
{ t: 'Le diagramme en barres', h: DEF(r`Dans un <b>diagramme en barres</b> (ou en bâtons), chaque valeur est représentée par une barre dont la <b>hauteur est proportionnelle à l'effectif</b> (ou à la fréquence). Les barres ont toutes la même largeur.`) + FIG(stats_fratrie) + METH(r`<ol><li>Trace deux axes : les valeurs en horizontal, les effectifs en vertical.</li><li>Choisis une <b>échelle</b> régulière qui <b>commence à 0</b> (ici 1 carreau pour 1 élève).</li><li>Trace une barre par valeur, de hauteur égale à l'effectif.</li><li>Donne un titre et nomme les axes.</li></ol>`, 'Méthode : construire un diagramme en barres') + EXM(r`Lecture : la plus haute barre correspond à la valeur 1 (effectif 8) : c'est la réponse la plus fréquente. 2 élèves ont 3 frères et sœurs.`) + ATT(r`Si l'axe vertical ne commence pas à 0, les barres trompent l'œil : une barre peut paraître deux fois plus haute alors que l'effectif est à peine plus grand. Lis toujours les graduations !`) },
{ t: 'Le diagramme circulaire', h: DEF(r`Dans un <b>diagramme circulaire</b>, le disque entier représente l'effectif total (100 %). Chaque valeur est représentée par un secteur dont l'<b>angle est proportionnel à l'effectif</b> : le disque entier fait $360°$.
$$\text{angle} = \text{fréquence} \times 360°$$`.replace(/\$\$/g, '$')) + EXM(r`Sport préféré de 36 élèves : football 12, basket 9, natation 6, danse 9.<br>36 élèves correspondent à $360°$, donc <b>1 élève correspond à $360° \div 36 = 10°$</b>.` + TAB([['Sport', 'Football', 'Basket', 'Natation', 'Danse', 'Total'], ['Effectif', '12', '9', '6', '9', '36'], ['Angle', '120°', '90°', '60°', '90°', '360°']]) + `On vérifie : $120 + 90 + 60 + 90 = 360$. ✔ Puis on trace chaque angle au rapporteur, l'un à la suite de l'autre.`) + FIG(stats_sport) + METH(r`Le tableau effectifs / angles est un <b>tableau de proportionnalité</b>. On peut :<ul><li>chercher l'angle pour 1 individu ($360° \div$ effectif total), puis multiplier ;</li><li>ou multiplier la fréquence par $360°$ : football $\frac{12}{36} \times 360° = 120°$.</li></ul>`, 'Méthode : calculer les angles') + RET(r`Repères utiles : 50 % → un demi-disque ($180°$) ; 25 % → un quart de disque ($90°$) ; 10 % → $36°$.<br>Dans un diagramme <b>semi-circulaire</b>, le demi-disque fait $180°$ : angle $=$ fréquence $\times 180°$.`, 'À retenir') + ATT(r`Un diagramme circulaire montre des <b>parts</b> d'un tout, pas des nombres de personnes : deux diagrammes de même taille peuvent représenter des populations de tailles très différentes.`) },
{ t: 'Le graphique cartésien', h: DEF(r`Un <b>graphique cartésien</b> représente des données dans un repère : on place un point pour chaque donnée (souvent l'axe horizontal représente le temps). Il sert à montrer une <b>évolution</b>.`) + FIG(stats_temp) + `<p style="text-align:center"><small>Températures moyennes (°C) d'une ville au cours de l'année.</small></p>` + EXM(r`<ul><li>En avril, la température moyenne est de $12$ °C.</li><li>Le mois le plus chaud est juillet ($23$ °C).</li><li>Entre janvier et juillet, la température augmente de $23 - 5 = 18$ °C.</li><li>La température dépasse $15$ °C de mai à septembre.</li></ul>`) + METH(r`Pour lire une valeur : pars de l'axe horizontal, monte jusqu'au point, puis va horizontalement jusqu'à l'axe vertical. Lis bien l'unité et la graduation (ici, un trait tous les 5 °C).`) + ATT(r`On relie les points par des segments quand cela a un sens (une évolution dans le temps). Les points entre deux mois ne sont pas des mesures : ce sont seulement des repères pour l'œil.`) },
{ t: 'Choisir une représentation', h: TAB([['Je veux…', 'Je choisis…'], ['comparer des effectifs ou des fréquences', 'un <b>diagramme en barres</b>'], ['montrer la part de chaque valeur dans un tout (comparer à 50 %, 25 %)', 'un <b>diagramme circulaire</b>'], ['montrer une évolution dans le temps', 'un <b>graphique cartésien</b>'], ['donner les valeurs exactes', 'un <b>tableau</b>']]) + FIG(stats_barres({ lab: ['Souvent', 'Parfois', 'Rarement'], val: [52, 46, 40], ymin: 40, ymax: 54, ystep: 2, unit: 'nombre de personnes', show: true }) + ' ' + stats_barres({ lab: ['Souvent', 'Parfois', 'Rarement'], val: [52, 46, 40], ymax: 60, ystep: 10, unit: 'nombre de personnes', show: true })) + EXM(r`Les deux diagrammes représentent les <b>mêmes</b> données. À gauche, l'axe commence à 40 : la barre « Souvent » semble deux fois plus haute que « Parfois ». À droite, l'axe commence à 0 : on voit que $52$ et $46$ sont proches.`) + RET(r`<ul><li>Effectif total $=$ somme des effectifs.</li><li>Fréquence $= \frac{\text{effectif}}{\text{effectif total}}$, en fraction, décimal ou pourcentage ; total des fréquences $= 100$ %.</li><li>Diagramme circulaire : angle $=$ fréquence $\times 360°$.</li><li>Garde un esprit critique : regarde les échelles et l'origine des axes.</li></ul>`) }

/* ===== 5e — La moyenne ===== */
/* Tours de cubes : avant / après égalisation (la moyenne, c'est un partage équitable). moyenne_tours([3,5,2,6]) */
function moyenne_tours(v, o){
  o = o || {}; const u = o.u || 22, n = v.length, tot = v.reduce((a, b) => a + b, 0), m = tot / n, hmax = Math.max(...v);
  const gw = n * (u + 14), W = 2 * gw + 90, H = hmax * u + 70;
  let s = SVG0(W, H);
  const tower = (x0, vals, egal) => { let g = ''; vals.forEach((h, k) => { for (let j = 0; j < h; j++) g += `<rect x="${x0 + k * (u + 14)}" y="${H - 34 - (j + 1) * u}" width="${u}" height="${u}" fill="${PAL[k % PAL.length]}aa" stroke="#1d2433" stroke-width="1"/>`; g += svgTxt(x0 + k * (u + 14) + u / 2, H - 16, egal ? fr(m) : String(h), { size: 12, w: 'bold' }); }); return g; };
  s += tower(20, v, false);
  s += `<line x1="16" y1="${H - 34 - m * u}" x2="${20 + gw}" y2="${H - 34 - m * u}" stroke="${COL.r}" stroke-width="2" stroke-dasharray="6 4"/>`;
  s += svgTxt(gw + 45, H / 2, '→', { size: 26, c: COL.r, w: 'bold' });
  if (Number.isInteger(m)) s += tower(gw + 70, v.map(() => m), true);
  s += svgTxt(20 + gw / 2, 16, 'avant', { size: 12, c: '#555' }) + svgTxt(gw + 70 + gw / 2, 16, 'après partage équitable', { size: 12, c: '#555' });
  return s + '</svg>';
}
/* Diagramme en barres avec la ligne de la moyenne. moyenne_barres({lab, val, ymax, ystep, unit, m, ml}) */
function moyenne_barres(d){
  const n = d.val.length, ex = d.m != null ? 96 : 0, W = Math.max(360, 80 + n * 56) + ex, H = 250, pl = 46, pb = 40, pt = 24;
  const bw = (W - pl - 14 - ex) / n, Y = v => H - pb - (v / d.ymax) * (H - pb - pt);
  let s = SVG0(W, H);
  for (let v = 0; v <= d.ymax + 1e-9; v += d.ystep){ s += `<line x1="${pl}" y1="${Y(v)}" x2="${W - 10}" y2="${Y(v)}" stroke="#e3e8f2"/>` + svgTxt(pl - 6, Y(v) + 4, fr(+v.toFixed(4)), { size: 11, c: '#555', a: 'end' }); }
  d.val.forEach((v, k) => { const x = pl + k * bw + bw * 0.2, w = bw * 0.6, c = d.c || COL.b;
    s += `<rect x="${x}" y="${Y(v)}" width="${w}" height="${H - pb - Y(v)}" fill="${c}bb" stroke="${c}"/>` + svgTxt(pl + k * bw + bw / 2, H - pb + 17, d.lab[k], { size: 12 });
    if (d.show) s += svgTxt(pl + k * bw + bw / 2, Y(v) - 5, fr(v), { size: 12, w: 'bold', c }); });
  if (d.m != null) s += `<line x1="${pl}" y1="${Y(d.m)}" x2="${W - 10}" y2="${Y(d.m)}" stroke="${COL.r}" stroke-width="2.2" stroke-dasharray="7 4"/>` + svgTxt(W - 6, Y(d.m) - 6, d.ml || 'moyenne', { size: 12, c: COL.r, w: 'bold', a: 'end' });
  s += `<line x1="${pl}" y1="${H - pb}" x2="${W - 10}" y2="${H - pb}" stroke="#333"/><line x1="${pl}" y1="${H - pb}" x2="${pl}" y2="${pt - 8}" stroke="#333"/>`;
  if (d.unit) s += svgTxt(pl + 6, pt - 10, d.unit, { size: 11, c: '#555', a: 'start' });
  return s + '</svg>';
}

{ t: 'Que veut dire la moyenne ?', h: PROP(r`La moyenne, c'est la valeur que <b>chaque donnée aurait si on partageait le total de façon équitable</b>.`, 'Le sens de la moyenne') + EXM(r`Quatre tours ont 3, 5, 2 et 6 cubes, soit 16 cubes en tout. Si on répartit les 16 cubes équitablement, chaque tour en a $16 \div 4 = 4$ : la moyenne est 4.`) + FIG(moyenne_tours([3, 5, 2, 6])) + EXM(r`Durant les deux dernières semaines, Léa a envoyé 329 SMS à sa copine Claire.<br>Nombre moyen de SMS par jour : $\frac{329 \text{ SMS}}{14 \text{ jours}} = 23,5$ SMS par jour.<br>Personne n'envoie « 23,5 SMS » : la moyenne <b>n'est pas forcément une des valeurs</b> et elle peut être un nombre décimal, même si toutes les données sont entières.`) + PROP(r`La moyenne est toujours comprise entre la plus petite et la plus grande valeur de la série.`) + ATT(r`Garde l'unité dans tes calculs (SMS, jours, km, €…) : cela t'aide à comprendre ce que représente le résultat.`) },
{ t: 'Moyenne et valeurs extrêmes', h: EXM(r`Six amis comparent leur argent de poche du mois : 10 €, 12 €, 8 €, 10 €, 15 € et 95 € (Max a reçu un cadeau d'anniversaire).<br>

{ t: 'Retrouver une valeur manquante', h: PROP(r`Comme moyenne $=$ somme $\div$ nombre de valeurs, on a aussi :

<b>2.</b> Elle a déjà $11 + 14 + 9 = 34$ points.<br>
<b>3.</b> Il lui manque $48 - 34 = 14$. Elle doit avoir <b>14</b>.<br>

/* ===== Probabilités ===== */
const probabilites_cols = { rouge: '#d23c3c', bleue: '#2f5bd3', verte: '#1f9d55', jaune: '#f2c200', noire: '#1d2433', orange: '#e07b00', violette: '#7b3fc4' };
/* Urne : liste [['verte', 3], ['jaune', 4]] */
function probabilites_urne(list, o){
  o = o || {}; const balls = []; list.forEach(([c, n]) => { for (let k = 0; k < n; k++) balls.push(c); });
  const per = Math.max(3, Math.ceil(Math.sqrt(balls.length * 1.6))), rows = Math.ceil(balls.length / per), R = 13, W = per * 2 * (R + 3) + 60, H = rows * 2 * (R + 3) + 70;
  let s = SVG0(W, H);
  s += `<path d="M20 26 L20 ${H - 26} Q20 ${H - 10} 36 ${H - 10} L${W - 36} ${H - 10} Q${W - 20} ${H - 10} ${W - 20} ${H - 26} L${W - 20} 26" fill="#f4f7fc" stroke="#5d6779" stroke-width="3"/>`;
  s += `<ellipse cx="${W / 2}" cy="26" rx="${W / 2 - 20}" ry="8" fill="none" stroke="#5d6779" stroke-width="2.5"/>`;
  balls.forEach((c, i) => { const col = i % per, row = Math.floor(i / per), x = 30 + (W - 60) / per * (col + 0.5), y = H - 22 - R - row * 2 * (R + 3);
    s += `<circle cx="${x}" cy="${y}" r="${R}" fill="${probabilites_cols[c] || c}" stroke="#1d2433" stroke-width="1"/><circle cx="${x - 4}" cy="${y - 4}" r="3" fill="#fff" opacity=".6"/>`; });
  if (o.cap) s += svgTxt(W / 2, 16, o.cap, { size: 12, w: 'bold' });
  return s + '</svg>';
}
/* Faces de dé : probabilites_des([1,2,3,4,5,6], {hl:[2,4,6]}) */
function probabilites_des(faces, o){
  o = o || {}; const sz = 46, gap = 12, W = faces.length * (sz + gap) + 10, H = sz + 20;
  const P = { 1: [[.5, .5]], 2: [[.25, .25], [.75, .75]], 3: [[.25, .25], [.5, .5], [.75, .75]], 4: [[.25, .25], [.75, .25], [.25, .75], [.75, .75]], 5: [[.25, .25], [.75, .25], [.5, .5], [.25, .75], [.75, .75]], 6: [[.25, .22], [.75, .22], [.25, .5], [.75, .5], [.25, .78], [.75, .78]] };
  let s = SVG0(W, H);
  faces.forEach((f, k) => { const x = 10 + k * (sz + gap), y = 10, hl = (o.hl || []).includes(f);
    s += `<rect x="${x}" y="${y}" width="${sz}" height="${sz}" rx="9" fill="${hl ? COL.g + '33' : '#fff'}" stroke="${hl ? COL.g : '#1d2433'}" stroke-width="${hl ? 3 : 2}"/>`;
    P[f].forEach(([a, b]) => { s += `<circle cx="${x + a * sz}" cy="${y + b * sz}" r="4.5" fill="#1d2433"/>`; }); });
  return s + '</svg>';
}
/* Échelle de probabilité de 0 à 1 avec des événements : ev = [[p, 'texte', c], ...] (au-dessus et au-dessous en alternance) */
function probabilites_echelle(ev){
  const W = 600, L = 520, x0 = 40, y = 110, H = 220, X = p => x0 + p * L;
  let s = SVG0(W, H);
  s += `<defs><linearGradient id="pbg" x1="0" x2="1"><stop offset="0" stop-color="#d23c3c"/><stop offset="0.5" stop-color="#f2c200"/><stop offset="1" stop-color="#1f9d55"/></linearGradient></defs>`;
  s += `<rect x="${x0}" y="${y - 7}" width="${L}" height="14" rx="7" fill="url(#pbg)"/>`;
  [[0, '0'], [0.25, '0,25'], [0.5, '0,5'], [0.75, '0,75'], [1, '1']].forEach(([p, t]) => { s += `<line x1="${X(p)}" y1="${y - 11}" x2="${X(p)}" y2="${y + 11}" stroke="#1d2433" stroke-width="2"/>`; });
  s += svgTxt(X(0), y + 28, 'impossible', { size: 12, w: 'bold', c: COL.r }) + svgTxt(X(0.5), y + 28, 'une chance sur deux', { size: 12, w: 'bold', c: '#9a7a00' }) + svgTxt(X(1), y + 28, 'certain', { size: 12, w: 'bold', c: COL.g });
  s += svgTxt(X(0), y - 16, '0', { size: 12 }) + svgTxt(X(0.5), y - 16, '0,5', { size: 12 }) + svgTxt(X(1), y - 16, '1', { size: 12 });
  ev.forEach(([p, t, c], k) => { const up = k % 2 === 0, yy = up ? 28 + (k % 4 === 2 ? 22 : 0) : H - 22 - (k % 4 === 3 ? 22 : 0); c = c || COL.b;
    s += `<line x1="${X(p)}" y1="${up ? yy + 6 : yy - 16}" x2="${X(p)}" y2="${up ? y - 9 : y + 36}" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="${X(p)}" cy="${y}" r="5" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
    s += svgTxt(Math.min(W - 60, Math.max(60, X(p))), yy, t, { size: 12, w: 'bold', c }); });
  return s + '</svg>';
}
/* Roue de loterie à secteurs égaux : liste de couleurs */
function probabilites_roue(cols, o){
  o = o || {}; const R = 80, W = 2 * R + 40, H = 2 * R + 46, cx = W / 2, cy = R + 30, n = cols.length;
  let s = SVG0(W, H);
  cols.forEach((c, k) => { const a1 = -Math.PI / 2 + 2 * Math.PI * k / n, a2 = a1 + 2 * Math.PI / n;
    s += `<path d="M${cx} ${cy}L${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)}A${R} ${R} 0 0 1 ${cx + R * Math.cos(a2)} ${cy + R * Math.sin(a2)}Z" fill="${probabilites_cols[c] || c}" stroke="#fff" stroke-width="2"/>`;
    if (o.lab) s += svgTxt(cx + R * 0.65 * Math.cos((a1 + a2) / 2), cy + R * 0.65 * Math.sin((a1 + a2) / 2) + 5, o.lab[k], { size: 13, w: 'bold', c: '#fff' }); });
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#1d2433" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="6" fill="#1d2433"/><path d="M${cx - 9} 6L${cx + 9} 6L${cx} 26Z" fill="#1d2433"/>`;
  return s + '</svg>';
}

CH({ id: 'probabilites', th: 'Statistiques et probabilités', per: 'Période 5', t: 'Probabilités',
intro: r`Pile ou face ? Quelle chance de tirer une boule verte ? Tu vas apprendre le vocabulaire du hasard (<b>expérience aléatoire</b>, <b>issue</b>, <b>événement</b>), à calculer des <b>probabilités</b> dans les situations d'<b>équiprobabilité</b> (dés, pièces, cartes, urnes, roues) et à comparer avec les <b>fréquences</b> observées quand on répète une expérience.`,
cours: [
{ t: 'Expérience aléatoire et issues', h: DEF(r`Une expérience est <b>aléatoire</b> quand on connaît tous les résultats possibles, mais qu'on ne peut pas prévoir lequel va se produire. Chaque résultat possible s'appelle une <b>issue</b>.`, 'Expérience aléatoire, issue') + TAB([['Expérience', 'Issues', 'Nombre d’issues'],
['Lancer une pièce', 'pile ; face', '2'],
['Lancer un dé à 6 faces', '1 ; 2 ; 3 ; 4 ; 5 ; 6', '6'],
['Tirer une boule dans l’urne ci-dessous et noter sa couleur', 'verte ; jaune', '2'],
['Tirer une carte dans un jeu de 32 cartes', 'les 32 cartes', '32']]) + FIG(probabilites_des([1, 2, 3, 4, 5, 6]) + ' ' + probabilites_urne([['verte', 3], ['jaune', 4]], { cap: '3 vertes, 4 jaunes' })) + ATT(r`« Mesurer la longueur de ma table » ou « calculer $3 \times 4$ » ne sont pas des expériences aléatoires : le résultat est prévisible.`) },
{ t: 'Les événements', h: DEF(r`Un <b>événement</b> est une condition qui peut être réalisée ou non par les issues. Il est formé d'une ou plusieurs issues.<br>
• Un événement <b>impossible</b> n'est réalisé par aucune issue.<br>
• Un événement <b>certain</b> est réalisé par toutes les issues.`, 'Événement') + EXM(r`On lance un dé à 6 faces.<br>
• « Obtenir un nombre pair » est réalisé par les issues 2, 4 et 6 (3 issues).<br>
• « Obtenir au moins 5 » est réalisé par 5 et 6 (2 issues).<br>
• « Obtenir 7 » est <b>impossible</b>.<br>
• « Obtenir un nombre inférieur à 7 » est <b>certain</b>.`) + FIG(probabilites_des([1, 2, 3, 4, 5, 6], { hl: [2, 4, 6] })) + r`<p style="text-align:center">Les issues qui réalisent « obtenir un nombre pair ».</p>` + EXM(r`L'événement « ne pas obtenir un nombre pair » est réalisé par 1, 3 et 5 : ce sont les autres issues. On l'appelle l'événement <b>contraire</b>.`) },
{ t: 'Probabilité et équiprobabilité', h: DEF(r`La <b>probabilité</b> d'un événement mesure la « chance » qu'il se réalise. C'est un nombre compris entre <b>0</b> (impossible) et <b>1</b> (certain).<br>
Quand toutes les issues ont la même chance de se produire (dé ou pièce <b>équilibrés</b>, tirage <b>au hasard</b>), on parle d'<b>équiprobabilité</b>. Alors :
<div style="text-align:center;font-size:1.15em;margin:6px 0">$\text{probabilité} = \frac{\text{nombre d'issues favorables}}{\text{nombre total d'issues}}$</div>`, 'Probabilité') + EXM(r`Avec un dé équilibré :<br>
• probabilité d'obtenir 3 : $\frac{1}{6}$ (une issue sur 6) ;<br>
• probabilité d'obtenir un nombre pair : $\frac{3}{6} = \frac{1}{2} = 0,5 = 50\,\%$ ;<br>
• probabilité d'obtenir au moins 5 : $\frac{2}{6} = \frac{1}{3}$.`) + FIG(probabilites_echelle([[0, 'obtenir 7 avec un dé', COL.r], [1 / 6, 'obtenir 6 avec un dé', COL.v], [0.5, 'obtenir pile', '#9a7a00'], [3 / 7, 'tirer une verte (3 sur 7)', COL.g], [0.97, 'ne pas gagner au loto', COL.b], [1, 'obtenir moins de 7', COL.g]])) + RET(r`« Une chance sur 4 » correspond à la probabilité $\frac{1}{4} = 0,25 = 25\,\%$.`, 'Différentes écritures') + ATT(r`Une probabilité n'est <b>jamais</b> plus grande que 1, ni négative. Si tu trouves $\frac{7}{5}$, tu as inversé les nombres !`) },
{ t: 'Dés, pièces, cartes, urnes et roues', h: EXM(r`<b>Urne</b> : 3 boules vertes et 4 boules jaunes, indiscernables au toucher. On en tire une au hasard. Il y a 7 issues équiprobables. Probabilité de tirer une verte : $\frac{3}{7}$ ; une jaune : $\frac{4}{7}$. Une rouge : 0 (impossible).`) + FIG(probabilites_urne([['verte', 3], ['jaune', 4]])) + EXM(r`<b>Jeu de 32 cartes</b> : 4 couleurs (♥ cœur, ♦ carreau, ♠ pique, ♣ trèfle) de 8 cartes chacune (7, 8, 9, 10, valet, dame, roi, as).<br>
• Tirer un as : $\frac{4}{32} = \frac{1}{8}$ ; • tirer un cœur : $\frac{8}{32} = \frac{1}{4}$ ;<br>
• tirer une figure (valet, dame ou roi) : $\frac{12}{32} = \frac{3}{8}$ ; • tirer le roi de pique : $\frac{1}{32}$.`) + EXM(r`<b>Roue</b> partagée en 8 secteurs égaux : 3 rouges, 2 bleus, 2 jaunes, 1 vert. Probabilité que la flèche s'arrête sur le rouge : $\frac{3}{8}$.`) + FIG(probabilites_roue(['rouge', 'bleue', 'rouge', 'jaune', 'rouge', 'bleue', 'verte', 'jaune'])) + ATT(r`Ce sont les <b>issues</b> qui sont équiprobables, pas les couleurs ! Dans l'urne, « vert » et « jaune » n'ont pas la même chance, car il y a plus de boules jaunes.`) },
{ t: 'Fréquences et répétition d’une expérience', h: r`<p>On lance une pièce de nombreuses fois et on calcule la <b>fréquence</b> de « pile » : $\frac{\text{nombre de piles}}{\text{nombre de lancers}}$.</p>` + TAB([['Nombre de lancers', '10', '100', '1 000', '10 000'], ['Nombre de « pile »', '7', '54', '503', '4 987'], ['Fréquence de « pile »', '0,7', '0,54', '0,503', '0,4987']]) + FIG(barsC({ lab: ['10', '100', '1000', '10000'], val: [0.7, 0.54, 0.503, 0.4987], ymax: 1, ystep: 0.1, unit: 'fréquence de pile', xl: 'lancers', show: true })) + PROP(r`Quand on répète une expérience aléatoire un <b>grand nombre</b> de fois, la fréquence observée d'un événement se rapproche de sa probabilité. Sur peu de lancers, la fréquence peut être assez éloignée de la probabilité : c'est le hasard.`, 'Fréquence et probabilité') + ATT(r`Le hasard n'a pas de mémoire : après 3 « pile » de suite, la probabilité d'obtenir « face » au lancer suivant est toujours $\frac{1}{2}$.`) + RET(r`<ul><li>Expérience aléatoire : on ne peut pas prévoir l'issue.</li>
<li>Événement : ensemble d'issues ; impossible (probabilité 0), certain (probabilité 1).</li>
<li>En équiprobabilité : probabilité $= \frac{\text{issues favorables}}{\text{total des issues}}$.</li>
<li>Une probabilité s'écrit en fraction, en décimal ou en pourcentage.</li>
<li>Sur un grand nombre d'essais, la fréquence se rapproche de la probabilité.</li></ul>`) }
],

/* ===== 5e — Construire des triangles, médiatrices ===== */
const triangles_P = (o, l, d) => [o[0] + l * Math.cos(d * Math.PI / 180), o[1] + l * Math.sin(d * Math.PI / 180)];
const triangles_mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
/* point sur la médiatrice de [ab], à distance 1 du milieu */
const triangles_perp = (a, b) => { const m = triangles_mid(a, b), dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); return [m[0] - dy / L, m[1] + dx / L]; };
/* centre du cercle circonscrit */
function triangles_cc(a, b, c){
  const d = 2 * (a[0] * (b[1] - c[1]) + b[0] * (c[1] - a[1]) + c[0] * (a[1] - b[1]));
  const A2 = a[0] ** 2 + a[1] ** 2, B2 = b[0] ** 2 + b[1] ** 2, C2 = c[0] ** 2 + c[1] ** 2;
  return [(A2 * (b[1] - c[1]) + B2 * (c[1] - a[1]) + C2 * (a[1] - b[1])) / d, (A2 * (c[0] - b[0]) + B2 * (a[0] - c[0]) + C2 * (b[0] - a[0])) / d];
}
/* sommet C tel que AC = b et BC = a, avec A = [0, 0] et B = [c, 0] */
const triangles_3l = (c, b, a) => { const x = (c * c + b * b - a * a) / (2 * c); return [x, Math.sqrt(b * b - x * x)]; };
const triangles_tri = (c, a, b) => triangles_P([0, 0], c * Math.sin(b * Math.PI / 180) / Math.sin((a + b) * Math.PI / 180), a);
/* triangle + ses trois médiatrices + cercle circonscrit */
function triangles_circ(A, B, C, o){
  o = o || {}; const O = triangles_cc(A, B, C);
  const pts = { A, B, C, O, _m1: triangles_mid(A, B), _n1: triangles_perp(A, B), _m2: triangles_mid(B, C), _n2: triangles_perp(B, C), _m3: triangles_mid(C, A), _n3: triangles_perp(C, A) };
  const meds = o.meds || [1, 2, 3];
  return geo(Object.assign({ s: o.s || 38, pts, lp: Object.assign({ O: 'e' }, o.lp || {}), polys: [{ p: ['A', 'B', 'C'], fill: '#2f5bd314', c: COL.k }],

    circles: o.noCircle ? [] : [{ o: 'O', through: 'A', c: COL.r }],
    right: meds.map(k => [['B', 'C', 'A'][k - 1], '_m' + k, '_n' + k]),
    ticks: [].concat(meds.includes(1) ? [['A', '_m1', 1], ['_m1', 'B', 1]] : [], meds.includes(2) ? [['B', '_m2', 2], ['_m2', 'C', 2]] : [], meds.includes(3) ? [['C', '_m3', 'o'], ['_m3', 'A', 'o']] : []) }, o.extra || {}));
}
