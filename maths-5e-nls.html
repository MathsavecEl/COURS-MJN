<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths 5e · NLS</title>
<meta name="description" content="Site de mathématiques des 5e NLS de M. AHA MAJANI : remise à niveau, programme de 6e et de 5e, automatismes, exercices interactifs et entraînement à l'évaluation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Mise en page : feuille de cahier, même famille que les cours Scratch et Tableur de M. AHA MAJANI */
:root{
  --paper:#f4f6fb; --grid:#e2e8f4; --card:#ffffff; --text:#1c2135; --ink:#24318a; --muted:#596282;
  --line:#d4dbeb; --red:#c22e2e; --red-soft:#fcebea; --green:#16764a; --green-soft:#e2f3e9;
  --amber:#985600; --amber-soft:#fbefdc; --mark:#ffef9e; --accent:#3d5bd9; --accent-soft:#e8edff;
  --violet:#6b3fc9; --violet-soft:#f0eaff; --brand:#a52a4a;
  --p1:#2f6fb0; --p2:#2f7d4f; --p3:#7046c0; --p4:#b8541a; --p5:#a52a4a;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142a; --grid:#181e3a; --card:#181e36; --text:#e8ebf6; --ink:#b9c6ff; --muted:#9ba4c3;
  --line:#2b3459; --red:#ff7f76; --red-soft:#3a1d25; --green:#5fd59c; --green-soft:#12321f;
  --amber:#ffbb63; --amber-soft:#382811; --mark:#5c4c0e; --accent:#93a8ff; --accent-soft:#232c57;
  --violet:#c4a8ff; --violet-soft:#2a2050; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background-color:var(--paper);color:var(--text);font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse}

/* En-tête */
.top{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo svg{width:28px;height:28px}
.brand h1{font-size:1.2rem;font-weight:800;color:var(--ink)}
.brand p{font-size:.78rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.brand p b{color:var(--red);letter-spacing:.08em}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.93rem}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a.on{color:var(--ink);background:var(--accent-soft)}

main{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
footer{padding-block:4px 32px;color:var(--muted);font-size:.85rem;text-align:center}

/* Feuille */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 24px 62px;min-width:0}
.sheet::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
@media (max-width:600px){ .sheet{padding:18px 14px 20px 30px} .sheet::before{left:18px} }
.sheet > * + *{margin-top:14px}
.sheet h2{font-size:1.45rem;color:var(--ink)}
.sheet h3{font-size:1.15rem;color:var(--ink)}
.lead{max-width:66ch}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:10px;font-weight:700;font-size:.98rem;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Page d'étape */
.band{border-radius:10px;padding:18px 20px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.band.y5{background:#2f7d4f}.band.y4{background:#b86200}.band.y3{background:#a52a4a}
.band .bn{grid-row:span 3;font:800 3rem/1 var(--f-display);text-align:center;min-width:70px}
.band .bn small{display:block;font:700 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.band h2{font-size:1.65rem;font-weight:800;color:#fff}
.band p{opacity:.92}
.band .bt{display:flex;gap:6px;flex-wrap:wrap}
.band .bt span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px}
.objectifs{display:grid;gap:4px;padding-left:1.2em;margin:0}

.box{border-radius:8px;padding:14px 16px;border-left:5px solid var(--bc);background:var(--bs);min-width:0}
.box > * + *{margin-top:10px}
.box h4{font:700 .8rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--bc)}
.box h4 b{color:var(--text);text-transform:none;letter-spacing:0;font-size:.95rem}
.box ul,.box ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.box.def{--bc:var(--accent);--bs:var(--accent-soft)}
.box.sav{--bc:var(--violet);--bs:var(--violet-soft)}
.box.met{--bc:var(--amber);--bs:var(--amber-soft)}
.box.exe{--bc:var(--green);--bs:var(--green-soft)}
.box.pie{--bc:var(--red);--bs:var(--red-soft)}
.box.ast{--bc:var(--muted);--bs:var(--paper)}
.box.ret{--bc:var(--ink);--bs:var(--card);border:2px solid var(--ink);border-left-width:6px}
.formula{font:800 1.25rem var(--f-display);color:var(--ink);text-align:center;padding:4px 0}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 20px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{min-width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:700;font-size:.85rem}
.tbl td.c,.tbl th.c{text-align:center}
.faux{color:var(--red);font-weight:700}.vrai{color:var(--green);font-weight:700}
mark{color:inherit;background:var(--mark);padding:0 3px;border-radius:3px;font-weight:700}
.hand{font:700 1.45rem var(--f-hand);color:var(--red)}

/* Exercices */
.lvl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:22px!important}
.lvl-h .stars{color:var(--amber);font-size:1.15rem;letter-spacing:2px}
.lvl-h h3{font-size:1.15rem}
.lvl-h span.muted{font-size:.9rem}
.lvl-h .reco-tag{font-size:.75rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.ex{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);min-width:0}
.ex > * + *{margin-top:10px}
.ex.done{border-color:var(--green)}
.ex-h{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.ex-h .en{font:800 1rem var(--f-display);color:var(--red)}
.ex-h h4{font-size:1.05rem;color:var(--ink)}
.ex-h .src{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:1px 7px}
.ex-h .ok-flag{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--green)}
.qs{display:grid;gap:10px;margin:0;padding-left:1.5em}
.qs > li::marker{font-weight:800;color:var(--ink)}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.qa input{width:min(170px,100%);border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.qa input.ok{border-color:var(--green);background:var(--green-soft)}
.qa input.ko{border-color:var(--red);background:var(--red-soft)}
.qa .choice{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-weight:700;min-height:38px}
.qa .choice:hover{border-color:var(--accent)}
.qa .choice.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.qa .choice.ko{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fb{font-weight:700;font-size:.92rem}
.fb.ok{color:var(--green)}.fb.ko{color:var(--red)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{background:var(--amber-soft);border-radius:8px;padding:10px 14px;border-left:4px solid var(--amber)}
.hint b.hl{color:var(--amber)}
.corr{border:2px dashed var(--red);border-radius:8px;padding:10px 16px 14px}
.corr > * + *{margin-top:8px}
.corr .ct{font:700 1.6rem/1 var(--f-hand);color:var(--red)}
.corr ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.res{display:inline-block;padding:2px 10px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}


/* ---- Ajouts du site 3e ---- */
.logo{background:var(--brand)}
.kicker{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .kicker{color:#ff8fa8} }
:root[data-theme="dark"] .kicker{color:#ff8fa8}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:2rem;font-weight:800;color:var(--ink)}
.hero > div > * + *{margin-top:12px}
.namebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.namebox input{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:1rem;width:min(220px,100%)}
.prog{gap:10px}.prog .minibar{max-width:320px;height:10px}
.go-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.go{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
.go:hover{border-color:var(--accent);transform:translateY(-2px)}
.go b{font:800 1.05rem var(--f-display);color:var(--ink)}
.go span:not(.gi):not(.pill){font-size:.9rem;color:var(--muted)}
.go .gi{font-size:1.6rem;line-height:1}
.go.wide{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;border-color:var(--brand)}
.howto{margin:0;padding-left:1.4em;display:grid;gap:6px}
.box.mail{--bc:var(--brand);--bs:var(--card);border:2px dashed var(--brand);border-left-width:6px}
.box.mail a{color:var(--accent);font-weight:700;word-break:break-all}
.per h3{display:flex;align-items:center;gap:10px}
.pdot{width:14px;height:14px;border-radius:50%;background:var(--pc);flex:none}
.p1{--pc:var(--p1)}.p2{--pc:var(--p2)}.p3{--pc:var(--p3)}.p4{--pc:var(--p4)}.p5{--pc:var(--p5)}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:8px;padding:11px 13px;text-decoration:none;color:var(--text);min-height:132px;transition:transform .15s,border-color .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard.full{border-color:var(--green);border-top-color:var(--green)}
.scard .num{font:800 .85rem var(--f-display);color:var(--pc)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .scard .num{color:var(--ink)} }
:root[data-theme="dark"] .scard .num{color:var(--ink)}
.scard .th{font-weight:700;line-height:1.3}
.scard .dm{font-size:.8rem;color:var(--muted)}
.scard .meta{margin-top:auto;display:flex;gap:6px;align-items:center;width:100%}
.minibar{flex:1;min-width:50px;height:7px;border-radius:9px;background:var(--line);overflow:hidden;display:inline-block}
.minibar span{display:block;height:100%;background:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green);border-color:transparent}
.band{background:var(--pc)}
.band .bn{grid-row:span 4}
.band .ded{font:700 1.35rem var(--f-hand);opacity:1}
.subnav{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.subnav a{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:.9rem}
.subnav a:hover{border-color:var(--accent)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:700px){.split2{grid-template-columns:1fr}}
.split2 > div > * + *{margin-top:8px}
.objectifs{padding-left:1.2em}
.sheet > .box + .box{margin-top:14px}
.exemple{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.exl{display:inline-block;font:700 .72rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:1px 8px;border-radius:6px;margin-bottom:4px}
.formula{font:700 1.15rem var(--f-display);color:var(--ink);text-align:center;padding:6px 0;overflow-x:auto}
.ex{margin-top:14px}
.ex-e > * + *{margin-top:8px}
.figbox{display:flex;justify-content:center;overflow-x:auto}
.fig{width:100%;height:auto;display:inline-block;vertical-align:middle;margin:4px auto}
.box .fig{max-height:300px}
.qs{display:grid;gap:14px;margin:0;padding-left:1.5em}
.q{min-width:0}
.q .qt{font-weight:600}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.qa input{width:min(220px,100%);border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-weight:700;font-size:1rem}
.qa input.ok{border-color:var(--green);background:var(--green-soft)}
.qa input.ko{border-color:var(--red);background:var(--red-soft)}
.unit{font-weight:700;color:var(--muted)}
.fb{font-weight:700;font-size:.93rem;min-height:0}
.fb .ok{color:var(--green)}.fb .ko{color:var(--red)}
.qbtns{display:flex;gap:14px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:700;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;display:none}
.lnk.show,.prof .lnk{display:inline-block}
.hint,.corr{margin-top:6px}
.corr p{margin:0}
.ans-prof{display:none}
.prof .corr{display:block!important}.prof .ans-prof{display:block;color:var(--green)}
.q.qdone .qt::after{content:" ✓";color:var(--green);font-weight:800}
.res{display:inline-block;padding:0 8px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:0 6px}
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.acard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-2px)}
.aic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink);font:800 1.1rem var(--f-display)}
.acard b{line-height:1.3}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;background:var(--green);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #toast{color:#06210f} }
:root[data-theme="dark"] #toast{color:#06210f}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{font-size:.93rem;font-variant-numeric:tabular-nums;margin:4px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:center;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:700}
.tbl table.memo{width:100%}.tbl table.memo td{text-align:left}.tbl table.memo td:first-child{font-weight:700;white-space:nowrap}
.tbl table.dice td,.tbl table.dice th{padding:3px 8px}
.sheet h3{margin-top:18px}
/* écriture des maths */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 2px;line-height:1.2}
.fr > span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr > span:last-child{padding:0 3px}
.rad{white-space:nowrap}.rad > span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
sup{font-size:.72em;line-height:0}
/* figures */
.fl{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.fl.hl{stroke:var(--red);stroke-width:2.2}
.fl.dash{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4 4}
.fl.thin{stroke-width:1.2}
.fl2{stroke:var(--muted);stroke-width:1}
.fz{fill:var(--accent-soft)}
.fd{fill:var(--ink)}
.fa{stroke:var(--amber);stroke-width:1.6;fill:none}
.ft{font:600 13px var(--f-body);fill:var(--text);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.ftp{font-style:italic;font-weight:700;font-size:14px}
.fts{fill:var(--ink);font-size:12px}
.gg{stroke:var(--line);stroke-width:1}
.ga{stroke:var(--text);stroke-width:1.3}
.gah{fill:var(--text)}
.gt{font:12px var(--f-body);fill:var(--muted);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.gty{text-anchor:end}
.gtt{font-weight:700;fill:var(--text)}
.gc{fill:none;stroke-width:2.4;stroke:var(--accent)}
.gc1{stroke:var(--red)}.gc2{stroke:var(--green)}
.gl{fill:var(--accent);font-weight:700;font-size:13px}.gl1{fill:var(--red)}.gl2{fill:var(--text);font-weight:800;font-size:14px}
.gp{fill:var(--red)}.gp2{fill:var(--amber);stroke:var(--card);stroke-width:1.5}
.bar{fill:var(--accent);fill-opacity:.7;stroke:var(--card);stroke-width:1}

function nf(v, dec) {

  const ax0 = Math.min(Math.max(0, ymin), ymax), ay0 = Math.min(Math.max(0, xmin), xmax);
  s += `<line x1="${pad - 6}" y1="${Y(ax0)}" x2="${r1(w - pad + 10)}" y2="${Y(ax0)}" class="ga"/><path d="M${r1(w - pad + 12)} ${Y(ax0)}l-8 -4v8z" class="gah"/>`;
  s += `<line x1="${X(ay0)}" y1="${r1(h - pad + 6)}" x2="${X(ay0)}" y2="${pad - 10}" class="ga"/><path d="M${X(ay0)} ${pad - 12}l-4 8h8z" class="gah"/>`;
  const fx = o.fx || nf, fy = o.fy || nf;

  for (let y = Math.ceil(ymin / yl) * yl; y <= ymax + 1e-9; y += yl) { if (Math.abs(y) < 1e-9) continue; s += `<text x="${r1(X(ay0) - 6)}" y="${Y(y)}" class="gt gty">${fy(+y.toFixed(6))}</text>`; }

  });
  (o.polys || []).forEach(pl => { s += `<polygon points="${pl.pts.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}" class="gpoly ${pl.c || ''}"/>`; if (pl.lab) s += `<text x="${X(pl.lx)}" y="${Y(pl.ly)}" class="gt gpl">${pl.lab}</text>`; });

  return `<svg class="fig" viewBox="0 0 ${r1(w)} ${r1(h)}" style="max-width:${Math.round(w * 1.2)}px" role="img" aria-label="${o.alt || 'Graphique'}">${s}</svg>`;

/* diagramme en barres ou histogramme (o.edges = bornes des classes) */
function svgBars(o) {
  const vals = o.vals, n = vals.length, pad = 36, W = o.w || 360, H = o.h || 220;
  const ymax = o.ymax, ys = o.ys;
  const pw = W - pad - 14, ph = H - pad - 26;
  const X0 = pad + 4, Y0 = 16 + ph, sy = v => r1(Y0 - v / ymax * ph);
  let s = '';
  for (let y = 0; y <= ymax + 1e-9; y += ys) s += `<line x1="${X0}" y1="${sy(y)}" x2="${X0 + pw}" y2="${sy(y)}" class="gg"/><text x="${X0 - 6}" y="${sy(y)}" class="gt gty">${nf(y)}</text>`;
  const bw = pw / n;
  vals.forEach((v, i) => {
    const x = X0 + i * bw, wdt = o.edges ? bw : bw * 0.56, xx = o.edges ? x : x + bw * 0.22;
    s += `<rect x="${r1(xx)}" y="${sy(v)}" width="${r1(wdt)}" height="${r1(Y0 - sy(v))}" class="bar"/>`;
    if (!o.edges) s += `<text x="${r1(x + bw / 2)}" y="${Y0 + 14}" class="gt">${o.labels[i]}</text>`;
  });
  if (o.edges) o.edges.forEach((e, i) => { s += `<text x="${r1(X0 + i * bw)}" y="${Y0 + 14}" class="gt">${nf(e)}</text>`; });
  s += `<line x1="${X0}" y1="${Y0}" x2="${X0 + pw}" y2="${Y0}" class="ga"/><line x1="${X0}" y1="${Y0}" x2="${X0}" y2="10" class="ga"/>`;
  if (o.yt) s += `<text x="${X0 + 6}" y="8" class="gt gtt" text-anchor="start">${o.yt}</text>`;
  if (o.xt) s += `<text x="${X0 + pw}" y="${Y0 + 30}" class="gt gtt" text-anchor="end">${o.xt}</text>`;
  return `<svg class="fig" viewBox="0 0 ${W} ${H + 18}" style="max-width:${Math.round(W * 1.2)}px" role="img" aria-label="${o.alt || 'Diagramme'}">${s}</svg>`;
}

/* diagramme circulaire */
function svgPie(o) {
  const R0 = 80, c = 100; let a = -Math.PI / 2, s = '';
  const tot = o.vals.reduce((x, y) => x + y, 0);
  o.vals.forEach((v, i) => {
    const d = v / tot * 2 * Math.PI, b = a + d;
    s += `<path d="M${c} ${c}L${r1(c + R0 * Math.cos(a))} ${r1(c + R0 * Math.sin(a))}A${R0} ${R0} 0 ${d > Math.PI ? 1 : 0} 1 ${r1(c + R0 * Math.cos(b))} ${r1(c + R0 * Math.sin(b))}Z" class="pie p${i}"/>`;
    const m = a + d / 2; s += `<text x="${r1(c + 52 * Math.cos(m))}" y="${r1(c + 52 * Math.sin(m))}" class="ft ptl">${o.labels[i]}</text>`;
    a = b;
  });
  return `<svg class="fig" viewBox="0 0 200 200" style="max-width:230px" role="img" aria-label="${o.alt || 'Diagramme circulaire'}">${s}</svg>`;
}

/* globe terrestre (projection orthographique, vue légèrement du dessus) */
function svgGlobe(o = {}) {
  const R0 = 110, c = 130, lat0 = (o.tilt !== undefined ? o.tilt : 20) * Math.PI / 180, lon0 = (o.lon0 || 0) * Math.PI / 180;
  const pr = (la, lo) => { la *= Math.PI / 180; lo = lo * Math.PI / 180 - lon0;
    const x = Math.cos(la) * Math.sin(lo), y = Math.cos(lat0) * Math.sin(la) - Math.sin(lat0) * Math.cos(la) * Math.cos(lo);
    const vis = Math.sin(lat0) * Math.sin(la) + Math.cos(lat0) * Math.cos(la) * Math.cos(lo) >= 0;
    return [c + R0 * x, c - R0 * y, vis]; };
  const path = (pts, cls) => { let d = '', on = false; pts.forEach(p => { if (p[2]) { d += (on ? 'L' : 'M') + r1(p[0]) + ' ' + r1(p[1]); on = true; } else on = false; }); return d ? `<path d="${d}" class="${cls}"/>` : ''; };
  let s = `<circle cx="${c}" cy="${c}" r="${R0}" class="gsph"/>`;
  for (let la = -60; la <= 60; la += 30) { const pts = []; for (let lo = -180; lo <= 180; lo += 3) pts.push(pr(la, lo)); s += path(pts, la === 0 ? 'geq' : 'gpar'); }
  for (let lo = -180; lo < 180; lo += 30) { const pts = []; for (let la = -90; la <= 90; la += 3) pts.push(pr(la, lo)); s += path(pts, lo === 0 ? 'ggr' : 'gmer'); }
  const N = pr(90, 0), S = pr(-90, 0);
  s += `<circle cx="${r1(N[0])}" cy="${r1(N[1])}" r="3" class="gp"/><text x="${r1(N[0] + 10)}" y="${r1(N[1] - 8)}" class="gt gl">N</text>`;
  if (o.labels !== false) { const q = pr(0, -75); s += `<text x="${r1(q[0])}" y="${r1(q[1] + 12)}" class="gt glab">équateur</text>`; const g = pr(-40, 0); s += `<text x="${r1(g[0] + 6)}" y="${r1(g[1])}" class="gt glab" text-anchor="start">Greenwich</text>`; }
  (o.pts || []).forEach(([la, lo, n]) => { const p = pr(la, lo); if (!p[2]) return; s += `<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="4" class="gp2"/><text x="${r1(p[0] + 10)}" y="${r1(p[1] - 8)}" class="gt gl2">${n}</text>`; });
  return `<svg class="fig" viewBox="0 0 260 260" style="max-width:300px" role="img" aria-label="Globe terrestre">${s}</svg>`;
}
/* blocs façon Scratch (programme de calcul) */

/* fonction affine par morceaux passant par des points [[x,y],...] (pour les graphiques à lire) */
const lerpF = P => x => { for (let i = 0; i < P.length - 1; i++) if (x >= P[i][0] - 1e-9 && x <= P[i + 1][0] + 1e-9) { const [a, b] = [P[i], P[i + 1]]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); } return NaN; };

/* cercle avec centre, rayon ou diamètre marqué */

  return `<svg class="fig" viewBox="0 0 200 ${o.half ? 125 : 200}" style="max-width:210px" role="img" aria-label="${o.alt || 'Cercle'}">${s}</svg>`;

/* pavé droit / cube en perspective cavalière, avec cotes */
function svgBox(o) {
  const L = o.L, l = o.l, h = o.h, k = o.k || Math.min(170 / (L + 0.5 * l), 120 / (h + 0.4 * l));
  const W = L * k, H = h * k, D = l * k * 0.5, dx = D * 0.85, dy = D * 0.6, x0 = String(o.th || "").length > 5 ? 74 : 40, y0 = 20 + dy;
  const A = [x0, y0 + H], B = [x0 + W, y0 + H], C = [x0 + W, y0], E = [x0, y0];
  const t = p => [p[0] + dx, p[1] - dy];
  const P = pts => pts.map(p => p.map(r1).join(',')).join(' ');
  let s = `<polygon points="${P([E, C, t(C), t(E)])}" class="fz" style="opacity:.6"/><polygon points="${P([B, C, t(C), t(B)])}" class="fz" style="opacity:.85"/><polygon points="${P([A, B, C, E])}" class="fz"/>`;
  s += `<polyline points="${P([A, B, C, E, A])}" class="fl"/><polyline points="${P([E, t(E), t(C), C])}" class="fl"/><polyline points="${P([t(C), t(B), B])}" class="fl"/>`;
  s += `<polyline points="${P([A, t(A), t(B)])}" class="fl dash"/><line x1="${r1(t(A)[0])}" y1="${r1(t(A)[1])}" x2="${r1(t(E)[0])}" y2="${r1(t(E)[1])}" class="fl dash"/>`;
  s += `<text x="${r1(x0 + W / 2)}" y="${r1(y0 + H + 16)}" class="ft fts">${o.tL}</text>`;
  s += `<text x="${r1(x0 + W + dx / 2 + 14)}" y="${r1(y0 + H - dy / 2 + 4)}" class="ft fts" style="text-anchor:start">${o.tl}</text>`;
  s += `<text x="${r1(x0 - 8)}" y="${r1(y0 + H / 2)}" class="ft fts" style="text-anchor:end">${o.th}</text>`;
  const w = r1(x0 + W + dx + 70), hh = r1(y0 + H + 30);
  return `<svg class="fig" viewBox="0 0 ${w} ${hh}" style="max-width:${Math.round(w * 1.2)}px" role="img" aria-label="${o.alt || 'Pavé droit'}">${s}</svg>`;

/* pyramide à base carrée ou rectangulaire, avec hauteur en pointillés */
function svgPyr(o) {
  const W = 150, D = 60, H = 130, x0 = 30, yb = 175;
  const A = [x0, yb], B = [x0 + W, yb], C = [x0 + W + D * 0.8, yb - D * 0.5], Dd = [x0 + D * 0.8, yb - D * 0.5];

  return `<svg class="fig" viewBox="0 0 280 200" style="max-width:320px" role="img" aria-label="${o.alt || 'Pyramide'}">${s}</svg>`;

/* tableau de proportionnalité avec la case cherchée surlignée */

/* piste de stade : deux lignes droites et deux demi-cercles */

/* ============================================================
   FIGURES SUPPLÉMENTAIRES (site 5e NLS) : droite graduée, blocs de numération,
   fractions, horloge, monnaie, règle, modèle en barres, quadrillage, angles,
   rapporteur, dés, thermomètre, prisme, cylindre
   (couleurs uniquement par classes CSS : lisibles en clair et en sombre)
   ============================================================ */
const svgWrap = (w, h, s, alt, mw) => `<svg class="fig" viewBox="0 0 ${r1(w)} ${r1(h)}" style="max-width:${Math.round(mw || w * 1.2)}px" role="img" aria-label="${alt}">${s}</svg>`;

/* droite graduée : o = {min, max, step, every (1 graduation sur every porte un nombre), show:[valeurs], pts:[[v,'A'],…], q:[v,…] (point « ? »), lab: v => texte, w, half (demi-droite) } */
function svgLine(o) {
  const W = o.w || 520, pad = 34, min = o.min, max = o.max, step = o.step || 1;
  const X = v => pad + (v - min) / (max - min) * (W - 2 * pad);
  const y = 46, n = Math.round((max - min) / step), every = o.every || 1, lab = o.lab || (v => nf(v));
  let s = `<line x1="${o.half ? X(min) : pad - 14}" y1="${y}" x2="${W - pad + 18}" y2="${y}" class="nl"/><path d="M${W - pad + 22} ${y}l-9 -5v10z" class="nlh"/>`;
  for (let k = 0; k <= n; k++) {
    const v = +(min + k * step).toFixed(9), x = r1(X(v)), big = k % every === 0;
    s += `<line x1="${x}" y1="${y - (big ? 9 : 5)}" x2="${x}" y2="${y + (big ? 9 : 5)}" class="nl"/>`;
    const shown = o.show ? o.show.some(t => Math.abs(t - v) < 1e-9) : big;
    if (shown) s += `<text x="${x}" y="${y + 24}" class="ft nlt">${lab(v)}</text>`;
  }
  (o.pts || []).forEach(([v, name], i) => { const x = r1(X(v)); s += `<circle cx="${x}" cy="${y}" r="4.5" class="nlp"/><text x="${x}" y="${o.pb ? y + 26 : y - 20}" class="ft nlL">${name}</text>`; });
  (o.q || []).forEach(v => { const x = r1(X(v)); s += `<path d="M${x} ${y - 8}l-6 -12h12z" class="nlq"/><text x="${x}" y="${y - 30}" class="ft nlQ">?</text>`; });
  (o.jumps || []).forEach(([a, b, t]) => { const xa = X(a), xb = X(b), m = (xa + xb) / 2, hgt = Math.min(36, Math.abs(xb - xa) / 2 + 8);
    s += `<path d="M${r1(xa)} ${y - 6}Q${r1(m)} ${r1(y - 6 - hgt * 1.6)} ${r1(xb)} ${y - 6}" class="nlj"/><path d="M${r1(xb)} ${y - 6}l${xb > xa ? -8 : 8} -6l${xb > xa ? 1 : -1} 9z" class="nljh"/>${t ? `<text x="${r1(m)}" y="${r1(y - 12 - hgt * .8)}" class="ft nljt">${t}</text>` : ''}`; });
  const top = (o.jumps && o.jumps.length) ? 16 : 0;
  return svgWrap(W, 82 + top, top ? `<g transform="translate(0 ${top})">${s}</g>` : s, o.alt || 'Droite graduée', W * 1.1);
}

/* blocs de numération : plaques de 100, barres de 10, cubes de 1 */
function svgBlocks(c, d, u, o = {}) {
  const k = 6, gap = 10; let x = 8, s = '';
  for (let i = 0; i < c; i++) { s += `<rect x="${x}" y="8" width="${10 * k}" height="${10 * k}" class="bkC"/>`; for (let j = 1; j < 10; j++) s += `<line x1="${x + j * k}" y1="8" x2="${x + j * k}" y2="${8 + 10 * k}" class="bkL"/><line x1="${x}" y1="${8 + j * k}" x2="${x + 10 * k}" y2="${8 + j * k}" class="bkL"/>`; x += 10 * k + gap; }
  for (let i = 0; i < d; i++) { s += `<rect x="${x}" y="8" width="${k}" height="${10 * k}" class="bkD"/>`; for (let j = 1; j < 10; j++) s += `<line x1="${x}" y1="${8 + j * k}" x2="${x + k}" y2="${8 + j * k}" class="bkL"/>`; x += k + 5; }
  if (d) x += gap - 5;
  for (let i = 0; i < u; i++) { s += `<rect x="${x + (i % 3) * (k + 4)}" y="${8 + 10 * k - k - Math.floor(i / 3) * (k + 4)}" width="${k}" height="${k}" class="bkU"/>`; }
  if (u) x += 3 * (k + 4);  const W = Math.max(x + 8, 60);
  return svgWrap(W, 10 * k + 18, s, o.alt || `${c} centaines, ${d} dizaines, ${u} unités`, W * 1.6);
}

/* fraction : barre partagée en d parts, n coloriées (n peut dépasser d : plusieurs barres) */
function svgFracBar(n, d, o = {}) {
  const W = o.w || 300, h = 30, bars = Math.max(1, Math.ceil(n / d)); let s = '';

  return svgWrap(W, bars * (h + 8) + 2, s, o.alt || `${n} parts coloriées sur ${d}`, W * 1.1);
}
/* fraction : disque (pizza) partagé en d parts, n coloriées */
function svgFracPie(n, d, o = {}) {
  const R = 52, c = 58, many = Math.max(1, Math.ceil(n / d)); let s = '';

    for (let i = 0; i < d; i++) { const a0 = -Math.PI / 2 + i * 2 * Math.PI / d, a1 = a0 + 2 * Math.PI / d, on = b * d + i < n;

/* ============================================================
   ENTRAÎNEMENT À L'ÉVALUATION : moteur des QCM de révision
   (repris des QCM de M. AHA MAJANI : EVAL {id,title,sub,exs:[{name,o,r,ctx,fig,qs:[{o,r,ctx,fig,q,ok,bad,m,h}]}]})
   ============================================================ */
const QF = {
  fmt: (n, d = 2) => { const v = Math.round(n * 10 ** d) / 10 ** d; return String(v).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' '); },
  fr: (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`
};
QF.eur = n => (Number.isInteger(Math.round(n * 100) / 100) ? QF.fmt(n) : (Math.round(n * 100) / 100).toFixed(2).replace('.', ',')) + ' €';
const EVALS = [];
const QZ = (() => {
  const { fmt, eur } = QF;
  const LET = ['A', 'B', 'C', 'D'];
  const $ = s => document.querySelector(s);
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeR(seed) {
    const r = mulberry(seed);
    const R = { f: r, i: (a, b) => a + Math.floor(r() * (b - a + 1)), pick: arr => arr[Math.floor(r() * arr.length)] };
    R.shuffle = arr => { const a = arr.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
    return R;
  }
  function fallback(ok) {
    const m = ok.match(/^(\d[\d  ]*(?:,\d+)?)( .*)?$/); if (!m) return [];
    const n = +m[1].replace(/[  ]/g, '').replace(',', '.'), u = m[2] || '';
    const f = v => u.trim() === '€' ? eur(v) : /^ jeux?$/.test(u) ? `${v} jeu${v > 1 ? 'x' : ''}` : fmt(v) + u;
    return [n * 2, n + 1, n > 1 ? n - 1 : n + 3, n + 2, n * 10].map(f);
  }
  const draw = (o, r, R) => { if (!r) return o || {}; let p; for (let t = 0; t < 8; t++) { p = r(R); if (JSON.stringify(p) !== JSON.stringify(o || {})) break; } return p; };
  /* liste des questions d'une série (graine 5 = « Commencer », sinon au hasard) */
  function build(E, seed) {
    const R = makeR(seed), list = [];
    E.exs.forEach((ex, ei) => {
      const pe = draw(ex.o, ex.r, R);
      ex.qs.forEach(q => {
        const pq = draw(q.o, q.r, R);
        const p = Object.assign({}, pe, pq);
        const ok = q.ok(p);
        const seen = new Set([ok]); const bad = [];
        for (const b of q.bad(p)) { if (!seen.has(b)) { seen.add(b); bad.push(b); } }
        if (bad.length < 2) for (const b of fallback(ok)) { if (bad.length >= 2) break; if (!seen.has(b)) { seen.add(b); bad.push(b); } }
        const choices = R.shuffle([ok, ...bad]);
        list.push({ ei, ex, q, p, choices, okIdx: choices.indexOf(ok) });
      });
    });
    return list;
  }
  let S = null;
  const head = E => `<section class="sheet"><p class="kicker">Entraînement à l'évaluation · ${DED}</p><h2>${E.htitle}</h2><div class="row"><a class="btn small ghost" href="#/evals">← Tous les QCM</a>${E.ch ? `<a class="btn small ghost" href="#/ch/${E.ch}">Revoir la leçon : ${chOf(E.ch).lab}</a>` : ''}</div></section>`;
  function home(E) {
    S = null;
    const n = E.exs.reduce((s, e) => s + e.qs.length, 0), best = store.get('qcm5nls-' + E.id);
    app().innerHTML = head(E) + `<section class="sheet qz"><p class="lead">${E.sub}</p>
      <ul class="qz-ex">${E.exs.map(e => `<li>${e.name}<span>${e.qs.length} question${e.qs.length > 1 ? 's' : ''}</span></li>`).join('')}</ul>
      <div class="row"><button class="btn" id="qzb1" type="button">▶ Commencer</button><button class="btn ghost" id="qzb2" type="button">🎲 Nouvelle série (autres nombres)</button></div>
      <p class="muted">${n} questions · une seule bonne réponse à chaque fois · la correction s'affiche après chaque réponse.${best ? `<br>Ton meilleur score : <b>${best.s} / ${best.n}</b>` : ''}</p>${mailBox()}</section>`;
    $('#qzb1').onclick = () => start(E, true); $('#qzb2').onclick = () => start(E, false);
  }
  function start(E, orig) { S = { E, list: build(E, orig ? 5 : (Date.now() & 0xffffff)), i: 0, ans: [] }; show(); }
  function show() {
    const it = S.list[S.i], { ex, q, p } = it, E = S.E;
    const good = S.ans.filter(a => a.good).length;
    const ctx = q.ctx ? q.ctx(p) : (ex.ctx ? ex.ctx(p) : ''), fig = q.fig ? q.fig(p) : (ex.fig ? ex.fig(p) : '');
    app().innerHTML = head(E) + `<section class="sheet qz">
      <div class="qz-bar"><span>Question ${S.i + 1} / ${S.list.length}</span><span class="minibar"><span style="width:${100 * S.i / S.list.length}%"></span></span><span class="pill g">✔ ${good} / ${S.ans.length}</span></div>
      <p class="qz-exname">${ex.name}</p><div class="sayzone">${ctx ? `<div class="qz-ctx">${ctx}</div>` : ''}${fig ? `<div class="figbox qz-fig">${fig}</div>` : ''}
      <p class="qz-q">${q.q(p)} ${SAY}</p>
      <div class="qz-choices">${it.choices.map((c, k) => `<button class="qz-choice" type="button" data-k="${k}"><span class="l">${LET[k]}</span><span>${c}</span></button>`).join('')}</div></div>
      ${q.h ? `<button class="lnk show" id="qzhb" type="button">💡 Un coup de pouce ?</button><div class="hint" id="qzhint" hidden>${q.h(p)}</div>` : ''}
      <div id="qzfb"></div></section>`;
    document.querySelectorAll('.qz-choice').forEach(b => b.onclick = () => answer(+b.dataset.k));
    if (q.h) $('#qzhb').onclick = () => { $('#qzhint').hidden = false; $('#qzhb').hidden = true; };
    window.scrollTo(0, 0);
  }
  function answer(k) {
    if (!S || S.ans.length > S.i) return;
    const it = S.list[S.i], good = k === it.okIdx;
    S.ans.push({ good, k });
    document.querySelectorAll('.qz-choice').forEach((b, j) => { b.disabled = true; if (j === it.okIdx) b.classList.add('ok'); else if (j === k) b.classList.add('ko'); });
    const hb = $('#qzhb'); if (hb) hb.hidden = true;
    const last = S.i === S.list.length - 1;
    const msg = good ? (ST.name && Math.random() < 0.4 ? pick2(BRAVO_N(esc(ST.name))) : pick2(BRAVO)) : 'Pas tout à fait… Lis bien la correction.';
    $('#qzfb').innerHTML = `<div class="qz-fb ${good ? 'ok' : 'ko'}"><h3>${msg}</h3>
      ${good ? '' : `<p>La bonne réponse est <b>${LET[it.okIdx]} : ${it.choices[it.okIdx]}</b>.</p>`}
      <div class="qz-meth">${it.q.m(it.p)}</div></div>
      <div class="row qz-nav"><button class="btn" id="qznx" type="button">${last ? 'Voir mon score' : 'Question suivante →'}</button></div>`;
    $('#qznx').onclick = next; $('#qznx').focus({ preventScroll: true });
    $('#qzfb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function next() { if (S.i < S.list.length - 1) { S.i++; show(); } else end(); }
  function end() {
    const E = S.E, n = S.list.length, s = S.ans.filter(a => a.good).length;
    const best = store.get('qcm5nls-' + E.id);
    if (!best || s > best.s) store.set('qcm5nls-' + E.id, { s, n });
    const nm = ST.name ? ' ' + esc(ST.name) : '';
    const msg = s === n ? `Parfait${nm} ! Tu es prêt(e) pour l'évaluation 🎉` : s >= n * .75 ? `Très bien${nm} ! Revois juste tes erreurs ci-dessous.` : s >= n / 2 ? `C'est en bonne voie${nm}. Relis les méthodes de tes erreurs, puis refais une série.` : `Courage${nm} ! Relis la correction de chaque erreur, puis recommence : chaque série te fait progresser.`;
    const rows = E.exs.map((e, ei) => { const idx = S.list.map((it, j) => it.ei === ei ? j : -1).filter(j => j >= 0); const g = idx.filter(j => S.ans[j].good).length; return [e.name, `${g} / ${idx.length}`]; });
    const errs = S.list.map((it, j) => ({ it, j })).filter(o => !S.ans[o.j].good);
    app().innerHTML = head(E) + `<section class="sheet qz">
      <div class="box exe"><h4>Résultat · <b>${s} / ${n}</b></h4><p class="hand">${msg}</p></div>
      ${TB([['#Exercice', '#Score'], ...rows])}
      ${errs.length ? `<h3>À revoir</h3>${errs.map(({ it, j }) => `<details class="qz-det"><summary>Question ${j + 1} · ${it.ex.name}</summary><p>${it.q.q(it.p)}</p><p>Ta réponse : <b class="faux">${it.choices[S.ans[j].k]}</b> · Bonne réponse : <b class="vrai">${it.choices[it.okIdx]}</b></p><div class="qz-meth">${it.q.m(it.p)}</div></details>`).join('')}` : ''}
      <div class="row"><button class="btn" id="qzb2" type="button">🎲 Nouvelle série (autres nombres)</button><button class="btn ghost" id="qzb1" type="button">↻ Refaire la même série</button><a class="btn ghost" href="#/evals">Tous les QCM</a></div>${mailBox()}</section>`;
    $('#qzb1').onclick = () => start(E, true); $('#qzb2').onclick = () => start(E, false);
    window.scrollTo(0, 0);
  }
  document.addEventListener('keydown', e => {
    if (!S || e.ctrlKey || e.metaKey || e.altKey || !location.hash.startsWith('#/eval/') || e.target.matches('input, textarea')) return;
    const k = 'abcd'.indexOf(e.key.toLowerCase()), d = '1234'.indexOf(e.key), c = k >= 0 ? k : d;
    if (c >= 0 && S.ans.length === S.i && c < S.list[S.i].choices.length) answer(c);
    else if (e.key === 'Enter' && S.ans.length > S.i && $('#qznx')) { e.preventDefault(); next(); }
  });
  return { home, build, best: id => store.get('qcm5nls-' + id), reset: () => { S = null; } };
})();

/* ============================================================
   QCM D'ENTRAÎNEMENT À L'ÉVALUATION — les bases et le programme de 6e
   (même modèle que les QCM de M. AHA MAJANI ; v = la bonne réponse recalculée autrement, pour le contrôle)

const fm = n => QF.fmt(n).replace(/^-/, '−');

  ] },

const QMAP = {};
function register() {
  const cnt = { B: 0, 6: 0, 5: 0 };
  CH.forEach(c => { c.k = ++cnt[c.part]; c.lab = c.part === 'B' ? `Bases ${c.k}` : `${c.part}e · ${c.k}`;

  DIAG.forEach((q, j) => { q.id = 'diag-' + (j + 1); QMAP[q.id] = q; });

const qsOf = exs => exs.flatMap(e => e.qs);

/* ---------- lecture à voix haute (synthèse vocale du navigateur) ---------- */
const TTS = typeof speechSynthesis !== 'undefined';
let frVoice = null;
if (TTS) { const pickV = () => { const v = speechSynthesis.getVoices().filter(x => /^fr/i.test(x.lang)); frVoice = v.find(x => /fr-FR/i.test(x.lang)) || v[0] || null; }; pickV(); speechSynthesis.onvoiceschanged = pickV; }
function speakText(el) {
  const c = el.cloneNode(true);
  c.querySelectorAll('svg, button, .say, input, .unit, .ans-prof').forEach(x => x.remove());
  c.querySelectorAll('.fr').forEach(f => { const [a, b] = f.children; f.replaceWith(` ${a ? a.textContent : ''} sur ${b ? b.textContent : ''} `); });
  c.querySelectorAll('sup').forEach(s => s.replaceWith(s.textContent === '2' ? ' au carré ' : s.textContent === '3' ? ' au cube ' : ' puissance ' + s.textContent + ' '));
  c.querySelectorAll('td, th, li, p, div, br').forEach(x => x.after('. '));
  let t = c.textContent;
  t = t.replace(/(\d) (?=\d{3}\b)/g, '$1').replace(/×/g, ' fois ').replace(/÷/g, ' divisé par ').replace(/ [−-] /g, ' moins ').replace(/−(?=\d)/g, 'moins ')
    .replace(/≈/g, ' environ ').replace(/≠/g, ' différent de ').replace(/ = /g, ' égale ').replace(/\+/g, ' plus ').replace(/ < /g, ' est plus petit que ').replace(/ > /g, ' est plus grand que ')
    .replace(/&lt;|</g, ' plus petit que ').replace(/&gt;|>/g, ' plus grand que ').replace(/(\d) ?%/g, '$1 pour cent').replace(/€/g, ' euros ').replace(/m²/g, ' mètres carrés').replace(/cm²/g, ' centimètres carrés')
    .replace(/\(/g, ', ').replace(/\)/g, ', ').replace(/[★✓✗💡🔊]/g, '').replace(/\?{2,}/g, '?').replace(/\s*\.\s*(\.\s*)+/g, '. ').replace(/\s+/g, ' ').trim();
  return t;
}
let sayBtn = null;
function stopSpeak() { if (TTS) speechSynthesis.cancel(); if (sayBtn) { sayBtn.classList.remove('on'); sayBtn.textContent = '🔊 Écouter'; } sayBtn = null; }
function speak(btn) {
  if (!TTS) return;
  if (sayBtn === btn) return stopSpeak();
  stopSpeak();
  const zone = btn.closest('.box, .q, .ex-e, .qz, .rap, .sayzone') || btn.parentElement;
  const parts = (speakText(zone).match(/[^.!?;:]+[.!?;:]*/g) || []).map(p => p.trim()).filter(Boolean);
  sayBtn = btn; btn.classList.add('on'); btn.textContent = '⏹ Arrêter';
  parts.forEach((p, i) => { const u = new SpeechSynthesisUtterance(p); u.lang = 'fr-FR'; if (frVoice) u.voice = frVoice; u.rate = 0.85;
    if (i === parts.length - 1) u.onend = () => { if (sayBtn === btn) stopSpeak(); }; speechSynthesis.speak(u); });
}

/* ---------- rendu d'une question et d'un exercice ---------- */
function qHTML(q) {
  let inp;
  if (q.t === 'qcm') inp = q.o.map((o, i) => `<button type="button" class="choice" data-q="${q.id}" data-v="${i}">${fmt(o)}</button>`).join('');
  else {
    const ph = { num: 'ta réponse', frac: 'ex. 3/4', expr: 'ex. 3x+2', sol: 'ex. 3', txt: 'ta réponse' }[q.t];
    inp = `<input type="text" inputmode="${q.t === 'num' ? 'decimal' : 'text'}" autocomplete="off" spellcheck="false" data-q="${q.id}" placeholder="${ph}" aria-label="Réponse">${q.u ? `<span class="unit">${q.u}</span>` : ''}<button type="button" class="btn small chk" data-q="${q.id}">Vérifier</button>`;
  }
  const done = ST.done[q.id], H = hintsOf(q);
  return `<li class="q${done ? ' qdone' : ''}" id="q-${q.id}"><div class="qt">${fmt(q.q)} ${SAY}</div><div class="qa">${inp}</div>
    <div class="fb" aria-live="polite">${done ? '<span class="ok">✓ Déjà réussie</span>' : ''}</div>
    <div class="qbtns"><button type="button" class="lnk hintb show" data-q="${q.id}">💡 Coup de pouce${H.length > 1 ? ` (1/${H.length})` : ''}</button><button type="button" class="lnk corrb" data-q="${q.id}">Voir la correction</button></div>
    <div class="hint" hidden data-n="0">${H.map((h, i) => `<span class="hn"${i ? ' hidden' : ''}><b class="hl">Indice ${H.length > 1 ? i + 1 : ''} :</b> ${fmt(h)}</span>`).join('')}</div>
    <div class="corr" hidden><span class="ct">Correction</span><p>${fmt(q.c)}</p><p class="ans-prof">Réponse attendue : <b>${fmt(ansText(q))}</b></p></div></li>`;
}
function exHTML(ex, n, pre) {
  const all = ex.qs.every(q => ST.done[q.id]);
  return `<article class="ex${all ? ' done' : ''}" data-ex="${pre}${n}"><div class="ex-h"><span class="en">${pre === 'p' ? 'Problème' : 'Exercice'} ${n}</span><h4>${ex.ti}</h4>${ex.tag ? `<span class="src">${ex.tag}</span>` : ''}<span class="ok-flag">${all ? '✓ Réussi' : ''}</span></div>
    ${ex.e ? `<div class="ex-e">${fmt(ex.e)} ${SAY}</div>` : ''}${ex.fig ? `<div class="figbox">${ex.fig}</div>` : ''}<ol class="qs">${ex.qs.map(qHTML).join('')}</ol></article>`;
}

/* ---------- vérification ---------- */
const tries = {};
function answer(id, raw, btn) {
  const q = QMAP[id]; if (!q) return;
  const li = document.getElementById('q-' + id); const fb = li.querySelector('.fb');
  const r = check(q, raw);
  if (r.ok) {
    if (q.t === 'qcm') { li.querySelectorAll('.choice').forEach(b => b.classList.remove('ko')); btn.classList.add('ok'); }
    else li.querySelector('input').className = 'ok';
    const msg = ST.name && Math.random() < 0.4 ? pick2(BRAVO_N(esc(ST.name))) : pick2(BRAVO);
    fb.innerHTML = `<span class="ok">✓ ${msg}</span>`;
    li.classList.add('qdone'); li.querySelector('.corrb').classList.add('show');
    if (id.startsWith('auto')) autoProgress(id, true);
    else if (id.startsWith('diag')) diagProgress(id, true);
    else { ST.done[id] = 1; save(); afterSolve(li); }
  } else {
    tries[id] = (tries[id] || 0) + 1;
    if (q.t === 'qcm') btn.classList.add('ko'); else li.querySelector('input').className = 'ko';
    fb.innerHTML = `<span class="ko">✗ ${r.msg ? esc(r.msg) : pick2(ENCORE)}</span>`;
    if (tries[id] >= 2) li.querySelector('.corrb').classList.add('show');
    if (id.startsWith('auto')) autoProgress(id, false);
    if (id.startsWith('diag')) diagProgress(id, false);
  }
}
function afterSolve(li) {
  const art = li.closest('.ex'); if (!art) return;
  const ids = [...art.querySelectorAll('.q')].map(x => x.id.slice(2));
  if (ids.every(i => ST.done[i]) && !art.classList.contains('done')) {
    art.classList.add('done'); const f = art.querySelector('.ok-flag'); if (f) f.textContent = '✓ Réussi';
    toast(ST.name ? `Exercice réussi, ${esc(ST.name)} ! Continue comme ça.` : 'Exercice réussi ! Continue comme ça.');
  }
  const pg = document.getElementById('chapEnd'); if (pg && CUR) pg.innerHTML = chapEnd(CUR);
}

function toast(html) { const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

function pageAutoList() {
  nav('automatismes'); CUR = null;
  app().innerHTML = `<section class="sheet"><p class="kicker">${DED}</p><h2>Automatismes</h2><p class="lead">Les automatismes, ce sont les calculs que l'on doit savoir faire vite, sans réfléchir longtemps : les tables, les compléments, les doubles… Choisis un thème : une nouvelle série de 10 questions est tirée au hasard à chaque fois. Quelques minutes par jour suffisent !</p>
    <a class="go wide" href="#/nls"><span class="gi">🎬</span><b>Les automatismes de la classe (M. AHA MAJANI)</b><span>Les automatismes faits en classe, période par période, avec la voix et les animations</span></a>
    <a class="go wide" href="#/auto/mix"><span class="gi">🎯</span><b>Grand mélange</b><span>12 questions de tous les thèmes</span>${ST.auto.mix !== undefined ? `<span class="pill g">Meilleur score : ${ST.auto.mix}/12</span>` : ''}</a>
    ${['B', '6', '5'].map(g => `<h3 style="margin-top:16px">${AGRP[g]}</h3><div class="auto-grid">${AUTO.filter(a => a.g === g).map(a => `<a class="acard" href="#/auto/${a.id}"><span class="aic">${a.ic}</span><b>${a.t}</b>${ST.auto[a.id] !== undefined ? `<span class="pill${ST.auto[a.id] === 10 ? ' g' : ''}">Record : ${ST.auto[a.id]}/10</span>` : '<span class="pill">Pas encore fait</span>'}</a>`).join('')}</div>`).join('')}${mailBox()}</section>`;
}
function newSerie(id) {
  const mix = id === 'mix', N = mix ? 12 : 10, qs = [];
  const th = AUTO.find(a => a.id === id);
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    let g, k = 0, src;
    do { src = mix ? AUTO[Math.floor(Math.random() * AUTO.length)] : th; g = src.gen[mix ? Math.floor(Math.random() * src.gen.length) : i % src.gen.length](); k++; } while (seen.has(g.q) && k < 20);
    seen.add(g.q); g.id = `auto-${i}-${Date.now() % 100000}`; g.h = g.h || (mix ? 'Thème : ' + src.t : 'Relis le rappel en haut de la page.'); g.th = src.t; QMAP[g.id] = g; qs.push(g);
  }
  SERIE = { id, qs, res: {}, N };
}
function autoProgress(qid, ok) {
  if (!SERIE || !(qid in QMAP)) return;
  if (SERIE.res[qid] === undefined) SERIE.res[qid] = ok;    // seul le 1er essai compte pour le score
  const ans = Object.keys(SERIE.res).length, sc = Object.values(SERIE.res).filter(x => x).length;
  const el = document.getElementById('aScore'); if (el) el.innerHTML = `Score : <b>${sc}</b> / ${SERIE.N} · ${ans} question${ans > 1 ? 's' : ''} sur ${SERIE.N} tentée${ans > 1 ? 's' : ''}`;
  if (ans === SERIE.N) {
    const best = ST.auto[SERIE.id]; if (best === undefined || sc > best) { ST.auto[SERIE.id] = sc; save(); }
    const r = sc / SERIE.N, nm = ST.name ? ' ' + esc(ST.name) : '';
    const msg = r === 1 ? `Sans faute${nm} ! Tu maîtrises ce thème.` : r >= 0.7 ? `Très bon score${nm} ! Encore une série pour viser le sans-faute ?` : r >= 0.4 ? `C'est en bonne voie${nm}. Relis le rappel et les corrections, puis refais une série.` : `Ne te décourage pas${nm} : relis le rappel, regarde les corrections, et recommence. Chaque série te fait progresser.`;
    document.getElementById('aEnd').innerHTML = `<div class="box exe"><h4>Série terminée · <b>${sc} / ${SERIE.N}</b></h4><p class="hand">${msg}</p><button class="btn" type="button" id="again">Nouvelle série</button></div>`;
    document.getElementById('again').onclick = () => { newSerie(SERIE.id); renderSerie(); window.scrollTo(0, 0); };
  }
}
function pageAuto(id) {
  nav('automatismes'); CUR = null;
  if (id !== 'mix' && !AUTO.find(a => a.id === id)) return pageAutoList();
  newSerie(id); renderSerie();
}
function renderSerie() {
  const id = SERIE.id, th = AUTO.find(a => a.id === id);
  const head = id === 'mix' ? `<h2>Grand mélange</h2><p class="lead">12 questions tirées dans tous les thèmes. Seul ton premier essai compte pour le score, mais tu peux réessayer pour comprendre.</p>`
    : `<h2>${th.ic} ${th.t}</h2><div class="box sav rap"><h4>Rappel ${SAY}</h4><div>${fmt(th.rap)}</div><div class="exemple"><span class="exl">Exemples</span><div>${fmt(th.ex)}</div></div></div>`;
  app().innerHTML = `<section class="sheet"><p class="kicker">Automatismes · ${DED}</p>${head}
    <div class="row"><span id="aScore" class="pill">Score : 0 / ${SERIE.N}</span><button class="btn small ghost" type="button" id="reroll">Nouvelle série</button><a class="btn small ghost" href="#/automatismes">Tous les thèmes</a></div>
    <article class="ex"><ol class="qs">${SERIE.qs.map(q => qHTML(q).replace('<div class="qt">', `<div class="qt">${id === 'mix' ? `<span class="tag">${q.th}</span> ` : ''}${q.fig ? `<div class="figbox">${q.fig}</div>` : ''}`)).join('')}</ol></article><div id="aEnd"></div>${mailBox()}</section>`;
  document.getElementById('reroll').onclick = () => { newSerie(id); renderSerie(); };
}

function nlsHTML() { const b = atob(NLS_APP), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new TextDecoder().decode(u); }

    <div class="nls-tools"><button class="btn small" type="button" id="nlsFull">⛶ Plein écran</button><a class="btn small ghost" href="#/automatismes">← Les autres automatismes</a></div>

}
function diagProgress(qid, ok) {
  if (!DG) return; if (DG.res[qid] === undefined) DG.res[qid] = ok;
  if (Object.keys(DG.res).length < DIAG.length) return;
  const miss = DIAG.filter(q => !DG.res[q.id]), s = DIAG.length - miss.length;
  ST.diag = { s, n: DIAG.length }; save();
  const L = [...new Set(miss.map(q => q.ch))].map(chOf).filter(Boolean);
  const nm = ST.name ? ' ' + esc(ST.name) : '';
  document.getElementById('dEnd').innerHTML = `<div class="box exe"><h4>Résultat · <b>${s} / ${DIAG.length}</b></h4><p class="hand">${s === DIAG.length ? `Bravo${nm} ! Tes bases sont solides.` : `Merci${nm} ! Maintenant on sait par où commencer.`}</p>
    ${L.length ? `<p>Je te conseille de commencer par ces leçons, dans cet ordre :</p><div class="diag-res">${L.map(c => `<a href="#/ch/${c.id}">${c.lab} : ${c.t}</a>`).join('')}</div>` : `<p>Tu peux commencer directement le <a href="#/chapitres/6">programme de 6<sup>e</sup></a>. Pense quand même à faire les automatismes chaque jour !</p>`}</div>`;
}

    ${['B', '6', '5'].map(p => `<section class="sheet"><h3>${PARTS[p].ic} ${PARTS[p].t}</h3><div class="ev-grid">${CH.filter(c => c.part === p).map(c => evalOf(c.id)).filter(Boolean).map(card).join('')}</div></section>`).join('')}${mailBox()}`;

/* ---------- routeur & événements ---------- */
function route() {
  const h = location.hash || '#/';
  let m;
  if (!h.startsWith('#/eval/')) QZ.reset();
  if ((m = h.match(/^#\/ch\/(\w+)/))) pageChapter(m[1]);
  else if ((m = h.match(/^#\/auto\/(\w+)/))) pageAuto(m[1]);
  else if ((m = h.match(/^#\/eval\/([\w-]+)/))) pageEval(m[1]);
  else if ((m = h.match(/^#\/chapitres\/(\w)/))) pageChapters(m[1]);
  else if (h.startsWith('#/chapitres')) pageChapters();
  else if (h.startsWith('#/automatismes')) pageAutoList();
  else if (h.startsWith('#/nls')) pageNLS();
  else if (h.startsWith('#/evals')) pageEvals();
  else if (h.startsWith('#/depart')) pageDiag();
  else if (h.startsWith('#/problemes')) pageProblemes();
  else if (h.startsWith('#/memo')) pageMemo();
  else if (h === '#/' || h === '' || h === '#' || h.startsWith('#/accueil')) pageHome();
  else return;   // ancres internes (#retiens…) : ne rien recharger
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.jump) { e.preventDefault(); const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.say) { e.preventDefault(); speak(t); return; }
  if (t.dataset.step) { const ol = t.previousElementSibling, hid = ol.querySelector('li.hid'); if (hid) hid.classList.remove('hid'); if (!ol.querySelector('li.hid')) { t.textContent = '↻ Revoir depuis le début'; t.dataset.step = '2'; if (t.dataset.done) { ol.querySelectorAll('li').forEach((l, j) => l.classList.toggle('hid', j > 0)); t.textContent = 'Étape suivante ▶'; delete t.dataset.done; } else t.dataset.done = '1'; } return; }
  const id = t.dataset.q; if (!id) return;
  const li = document.getElementById('q-' + id);
  if (t.classList.contains('chk')) answer(id, li.querySelector('input').value, t);
  else if (t.classList.contains('choice')) answer(id, t.dataset.v, t);
  else if (t.classList.contains('hintb')) { const hn = li.querySelector('.hint'), H = [...hn.querySelectorAll('.hn')]; if (hn.hidden) { hn.hidden = false; } else { const nx = H.find(x => x.hidden); if (nx) nx.hidden = false; else { hn.hidden = true; H.forEach((x, j) => x.hidden = j > 0); } }
    const shown = hn.hidden ? 0 : H.filter(x => !x.hidden).length; t.textContent = H.length > 1 ? (shown && shown < H.length ? `💡 Indice suivant (${shown + 1}/${H.length})` : shown ? '💡 Masquer les indices' : `💡 Coup de pouce (1/${H.length})`) : (shown ? '💡 Masquer le coup de pouce' : '💡 Coup de pouce'); }
  else if (t.classList.contains('corrb')) { const c = li.querySelector('.corr'); c.hidden = !c.hidden; t.textContent = c.hidden ? 'Voir la correction' : 'Masquer la correction'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.qa input')) answer(e.target.dataset.q, e.target.value, null); });
document.getElementById('profBtn').onclick = () => { const on = document.body.classList.toggle('prof'); document.getElementById('profBtn').textContent = on ? 'Mode professeur activé : cliquer pour masquer les corrections' : 'Mode professeur : afficher toutes les corrections'; };
document.getElementById('brandHome').onclick = () => { location.hash = '#/'; };
const applyBig = () => { document.documentElement.classList.toggle('big', !!ST.big); const b = document.getElementById('bigBtn'); if (b) b.setAttribute('aria-pressed', String(!!ST.big)); };
document.getElementById('bigBtn').onclick = () => { ST.big = !ST.big; save(); applyBig(); };
if (!TTS) document.body.classList.add('no-tts');
applyBig();
window.addEventListener('hashchange', route);
register(); route();
